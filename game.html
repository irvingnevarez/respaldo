  ctx.restore();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ===========================================================================
function UI_skyline(ctx, t){
  // two parallax silhouette bands with deterministic lit windows
  const bands = [
    { y: 402, h: 150, w0: 34, w1: 78, hi: 120, col: PAL.bldgFar, a: 1.0, seed: 11, win: 0.20 },
    { y: 440, h: 130, w0: 46, w1: 96, hi: 150, col: '#090b18', a: 1.0, seed: 57, win: 0.13 }
  ];
  ctx.save();
  for(let b=0;b<bands.length;b++){
    const B = bands[b];
    let x = -30, i = 0;
    ctx.fillStyle = B.col;
    while(x < CW + 40){
      const r1 = UI_rnd(B.seed + i*1.7);
      const r2 = UI_rnd(B.seed + i*3.3);
      const w  = B.w0 + r1*(B.w1 - B.w0);
      const h  = 50 + r2*B.hi;
      const y  = B.y - h;
      ctx.fillRect(x, y, w, h + B.h);
      // roof detail
      if(r1 > 0.62) ctx.fillRect(x + w*0.35, y - 16 - r2*20, 5, 20 + r2*20);
      if(r2 > 0.78){ ctx.fillRect(x + w*0.12, y - 8, w*0.24, 8); }
      // windows
      for(let wy = y + 10; wy < B.y + 26; wy += 13){
        for(let wx = x + 6; wx < x + w - 7; wx += 12){
          const k = Math.floor(wx*0.37) * 71 + Math.floor(wy*0.53) + B.seed;
          const q = UI_rnd(k);
          if(q < B.win){
            const flick = 0.55 + 0.45*Math.sin(t*(0.7 + UI_rnd(k+4)*2.4) + q*9);
            ctx.save();
            ctx.globalAlpha = 0.20 + 0.55*flick;
            ctx.fillStyle = q < B.win*0.22 ? '#9fd0ff' : PAL.bldgWin;
            ctx.fillRect(wx, wy, 4, 6);
            ctx.restore();
          }
        }
      }
      x += w + 5 + UI_rnd(B.seed + i*5.9)*10;
      i++;
    }
  }
  ctx.restore();
}

function UI_beam(ctx, ax, ay, tx, ty, halfTop, t, seed){
  const dx = tx-ax, dy = ty-ay, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.72 + 0.28*Math.sin(t*1.15 + seed);
  ctx.beginPath();
  ctx.moveTo(ax - nx*7, ay - ny*7);
  ctx.lineTo(tx - nx*halfTop, ty - ny*halfTop);
  ctx.lineTo(tx + nx*halfTop, ty + ny*halfTop);
  ctx.lineTo(ax + nx*7, ay + ny*7);
  ctx.closePath();
  const g = ctx.createLinearGradient(ax, ay, tx, ty);
  g.addColorStop(0, 'rgba(214,226,255,0.22)');
  g.addColorStop(0.40, 'rgba(158,178,240,0.11)');
  g.addColorStop(1, 'rgba(120,140,220,0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}

function UI_rain(ctx, t, n, seed, alpha){
  ctx.save();
  ctx.strokeStyle = PAL.rain;
  ctx.lineWidth = 1;
  ctx.globalAlpha = alpha == null ? 0.30 : alpha;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a = UI_rnd(seed+i), b = UI_rnd(seed+i*2.9), c = UI_rnd(seed+i*5.1);
    const sp = 420 + c*520;
    const xx = ((a*(CW+140) + t*sp*0.18) % (CW + 140)) - 70;
    const y = ((b*CH + t*sp) % (CH + 70)) - 40;
    const len = 11 + c*20;
    ctx.moveTo(xx, y);
    ctx.lineTo(xx - len*0.18, y + len);
  }
  ctx.stroke();
  ctx.restore();
}

function UI_cracks(ctx, cx, cy, r, seed, prog){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for(let i=0;i<10;i++){
    const start = (i/10)*Math.PI*2 + UI_rnd(seed+i)*0.55;
    let a = start, x = 0, y = 0;
    const segs = 4 + Math.floor(UI_rnd(seed + i*3.1)*3);
    ctx.beginPath();
    ctx.moveTo(0,0);
    for(let j=0;j<segs;j++){
      const len = r*(0.13 + UI_rnd(seed + i*7.3 + j)*0.17)*prog;
      a += (UI_rnd(seed + i*11.7 + j*2.3) - 0.5)*0.95;
      x += Math.cos(a)*len; y += Math.sin(a)*len*0.8;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(245,197,24,0.42)';
    ctx.lineWidth = 2.6;
    ctx.shadowColor = 'rgba(245,197,24,0.8)';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(4,4,10,0.92)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }
  ctx.restore();
}

// ═══ BOSSES ═══════════════════════════════════════
// NOTE ON VALUE: nothing in here may render at paper white. The grade is
// near-monochrome and sits between 0.1 and 0.3 luminance, so a white fill is
// four stops hot, blooms, and turns a character into a glowing blob — which is
// exactly what the Penguin had become. Small specular dots and eye glints are
// the exception: those are highlights and are meant to clip.
// ═══════════════════════════════════════════════════════════════════════
//  BOSS ART — the two arena bosses, their projectiles and their UI.
//  Module prefix BS_.  All animation is driven by the passed time so frames
//  are reproducible; variation comes from hashing an index, never Math.random.
// ═══════════════════════════════════════════════════════════════════════

function BS_rnd(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function BS_clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function BS_roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, rr); return; }
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function BS_shadow(ctx, cx, groundY, rx) {
  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, groundY, Math.max(2, rx), Math.max(2, rx * 0.22), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// white-out pass used when a boss takes a hit
function BS_flash(ctx, x, y, w, h, amt) {
  if (amt <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = BS_clamp(amt, 0, 1) * 0.8;
  ctx.fillStyle = '#fff';
  BS_roundRect(ctx, x, y, w, h, Math.min(w, h) * 0.3);
  ctx.fill();
  ctx.restore();
}

// ── EL PINGÜINO ────────────────────────────────────────────────────────
function BS_umbrellaCopter(ctx, cx, cy, w, state, t, phase) {
  const folded = state === 'telegraph' || state === 'slam' || state === 'dazed';
  const spread = folded ? 0.22 : 1;
  const spin = state === 'hover' ? t * 16 : t * 2;
  ctx.save();
  ctx.translate(cx, cy);
  // shaft
  ctx.fillStyle = '#2a2a34';
  ctx.fillRect(-3, -4, 6, 26);
  // ribs, squashed horizontally to fake rotation
  for (let i = 0; i < 6; i++) {
    const a = spin + i * Math.PI / 3;
    const sx = Math.cos(a);
    const len = w * 0.52 * spread;
    ctx.save();
    ctx.globalAlpha = state === 'hover' ? 0.55 + 0.45 * Math.abs(sx) : 1;
    const g = ctx.createLinearGradient(0, 0, sx * len, -8);
    g.addColorStop(0, '#4a4358');
    g.addColorStop(1, '#20202c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.quadraticCurveTo(sx * len * 0.55, -12, sx * len, -3);
    ctx.lineTo(sx * len * 0.9, 2);
    ctx.quadraticCurveTo(sx * len * 0.5, -4, 0, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // armoured hub
  const hub = ctx.createRadialGradient(-3, -4, 1, 0, 0, 13);
  hub.addColorStop(0, '#6b6480');
  hub.addColorStop(1, '#23222e');
  ctx.fillStyle = hub;
  ctx.beginPath(); ctx.arc(0, -2, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#12121a'; ctx.lineWidth = 1.5; ctx.stroke();
  if (phase >= 2) {           // damage sparks
    const f = (t * 7 + 0.3) % 1;
    if (f < 0.22) {
      ctx.globalAlpha = 1 - f / 0.22;
      ctx.fillStyle = '#ffd27a';
      ctx.beginPath(); ctx.arc(6, -6, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawPenguinBoss(ctx, x, y, w, h, o) {
  o = o || {};
  const st = o.state || 'hover';
  const t = o.animTime || 0;
  const right = !!o.facingRight;
  const phase = o.phase || 1;
  const dazed = st === 'dazed';
  const dead = st === 'dead';

  ctx.save();
  BS_shadow(ctx, x + w / 2, Math.min(y + h + 6, 15 * 32 + 2), w * 0.42);

  ctx.translate(x + w / 2, y);
  if (!right) ctx.scale(-1, 1);
  const bw = w * 0.78, bh = h * 0.72;
  const bodyTop = h * 0.26;
  const bob = st === 'hover' ? Math.sin(t * 2.2) * 3 : 0;

  // dazed: buried head-first, so flip the whole body over
  ctx.save();
  if (dazed) { ctx.translate(0, h * 0.62); ctx.rotate(Math.PI); ctx.translate(0, -h * 0.38); }
  if (dead) { ctx.rotate(0.34); ctx.translate(6, 10); }

  if (!dazed && !dead) BS_umbrellaCopter(ctx, 0, bodyTop - 26 + bob, w, st, t, phase);

  // body
  const bg = ctx.createLinearGradient(-bw / 2, bodyTop, bw / 2, bodyTop + bh);
  bg.addColorStop(0, '#2e2e3c');
  bg.addColorStop(0.45, PAL.peng);
  bg.addColorStop(1, '#07070c');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, bodyTop + bh / 2 + bob, bw / 2, bh / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // shirt front
  const sg = ctx.createLinearGradient(0, bodyTop + bh * 0.15, 0, bodyTop + bh);
  sg.addColorStop(0, '#9aa0ab');
  sg.addColorStop(1, '#6c7280');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(0, bodyTop + bh * 0.58 + bob, bw * 0.26, bh * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();

  // flippers
  ctx.fillStyle = '#16161e';
  for (const s of [-1, 1]) {
    const flap = st === 'slam' ? -0.5 : Math.sin(t * 3 + (s > 0 ? 0 : 1)) * 0.18;
    ctx.save();
    ctx.translate(s * bw * 0.46, bodyTop + bh * 0.42 + bob);
    ctx.rotate(s * (0.35 + flap));
    ctx.beginPath(); ctx.ellipse(0, 0, bw * 0.11, bh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // feet
  ctx.fillStyle = PAL.orange;
  for (const s of [-1, 1]) {
    const kick = dazed ? Math.sin(t * 14 + s) * 6 : 0;
    ctx.beginPath();
    ctx.ellipse(s * bw * 0.2 + kick, bodyTop + bh + 3 + bob, bw * 0.16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // head
  const hy = bodyTop + bh * 0.12 + bob;
  ctx.fillStyle = '#1a1a24';
  ctx.beginPath(); ctx.ellipse(0, hy, bw * 0.3, bh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a5a399';
  ctx.beginPath(); ctx.ellipse(bw * 0.05, hy + 3, bw * 0.2, bh * 0.13, 0, 0, Math.PI * 2); ctx.fill();

  // beak + cigarette holder
  ctx.fillStyle = PAL.orange;
  ctx.beginPath();
  ctx.moveTo(bw * 0.18, hy); ctx.lineTo(bw * 0.44, hy + 3); ctx.lineTo(bw * 0.18, hy + 8);
  ctx.closePath(); ctx.fill();
  if (!dead) {
    ctx.strokeStyle = '#b0ab9d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bw * 0.4, hy + 4); ctx.lineTo(bw * 0.62, hy - 4); ctx.stroke();
    ctx.fillStyle = '#ff7a3a';
    ctx.beginPath(); ctx.arc(bw * 0.63, hy - 5, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // eye + cracked monocle
  const eyeR = phase >= 3 ? '#ff5a4a' : '#fff';
  ctx.fillStyle = eyeR;
  ctx.beginPath(); ctx.arc(bw * 0.08, hy - 1, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#101018';
  ctx.beginPath(); ctx.arc(bw * 0.09, hy - 1, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.yellow; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(bw * 0.08, hy - 1, 7, 0, Math.PI * 2); ctx.stroke();
  if (phase >= 2) {
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bw * 0.03, hy - 7); ctx.lineTo(bw * 0.12, hy + 4); ctx.stroke();
  }
  ctx.strokeStyle = PAL.yellowD; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bw * 0.14, hy + 4); ctx.quadraticCurveTo(bw * 0.22, hy + 16, bw * 0.05, hy + 22); ctx.stroke();

  // top hat
  if (!dead) {
    ctx.fillStyle = '#0d0d14';
    ctx.fillRect(-bw * 0.26, hy - bh * 0.2 - 2, bw * 0.52, 4);
    BS_roundRect(ctx, -bw * 0.18, hy - bh * 0.2 - 20, bw * 0.36, 20, 2);
    ctx.fill();
    ctx.fillStyle = '#3a2a55';
    ctx.fillRect(-bw * 0.18, hy - bh * 0.2 - 8, bw * 0.36, 4);
  }

  // bow tie
  ctx.fillStyle = PAL.danger;
  ctx.beginPath();
  ctx.moveTo(-7, hy + bh * 0.22); ctx.lineTo(0, hy + bh * 0.26); ctx.lineTo(-7, hy + bh * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(7, hy + bh * 0.22); ctx.lineTo(0, hy + bh * 0.26); ctx.lineTo(7, hy + bh * 0.3);
  ctx.closePath(); ctx.fill();

  // rim light down the facing edge
  ctx.strokeStyle = 'rgba(190,205,255,0.5)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(0, bodyTop + bh / 2 + bob, bw / 2, bh / 2, 0, -1.25, 0.5);
  ctx.stroke();

  ctx.restore();

  // dazed stars
  if (dazed) {
    ctx.save();
    ctx.translate(0, h * 0.1);
    for (let i = 0; i < 3; i++) {
      const a = t * 4 + i * Math.PI * 2 / 3;
      ctx.fillStyle = PAL.yellow;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 8 + i);
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 26, Math.sin(a) * 9 - 6, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();

  BS_flash(ctx, x, y, w, h, o.hurtFlash || 0);
}

// ── EL JOKER ───────────────────────────────────────────────────────────
function BS_jokerFace(ctx, cx, cy, r, t, phase, laughing) {
  // hair goes behind the head so the strands read as a mane
  ctx.fillStyle = '#1f6b16';
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * 1.02 + i * (Math.PI * 1.04 / 6);
    const wob = Math.sin(t * 5 + i * 1.3) * 0.12;
    const len = 1.7 + BS_rnd(i) * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 0.92, cy + Math.sin(a) * r * 0.92);
    ctx.quadraticCurveTo(
      cx + Math.cos(a + wob) * r * len, cy + Math.sin(a + wob) * r * len,
      cx + Math.cos(a + 0.32) * r * 0.86, cy + Math.sin(a + 0.32) * r * 0.86);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = PAL.jokerGreen;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI * 0.95 + i * (Math.PI * 0.9 / 5);
    const wob = Math.sin(t * 5 + i) * 0.1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9);
    ctx.quadraticCurveTo(
      cx + Math.cos(a + wob) * r * 1.45, cy + Math.sin(a + wob) * r * 1.45,
      cx + Math.cos(a + 0.3) * r * 0.85, cy + Math.sin(a + 0.3) * r * 0.85);
    ctx.closePath(); ctx.fill();
  }
  // chalk-white face, modelled instead of flat: lit from upper left, with a
  // greenish bounce under the jaw
  const fg = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.1, cx, cy, r * 1.25);
  fg.addColorStop(0, '#aaa89f');
  fg.addColorStop(0.55, PAL.face);
  fg.addColorStop(1, '#848b79');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 1.12, 0, 0, Math.PI * 2); ctx.fill();
  // cheekbone shadow and a pointed chin
  ctx.fillStyle = 'rgba(120,110,130,0.28)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.62, r * 0.55, r * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();
  // sunken eye sockets with smeared makeup
  ctx.fillStyle = 'rgba(60,30,80,0.45)';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + s * r * 0.34, cy - r * 0.14, r * 0.3, r * 0.28, s * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // brow
  ctx.strokeStyle = '#2a1630';
  ctx.lineWidth = Math.max(1, r * 0.07);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + s * r * 0.12, cy - r * 0.44);
    ctx.lineTo(cx + s * r * 0.56, cy - r * 0.3);
    ctx.stroke();
  }
  // eyes
  ctx.fillStyle = '#1b1024';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + s * r * 0.34, cy - r * 0.15, r * 0.15, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  if (phase >= 3) {   // unhinged: blown pupils and a twitch
    ctx.fillStyle = '#e8e0ff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + s * r * 0.34 + Math.sin(t * 21) * 1.2, cy - r * 0.15, r * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // rictus grin
  ctx.strokeStyle = PAL.smile;
  ctx.lineWidth = Math.max(1.6, r * 0.13);
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.12, r * 0.62, 0.22, Math.PI - 0.22);
  ctx.stroke();
  if (laughing) {
    ctx.fillStyle = '#3a0a12';
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.42, r * 0.4, r * 0.26 * (1 + Math.sin(t * 14) * 0.3), 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawJokerBoss(ctx, x, y, w, h, o) {
  o = o || {};
  const st = o.state || 'ride';
  const t = o.animTime || 0;
  const right = !!o.facingRight;
  const phase = o.phase || 1;
  const riding = phase === 1 && st !== 'dead';

  ctx.save();

  if (st === 'teleport') {
    // dissolving into green smoke, cards scattering out of it
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const a = BS_rnd(i) * Math.PI * 2, d = 8 + BS_rnd(i + 40) * 34;
      ctx.globalAlpha = 0.35 * (1 - BS_rnd(i + 9));
      ctx.fillStyle = PAL.jokerGreen;
      ctx.beginPath();
      ctx.arc(x + w / 2 + Math.cos(a) * d, y + h * 0.5 + Math.sin(a) * d * 0.7,
        6 + BS_rnd(i + 3) * 9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.restore();
    return;
  }

  BS_shadow(ctx, x + w / 2, 15 * 32 + 2, w * 0.36);
  ctx.translate(x + w / 2, y);
  if (!right) ctx.scale(-1, 1);

  const manW = riding ? w * 0.42 : w * 0.72;
  const manTop = riding ? h * 0.62 : h * 0.06;
  const manH = riding ? h * 0.34 : h * 0.9;

  if (riding) {
    // gas bag with his own grinning face painted on it
    const bw = w * 0.9, bh = h * 0.62;
    const sway = Math.sin(t * 1.5) * 0.05;
    ctx.save();
    ctx.rotate(sway);
    const g = ctx.createRadialGradient(-bw * 0.2, bh * 0.1, 6, 0, bh * 0.3, bw * 0.6);
    g.addColorStop(0, PAL.jokerHi);
    g.addColorStop(0.6, PAL.joker);
    g.addColorStop(1, '#2c1348');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, bh * 0.34, bw / 2, bh / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;
    BS_jokerFace(ctx, 0, bh * 0.3, bw * 0.24, t, phase, false);
    ctx.globalAlpha = 1;
    // ropes to the basket
    ctx.strokeStyle = '#c9b88a'; ctx.lineWidth = 1.4;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * bw * 0.3, bh * 0.62);
      ctx.lineTo(s * w * 0.17, h * 0.66);
      ctx.stroke();
    }
    ctx.restore();
    // wicker basket
    const bg2 = ctx.createLinearGradient(0, h * 0.66, 0, h * 0.82);
    bg2.addColorStop(0, '#a97f3f');
    bg2.addColorStop(1, '#5d431d');
    ctx.fillStyle = bg2;
    BS_roundRect(ctx, -w * 0.2, h * 0.66, w * 0.4, h * 0.16, 3);
    ctx.fill();
    ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-w * 0.2, h * 0.66 + i * h * 0.04);
      ctx.lineTo(w * 0.2, h * 0.66 + i * h * 0.04);
      ctx.stroke();
    }
  }

  // the man himself
  const armUp = st === 'taunt' || st === 'throw';
  ctx.save();
  ctx.translate(0, manTop);
  // shoes first, so the coat tails fall over them
  if (!riding) {
    ctx.fillStyle = '#14101c';
    for (const s of [-1, 1]) {
      const step = Math.sin(t * 4 + (s > 0 ? 0 : Math.PI)) * manW * 0.06;
      ctx.beginPath();
      ctx.ellipse(s * manW * 0.2 + step, manH * 0.97, manW * 0.19, manH * 0.045, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // trousers
    ctx.fillStyle = '#2c1548';
    ctx.fillRect(-manW * 0.3, manH * 0.72, manW * 0.6, manH * 0.24);
  }

  // tailcoat: a real silhouette with shoulders, not a rounded box
  const cg = ctx.createLinearGradient(-manW * 0.4, manH * 0.3, manW * 0.4, manH * 0.9);
  cg.addColorStop(0, '#9a67d8');
  cg.addColorStop(0.4, PAL.jokerHi);
  cg.addColorStop(0.75, PAL.joker);
  cg.addColorStop(1, '#2a1046');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-manW * 0.34, manH * 0.3);           // left shoulder
  ctx.quadraticCurveTo(-manW * 0.56, manH * 0.34, -manW * 0.5, manH * 0.46);
  ctx.lineTo(-manW * 0.42, manH * 0.84);          // waist
  ctx.lineTo(manW * 0.42, manH * 0.84);
  ctx.lineTo(manW * 0.5, manH * 0.46);
  ctx.quadraticCurveTo(manW * 0.56, manH * 0.34, manW * 0.34, manH * 0.3);
  ctx.closePath(); ctx.fill();

  if (!riding) {  // coat tails flying behind
    ctx.beginPath();
    ctx.moveTo(-manW * 0.42, manH * 0.74);
    ctx.quadraticCurveTo(-manW * 0.98, manH * (0.88 + Math.sin(t * 6) * 0.06), -manW * 0.66, manH * 1.04);
    ctx.lineTo(-manW * 0.16, manH * 0.86);
    ctx.closePath(); ctx.fill();
  }

  // waistcoat
  ctx.fillStyle = '#2a8c1e';
  ctx.beginPath();
  ctx.moveTo(-manW * 0.2, manH * 0.33);
  ctx.lineTo(manW * 0.2, manH * 0.33);
  ctx.lineTo(manW * 0.13, manH * 0.78);
  ctx.lineTo(-manW * 0.13, manH * 0.78);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAL.jokerGreen;
  ctx.beginPath();
  ctx.moveTo(-manW * 0.18, manH * 0.34);
  ctx.lineTo(manW * 0.05, manH * 0.34);
  ctx.lineTo(-manW * 0.05, manH * 0.7);
  ctx.lineTo(-manW * 0.12, manH * 0.7);
  ctx.closePath(); ctx.fill();

  // lapels
  ctx.fillStyle = '#5c2a94';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * manW * 0.34, manH * 0.3);
    ctx.lineTo(s * manW * 0.08, manH * 0.56);
    ctx.lineTo(s * manW * 0.2, manH * 0.32);
    ctx.closePath(); ctx.fill();
  }

  // bow tie
  ctx.fillStyle = PAL.orange;
  ctx.beginPath();
  ctx.moveTo(-manW * 0.17, manH * 0.29); ctx.lineTo(0, manH * 0.34); ctx.lineTo(-manW * 0.17, manH * 0.39);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(manW * 0.17, manH * 0.29); ctx.lineTo(0, manH * 0.34); ctx.lineTo(manW * 0.17, manH * 0.39);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c05a10';
  ctx.beginPath(); ctx.arc(0, manH * 0.34, manW * 0.05, 0, Math.PI * 2); ctx.fill();

  // rim light down the leading edge
  ctx.strokeStyle = 'rgba(210,190,255,0.45)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(manW * 0.34, manH * 0.31);
  ctx.quadraticCurveTo(manW * 0.55, manH * 0.35, manW * 0.49, manH * 0.47);
  ctx.lineTo(manW * 0.41, manH * 0.83);
  ctx.stroke();

  // arms
  ctx.strokeStyle = PAL.joker;
  ctx.lineWidth = Math.max(3, manW * 0.13);
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    const a = armUp ? -1.15 * s : (0.5 + Math.sin(t * 3 + s) * 0.16) * s;
    ctx.beginPath();
    ctx.moveTo(s * manW * 0.4, manH * 0.4);
    ctx.lineTo(s * manW * 0.4 + Math.sin(a) * manW * 0.5, manH * 0.4 + Math.cos(a) * manH * 0.3);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  // fanned cards in the leading hand
  if (st === 'throw' || st === 'ground') {
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(manW * 0.62, manH * 0.16);
      ctx.rotate(-0.5 + i * 0.24);
      ctx.fillStyle = '#c0bdb2';
      ctx.fillRect(0, -7, 9, 13);
      ctx.strokeStyle = PAL.smile; ctx.lineWidth = 1; ctx.strokeRect(0, -7, 9, 13);
      ctx.restore();
    }
  }
  // head
  BS_jokerFace(ctx, 0, manH * 0.14, manW * 0.36, t, phase, armUp || st === 'taunt');
  ctx.restore();

  ctx.restore();
  BS_flash(ctx, x, y, w, h, o.hurtFlash || 0);
}

// ── projectiles ────────────────────────────────────────────────────────
function drawUmbrellaBomb(ctx, cx, cy, r, angle, fuse) {
  ctx.save();
  ctx.translate(cx, cy);
  // canopy
  ctx.fillStyle = '#2a1c3e';
  ctx.beginPath();
  ctx.arc(0, -r * 0.7, r * 1.05, Math.PI, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1a1026'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const a = Math.PI + i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.7);
    ctx.lineTo(Math.cos(a) * r * 1.05, -r * 0.7 + Math.sin(a) * r * 1.05);
    ctx.stroke();
  }
  ctx.strokeStyle = '#3a2a12'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(0, -r * 0.1); ctx.stroke();
  // bomb
  const g = ctx.createRadialGradient(-r * 0.3, r * 0.1, 1, 0, r * 0.35, r);
  g.addColorStop(0, '#4a4a58');
  g.addColorStop(1, '#0a0a10');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.72, 0, Math.PI * 2); ctx.fill();
  // fuse spark, ramping red as it is about to blow
  const f = BS_clamp(fuse || 0, 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = f > 0.6 ? '#ff5030' : '#ffcf6a';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(angle * 6);
  ctx.beginPath();
  ctx.arc(r * 0.35, -r * 0.25, 2 + f * 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  if (f > 0.55) {
    ctx.globalAlpha = (f - 0.55) * 1.2;
    ctx.strokeStyle = PAL.danger; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.9, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawCardProjectile(ctx, cx, cy, r, angle) {
  ctx.save();
  // motion trail
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = PAL.jokerHi;
  ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.7, r * 0.5, angle * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.translate(cx, cy);
  ctx.rotate(angle);
  const sq = Math.abs(Math.cos(angle * 0.8));      // fake the card turning edge-on
  ctx.scale(0.35 + sq * 0.65, 1);
  ctx.fillStyle = '#f7f4e8';
  BS_roundRect(ctx, -r * 0.7, -r, r * 1.4, r * 2, 2);
  ctx.fill();
  ctx.strokeStyle = '#b9b2a0'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = PAL.smile;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.jokerGreen;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawShockwave(ctx, cx, groundY, w, h, t, strength) {
  ctx.save();
  const s = BS_clamp(strength === undefined ? 1 : strength, 0, 1);
  // crest
  const g = ctx.createLinearGradient(0, groundY - h, 0, groundY);
  g.addColorStop(0, 'rgba(190,225,255,0.0)');
  g.addColorStop(0.45, 'rgba(170,215,255,' + (0.55 * s) + ')');
  g.addColorStop(1, 'rgba(90,130,190,' + (0.85 * s) + ')');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.75, groundY);
  ctx.quadraticCurveTo(cx - w * 0.2, groundY - h * 1.15, cx, groundY - h * 0.85);
  ctx.quadraticCurveTo(cx + w * 0.25, groundY - h * 0.5, cx + w * 0.7, groundY);
  ctx.closePath(); ctx.fill();
  // cracked shards along the leading edge
  ctx.fillStyle = 'rgba(225,240,255,' + (0.8 * s) + ')';
  for (let i = 0; i < 5; i++) {
    const px = cx - w * 0.4 + i * w * 0.2 + Math.sin(t * 10 + i) * 2;
    const ph = h * (0.3 + BS_rnd(i) * 0.5);
    ctx.beginPath();
    ctx.moveTo(px, groundY);
    ctx.lineTo(px + 3, groundY - ph);
    ctx.lineTo(px + 7, groundY);
    ctx.closePath(); ctx.fill();
  }
  // dust
  ctx.globalAlpha = 0.3 * s;
  ctx.fillStyle = '#9fb0c8';
  for (let i = 0; i < 6; i++) {
    const a = t * 3 + i;
    ctx.beginPath();
    ctx.arc(cx - w * 0.5 + i * w * 0.18, groundY - 6 - (a % 1) * 14, 3 + BS_rnd(i + 7) * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGasCloud(ctx, x, y, w, h, t) {
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(120,230,90,0.42)');
  g.addColorStop(0.3, 'rgba(60,170,50,0.62)');
  g.addColorStop(1, 'rgba(14,70,20,0.88)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  // churning top edge, built from overlapping lobes so it tiles with itself
  ctx.fillStyle = 'rgba(150,245,120,0.5)';
  ctx.beginPath();
  ctx.moveTo(x, y + 10);
  for (let i = 0; i <= 24; i++) {
    const px = x + (i / 24) * w;
    const py = y + 8 + Math.sin(t * 1.7 + i * 0.9) * 5 + Math.sin(t * 3.1 + i * 2.3) * 3;
    ctx.lineTo(px, py);
  }
  ctx.lineTo(x + w, y + 22); ctx.lineTo(x, y + 22);
  ctx.closePath(); ctx.fill();
  // rising bubbles
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#b6ff9a';
  for (let i = 0; i < 16; i++) {
    const px = x + ((BS_rnd(i) * w) + t * 18 * (0.4 + BS_rnd(i + 5))) % w;
    const py = y + h - ((t * 30 * (0.5 + BS_rnd(i + 2)) + BS_rnd(i + 8) * h) % h);
    ctx.beginPath(); ctx.arc(px, py, 2 + BS_rnd(i + 11) * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ── boss UI ────────────────────────────────────────────────────────────
function BS_disp(size) {
  return '800 ' + size + 'px Oswald, "Arial Black", Impact, system-ui, sans-serif';
}

function drawBossHealthBar(ctx, x, y, w, h, o) {
  o = o || {};
  const hp = o.hp || 0, maxHp = Math.max(1, o.maxHp || 1);
  const flash = BS_clamp(o.flash || 0, 0, 1);
  // Restyled to match the rest of the HUD: no gold frame, no glass plate, no
  // gradient pips. A framed red slab with a drop-shadowed name is the most
  // dated thing that can sit at the top of a screen.
  const bw = Math.min(w, 440), bx = x + (w - bw) / 2;
  ctx.save();
  ctx.translate(Math.sin((o.t || 0) * 60) * flash * 2.5, 0);

  ctx.font = '600 12px Oswald, system-ui, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = flash > 0.2 ? 'rgba(255,255,255,0.95)' : 'rgba(228,238,250,0.78)';
  const nm = String(o.name || '');
  let spaced = '';
  for (let i = 0; i < nm.length; i++) spaced += nm[i] + (i < nm.length - 1 ? ' ' : '');
  ctx.fillText(spaced, bx + bw / 2, y - 8);
  ctx.textAlign = 'left';

  // a thin rule, segmented by hit points
  const gap = 4, seg = (bw - gap * (maxHp - 1)) / maxHp;
  for (let i = 0; i < maxHp; i++) {
    const sx = bx + i * (seg + gap);
    ctx.fillStyle = i < hp
      ? (flash > 0.2 ? 'rgba(255,255,255,0.95)' : 'rgba(206,74,68,0.92)')
      : 'rgba(150,168,190,0.16)';
    ctx.fillRect(sx, y, seg, 3);
  }

  ctx.font = '600 9px Oswald, system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(196,210,228,0.40)';
  ctx.fillText('FASE ' + (o.phase || 1), bx + bw, y + 16);

  ctx.restore();
  ctx.textAlign = 'left';
}

function drawBossIntro(ctx, t, name, subtitle, progress) {
  const p = BS_clamp(progress || 0, 0, 1);
  // ease in, hold, ease out
  const a = p < 0.18 ? p / 0.18 : (p > 0.8 ? (1 - p) / 0.2 : 1);
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(4,3,10,0.72)';
  ctx.fillRect(0, 0, CW, CH);

  const slide = (1 - Math.min(1, p / 0.25));
  ctx.translate(-slide * 420, 0);

  // Letterbox bars rather than a painted red slash: the slash read as a
  // fighting-game banner, which is exactly the register we are moving away from.
  ctx.fillStyle = 'rgba(3,5,9,0.92)';
  ctx.fillRect(0, 0, CW, CH / 2 - 62);
  ctx.fillRect(0, CH / 2 + 58, CW, CH / 2 - 58);
  ctx.fillStyle = 'rgba(198,214,236,0.22)';
  ctx.fillRect(CW * 0.5 - 150, CH / 2 - 62, 300, 1);
  ctx.fillRect(CW * 0.5 - 150, CH / 2 + 58, 300, 1);

  ctx.textAlign = 'center';
  ctx.font = BS_disp(52);
  ctx.fillStyle = 'rgba(236,243,252,0.96)';
  ctx.fillText(name || '', CW / 2, CH / 2 + 6);

  ctx.font = BS_disp(13);
  ctx.fillStyle = 'rgba(190,206,228,0.62)';
  let sub = subtitle || '';
  let spaced = '';
  for (let i = 0; i < sub.length; i++) spaced += sub[i] + (i < sub.length - 1 ? ' ' : '');
  ctx.fillText(spaced, CW / 2, CH / 2 + 44);

  ctx.restore();
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

// --- small prefixed helpers (safe to ignore; LEVELS is the public data) ----
function LV_levelWidth(level) {
  return level && level.rows && level.rows.length ? level.rows[0].length : 0;
}
function LV_tileAt(level, tx, ty) {
  if (!level || !level.rows) return ' ';
  if (ty < 0 || ty >= level.rows.length) return ' ';
  if (tx < 0 || tx >= level.rows[ty].length) return ' ';
  return level.rows[ty].charAt(tx);
}
function LV_isSolid(ch) { return ch === '#' || ch === 'X' || ch === 'B' || ch === '?'; }


// ═══ LIGHTING ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
//  NORMAL BUFFER — the geometry half of the dynamic lighting.
//
//  The scene art is 6000 lines of procedural Canvas 2D. Re-drawing all of it
//  a second time as normals is not realistic, so instead we bake a small set
//  of normal SPRITES once at startup (a bevelled tile face, a dome, a capsule)
//  and stamp them at the positions we already track: tiles, blocks, pickups,
//  the player, enemies.
//
//  That gives real per-object surface direction — bevelled blocks catch light
//  on the edge facing the source, characters read as rounded volumes — without
//  touching the art modules at all.
//
//  Encoding is the usual tangent-space one: rgb = normal * 0.5 + 0.5, so flat
//  (facing the viewer) is (128, 128, 255).
// ═══════════════════════════════════════════════════════════════════════

var LT_cache = null;

function LT_canvas(w, h) {
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// Bevelled square: flat in the middle, edges sloping outward like a chamfer.
// Matches the upper-left light convention the tile art is already drawn with.
function LT_makeBevel(size, bevel) {
  var c = LT_canvas(size, size), ctx = c.getContext('2d');
  var img = ctx.createImageData(size, size), d = img.data;
  for (var y = 0; y < size; y++) {
    for (var x = 0; x < size; x++) {
      // signed distance to each edge, in bevel units
      var dl = x / bevel, dr = (size - 1 - x) / bevel;
      var dt = y / bevel, db = (size - 1 - y) / bevel;
      var nx = 0, ny = 0;
      if (dl < 1) nx -= (1 - dl);
      if (dr < 1) nx += (1 - dr);
      if (dt < 1) ny -= (1 - dt);
      if (db < 1) ny += (1 - db);
      // soften the ramp so edges are rounded rather than faceted
      nx = Math.sign(nx) * Math.pow(Math.abs(nx), 0.75) * 0.85;
      ny = Math.sign(ny) * Math.pow(Math.abs(ny), 0.75) * 0.85;
      var nz = Math.sqrt(Math.max(0.02, 1 - nx * nx - ny * ny));
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      var i = (y * size + x) * 4;
      d[i] = Math.round((nx / len * 0.5 + 0.5) * 255);
      d[i + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
      d[i + 2] = Math.round((nz / len * 0.5 + 0.5) * 255);
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// Elliptical dome — characters and pickups read as rounded volumes.
// `flat` keeps the centre from being too spherical on tall thin sprites.
function LT_makeDome(w, h, flat) {
  var c = LT_canvas(w, h), ctx = c.getContext('2d');
  var img = ctx.createImageData(w, h), d = img.data;
  var cx = (w - 1) / 2, cy = (h - 1) / 2;
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var u = (x - cx) / cx, v = (y - cy) / cy;
      var r = Math.sqrt(u * u + v * v);
      var i = (y * w + x) * 4;
      if (r > 1) { d[i] = 128; d[i + 1] = 128; d[i + 2] = 255; d[i + 3] = 0; continue; }
      var s = Math.pow(r, flat);
      var nx = u * s, ny = v * s;
      var nz = Math.sqrt(Math.max(0.05, 1 - nx * nx - ny * ny));
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      d[i] = Math.round((nx / len * 0.5 + 0.5) * 255);
      d[i + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
      d[i + 2] = Math.round((nz / len * 0.5 + 0.5) * 255);
      // feather the rim so sprites do not show a hard normal edge
      d[i + 3] = Math.round(255 * Math.min(1, (1 - r) * 6));
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// Horizontal cylinder — good for ground rows: light rakes across them.
function LT_makeCylinder(w, h) {
  var c = LT_canvas(w, h), ctx = c.getContext('2d');
  var img = ctx.createImageData(w, h), d = img.data;
  var cy = (h - 1) / 2;
  for (var y = 0; y < h; y++) {
    var v = (y - cy) / cy;
    var ny = v * 0.7;
    var nz = Math.sqrt(Math.max(0.05, 1 - ny * ny));
    var len = Math.sqrt(ny * ny + nz * nz) || 1;
    var g = Math.round((ny / len * 0.5 + 0.5) * 255);
    var bl = Math.round((nz / len * 0.5 + 0.5) * 255);
    for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4;
      d[i] = 128; d[i + 1] = g; d[i + 2] = bl; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function LT_init() {
  if (LT_cache) return LT_cache;
  LT_cache = {
    bevel: LT_makeBevel(32, 7),      // floating blocks: strong chamfer
    bevelSoft: LT_makeBevel(32, 11), // ground masonry: broader, softer
    ground: LT_makeCylinder(32, 32),
    dome: LT_makeDome(64, 64, 1.35),
    domeTall: LT_makeDome(48, 72, 1.5),
  };
  return LT_cache;
}

// flat normal, pointing straight at the viewer
function LT_clear(ctx, w, h) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgb(128,128,255)';
  ctx.fillRect(0, 0, w, h);
}


// ═══ ATMOS ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
//  ATMOSPHERE — breath and street steam.
//
//  Kept out of fx.js deliberately: those particles are impact feedback and
//  need to be punchy and short-lived, while these are slow, large and almost
//  transparent. Mixing the two tuning regimes in one system makes both worse.
//
//  Drawn into the 2D scene, so the deferred lighting pass tints them with
//  whatever light they are drifting through.
// ═══════════════════════════════════════════════════════════════════════

function AT_hash(n) { const s = Math.sin(n * 91.37 + 7.13) * 43758.5453; return s - Math.floor(s); }

class Atmosphere {
  constructor() {
    this.p = [];
    this.breathT = 0;
    this.ventT = 0;
    this.max = 180;
  }
  clear() { this.p.length = 0; this.breathT = 0; this.ventT = 0; }

  emit(x, y, kind, seed) {
    if (this.p.length >= this.max) return;
    const warm = kind === 'steam';
    this.p.push({
      x: x, y: y, kind: kind, seed: seed,
      vx: (AT_hash(seed) - 0.5) * (warm ? 14 : 26),
      vy: warm ? -14 - AT_hash(seed + 3) * 12 : -20 - AT_hash(seed + 3) * 16,
      r: warm ? 9 + AT_hash(seed + 7) * 12 : 2.5 + AT_hash(seed + 7) * 2.5,
      grow: warm ? 16 : 9,
      life: warm ? 2.6 + AT_hash(seed + 11) * 1.6 : 0.85 + AT_hash(seed + 11) * 0.4,
      age: 0,
    });
  }

  update(dt, game) {
    for (const q of this.p) {
      q.age += dt;
      q.vy += (q.kind === 'steam' ? -5 : -8) * dt;   // buoyancy
      q.vx *= 1 - 0.9 * dt;                          // drag
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.r += q.grow * dt;
    }
    this.p = this.p.filter(q => q.age < q.life);
    if (!game.world || !game.player) return;

    // ── breath: only when he is standing still in the cold ──
    const pl = game.player;
    if (!pl.dead && pl.onGround && Math.abs(pl.vx) < 45) {
      this.breathT -= dt;
      if (this.breathT <= 0) {
        this.breathT = 1.5 + AT_hash(Math.floor(game.time * 3)) * 0.9;
        const n = 3;
        for (let i = 0; i < n; i++) {
          this.emit(pl.rect.cx + pl.face * (pl.rect.w * 0.45 + i * 4),
            pl.rect.y + 12 + i, 'breath', Math.floor(game.time * 60) + i * 13);
        }
      }
    } else this.breathT = Math.min(this.breathT, 0.5);

    // ── street vents: a sparse hashed set of ground columns ──
    this.ventT -= dt;
    if (this.ventT <= 0) {
      this.ventT = 0.55;
      const w = game.world, camX = game.cam ? game.cam.x : 0;
      const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
      const c1 = Math.min(w.w - 1, Math.floor((camX + CW) / TILE) + 1);
      for (let cx = c0; cx <= c1; cx++) {
        if (AT_hash(cx * 3.1 + 0.5) > 0.075) continue;      // ~7% of columns
        // Street level only. Scanning from the top found the first solid cell
        // in the column, which meant vents happily sprouted from the roof of a
        // floating '?' block instead of from the pavement.
        let row = -1;
        for (let cy = 14; cy < w.h; cy++) {
          const c = w.cells[cy * w.w + cx];
          if (c && c.alive && c.solid) { row = cy; break; }
        }
        if (row < 0) continue;
        const above = w.cells[(row - 1) * w.w + cx];
        if (above && above.alive && above.solid) continue;
        this.emit(cx * TILE + TILE / 2 + (AT_hash(cx) - 0.5) * 10,
          row * TILE - 2, 'steam', cx * 7 + Math.floor(game.time * 2));
      }
    }
  }

  draw(ctx, camX) {
    if (!this.p.length) return;
    ctx.save();
    for (const q of this.p) {
      const x = q.x - camX;
      if (x < -60 || x > CW + 60) continue;
      const k = q.age / q.life;
      // fade in fast, out slow, so nothing pops into existence
      const a = Math.min(1, k * 6) * (1 - k) * (q.kind === 'steam' ? 0.16 : 0.30);
      if (a <= 0.004) continue;
      const g = ctx.createRadialGradient(x, q.y, 0, x, q.y, Math.max(1, q.r));
      if (q.kind === 'steam') {
        g.addColorStop(0, 'rgba(206,214,232,' + a + ')');
        g.addColorStop(0.55, 'rgba(150,162,190,' + (a * 0.5) + ')');
        g.addColorStop(1, 'rgba(120,130,160,0)');
      } else {
        g.addColorStop(0, 'rgba(226,238,255,' + a + ')');
        g.addColorStop(0.6, 'rgba(180,200,235,' + (a * 0.45) + ')');
        g.addColorStop(1, 'rgba(160,180,220,0)');
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      // squashed slightly: rising vapour spreads wider than it is tall
      ctx.ellipse(x, q.y, q.r, q.r * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}


// ═══ DECOR ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
//  DECOR — street furniture that actually lights the scene.
//
//  Until now every light in the game came from a gameplay object: blocks,
//  pickups, the beacon. The street itself emitted nothing, so Gotham was a
//  painted backdrop rather than a lit place. Lamps and neon signs are placed
//  deterministically from the level geometry, drawn into the world pass, and
//  registered as real lights - so they cast shadows, pool on the wet ground
//  and bloom like everything else.
// ═══════════════════════════════════════════════════════════════════════

function DC_hash(n) { const s = Math.sin(n * 53.77 + 19.31) * 43758.5453; return s - Math.floor(s); }

class Decor {
  constructor() { this.items = []; this.key = null; }

  // Scan once per level rather than every frame: the layout never changes.
  build(world, levelId) {
    if (this.key === levelId) return;
    this.key = levelId;
    this.items = [];
    if (!world) return;
    // Walk the street in strides rather than hashing each column: a pure hash
    // with a clear-air requirement on top produced four lamps in an entire
    // 200-column level, none of them on screen. A stride guarantees the street
    // is actually lit along its whole length.
    let cx = 5;
    while (cx < world.w - 5) {
      for (let k = 0; k < 9; k++) {
        const col = cx + k;
        if (col >= world.w - 4) break;
        let row = -1;
        for (let cy = 13; cy < world.h; cy++) {
          const c = world.cells[cy * world.w + col];
          if (c && c.alive && c.solid) { row = cy; break; }
        }
        if (row < 0) continue;
        let clear = true;
        for (let j = 1; j <= 4; j++) {
          const c = world.cells[(row - j) * world.w + col];
          if (c && c.alive && c.solid) { clear = false; break; }
        }
        if (!clear) continue;
        const neon = DC_hash(col * 7.7 + 4.4) < 0.34;
        this.items.push({
          x: col * TILE + TILE / 2,
          y: row * TILE,
          h: 66 + Math.round(DC_hash(col + 9) * 22),
          neon: neon,
          hue: neon ? DC_hash(col * 3.3) : 0,
          seed: col,
        });
        break;
      }
      cx += 14 + Math.floor(DC_hash(cx * 1.7) * 8);
    }
  }

  // amber sodium lamp, or a cold neon tube
  // Muted. Saturated pink and violet neon was the loudest colour in the frame
  // and fought the near-monochrome grade; these still read as neon against a
  // grey street without repainting it.
  colour(it) {
    if (!it.neon) return [1.0, 0.86, 0.62];        // cool sodium
    if (it.hue < 0.34) return [0.95, 0.48, 0.52];  // dull rose
    if (it.hue < 0.67) return [0.52, 0.82, 0.95];  // ice
    return [0.66, 0.60, 0.88];                     // pale violet
  }

  draw(ctx, camX, t) {
    for (const it of this.items) {
      const x = it.x - camX;
      if (x < -60 || x > CW + 60) continue;
      const c = this.colour(it);
      const rgb = 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
      const flick = it.neon
        ? (DC_hash(Math.floor(t * 9) + it.seed) > 0.06 ? 1 : 0.35)   // neon stutters
        : 0.92 + 0.08 * Math.sin(t * 2.6 + it.seed);
      const topY = it.y - it.h;

      ctx.save();
      // post
      const pg = ctx.createLinearGradient(x - 3, 0, x + 3, 0);
      pg.addColorStop(0, '#2a2636');
      pg.addColorStop(0.5, '#4a4560');
      pg.addColorStop(1, '#1a1726');
      ctx.fillStyle = pg;
      ctx.fillRect(x - 2.5, topY, 5, it.h);
      ctx.fillStyle = '#221f30';
      ctx.beginPath();
      ctx.ellipse(x, it.y, 8, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      if (it.neon) {
        // a vertical tube bracketed off the post
        ctx.globalAlpha = flick;
        ctx.strokeStyle = rgb;
        ctx.lineWidth = 3;
        ctx.shadowColor = rgb;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(x + 9, topY + 6);
        ctx.lineTo(x + 9, topY + 30);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x + 3, topY + 8);
        ctx.lineTo(x + 9, topY + 8);
        ctx.stroke();
      } else {
        // hooded lamp head
        ctx.fillStyle = '#2e2a3c';
        ctx.beginPath();
        ctx.moveTo(x - 11, topY + 8);
        ctx.lineTo(x + 11, topY + 8);
        ctx.lineTo(x + 7, topY + 1);
        ctx.lineTo(x - 7, topY + 1);
        ctx.closePath(); ctx.fill();
        // the hood's own underside catches the bulb — without it the head is a
        // flat dark wedge with a glow pasted under it
        ctx.globalAlpha = 0.5 * flick;
        ctx.fillStyle = rgb;
        ctx.fillRect(x - 9, topY + 6.5, 18, 1.8);
        ctx.globalAlpha = flick;
        ctx.fillStyle = rgb;
        ctx.shadowColor = rgb;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.ellipse(x, topY + 10, 7, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // the cone it throws down the wall
        ctx.globalAlpha = 0.13 * flick;
        const cg = ctx.createLinearGradient(0, topY + 10, 0, it.y);
        cg.addColorStop(0, rgb);
        cg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(x - 7, topY + 10);
        ctx.lineTo(x + 7, topY + 10);
        ctx.lineTo(x + 30, it.y);
        ctx.lineTo(x - 30, it.y);
        ctx.closePath(); ctx.fill();

        // Rain lit inside the cone. This is the cheapest realism cue in the
        // whole scene: you do not see rain falling at night, you see the slice
        // of it that passes through a streetlight. Clipped to the cone the
        // lamp already throws, so the two can never disagree, and seeded off
        // the lamp's own column so it stays deterministic.
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x - 7, topY + 10);
        ctx.lineTo(x + 7, topY + 10);
        ctx.lineTo(x + 30, it.y);
        ctx.lineTo(x - 30, it.y);
        ctx.closePath();
        ctx.clip();
        ctx.strokeStyle = rgb;
        ctx.lineWidth = 1;
        const span = it.y - topY - 10;
        for (let k = 0; k < 14; k++) {
          const ph = DC_hash(it.seed * 3.1 + k * 7.7);
          const sp = 440 + ph * 420;
          let ry = ((ph * span) + t * sp) % span;
          const ry0 = topY + 10 + ry;
          const rx = x - 34 + DC_hash(it.seed + k * 2.3) * 68;
          // brightest in the middle of the beam, gone at its edges
          ctx.globalAlpha = 0.30 * flick * (1 - Math.abs(rx - x) / 40) * (1 - ry / span * 0.5);
          if (ctx.globalAlpha <= 0.01) continue;
          ctx.beginPath();
          ctx.moveTo(rx, ry0);
          ctx.lineTo(rx - 4, ry0 + 15);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  // Fed into the deferred lighting pass alongside the gameplay lights.
  addLights(push, camX, t) {
    for (const it of this.items) {
      const sx = it.x - camX;
      if (sx < -140 || sx > CW + 140) continue;
      const c = this.colour(it);
      const flick = it.neon
        ? (DC_hash(Math.floor(t * 9) + it.seed) > 0.06 ? 1 : 0.3)
        : 0.92 + 0.08 * Math.sin(t * 2.6 + it.seed);
      const bulbY = it.y - it.h + (it.neon ? 18 : 10);
      push(it.x, bulbY, it.neon ? 150 : 210, c[0], c[1], c[2],
        (it.neon ? 0.48 : 0.82) * flick, 0.09);
    }
  }
}


// ═══ FOREGROUND ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
//  FOREGROUND — out-of-focus clutter between the camera and the playfield.
//
//  A side-on game with nothing in front of the action always reads flat, no
//  matter how good the lighting behind it is: the eye gets depth from
//  OCCLUSION and from parallax, and a scene with exactly one plane offers
//  neither. Contemporary 2D games all solve it the same way — near-black
//  shapes drifting across the lens faster than the world, slightly defocused,
//  that the player's eye reads as "I am standing behind something".
//
//  Everything here is a silhouette: no detail, no colour, soft edges. It is
//  drawn after the world and before the HUD, at roughly 1.4x the camera speed,
//  and it deliberately never covers the middle band where the player lives.
//
//  The blur is faked. A real defocus would mean another full-screen canvas and
//  another upload per frame, which measured as a genuine cost; a silhouette
//  built from soft radial and linear gradients is indistinguishable at this
//  value range, because a near-black shape against a dark city has almost no
//  edge contrast to give the trick away.
// ═══════════════════════════════════════════════════════════════════════

function FG_hash(n) { const s = Math.sin(n * 41.17 + 3.77) * 43758.5453; return s - Math.floor(s); }

class Foreground {
  constructor() { this.items = []; this.key = null; }

  // Placed once per level from the level geometry, never per frame.
  build(world, levelId) {
    if (this.key === levelId) return;
    this.key = levelId;
    this.items = [];
    if (!world) return;

    const W = world.w;
    let cx = 6;
    while (cx < W - 4) {
      const h = FG_hash(cx * 2.3);
      let kind;
      if (h < 0.34) kind = 'pipe';
      else if (h < 0.60) kind = 'rail';
      else if (h < 0.82) kind = 'cable';
      else kind = 'post';
      this.items.push({
        x: cx * TILE,
        kind: kind,
        seed: cx,
        // vertical placement: pipes and cables hang from the top of frame,
        // rails and posts rise from the bottom
        span: 0.5 + FG_hash(cx * 5.1) * 0.9,
      });
      cx += 19 + Math.floor(FG_hash(cx * 1.9) * 17);
    }
  }

  // camX is the world camera; the foreground runs faster so it slides past.
  draw(ctx, camX, t) {
    if (!this.items.length) return;
    const PAR = 1.42;
    ctx.save();
    for (const it of this.items) {
      const x = it.x - camX * PAR;
      if (x < -300 || x > CW + 300) continue;
      const a = 0.62;
      switch (it.kind) {
        case 'pipe': this.pipe(ctx, x, it, a, t); break;
        case 'rail': this.rail(ctx, x, it, a); break;
        case 'cable': this.cable(ctx, x, it, a, t); break;
        default: this.post(ctx, x, it, a); break;
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // A soft-edged vertical bar: the gradient across its width IS the defocus.
  soft(ctx, x, y, w, h, a) {
    // The falloff has to be WIDE. A short ramp still reads as an edge, and an
    // edge reads as a black bar laid over the picture rather than as something
    // close to the lens. Two thirds of the width is transition.
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0.00, 'rgba(2,4,7,0)');
    g.addColorStop(0.22, 'rgba(2,4,7,' + (a * 0.18).toFixed(3) + ')');
    g.addColorStop(0.40, 'rgba(2,4,7,' + (a * 0.70).toFixed(3) + ')');
    g.addColorStop(0.60, 'rgba(2,4,7,' + (a * 0.70).toFixed(3) + ')');
    g.addColorStop(0.78, 'rgba(2,4,7,' + (a * 0.18).toFixed(3) + ')');
    g.addColorStop(1.00, 'rgba(2,4,7,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - w, y, w * 2, h);
  }

  // a fat drainpipe running the full height, with a joint collar
  pipe(ctx, x, it, a, t) {
    const w = 17 + FG_hash(it.seed) * 13;
    this.soft(ctx, x, -20, w, CH + 40, a);
    const cy = CH * (0.18 + FG_hash(it.seed + 3) * 0.5);
    this.soft(ctx, x, cy, w * 1.5, 16, a * 0.95);
    const cy2 = cy + 120 + FG_hash(it.seed + 9) * 160;
    if (cy2 < CH) this.soft(ctx, x, cy2, w * 1.4, 13, a * 0.9);
  }

  // a railing crossing the lower third: one top rail and a few uprights
  rail(ctx, x, it, a) {
    const y = CH * (0.62 + FG_hash(it.seed + 1) * 0.2);
    const wide = 180 + FG_hash(it.seed + 4) * 220;
    const g = ctx.createLinearGradient(0, y - 15, 0, y + 15);
    g.addColorStop(0.0, 'rgba(2,4,7,0)');
    g.addColorStop(0.32, 'rgba(2,4,7,' + (a * 0.38).toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(2,4,7,' + (a * 0.80).toFixed(3) + ')');
    g.addColorStop(0.68, 'rgba(2,4,7,' + (a * 0.38).toFixed(3) + ')');
    g.addColorStop(1.0, 'rgba(2,4,7,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - wide * 0.5, y - 15, wide, 30);
    const n = 2 + Math.floor(FG_hash(it.seed + 7) * 3);
    for (let i = 0; i <= n; i++) {
      const px = x - wide * 0.5 + (wide * i) / n;
      this.soft(ctx, px, y, 9, CH - y + 20, a * 0.8);
    }
  }

  // a slack catenary sagging across the top of frame, swaying very slightly
  cable(ctx, x, it, a, t) {
    const y0 = CH * (0.05 + FG_hash(it.seed + 2) * 0.22);
    const wide = 300 + FG_hash(it.seed + 6) * 320;
    const sag = 60 + FG_hash(it.seed + 8) * 110 + Math.sin(t * 0.5 + it.seed) * 5;
    ctx.save();
    ctx.strokeStyle = 'rgba(2,4,7,' + (a * 0.80).toFixed(3) + ')';
    ctx.lineCap = 'round';
    // three passes of decreasing width fake the soft edge of a defocused wire
    for (const [lw, al] of [[11, 0.22], [7, 0.45], [3.6, 0.85]]) {
      ctx.globalAlpha = al;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(x - wide * 0.5, y0);
      ctx.quadraticCurveTo(x, y0 + sag * 2, x + wide * 0.5, y0 + FG_hash(it.seed + 11) * 30);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // a lamp post or sign pole crossing the whole frame
  post(ctx, x, it, a) {
    const w = 11 + FG_hash(it.seed + 5) * 9;
    this.soft(ctx, x, -20, w, CH + 40, a * 0.92);
    const ay = CH * (0.12 + FG_hash(it.seed + 13) * 0.22);
    const arm = 60 + FG_hash(it.seed + 17) * 90;
    const dir = FG_hash(it.seed + 19) > 0.5 ? 1 : -1;
    const g = ctx.createLinearGradient(0, ay - 8, 0, ay + 8);
    g.addColorStop(0, 'rgba(2,4,7,0)');
    g.addColorStop(0.5, 'rgba(2,4,7,' + (a * 0.86).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(2,4,7,0)');
    ctx.fillStyle = g;
    ctx.fillRect(dir > 0 ? x : x - arm, ay - 8, arm, 16);
  }
}

//  TEXTURES — the one place the game stops being purely procedural.
//
//  Everything else here is drawn from strokes and gradients, and that rule
//  earned its keep: it is why the whole game is one small file with no asset
//  pipeline. But procedural stone has a ceiling. Canvas gradients can give a
//  surface a VALUE and a SHAPE; they cannot give it the fine irregular grain
//  that makes the eye read "this is a real material" rather than "this is a
//  shaded polygon". Three small tiling maps buy exactly that, and nothing else
//  in the renderer can.
//
//  What is here, and why each one:
//
//    det  surface detail, zero-centred. Modulates the albedo the tiles already
//         paint, so the stone keeps its authored colour and only gains grain.
//    nrm  a normal map derived from that same height field. This is the one
//         that genuinely changes the lighting: the deferred pass already
//         consumes a normal buffer, so the moon and the street lamps now rake
//         across actual surface relief instead of a flat plane.
//    grm  grime and vertical rain-runoff, at a much larger scale, so that one
//         block does not look like the block next to it.
//
//  They total about 85 KB of base64 — a fifth of the file, for the single
//  largest step in material realism available. They are deliberately small and
//  monochrome: colour comes from the art, these only carry detail.
//
//  All three are seamless by construction (see demo/mktex.py) and are locked
//  to WORLD space, not screen space. A screen-locked pattern slides across the
//  ground as the camera moves, which reads as the texture swimming and is far
//  worse than having no texture at all.
// ═══════════════════════════════════════════════════════════════════════

const TEX = { ready: false, img: {}, pat: {}, pend: 0, failed: false };

function TEX_load() {
  const keys = Object.keys(TEX_SRC);
  TEX.pend = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = function () {
      TEX.img[k] = im;
      if (--TEX.pend === 0) TEX.ready = Object.keys(TEX.img).length === keys.length;
    };
    // A missing texture must degrade to the old procedural look, never to a
    // broken frame: every caller checks TEX.ready and skips the whole pass.
    im.onerror = function () {
      TEX.failed = true;
      if (--TEX.pend === 0) TEX.ready = false;
    };
    im.src = TEX_SRC[k];
  }
}

// `repeat` is how many WORLD pixels one tile of the map covers. Bigger means
// coarser; the detail map wants to be fine and the grime map wants to be broad
// enough that neighbouring blocks differ.
function TEX_pat(ctx, key, repeat, camX, camY) {
  const im = TEX.img[key];
  if (!im) return null;
  const ck = key + '@' + repeat;
  let rec = TEX.pat[ck];
  if (!rec || rec.ctx !== ctx) {
    const p = ctx.createPattern(im, 'repeat');
    if (!p) return null;
    rec = TEX.pat[ck] = { ctx: ctx, pat: p, ok: typeof DOMMatrix !== 'undefined' && !!p.setTransform };
  }
  if (rec.ok) {
    const s = repeat / im.width;
    // modulo by the repeat length keeps the translation small; a camera 20000
    // pixels into a level otherwise hands the matrix a number big enough to
    // lose sub-pixel precision, and the texture visibly jitters
    const ox = -(camX % repeat), oy = -((camY || 0) % repeat);
    try {
      rec.pat.setTransform(new DOMMatrix([s, 0, 0, s, ox, oy]));
    } catch (e) { rec.ok = false; }
  }
  return rec.pat;
}

// Lays the detail and grime maps over a path of already-painted tiles.
// One fill per map for the whole screen's worth of stone, not one per tile.
function TEX_surface(ctx, path, camX) {
  if (!TEX.ready) return;
  const det = TEX_pat(ctx, 'det', 192, camX);
  const grm = TEX_pat(ctx, 'grm', 384, camX);
  if (!det || !grm) return;
  ctx.save();
  // 'overlay' keeps the tile's own value and pushes contrast into it, which is
  // what a detail map is for. 'multiply' for the grime, because dirt only ever
  // subtracts light.
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = det;
  ctx.fill(path);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.52;
  ctx.fillStyle = grm;
  ctx.fill(path);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// Perturbs the baked normals with the real surface relief. The normal buffer
// is half resolution, so the map is 128px and covers 256 world pixels — that
// lands it at 1:1 in the buffer, with no minification to alias.
//
// Straight alpha blending of two normals is not a correct rotation, but the
// lighting shader normalizes what it reads, so the result is a well-formed
// unit vector pointing between the two. At this strength the difference from a
// proper slerp is not visible.
function TEX_normals(ctx, path, camX) {
  if (!TEX.ready) return;
  const p = TEX_pat(ctx, 'nrm', 256, camX);
  if (!p) return;
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = p;
  ctx.fill(path);
  ctx.restore();
  ctx.globalAlpha = 1;
}


// ═══ POSTFX ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
//  POST-PROCESSING — WebGL2 pipeline run over the 2D scene each frame.
//
//  scene canvas -> bright pass -> 6-level mip blur chain (downsample with a
//  13-tap filter, upsample with a tent filter, accumulated additively) ->
//  composite: chromatic aberration, bloom, ACES filmic tonemap, lift/gamma/
//  gain grading, split toning, vignette, grain, and an ordered dither.
//
//  The dither matters more than it sounds: this game is almost entirely dark
//  gradients, and 8-bit output bands badly without it.
//
//  Degrades to null if WebGL2 is unavailable — the caller then shows the
//  plain 2D canvas instead.
// ═══════════════════════════════════════════════════════════════════════

var PFX_VERT = [
  '#version 300 es',
  'out vec2 vUV;',
  'void main(){',
  '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
  '  vUV = p;',
  '  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);',
  '}'
].join('\n');

var PFX_HEAD = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'in vec2 vUV;',
  'out vec4 oColor;'
].join('\n');

// ── bright pass ─────────────────────────────────────────────────────────
var PFX_BRIGHT = PFX_HEAD + [
  '',
  'uniform sampler2D uTex;',
  'uniform float uThreshold;',
  'uniform float uKnee;',
  'uniform float uWarm;',
  'void main(){',
  '  vec3 c = texture(uTex, vUV).rgb;',
  '  c = pow(max(c, 0.0), vec3(2.2));',            // to rough linear
  '  float br = max(c.r, max(c.g, c.b));',
  '  float k = max(uKnee, 1e-4);',
  '  float soft = clamp(br - uThreshold + k, 0.0, 2.0 * k);',
  '  soft = soft * soft / (4.0 * k);',
  '  float contrib = max(soft, br - uThreshold) / max(br, 1e-4);',
  // Gotham's light sources are amber: let gold bloom harder than blue-white
  '  float warm = clamp(c.r + c.g * 0.6 - c.b * 1.2, 0.0, 2.0);',
  '  contrib *= 1.0 + uWarm * warm;',
  '  oColor = vec4(c * contrib, 1.0);',
  '}'
].join('\n');

// ── deferred lighting ───────────────────────────────────────────────────
// Albedo x (ambient + sum of lights), evaluated against the normal buffer.
// Ambient is deliberately high: the 2D art already carries its own baked
// shading, so lights ADD highlights rather than being the only illumination.
// Anything the lights push above 1.0 spills into the bloom chain downstream.
var PFX_MAXL = 24;
var PFX_LIGHT = PFX_HEAD + [
  '',
  'uniform sampler2D uAlbedo;',
  'uniform sampler2D uNrm;',
  'uniform sampler2D uOcc;',
  'uniform int   uShadowCount;',
  'uniform float uShadowStrength;',
  'uniform float uSunShadow;',
  'uniform float uSunLen;',
  'uniform float uAO;',
  'uniform float uSpec;',       // global specular strength
  'uniform float uSunSpec;',    // the moon throws a hard highlight of its own
  'uniform vec3  uAmbient;',
  'uniform float uAspect;',
  'uniform float uNrmStrength;',
  'uniform int   uCount;',
  'uniform vec4  uLP[' + PFX_MAXL + '];',   // xy = uv position, z = height, w = radius
  'uniform vec4  uLC[' + PFX_MAXL + '];',   // rgb = colour, a = intensity
  'uniform vec3  uSunDir;',
  'uniform vec3  uSunCol;',
  '',
  // March from the fragment toward the light through the occluder map. The
  // first couple of steps are skipped so a surface does not shadow itself,
  // and the taps widen with distance to fake a penumbra.
  'float PFX_shadow(vec2 uv, vec2 lp){',
  '  const int ST = 9;',
  '  vec2 stepv = (lp - uv) / float(ST);',
  '  float occ = 0.0;',
  // One tap per step, offset perpendicular by a step-varying amount: it
  // softens the edge the same way three taps did, at a third of the cost.
  '  for (int i = 3; i <= ST; i++) {',
  '    float f = float(i) / float(ST);',
  '    vec2 w = vec2(stepv.y, -stepv.x) * (f - 0.5) * 0.9;',
  '    occ += texture(uOcc, uv + stepv * float(i) + w).r;',
  '  }',
  '  return clamp(1.0 - (occ / float(ST - 2)) * uShadowStrength, 0.0, 1.0);',
  '}',
  '',
  'void main(){',
  '  vec3 n = texture(uNrm, vUV).rgb * 2.0 - 1.0;',
  // The normal buffer is authored in canvas space (y grows downward) but every
  // light vector here is in UV space (y grows upward), so the vertical
  // component has to be flipped or lighting arrives upside down.
  '  n.y = -n.y;',
  '  n.xy *= uNrmStrength;',
  '  n = normalize(n + vec3(0.0, 0.0, 1e-5));',
  '  vec3 lit = uAmbient;',
  '',
  // ── material ──────────────────────────────────────────────────────────
  // Everything above this line was Lambertian: every surface in the game
  // answered light the same way, which is exactly why it read as illustrated
  // rather than rendered. The occluder buffer now carries roughness in green
  // and specular mass in blue, so wet stone, lacquered metal, brick and the
  // suit each answer differently.
  '  vec4 mat = texture(uOcc, vUV);',
  '  float rough = clamp(mat.g, 0.03, 1.0);',
  '  float shin  = mix(240.0, 3.0, rough * rough);',
  // Fresnel. Light grazing a surface reflects far more of it, which is why a
  // wet road glares at you down its length and not underfoot, and why every
  // edge in a modern frame carries a bright lip. n.z is 1 facing the camera
  // and 0 at a silhouette edge, so this falls out of the normal buffer for
  // free and lands exactly where the eye expects it.
  '  float fres  = pow(1.0 - clamp(n.z, 0.0, 1.0), 4.0);',
  '  float kspec = mat.b * uSpec * (0.22 + 1.25 * fres);',
  '  vec3  V     = vec3(0.0, 0.0, 1.0);',
  '  vec3  spec  = vec3(0.0);',
  // Contact occlusion. Only air pixels are darkened, and only by how much
  // geometry crowds them, so nooks where a wall meets the floor and the
  // undersides of ledges pick up a soft grounding shadow. Pixels inside
  // geometry are left alone - the tile art already shades its own volume.
  '  if (uAO > 0.001 && texture(uOcc, vUV).r < 0.45) {',
  '    float occ = 0.0;',
  '    for (int i = 0; i < 6; i++) {',
  '      float a = float(i) * 1.0471975;',
  '      vec2 d = vec2(cos(a) / uAspect, sin(a));',
  '      occ += texture(uOcc, vUV + d * 0.016).r;',
  '    }',
  '    lit *= 1.0 - clamp(occ / 6.0, 0.0, 1.0) * uAO;',
  '  }',
  // Directional (moon) shadow: a fixed-length march along the light direction.
  // This is what produces the long raking shadows off every block and figure -
  // the point lights are small and local, so on their own they barely read.
  '  float sunSh = 1.0;',
  '  if (uSunShadow > 0.0) {',
  '    vec2 sd = normalize(vec2(uSunDir.x / uAspect, uSunDir.y)) * uSunLen;',
  '    float socc = 0.0;',
  '    for (int i = 2; i <= 9; i++) {',
  '      socc += texture(uOcc, vUV + sd * (float(i) / 9.0)).r;',
  '    }',
  '    sunSh = clamp(1.0 - (socc / 8.0) * uSunShadow, 0.0, 1.0);',
  '  }',
  '  vec3 sdir = normalize(uSunDir);',
  '  lit += uSunCol * max(dot(n, sdir), 0.0) * sunSh;',
  // the moon is a small, hard source: a tight highlight, not a wash
  '  vec3 sh2 = normalize(sdir + V);',
  '  spec += uSunCol * (pow(max(dot(n, sh2), 0.0), shin) * kspec * uSunSpec * sunSh);',
  '  for (int i = 0; i < ' + PFX_MAXL + '; i++) {',
  '    if (i >= uCount) break;',
  '    vec4 lp = uLP[i];',
  '    vec3 L = vec3((lp.x - vUV.x) * uAspect, lp.y - vUV.y, lp.z);',
  '    float dist = length(L);',
  '    L /= max(dist, 1e-5);',
  '    float att = max(0.0, 1.0 - dist / max(lp.w, 1e-5));',
  '    att *= att;',
  // wrap the falloff slightly: surfaces angled away still catch a little,
  // which reads as bounce light and avoids hard terminator lines
  '    float ndl = max(dot(n, L), 0.0) * 0.82 + 0.18;',
  // only the strongest few lights cast: shadow marching is the expensive part
  '    float sh = (i < uShadowCount && att > 0.001) ? PFX_shadow(vUV, lp.xy) : 1.0;',
  '    lit += uLC[i].rgb * (uLC[i].a * att * ndl * sh);',
  // Specular from the same source. This is what puts a streak of the street
  // lamp on the wet road, a glint on the signal blocks and a hard edge on the
  // suit — the single largest step from "drawn" towards "lit".
  '    vec3 hv = normalize(L + V);',
  '    spec += uLC[i].rgb * (uLC[i].a * att * pow(max(dot(n, hv), 0.0), shin) * kspec * sh);',
  '  }',
  // RGB carries diffuse AND specular summed, and alpha carries the specular's
  // luminance, so the apply pass can separate them again without a second
  // buffer. Keeping them apart matters: diffuse multiplies the surface colour,
  // specular is light bounced off it and must be ADDED — folding the highlight
  // into the albedo is what washed every stone block out to flat grey.
  '  float slum = dot(spec, vec3(0.2126, 0.7152, 0.0722));',
  '  oColor = vec4(lit + spec, slum);',
  '}'
].join('\n');

// ── apply lighting ──────────────────────────────────────────────────────
// Light, shadows and AO are all low-frequency, so the pass above runs at
// half resolution and this multiplies the full-resolution albedo by the
// upscaled result. Same picture, a quarter of the fragment work.
var PFX_APPLY = PFX_HEAD + [
  '',
  'uniform sampler2D uAlbedo;',
  'uniform sampler2D uLight;',
  'void main(){',
  '  vec3 alb = texture(uAlbedo, vUV).rgb;',
  '  vec4 L   = texture(uLight, vUV);',
  // Split the sum back apart using the luminance the light pass stored in
  // alpha. Doing it by ratio rather than by a flat tint keeps the highlight's
  // COLOUR — which is the whole point of a sodium lamp streaking amber across
  // a blue-grey wet road.
  '  float lum   = max(dot(L.rgb, vec3(0.2126, 0.7152, 0.0722)), 1e-4);',
  '  float sfrac = clamp(L.a / lum, 0.0, 1.0);',
  '  vec3  specC = L.rgb * sfrac;',
  '  vec3  diffC = max(L.rgb - specC, vec3(0.0));',
  '  oColor = vec4(alb * diffC + specC, 1.0);',
  '}'
].join('\n');

// ── 13-tap downsample ───────────────────────────────────────────────────
var PFX_DOWN = PFX_HEAD + [
  '',
  'uniform sampler2D uTex;',
  'uniform vec2 uTexel;',
  'void main(){',
  '  vec2 t = uTexel;',
  '  vec3 a = texture(uTex, vUV + vec2(-2.0,  2.0) * t).rgb;',
  '  vec3 b = texture(uTex, vUV + vec2( 0.0,  2.0) * t).rgb;',
  '  vec3 c = texture(uTex, vUV + vec2( 2.0,  2.0) * t).rgb;',
  '  vec3 d = texture(uTex, vUV + vec2(-2.0,  0.0) * t).rgb;',
  '  vec3 e = texture(uTex, vUV                     ).rgb;',
  '  vec3 f = texture(uTex, vUV + vec2( 2.0,  0.0) * t).rgb;',
  '  vec3 g = texture(uTex, vUV + vec2(-2.0, -2.0) * t).rgb;',
  '  vec3 h = texture(uTex, vUV + vec2( 0.0, -2.0) * t).rgb;',
  '  vec3 i = texture(uTex, vUV + vec2( 2.0, -2.0) * t).rgb;',
  '  vec3 j = texture(uTex, vUV + vec2(-1.0,  1.0) * t).rgb;',
  '  vec3 k = texture(uTex, vUV + vec2( 1.0,  1.0) * t).rgb;',
  '  vec3 l = texture(uTex, vUV + vec2(-1.0, -1.0) * t).rgb;',
  '  vec3 m = texture(uTex, vUV + vec2( 1.0, -1.0) * t).rgb;',
  '  vec3 r = e * 0.125;',
  '  r += (a + c + g + i) * 0.03125;',
  '  r += (b + d + f + h) * 0.0625;',
  '  r += (j + k + l + m) * 0.125;',
  '  oColor = vec4(r, 1.0);',
  '}'
].join('\n');

// ── 9-tap tent upsample ─────────────────────────────────────────────────
var PFX_UP = PFX_HEAD + [
  '',
  'uniform sampler2D uTex;',
  'uniform vec2 uTexel;',
  'uniform float uRadius;',
  'void main(){',
  '  vec2 t = uTexel * uRadius;',
  '  vec3 r = vec3(0.0);',
  '  r += texture(uTex, vUV + vec2(-1.0,  1.0) * t).rgb * 1.0;',
  '  r += texture(uTex, vUV + vec2( 0.0,  1.0) * t).rgb * 2.0;',
  '  r += texture(uTex, vUV + vec2( 1.0,  1.0) * t).rgb * 1.0;',
  '  r += texture(uTex, vUV + vec2(-1.0,  0.0) * t).rgb * 2.0;',
  '  r += texture(uTex, vUV                      ).rgb * 4.0;',
  '  r += texture(uTex, vUV + vec2( 1.0,  0.0) * t).rgb * 2.0;',
  '  r += texture(uTex, vUV + vec2(-1.0, -1.0) * t).rgb * 1.0;',
  '  r += texture(uTex, vUV + vec2( 0.0, -1.0) * t).rgb * 2.0;',
  '  r += texture(uTex, vUV + vec2( 1.0, -1.0) * t).rgb * 1.0;',
  '  oColor = vec4(r / 16.0, 1.0);',
  '}'
].join('\n');

// ── depth of field merge ────────────────────────────────────────────────
// The backdrop arrives on its own canvas and is downsampled twice; sampling
// that small texture with hardware bilinear filtering IS the blur, for the
// cost of two quarter-res passes. The foreground canvas is transparent
// everywhere the world does not cover, so its alpha is the composite mask and
// the playfield, entities and HUD all stay perfectly sharp.
var PFX_MERGE = PFX_HEAD + [
  '',
  'uniform sampler2D uBg;',
  'uniform sampler2D uFg;',
  'uniform float uBgDim;',
  'void main(){',
  '  vec4 fg = texture(uFg, vUV);',
  '  vec3 bg = texture(uBg, vUV).rgb * uBgDim;',
  '  oColor = vec4(mix(bg, fg.rgb, clamp(fg.a, 0.0, 1.0)), 1.0);',
  '}'
].join('\n');

// ── wet ground reflections ──────────────────────────────────────────────
// Screen-space mirror: the wet buffer marks every exposed floor tile and
// stores, per pixel, the v coordinate of the surface it belongs to. Each
// pixel below that line samples the lit scene mirrored about it, rippled and
// fading with depth. Runs after lighting so reflected light sources still
// feed the bloom chain.
var PFX_WET = PFX_HEAD + [
  '',
  'uniform sampler2D uLit;',
  'uniform sampler2D uWet;',
  'uniform float uTime;',
  'uniform float uStrength;',
  'uniform float uFade;',
  'uniform float uSquash;',
  'uniform float uRipple;',
  'uniform vec3  uTint;',
  'float PFX_h1(float n){ return fract(sin(n * 17.17) * 43758.5453); }',
  '',
  'void main(){',
  '  vec3 base = texture(uLit, vUV).rgb;',
  '  vec4 w = texture(uWet, vUV);',
  '  if (w.r < 0.08) { oColor = vec4(base, 1.0); return; }',
  '  float surfV = w.g;',                       // v of the reflecting surface
  '  float d = surfV - vUV.y;',                 // how far below the surface we are
  '  if (d <= 0.0) { oColor = vec4(base, 1.0); return; }',
  // two ripple frequencies so the surface never looks like a single sine
  '  float rip = sin(vUV.x * 150.0 + uTime * 1.7 + d * 95.0) * 0.0016',
  '           + sin(vUV.x * 63.0 - uTime * 1.1) * 0.0011;',
  // A true 1:1 mirror only reaches as far above the floor as the band is
  // deep - about 34px - so it reflected almost nothing. Compressing it
  // pulls the windows, the moon and the player down into the puddle, which
  // is what actually reads as a wet street in a side-on view.
  // Rain rings. Each slot along x owns a drop on its own period; the ring
  // radius grows and fades, warping the mirror and leaving a bright crest.
  // The vertical term is squashed hard because the floor is seen edge-on, so
  // the rings read as ellipses rather than circles.
  '  float ripAmp = 0.0;',
  '  float ripPush = 0.0;',
  '  if (uRipple > 0.001) {',
  '    for (int i = 0; i < 4; i++) {',
  '      float slot = floor(vUV.x * 9.0) + float(i - 1);',
  '      float h1 = PFX_h1(slot + 3.7);',
  '      float h2 = PFX_h1(slot + 11.3);',
  '      float cu = (slot + h1) / 9.0;',
  '      float ph = fract(uTime / (1.1 + h2 * 1.4) + h2);',
  '      float rad = ph * 0.058;',
  '      float du = vUV.x - cu;',
  '      float dv = d * 3.2;',
  '      float dist = sqrt(du * du + dv * dv);',
  '      float ring = exp(-abs(dist - rad) * 250.0) * (1.0 - ph);',
  '      ripAmp += ring;',
  '      ripPush += (du > 0.0 ? 1.0 : -1.0) * ring;',
  '    }',
  '    ripAmp *= uRipple;',
  '    ripPush *= uRipple;',
  '  }',
  '  vec2 ruv = vec2(vUV.x + rip + ripPush * 0.006, surfV + d * uSquash);',
  '  vec3 refl = texture(uLit, ruv).rgb;',
  '  float fade = exp(-d * uFade);',
  '  float amt = clamp(w.r * uStrength * fade, 0.0, 0.9);',
  '  vec3 outc = mix(base, refl * uTint, amt);',
  '  outc += vec3(0.55, 0.68, 0.9) * clamp(ripAmp, 0.0, 1.6) * 0.30 * fade;',
  '  oColor = vec4(outc, 1.0);',
  '}'
].join('\n');

// ── anamorphic streak ───────────────────────────────────────────────────
// A wide horizontal-only blur of the bright pass. Real anamorphic lenses
// smear highlights sideways and tint them blue; it is the single cheapest
// thing that makes a frame read as "shot" rather than "rendered".
var PFX_STREAK = PFX_HEAD + [
  '',
  'uniform sampler2D uTex;',
  'uniform vec2 uTexel;',
  'uniform float uLen;',
  'void main(){',
  '  vec3 acc = vec3(0.0);',
  '  float wsum = 0.0;',
  '  for (int i = -14; i <= 14; i++) {',
  '    float fi = float(i);',
  '    float w = 1.0 - abs(fi) / 15.0;',
  '    w *= w;',
  '    acc += texture(uTex, vUV + vec2(fi * uTexel.x * uLen, 0.0)).rgb * w;',

    }

    // 0. deferred lighting pass
    if (normalSource && prm.lighting !== false) {
      upload('nrm', self.normalTex, normalSource);
      var castShadows = !!(occSource && prm.shadows !== false);
      if (castShadows) {
        upload('occ', self.occTex, occSource);
      }

      var n = Math.min(lights ? lights.length : 0, PFX_MAXL);
      for (var li = 0; li < n; li++) {
        var L = lights[li], o4 = li * 4;
        self.lpBuf[o4] = L.x; self.lpBuf[o4 + 1] = L.y;
        self.lpBuf[o4 + 2] = L.z; self.lpBuf[o4 + 3] = L.r;
        self.lcBuf[o4] = L.cr; self.lcBuf[o4 + 1] = L.cg;
        self.lcBuf[o4 + 2] = L.cb; self.lcBuf[o4 + 3] = L.i;
      }
      var lp = self.progLight;
      gl.useProgram(lp.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, self.normalTex);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, self.occTex);
      gl.uniform1i(lp.u.uNrm, 1);
      gl.uniform1i(lp.u.uOcc, 2);
      gl.uniform1i(lp.u.uShadowCount, castShadows ? Math.min(prm.shadowLights, n) : 0);
      gl.uniform1f(lp.u.uShadowStrength, prm.shadowStrength);
      gl.uniform1f(lp.u.uSunShadow, castShadows ? prm.sunShadow : 0.0);
      gl.uniform1f(lp.u.uSunLen, prm.sunLen);
      gl.uniform1f(lp.u.uAO, prm.ao);
      gl.uniform1f(lp.u.uSpec, prm.specular);
      gl.uniform1f(lp.u.uSunSpec, prm.sunSpec);
      gl.uniform3fv(lp.u.uAmbient, prm.ambient);
      gl.uniform1f(lp.u.uAspect, self.w / Math.max(1, self.h));
      gl.uniform1f(lp.u.uNrmStrength, prm.normalStrength);
      gl.uniform1i(lp.u.uCount, n);
      if (lp.u['uLP[0]']) gl.uniform4fv(lp.u['uLP[0]'], self.lpBuf);
      if (lp.u['uLC[0]']) gl.uniform4fv(lp.u['uLC[0]'], self.lcBuf);
      gl.uniform3fv(lp.u.uSunDir, prm.sunDir);
      gl.uniform3fv(lp.u.uSunCol, prm.sunCol);
      blit(lp, self.lightBuf);
      var ap = self.progApply;
      gl.useProgram(ap.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, self.lightBuf.tex);
      gl.uniform1i(ap.u.uAlbedo, 0);
      gl.uniform1i(ap.u.uLight, 1);
      blit(ap, self.lit);
      srcTex = self.lit.tex;
      gl.activeTexture(gl.TEXTURE0);
    }

    // 0b. wet-ground reflections, before bloom so reflected lights glow too
    if (wetSource && prm.wet > 0.001 && srcTex === self.lit.tex) {
      upload('wet', self.wetTex, wetSource);
      var wp = self.progWet;
      gl.useProgram(wp.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, self.wetTex);
      gl.uniform1i(wp.u.uLit, 0);
      gl.uniform1i(wp.u.uWet, 1);
      gl.uniform1f(wp.u.uTime, prm.time);
      gl.uniform1f(wp.u.uStrength, prm.wet);
      gl.uniform1f(wp.u.uFade, prm.wetFade);
      gl.uniform1f(wp.u.uSquash, prm.wetSquash);
      gl.uniform1f(wp.u.uRipple, prm.ripple);
      gl.uniform3fv(wp.u.uTint, prm.wetTint);
      blit(wp, self.wet);
      srcTex = self.wet.tex;
      gl.activeTexture(gl.TEXTURE0);
    }

    // 1. bright pass into mip 0
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.useProgram(self.progBright.p);
    gl.uniform1i(self.progBright.u.uTex, 0);
    gl.uniform1f(self.progBright.u.uThreshold, prm.threshold);
    gl.uniform1f(self.progBright.u.uKnee, prm.knee);
    gl.uniform1f(self.progBright.u.uWarm, prm.warm);
    blit(self.progBright, self.mips[0]);

    // 2. downsample chain
    gl.useProgram(self.progDown.p);
    gl.uniform1i(self.progDown.u.uTex, 0);
    for (var i = 1; i < self.mips.length; i++) {
      gl.bindTexture(gl.TEXTURE_2D, self.mips[i - 1].tex);
      gl.uniform2f(self.progDown.u.uTexel, 1 / self.mips[i - 1].w, 1 / self.mips[i - 1].h);
      blit(self.progDown, self.mips[i]);
    }

    // 3. upsample chain, accumulating additively
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(self.progUp.p);
    gl.uniform1i(self.progUp.u.uTex, 0);
    gl.uniform1f(self.progUp.u.uRadius, prm.radius);
    for (var j = self.mips.length - 1; j > 0; j--) {
      gl.bindTexture(gl.TEXTURE_2D, self.mips[j].tex);
      gl.uniform2f(self.progUp.u.uTexel, 1 / self.mips[j].w, 1 / self.mips[j].h);
      blit(self.progUp, self.mips[j - 1]);
    }
