  ctx.fillStyle = TL_grad(ctx, 'ggcol' + Math.round(w), w * 0.08, 0, w * 0.95, 0, [
    [0, '#3b424c'], [0.22, PAL.stoneL], [0.55, PAL.stone], [1, '#0d1116']
  ]);
  ctx.fillRect(w * 0.10, colTop, w * 0.80, ch);

  // fluting
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const fx = w * 0.10 + (w * 0.80) * (i / 4);
    ctx.beginPath(); ctx.moveTo(fx, colTop + 6); ctx.lineTo(fx, h); ctx.stroke();
    ctx.strokeStyle = 'rgba(146,162,186,0.13)';
    ctx.beginPath(); ctx.moveTo(fx + 1.2, colTop + 6); ctx.lineTo(fx + 1.2, h); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  }
  // weathering streaks
  ctx.save();
  ctx.beginPath(); ctx.rect(w * 0.10, colTop, w * 0.80, ch); ctx.clip();
  for (let i = 0; i < 9; i++) {
    const sx = w * 0.12 + TL_rnd(i * 3 + 1) * w * 0.76;
    const sl = ch * (0.25 + TL_rnd(i * 5) * 0.7);
    ctx.globalAlpha = 0.10 + TL_rnd(i * 7) * 0.16;
    ctx.fillStyle = TL_grad(ctx, 'ggstr' + Math.round(colTop), 0, colTop, 0, colTop + ch, [
      [0, 'rgba(8,10,14,0.92)'], [1, 'rgba(8,10,14,0)']
    ]);
    ctx.fillRect(sx, colTop + 4, 1 + TL_rnd(i) * 2.5, sl);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ledge / capital
  const lw = w * 1.0, lx = (w - lw) / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(lx + 3, colTop + 4, lw, 10);
  ctx.fillStyle = TL_grad(ctx, 'ggledge' + Math.round(w), 0, colTop - 6, 0, colTop + 12, [
    [0, '#4a535e'], [0.4, PAL.stone], [1, '#12161c']
  ]);
  ctx.fillRect(lx, colTop - 6, lw, 14);
  ctx.fillStyle = 'rgba(158,176,200,0.30)';
  ctx.fillRect(lx, colTop - 6, lw, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(lx, colTop + 6.5, lw, 1.5);

  // ---- body (hunched) ----
  const bx = w / 2, by = colTop - 6;
  const bodyH = colTop - 6;
  const bodyW = w * 0.62;
  const gk = Math.round(bodyW) + '_' + Math.round(bodyH);

  ctx.save();
  ctx.translate(bx, by);

  // wings behind, folded
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.save();
    ctx.scale(sgn, 1);
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.12, -bodyH * 0.72);
    ctx.bezierCurveTo(bodyW * 0.85, -bodyH * 0.95, bodyW * 1.05, -bodyH * 0.45, bodyW * 0.72, -bodyH * 0.05);
    ctx.bezierCurveTo(bodyW * 0.62, -bodyH * 0.18, bodyW * 0.52, -bodyH * 0.10, bodyW * 0.46, -bodyH * 0.22);
    ctx.bezierCurveTo(bodyW * 0.40, -bodyH * 0.12, bodyW * 0.30, -bodyH * 0.14, bodyW * 0.24, -bodyH * 0.30);
    ctx.bezierCurveTo(bodyW * 0.18, -bodyH * 0.42, bodyW * 0.14, -bodyH * 0.58, bodyW * 0.12, -bodyH * 0.72);
    ctx.closePath();
    ctx.fillStyle = sgn < 0
      ? TL_grad(ctx, 'ggwl'+gk, 0, -bodyH, 0, 0, [[0, '#3a424c'], [1, '#0c1015']])
      : TL_grad(ctx, 'ggwr'+gk, 0, -bodyH, 0, 0, [[0, '#262c34'], [1, '#080b10']]);
    ctx.fill();
    // wing ribs
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(bodyW * 0.14, -bodyH * (0.66 - k * 0.04));
      ctx.quadraticCurveTo(bodyW * 0.5, -bodyH * (0.5 - k * 0.14), bodyW * (0.30 + k * 0.16), -bodyH * (0.20 - k * 0.05));
      ctx.stroke();
    }
    // rim light only on left wing
    if (sgn < 0) {
      ctx.strokeStyle = 'rgba(154,172,198,0.30)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bodyW * 0.12, -bodyH * 0.72);
      ctx.bezierCurveTo(bodyW * 0.85, -bodyH * 0.95, bodyW * 1.05, -bodyH * 0.45, bodyW * 0.72, -bodyH * 0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  // torso
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.34, 0);
  ctx.bezierCurveTo(-bodyW * 0.42, -bodyH * 0.34, -bodyW * 0.36, -bodyH * 0.58, -bodyW * 0.18, -bodyH * 0.66);
  ctx.lineTo(bodyW * 0.18, -bodyH * 0.66);
  ctx.bezierCurveTo(bodyW * 0.36, -bodyH * 0.58, bodyW * 0.42, -bodyH * 0.34, bodyW * 0.34, 0);
  ctx.closePath();
  ctx.fillStyle = TL_grad(ctx, 'ggtor'+gk, -bodyW * 0.4, -bodyH * 0.6, bodyW * 0.4, 0, [
    [0, '#474f5a'], [0.45, PAL.stone], [1, '#10141a']
  ]);
  ctx.fill();
  // a century of soot and acid rain: pitting on the stone, and the dark runnel
  // the rain has cut down the middle of the chest
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.34, 0);
  ctx.bezierCurveTo(-bodyW * 0.42, -bodyH * 0.34, -bodyW * 0.36, -bodyH * 0.58, -bodyW * 0.18, -bodyH * 0.66);
  ctx.lineTo(bodyW * 0.18, -bodyH * 0.66);
  ctx.bezierCurveTo(bodyW * 0.36, -bodyH * 0.58, bodyW * 0.42, -bodyH * 0.34, bodyW * 0.34, 0);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < 9; i++) {
    const px = (TL_rnd(i * 13 + 2) - 0.5) * bodyW * 0.7;
    const py = -TL_rnd(i * 7 + 5) * bodyH * 0.62;
    ctx.fillStyle = TL_rnd(i * 3) > 0.66 ? 'rgba(164,180,202,0.10)' : 'rgba(0,0,0,0.30)';
    ctx.fillRect(px, py, 1.4, 1.2);
  }
  ctx.fillStyle = TL_grad(ctx, 'ggsoot' + gk, 0, -bodyH * 0.66, 0, 0, [
    [0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,0.26)'], [1, 'rgba(0,0,0,0.46)']
  ]);
  ctx.fillRect(-bodyW * 0.5, -bodyH * 0.7, bodyW, bodyH * 0.72);
  ctx.restore();
  // chest shading + rim
  ctx.strokeStyle = 'rgba(158,176,200,0.24)'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.34, 0);
  ctx.bezierCurveTo(-bodyW * 0.42, -bodyH * 0.34, -bodyW * 0.36, -bodyH * 0.58, -bodyW * 0.18, -bodyH * 0.66);
  ctx.stroke();

  // head
  const hy = -bodyH * 0.76, hr = bodyW * 0.27;
  ctx.beginPath();
  ctx.ellipse(0, hy, hr, hr * 0.92, 0, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'gghead'+gk, -hr, hy - hr, hr, hy + hr, [
    [0, '#525b66'], [0.5, PAL.stone], [1, '#0f1318']
  ]);
  ctx.fill();
  // snout
  ctx.beginPath();
  ctx.moveTo(-hr * 0.5, hy + hr * 0.18);
  ctx.quadraticCurveTo(0, hy + hr * 1.15, hr * 0.5, hy + hr * 0.18);
  ctx.closePath();
  ctx.fillStyle = '#1a1f26'; ctx.fill();
  // fangs
  ctx.fillStyle = 'rgba(176,186,200,0.50)';
  ctx.beginPath(); ctx.moveTo(-hr * 0.22, hy + hr * 0.62); ctx.lineTo(-hr * 0.08, hy + hr * 0.60); ctx.lineTo(-hr * 0.16, hy + hr * 0.92); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hr * 0.22, hy + hr * 0.62); ctx.lineTo(hr * 0.08, hy + hr * 0.60); ctx.lineTo(hr * 0.16, hy + hr * 0.92); ctx.closePath(); ctx.fill();
  // horns
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.beginPath();
    ctx.moveTo(sgn * hr * 0.55, hy - hr * 0.45);
    ctx.quadraticCurveTo(sgn * hr * 1.25, hy - hr * 1.15, sgn * hr * 1.5, hy - hr * 2.0);
    ctx.quadraticCurveTo(sgn * hr * 0.95, hy - hr * 1.10, sgn * hr * 0.28, hy - hr * 0.78);
    ctx.closePath();
    ctx.fillStyle = sgn < 0 ? '#3f4751' : '#1d2228';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
  }
  // ember eyes -- flicker deterministically on t
  const flick = 0.62 + 0.38 * Math.sin(t * 7.3) * Math.sin(t * 2.1 + 1.3);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    const ex = sgn * hr * 0.40, ey = hy - hr * 0.05;
    ctx.globalAlpha = 0.13 + flick * 0.20;
    ctx.fillStyle = TL_rgrad(ctx, 'ggeye', 0, 0, 0, 0, 0, 10, [
      [0, 'rgba(255,170,80,1)'], [0.4, 'rgba(214,96,34,0.45)'], [1, 'rgba(170,60,20,0)']
    ]);
    ctx.save(); ctx.translate(ex, ey); ctx.scale(hr * 0.24, hr * 0.24);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 0.45 + flick * 0.30;
    ctx.fillStyle = '#e8b480';
    ctx.beginPath(); ctx.ellipse(ex, ey, hr * 0.10, hr * 0.075, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // clawed feet gripping the ledge
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.save(); ctx.scale(sgn, 1);
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.10, -bodyH * 0.12);
    ctx.quadraticCurveTo(bodyW * 0.46, -bodyH * 0.10, bodyW * 0.50, bodyH * 0.02);
    ctx.quadraticCurveTo(bodyW * 0.30, bodyH * 0.06, bodyW * 0.10, bodyH * 0.02);
    ctx.closePath();
    ctx.fillStyle = sgn < 0 ? '#3c444e' : '#1b2027';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const cxk = bodyW * (0.18 + k * 0.13);
      ctx.beginPath();
      ctx.moveTo(cxk, bodyH * 0.01);
      ctx.quadraticCurveTo(cxk + bodyW * 0.05, bodyH * 0.10, cxk - bodyW * 0.01, bodyH * 0.13);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore(); // body transform

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BEACON (level goal)
// ============================================================================
function drawBeacon(ctx, x, y, s, t, reached) {
  ctx.save();
  ctx.translate(x, y);
  const baseH = s * 0.55, baseW = s * 1.05;
  const dishCx = 0, dishCy = -s * 0.82, dishR = s * 0.52;
  const boost = reached ? 1 : 0;

  // ---------- volumetric cone (drawn first, behind hardware) ----------
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const sweep = Math.sin(t * 0.45) * (reached ? 0.10 : 0.22);
  const spread = (reached ? 3.1 : 1.9) * s;
  const reach = CH * 1.25;
  ctx.translate(dishCx, dishCy);
  ctx.rotate(sweep);

  const coneG = TL_rgrad(ctx, 'bcone' + (reached ? 'R' : 'N'), 0, 0, 0, 0, 0, reach, [
    [0, reached ? 'rgba(255,248,220,0.95)' : 'rgba(230,238,255,0.62)'],
    [0.18, reached ? 'rgba(250,225,150,0.45)' : 'rgba(170,196,255,0.26)'],
    [0.55, reached ? 'rgba(200,170,90,0.16)' : 'rgba(110,138,210,0.09)'],
    [1, 'rgba(60,80,150,0)']
  ]);
  ctx.fillStyle = coneG;
  ctx.beginPath();
  ctx.moveTo(-s * 0.30, 0);
  ctx.lineTo(-spread, -reach);
  ctx.lineTo(spread, -reach);
  ctx.lineTo(s * 0.30, 0);
  ctx.closePath();
  ctx.fill();

  // inner hot core
  ctx.globalAlpha = 0.55 + 0.35 * boost + 0.10 * Math.sin(t * 3.1);
  ctx.fillStyle = TL_grad(ctx, 'bcore', 0, 0, 0, -reach * 0.75, [
    [0, 'rgba(255,255,255,0.75)'], [0.4, 'rgba(210,225,255,0.20)'], [1, 'rgba(200,220,255,0)']
  ]);
  ctx.beginPath();
  ctx.moveTo(-s * 0.14, 0); ctx.lineTo(-spread * 0.42, -reach); ctx.lineTo(spread * 0.42, -reach); ctx.lineTo(s * 0.14, 0);
  ctx.closePath(); ctx.fill();

  // god-ray striations
  ctx.globalAlpha = 0.16 + boost * 0.14;
  for (let i = 0; i < 7; i++) {
    const f = (i / 7) - 0.5 + Math.sin(t * 0.5 + i) * 0.03;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.5)' : 'rgba(160,190,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(f * s * 0.30, 0);
    ctx.lineTo(f * spread - s * 0.06, -reach);
    ctx.lineTo(f * spread + s * 0.10, -reach);
    ctx.closePath(); ctx.fill();
  }

  // projected bat emblem inside the beam
  const projY = -s * (4.0 + Math.sin(t * 0.7) * 0.25);
  const projW = s * (2.5 + boost * 0.8);
  ctx.globalAlpha = 0.34 + boost * 0.34 + 0.07 * Math.sin(t * 2.0);
  ctx.shadowColor = reached ? 'rgba(255,235,160,0.9)' : 'rgba(190,210,255,0.8)';
  ctx.shadowBlur = s * 0.7;
  TL_batPath(ctx, 0, projY, projW);
  ctx.fillStyle = reached ? 'rgba(255,246,205,0.85)' : 'rgba(225,236,255,0.75)';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = reached ? 'rgba(255,255,230,0.9)' : 'rgba(255,255,255,0.6)';
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;

  // ---------- base ----------
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 2, baseW * 0.58, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = TL_grad(ctx, 'bbase' + Math.round(s), -baseW / 2, 0, baseW / 2, 0, [
    [0, '#3b3f55'], [0.25, '#2a2d40'], [0.6, '#1a1c2b'], [1, '#0c0d16']
  ]);
  TL_roundRect(ctx, -baseW / 2, -baseH, baseW, baseH, s * 0.06);
  ctx.fill();
  // top lit lip
  ctx.fillStyle = 'rgba(160,175,225,0.30)';
  ctx.fillRect(-baseW / 2, -baseH, baseW, 2);
  // rivets
  ctx.fillStyle = '#0a0b12';
  for (let i = 0; i < 6; i++) {
    const rx = -baseW * 0.42 + (baseW * 0.84) * (i / 5);
    for (let r = 0; r < 2; r++) {
      const ry = -baseH + s * 0.10 + r * s * 0.26;
      ctx.beginPath(); ctx.arc(rx, ry, s * 0.026, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(170,185,235,0.40)';
      ctx.beginPath(); ctx.arc(rx - s * 0.008, ry - s * 0.010, s * 0.016, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0b12';
    }
  }
  // yoke arms
  ctx.strokeStyle = '#22253a'; ctx.lineWidth = s * 0.09;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-baseW * 0.30, -baseH + 2); ctx.lineTo(-dishR * 0.82, dishCy + dishR * 0.35);
  ctx.moveTo(baseW * 0.30, -baseH + 2); ctx.lineTo(dishR * 0.82, dishCy + dishR * 0.35);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,165,215,0.22)'; ctx.lineWidth = s * 0.02;
  ctx.beginPath();
  ctx.moveTo(-baseW * 0.30 - s * 0.03, -baseH + 2); ctx.lineTo(-dishR * 0.86, dishCy + dishR * 0.35);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // ---------- lens dish ----------
  ctx.save();
  ctx.translate(dishCx, dishCy);
  // housing shell
  ctx.beginPath(); ctx.arc(0, 0, dishR * 1.16, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'bhouse' + Math.round(s), -dishR, -dishR, dishR, dishR, [
    [0, '#454a63'], [0.4, '#262a3c'], [1, '#0d0f18']
  ]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(170,185,235,0.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, dishR * 1.16, Math.PI * 0.8, Math.PI * 1.85); ctx.stroke();

  // lens
  ctx.beginPath(); ctx.arc(0, 0, dishR, 0, Math.PI * 2);
  ctx.fillStyle = TL_rgrad(ctx, 'blens' + (reached ? 'R' : 'N') + Math.round(s),
    -dishR * 0.3, -dishR * 0.3, dishR * 0.05, 0, 0, dishR, [
      [0, reached ? '#ffffff' : '#e9f0ff'],
      [0.35, reached ? '#ffeeb0' : '#9fb6ee'],
      [0.72, reached ? '#c79a2a' : '#41508a'],
      [1, '#131728']
    ]);
  ctx.fill();

  // lattice grille
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, dishR * 0.98, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(10,12,22,0.72)'; ctx.lineWidth = Math.max(1, s * 0.028);
  for (let i = -4; i <= 4; i++) {
    const p = i * dishR * 0.24;
    ctx.beginPath(); ctx.moveTo(p, -dishR); ctx.lineTo(p, dishR); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-dishR, p); ctx.lineTo(dishR, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(200,215,255,0.16)'; ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    const p = i * dishR * 0.24 - Math.max(1, s * 0.028) * 0.6;
    ctx.beginPath(); ctx.moveTo(p, -dishR); ctx.lineTo(p, dishR); ctx.stroke();
  }
  // bat emblem cut into the lens
  ctx.globalAlpha = 0.85;
  TL_batPath(ctx, 0, dishR * 0.04, dishR * 1.5);
  ctx.fillStyle = 'rgba(8,10,20,0.90)'; ctx.fill();
  ctx.restore();

  // lens rim + hotspot
  ctx.strokeStyle = 'rgba(20,22,36,0.9)'; ctx.lineWidth = Math.max(2, s * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, dishR, 0, Math.PI * 2); ctx.stroke();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.45 + boost * 0.4;
  ctx.fillStyle = TL_rgrad(ctx, 'bhot' + Math.round(s), 0, 0, 0, 0, 0, dishR * 2.1, [
    [0, reached ? 'rgba(255,250,225,0.95)' : 'rgba(215,232,255,0.7)'],
    [0.45, 'rgba(150,180,255,0.18)'], [1, 'rgba(120,150,255,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, dishR * 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BATARANG (coin)
// ============================================================================
function drawBatarang(ctx, cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // motion arc trailing the spin
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 1; k <= 3; k++) {
    ctx.globalAlpha = 0.12 / k;
    ctx.strokeStyle = k === 1 ? 'rgba(226,200,150,0.75)' : 'rgba(152,172,206,0.6)';
    ctx.lineWidth = r * (0.18 / k);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, angle - 1.5 - k * 0.35, angle - 0.12 - k * 0.1);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  ctx.rotate(angle);
  // foreshorten as it spins so it reads as a flat object turning
  const sx = Math.max(0.14, Math.abs(Math.cos(angle * 0.9)) * 0.82 + 0.18);
  ctx.scale(1, 1);

  const blade = (dir) => {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.12);
    ctx.bezierCurveTo(dir * r * 0.35, -r * 0.62, dir * r * 0.86, -r * 0.72, dir * r * 1.02, -r * 0.30);
    ctx.bezierCurveTo(dir * r * 0.80, -r * 0.34, dir * r * 0.58, -r * 0.16, dir * r * 0.46, r * 0.12);
    ctx.bezierCurveTo(dir * r * 0.30, r * 0.02, dir * r * 0.14, r * 0.04, 0, r * 0.30);
    ctx.closePath();
  };

  ctx.save();
  ctx.scale(sx, 1);

  // soft shadow under the metal
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = r * 0.35;
  ctx.shadowOffsetY = r * 0.12;

  // Gunmetal with a few counts of brass in it, not a gold coin. The pickup
  // carries its own point light, and the specular pass puts the shine back.
  const metal = TL_grad(ctx, 'btrg' + Math.round(r), -r, -r, r, r, [
    [0, '#aab0b2'], [0.18, '#7e8184'], [0.42, '#4a4e54'], [0.58, '#262a30'],
    [0.76, '#8a8578'], [1, '#14171b']
  ]);

  for (let d = -1; d <= 1; d += 2) {
    blade(d);
    ctx.fillStyle = metal;
    ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // darker underside wash on the lower-right of the pair
  ctx.save();
  for (let d = -1; d <= 1; d += 2) blade(d);
  ctx.fillStyle = TL_grad(ctx, 'btrgsh' + Math.round(r), -r * 0.3, -r * 0.3, r, r * 0.6, [
    [0, 'rgba(210,222,238,0.10)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.55)']
  ]);
  ctx.fill();
  ctx.restore();

  // bright leading-edge specular
  ctx.strokeStyle = 'rgba(214,224,236,0.62)';
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.lineJoin = 'round';
  for (let d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.12);
    ctx.bezierCurveTo(d * r * 0.35, -r * 0.62, d * r * 0.86, -r * 0.72, d * r * 1.02, -r * 0.30);
    ctx.stroke();
  }
  // shadowed trailing edge
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.05);
  for (let d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.moveTo(d * r * 0.46, r * 0.12);
    ctx.bezierCurveTo(d * r * 0.30, r * 0.02, d * r * 0.14, r * 0.04, 0, r * 0.30);
    ctx.stroke();
  }

  // central hub
  ctx.beginPath(); ctx.arc(0, -r * 0.06, r * 0.17, 0, Math.PI * 2);
  ctx.fillStyle = '#0d1014'; ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.05, -r * 0.11, r * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(190,200,214,0.45)'; ctx.fill();
  ctx.restore();

  // travelling glint across the blades
  const gl = (Math.sin(angle * 2.0) + 1) * 0.5;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22 + gl * 0.44;
  ctx.fillStyle = TL_rgrad(ctx, 'btglint', 0, 0, 0, 0, 0, 12, [
    [0, 'rgba(255,250,232,1)'], [0.4, 'rgba(240,214,152,0.32)'], [1, 'rgba(230,196,120,0)']
  ]);
  ctx.save();
  ctx.translate((gl - 0.5) * r * 1.6 * sx, -r * 0.34);
  ctx.scale(r * 0.055, r * 0.055);
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SUIT PICKUP
// ============================================================================
function drawBatSuitPickup(ctx, x, y, s, t) {
  ctx.save();
  const bob = Math.sin(t * 2.2) * s * 0.07;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.0);
  ctx.translate(x + s / 2, y + s / 2 + bob);

  // crimson energy aura
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.17 + pulse * 0.19;
  ctx.fillStyle = TL_rgrad(ctx, 'bsaura' + Math.round(s), 0, 0, s * 0.18, 0, 0, s * 1.05, [
    [0, 'rgba(226,110,96,0.70)'], [0.45, 'rgba(176,52,46,0.24)'], [1, 'rgba(120,18,22,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 1.05, 0, Math.PI * 2); ctx.fill();
  // rising energy motes
  for (let i = 0; i < 6; i++) {
    const ph = (t * 0.55 + TL_rnd(i * 17)) % 1;
    const mx = (TL_rnd(i * 5 + 3) - 0.5) * s * 0.85;
    const my = s * 0.5 - ph * s * 1.15;
    ctx.globalAlpha = (1 - ph) * 0.38;
    ctx.fillStyle = PAL.danger;
    ctx.beginPath(); ctx.arc(mx, my, s * 0.035 * (1 - ph * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // ground-contact shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, s * 0.62 - bob, s * 0.34, s * 0.07, 0, 0, Math.PI * 2); ctx.fill();

  // ---- armored chest plate ----
  const pw = s * 0.72, ph2 = s * 0.78;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.5, -ph2 * 0.46);
  ctx.quadraticCurveTo(-pw * 0.30, -ph2 * 0.56, 0, -ph2 * 0.50);
  ctx.quadraticCurveTo(pw * 0.30, -ph2 * 0.56, pw * 0.5, -ph2 * 0.46);
  ctx.lineTo(pw * 0.44, ph2 * 0.18);
  ctx.quadraticCurveTo(pw * 0.36, ph2 * 0.46, 0, ph2 * 0.54);
  ctx.quadraticCurveTo(-pw * 0.36, ph2 * 0.46, -pw * 0.44, ph2 * 0.18);
  ctx.closePath();
  ctx.fillStyle = TL_grad(ctx, 'bsplate' + Math.round(s), -pw * 0.5, -ph2 * 0.5, pw * 0.5, ph2 * 0.5, [
    [0, PAL.batHi], [0.35, PAL.bat], [1, PAL.batLo]
  ]);
  ctx.fill();
  // rim light upper-left
  ctx.strokeStyle = 'rgba(158,176,202,0.42)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.44, ph2 * 0.10);
  ctx.lineTo(-pw * 0.5, -ph2 * 0.46);
  ctx.quadraticCurveTo(-pw * 0.30, -ph2 * 0.56, 0, -ph2 * 0.50);
  ctx.stroke();
  // dark inner shade on the right
  ctx.fillStyle = TL_grad(ctx, 'bsplsh' + Math.round(s), 0, 0, pw * 0.5, ph2 * 0.4, [
    [0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.5)']
  ]);
  ctx.fill();

  // armor plate seams
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.40, -ph2 * 0.16); ctx.quadraticCurveTo(0, -ph2 * 0.06, pw * 0.40, -ph2 * 0.16);
  ctx.moveTo(-pw * 0.34, ph2 * 0.12); ctx.quadraticCurveTo(0, ph2 * 0.24, pw * 0.34, ph2 * 0.12);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,165,215,0.20)';
  ctx.beginPath();
  ctx.moveTo(-pw * 0.40, -ph2 * 0.16 + 1.3); ctx.quadraticCurveTo(0, -ph2 * 0.06 + 1.3, pw * 0.40, -ph2 * 0.16 + 1.3);
  ctx.stroke();

  // yellow oval emblem
  ctx.beginPath();
  ctx.ellipse(0, -ph2 * 0.10, pw * 0.34, ph2 * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'bsoval' + Math.round(s), 0, -ph2 * 0.34, 0, ph2 * 0.14, [
    [0, '#e8d898'], [0.5, '#c6a53c'], [1, '#6f5716']
  ]);
  ctx.shadowColor = 'rgba(224,180,64,0.55)'; ctx.shadowBlur = s * 0.14;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(120,88,6,0.7)'; ctx.lineWidth = 1; ctx.stroke();

  TL_batPath(ctx, 0, -ph2 * 0.10, pw * 0.62);
  ctx.fillStyle = PAL.batLo; ctx.fill();

  // glass specular sweep over the emblem
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -ph2 * 0.10, pw * 0.34, ph2 * 0.24, 0, 0, Math.PI * 2); ctx.clip();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = 'rgba(214,226,240,0.7)';
  ctx.beginPath();
  ctx.ellipse(-pw * 0.10, -ph2 * 0.20, pw * 0.20, ph2 * 0.07, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SIGNAL STAR (invincibility)
// ============================================================================
function drawBatSignalStar(ctx, x, y, s, t) {
  ctx.save();
  const bob = Math.sin(t * 2.6) * s * 0.06;
  ctx.translate(x + s / 2, y + s / 2 + bob);
  const pulse = 0.5 + 0.5 * Math.sin(t * 4.2);

  // additive halo
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30 + pulse * 0.26;
  ctx.fillStyle = TL_rgrad(ctx, 'bsthalo' + Math.round(s), 0, 0, s * 0.10, 0, 0, s * 1.15, [
    [0, 'rgba(255,250,224,0.92)'], [0.25, 'rgba(238,202,110,0.40)'],
    [0.6, 'rgba(196,146,48,0.12)'], [1, 'rgba(210,164,60,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 1.15, 0, Math.PI * 2); ctx.fill();

  // rotating starburst rays -- two counter-rotating sets
  for (let set = 0; set < 2; set++) {
    const n = set === 0 ? 8 : 12;
    const rot = t * (set === 0 ? 0.9 : -0.55);
    const len = s * (set === 0 ? 0.86 : 0.62) * (0.86 + pulse * 0.18);
    const wdt = set === 0 ? 0.085 : 0.045;
    ctx.globalAlpha = set === 0 ? 0.30 + pulse * 0.20 : 0.16 + pulse * 0.13;
    ctx.fillStyle = TL_grad(ctx, 'bstray' + set + Math.round(s), 0, 0, len, 0, [
      [0, 'rgba(255,250,230,0.90)'], [0.35, 'rgba(236,200,106,0.36)'], [1, 'rgba(214,166,58,0)']
    ]);
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const lm = len * (0.7 + 0.3 * TL_rnd(i + set * 31));
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(s * 0.16, 0);
      ctx.lineTo(lm, -s * wdt * 0.45);
      ctx.lineTo(lm, s * wdt * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // long lens-flare cross
  ctx.globalAlpha = 0.34 + pulse * 0.30;
  ctx.fillStyle = TL_grad(ctx, 'bstflare' + Math.round(s), -s * 1.5, 0, s * 1.5, 0, [
    [0, 'rgba(255,220,120,0)'], [0.42, 'rgba(255,245,200,0.75)'],
    [0.5, 'rgba(255,255,255,0.95)'], [0.58, 'rgba(255,245,200,0.75)'], [1, 'rgba(255,220,120,0)']
  ]);
  ctx.fillRect(-s * 1.5, -s * 0.022, s * 3, s * 0.044);
  ctx.save(); ctx.rotate(Math.PI / 2);
  ctx.fillRect(-s * 1.5, -s * 0.018, s * 3, s * 0.036);
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;

  // spinning medallion
  const spin = t * 1.7;
  const sq = Math.abs(Math.cos(spin)) * 0.85 + 0.15;
  ctx.save();
  ctx.scale(sq, 1);
  const dr = s * 0.32;
  ctx.beginPath(); ctx.arc(0, 0, dr, 0, Math.PI * 2);
  ctx.fillStyle = TL_rgrad(ctx, 'bstdisc' + Math.round(s), -dr * 0.35, -dr * 0.35, dr * 0.05, 0, 0, dr, [
    [0, '#fffbe0'], [0.4, PAL.yellow], [0.8, PAL.yellowD], [1, '#5d4506']
  ]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,210,0.8)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, dr, Math.PI * 0.85, Math.PI * 1.9); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,66,6,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, dr, Math.PI * 1.9, Math.PI * 0.85); ctx.stroke();

  TL_batPath(ctx, 0, 0, dr * 1.35);
  ctx.fillStyle = '#16121f'; ctx.fill();
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = 'rgba(255,235,150,0.8)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // hot centre dot
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.fillStyle = TL_rgrad(ctx, 'bstcore' + Math.round(s), 0, 0, 0, 0, 0, s * 0.22, [
    [0, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,220,120,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}


// ═══ FX ═══════════════════════════════════════
// ============================================================================
// fx.js -- particles, weather, lightning, camera feel.  Module prefix: FX_
// Batman / Arkham-flavoured atmospherics, 100% canvas primitives.
// ============================================================================

const FX_MAX_PARTICLES = 400;
const FX_TAU = Math.PI * 2;

// ---- deterministic pseudo-random ------------------------------------------
function FX_rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function FX_rnd2(n, k) {
  const s = Math.sin(n * 269.5 + k * 183.3 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}
// signed -1..1
function FX_srnd(n, k) { return FX_rnd2(n, k) * 2 - 1; }

function FX_clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function FX_lerp(a, b, t) { return a + (b - a) * t; }

// module-level gradient cache (keyed by string) -- gradients are screen-space
// radial/linear built at origin then translated, so they can be reused freely.
const FX_gradCache = Object.create(null);
function FX_radial(ctx, key, r, stops) {
  let g = FX_gradCache[key];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    FX_gradCache[key] = g;
  }
  return g;
}
function FX_linear(ctx, key, x0, y0, x1, y1, stops) {
  let g = FX_gradCache[key];
  if (!g) {
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    FX_gradCache[key] = g;
  }
  return g;
}

function FX_roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

// color helpers -------------------------------------------------------------
function FX_hex2rgb(hex) {
  if (typeof hex !== 'string' || hex.charAt(0) !== '#') return [255, 255, 255];
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function FX_rgba(hex, a) {
  const c = FX_hex2rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function FX_shade(hex, amt) { // amt -1..1
  const c = FX_hex2rgb(hex);
  const f = amt < 0 ? (1 + amt) : 1;
  const add = amt > 0 ? 255 * amt : 0;
  const r = FX_clamp(Math.round(c[0] * f + add), 0, 255);
  const g = FX_clamp(Math.round(c[1] * f + add), 0, 255);
  const b = FX_clamp(Math.round(c[2] * f + add), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ============================================================================
// ParticleSystem
// ============================================================================
class ParticleSystem {
  constructor() {
    this.parts = [];
    this.seed = 0;          // deterministic spawn counter
    this.time = 0;
  }

  clear() { this.parts.length = 0; }

  // internal: push with cap. Oldest non-score particles are evicted first.
  FX_push(p) {
    const arr = this.parts;
    if (arr.length >= FX_MAX_PARTICLES) {
      let idx = -1;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i].kind !== 'score') { idx = i; break; }
      }
      if (idx < 0) idx = 0;
      arr.splice(idx, 1);
    }
    arr.push(p);
  }

  FX_mk(kind, x, y, vx, vy, life, size, color) {
    return {
      kind: kind, x: x, y: y, vx: vx, vy: vy,
      life: life, maxLife: life, size: size, size0: size,
      rot: 0, vrot: 0, grav: 260, drag: 1.6, color: color || PAL.stoneL,
      alpha: 1, spin: 0, text: null, glow: 0, seed: 0
    };
  }

  // -- stomp: dust ring + bright impact shards -------------------------------
  spawnStomp(x, y) {
    const s = ++this.seed;
    // flat expanding shock ring
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.32, 6, PAL.eye);
    ring.grav = 0; ring.glow = 1;
    this.FX_push(ring);
    const ring2 = this.FX_mk('ring', x, y, 0, 0, 0.5, 2, PAL.yellow);
    ring2.grav = 0; ring2.glow = 1;
    this.FX_push(ring2);

    // dust puffs low and wide
    for (let i = 0; i < 12; i++) {
      const a = Math.PI + (i / 11) * Math.PI + FX_srnd(s, i) * 0.22;
      const sp = 60 + FX_rnd2(s, i + 40) * 130;
      const p = this.FX_mk('dust', x + FX_srnd(s, i + 7) * 6, y + FX_srnd(s, i + 9) * 3,
        Math.cos(a) * sp, Math.sin(a) * sp * 0.55 - 20,
        0.45 + FX_rnd2(s, i + 3) * 0.4, 5 + FX_rnd2(s, i + 11) * 7, PAL.stoneL);
      p.grav = 130; p.drag = 2.6;
      p.vrot = FX_srnd(s, i + 17) * 3;
      this.FX_push(p);
    }
    // hard shards flung upward
    for (let i = 0; i < 8; i++) {
      const a = -Math.PI * 0.5 + FX_srnd(s, i + 60) * 1.25;
      const sp = 150 + FX_rnd2(s, i + 70) * 190;
      const p = this.FX_mk('shard', x, y - 2, Math.cos(a) * sp, Math.sin(a) * sp,
        0.4 + FX_rnd2(s, i + 80) * 0.35, 2 + FX_rnd2(s, i + 90) * 3.5,
        i % 3 === 0 ? PAL.yellow : PAL.eye);
      p.grav = 620; p.drag = 0.5; p.vrot = FX_srnd(s, i + 100) * 12; p.glow = 1;
      this.FX_push(p);
    }
  }

  // -- landing puff ----------------------------------------------------------
  spawnLand(x, y) {
    const s = ++this.seed;
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1;
      const sp = 40 + FX_rnd2(s, i) * 90;
      const p = this.FX_mk('dust', x + side * (2 + FX_rnd2(s, i + 5) * 5), y,
        side * sp, -18 - FX_rnd2(s, i + 12) * 34,
        0.32 + FX_rnd2(s, i + 20) * 0.3, 4 + FX_rnd2(s, i + 25) * 5, PAL.stone);
      p.grav = 90; p.drag = 3.2; p.vrot = FX_srnd(s, i + 31) * 2.4;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.24, 4, PAL.stoneL);
    ring.grav = 0; ring.glow = 0.5;
    this.FX_push(ring);
  }

  // -- running scuff ---------------------------------------------------------
  spawnRunDust(x, y, dir) {
    const s = ++this.seed;
    const d = dir >= 0 ? 1 : -1;
    for (let i = 0; i < 2; i++) {
      const p = this.FX_mk('dust', x - d * (2 + FX_rnd2(s, i) * 4), y - FX_rnd2(s, i + 2) * 3,
        -d * (25 + FX_rnd2(s, i + 4) * 55), -14 - FX_rnd2(s, i + 6) * 26,
        0.28 + FX_rnd2(s, i + 8) * 0.24, 2.5 + FX_rnd2(s, i + 10) * 3.5, PAL.stone);
      p.grav = 70; p.drag = 3.6; p.vrot = FX_srnd(s, i + 13) * 3;
      this.FX_push(p);
    }
  }

  // -- block break: chunky rotating stone debris -----------------------------
  spawnBlockBreak(x, y) {
    const s = ++this.seed;
    const cols = [PAL.stone, PAL.stoneD, PAL.stoneL, PAL.mortar];
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI * 0.5 + FX_srnd(s, i) * 2.2;
      const sp = 110 + FX_rnd2(s, i + 20) * 230;
      const p = this.FX_mk('chunk',
        x + FX_srnd(s, i + 3) * 12, y + FX_srnd(s, i + 4) * 12,
        Math.cos(a) * sp, Math.sin(a) * sp - 60,
        0.7 + FX_rnd2(s, i + 30) * 0.6,
        4 + FX_rnd2(s, i + 40) * 8, cols[i & 3]);
      p.grav = 760; p.drag = 0.35;
      p.vrot = FX_srnd(s, i + 50) * 11;
      p.rot = FX_rnd2(s, i + 60) * FX_TAU;
      p.seed = i + s;
      this.FX_push(p);
    }
    // fine dust cloud left behind
    for (let i = 0; i < 8; i++) {
      const a = FX_rnd2(s, i + 90) * FX_TAU;
      const sp = 20 + FX_rnd2(s, i + 95) * 60;
      const p = this.FX_mk('dust', x, y, Math.cos(a) * sp, Math.sin(a) * sp - 30,
        0.6 + FX_rnd2(s, i + 99) * 0.5, 7 + FX_rnd2(s, i + 101) * 9, PAL.stoneD);
      p.grav = 30; p.drag = 2.0;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.3, 8, PAL.stoneL);
    ring.grav = 0; ring.glow = 0.6;
    this.FX_push(ring);
  }

  // -- pickup sparkle burst --------------------------------------------------
  spawnPickup(x, y, color) {
    const s = ++this.seed;
    const c = color || PAL.yellow;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * FX_TAU + FX_srnd(s, i) * 0.3;
      const sp = 90 + FX_rnd2(s, i + 15) * 160;
      const p = this.FX_mk('spark', x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.4 + FX_rnd2(s, i + 25) * 0.45, 1.6 + FX_rnd2(s, i + 35) * 2.6, c);
      p.grav = 210; p.drag = 2.2; p.glow = 1; p.vrot = FX_srnd(s, i + 45) * 8;
      this.FX_push(p);
    }
    // four long cross-flares
    for (let i = 0; i < 4; i++) {
      const p = this.FX_mk('flare', x, y, 0, 0, 0.3, 16 + i * 2, c);
      p.grav = 0; p.rot = (i / 4) * Math.PI; p.glow = 1;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.42, 3, c);
    ring.grav = 0; ring.glow = 1;
    this.FX_push(ring);
  }

  // -- floating score text ---------------------------------------------------
  spawnScore(x, y, value) {
    const p = this.FX_mk('score', x, y, 0, -54, 1.05, 15, PAL.yellow);
    p.grav = 26; p.drag = 0.6;
    p.text = (typeof value === 'string') ? value : ('+' + value);
    this.FX_push(p);
  }

  // -- bat afterimage --------------------------------------------------------
  spawnBatTrail(x, y) {
    const s = ++this.seed;
    const p = this.FX_mk('bat', x, y, FX_srnd(s, 1) * 18, -10 - FX_rnd2(s, 2) * 24,
      0.55 + FX_rnd2(s, 3) * 0.3, 7 + FX_rnd2(s, 4) * 5, PAL.bat);
    p.grav = -14; p.drag = 1.1;
    p.rot = FX_srnd(s, 5) * 0.5;
    p.vrot = FX_srnd(s, 6) * 1.6;
    p.seed = s;
    this.FX_push(p);
  }

  // -- rain splash -----------------------------------------------------------
  spawnSplash(x, y) {
    const s = ++this.seed;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI * 0.5 + FX_srnd(s, i) * 1.1;
      const sp = 30 + FX_rnd2(s, i + 4) * 55;
      const p = this.FX_mk('drop', x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.2 + FX_rnd2(s, i + 8) * 0.18, 1 + FX_rnd2(s, i + 12) * 1.2, PAL.rain);
      p.grav = 480; p.drag = 0.2; p.glow = 0.4;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.22, 1.5, PAL.rain);
    ring.grav = 0; ring.glow = 0.35; ring.size0 = 1.5;
    this.FX_push(ring);
  }

  // -- simulation ------------------------------------------------------------
  update(dt) {
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    this.time += dt;
    const arr = this.parts;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= dt;
      if (p.life <= 0) { arr.splice(i, 1); continue; }
      const d = Math.exp(-p.drag * dt);
      p.vx *= d;
      p.vy = (p.vy + p.grav * dt) * d;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      const t = p.life / p.maxLife;           // 1 -> 0
      p.alpha = t < 0.35 ? t / 0.35 : 1;
      if (p.kind === 'ring') {
        p.size = p.size0 + (1 - t) * (p.size0 * 5.5 + 14);
        p.alpha *= t * 0.9;
      } else if (p.kind === 'flare') {
        p.size = p.size0 * (0.35 + (1 - t) * 1.4);
        p.alpha = t * t;
      } else if (p.kind === 'dust') {
        p.size = p.size0 * (1 + (1 - t) * 1.3);
        p.alpha *= 0.55 * t + 0.12;
      } else if (p.kind === 'score') {
        p.alpha = t > 0.7 ? (1 - t) / 0.3 : Math.min(1, t / 0.45);
      } else {
        p.size = p.size0 * (0.35 + t * 0.65);
      }
    }
  }

  // -- rendering -------------------------------------------------------------
  draw(ctx, camX) {
    const arr = this.parts;
    if (arr.length === 0) return;
    const cx = camX || 0;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      const sx = p.x - cx;
      const sy = p.y;
      if (sx < -80 || sx > CW + 80 || sy < -120 || sy > CH + 120) continue;
      const a = FX_clamp(p.alpha, 0, 1);
      if (a <= 0.004) continue;
      ctx.globalAlpha = a;
      switch (p.kind) {
        case 'dust':   this.FX_drawDust(ctx, p, sx, sy); break;
        case 'shard':  this.FX_drawShard(ctx, p, sx, sy); break;
        case 'chunk':  this.FX_drawChunk(ctx, p, sx, sy); break;
        case 'spark':  this.FX_drawSpark(ctx, p, sx, sy); break;
        case 'flare':  this.FX_drawFlare(ctx, p, sx, sy); break;
        case 'ring':   this.FX_drawRing(ctx, p, sx, sy); break;
        case 'score':  this.FX_drawScore(ctx, p, sx, sy); break;
        case 'bat':    this.FX_drawBat(ctx, p, sx, sy); break;
        case 'drop':   this.FX_drawDrop(ctx, p, sx, sy); break;
        default:       this.FX_drawSpark(ctx, p, sx, sy); break;
      }
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.restore();
  }

  FX_drawDust(ctx, p, x, y) {
    // soft volumetric puff: dark core, lit upper edge
    const r = Math.max(0.6, p.size);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.scale(r, r * 0.82);
    const g = FX_radial(ctx, 'dustPuff', 1, [
      [0.0, FX_rgba(PAL.stoneL, 0.55)],
      [0.45, FX_rgba(PAL.stone, 0.32)],
      [1.0, FX_rgba(PAL.stoneD, 0.0)]
    ]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, FX_TAU);
    ctx.fill();
    // rim: a crescent of moonlight on the top-left
    ctx.globalAlpha *= 0.5;
    ctx.strokeStyle = FX_rgba(PAL.moonGlow, 0.5);
    ctx.lineWidth = 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, 0.82, Math.PI * 1.05, Math.PI * 1.75);
    ctx.stroke();
    ctx.restore();
  }

  FX_drawShard(ctx, p, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.shadowBlur = 10;
    ctx.shadowColor = FX_rgba(p.color, 0.9);
    const s = Math.max(0.5, p.size);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.42, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s * 0.42, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = FX_rgba(PAL.white, 0.75);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.2, -s * 0.2);
    ctx.lineTo(-s * 0.12, -s * 0.1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  FX_drawChunk(ctx, p, x, y) {
    const s = Math.max(1, p.size);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    // drop shadow behind the chunk
    ctx.globalAlpha *= 0.9;
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    // irregular quad from deterministic seed
    const n = p.seed;
    const k1 = 0.55 + FX_rnd(n) * 0.6;
    const k2 = 0.55 + FX_rnd(n + 1) * 0.6;
    const k3 = 0.55 + FX_rnd(n + 2) * 0.6;
    const k4 = 0.55 + FX_rnd(n + 3) * 0.6;
    ctx.beginPath();
    ctx.moveTo(-s * k1, -s * k2);
    ctx.lineTo(s * k3, -s * k1 * 0.8);
    ctx.lineTo(s * k2 * 0.9, s * k4);
    ctx.lineTo(-s * k4 * 0.85, s * k3 * 0.8);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.shadowBlur = 0;
    // shading pass: dark gradient on lower-right
    ctx.save();
    ctx.clip();
    ctx.scale(s, s);
    const gs = FX_linear(ctx, 'chunkShade', -1, -1, 1, 1, [
      [0, 'rgba(255,255,255,0.18)'],
      [0.5, 'rgba(0,0,0,0)'],
      [1, 'rgba(0,0,0,0.55)']
    ]);
    ctx.fillStyle = gs;
    ctx.fillRect(-1.2, -1.2, 2.4, 2.4);
    ctx.restore();
    // rim light top edge
    ctx.strokeStyle = FX_rgba(PAL.moonGlow, 0.45);
    ctx.lineWidth = Math.max(0.6, s * 0.12);
    ctx.beginPath();
    ctx.moveTo(-s * k1, -s * k2);
    ctx.lineTo(s * k3, -s * k1 * 0.8);
    ctx.stroke();
    ctx.restore();
  }

  FX_drawSpark(ctx, p, x, y) {
    const s = Math.max(0.4, p.size);
    ctx.save();
    ctx.translate(x, y);
    // glow halo
    ctx.save();
    ctx.scale(s * 3.2, s * 3.2);
    ctx.fillStyle = FX_radial(ctx, 'sparkGlow', 1, [
      [0, 'rgba(255,255,255,0.5)'],
      [0.35, FX_rgba(p.color, 0.32)],
      [1, FX_rgba(p.color, 0)]
    ]);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, FX_TAU); ctx.fill();
    ctx.restore();
    // hot core, stretched along velocity
    const sp = Math.hypot(p.vx, p.vy);
    ctx.rotate(Math.atan2(p.vy, p.vx));
    const stretch = 1 + FX_clamp(sp / 240, 0, 2.2);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * stretch, s * 0.8, 0, 0, FX_TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.5 * stretch, s * 0.32, 0, 0, FX_TAU);
    ctx.fill();
    ctx.restore();
  }

  FX_drawFlare(ctx, p, x, y) {
    const s = Math.max(1, p.size);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.shadowBlur = 12;
    ctx.shadowColor = FX_rgba(p.color, 0.9);
    ctx.fillStyle = FX_rgba(p.color, 0.85);
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.quadraticCurveTo(0, -s * 0.13, s, 0);
    ctx.quadraticCurveTo(0, s * 0.13, -s, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  FX_drawRing(ctx, p, x, y) {
    const r = Math.max(0.5, p.size);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, 0.42);   // ground-hugging ellipse
    ctx.lineWidth = Math.max(0.7, 3.2 * (p.life / p.maxLife));
    if (p.glow > 0) {
      ctx.shadowBlur = 14 * p.glow;
      ctx.shadowColor = FX_rgba(p.color, 0.8);
    }
    ctx.strokeStyle = FX_rgba(p.color, 0.85);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, FX_TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha *= 0.4;
    ctx.lineWidth = 1;
    ctx.strokeStyle = FX_rgba(PAL.white, 0.6);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, FX_TAU); ctx.stroke();
    ctx.restore();
  }

  FX_drawScore(ctx, p, x, y) {
    ctx.save();
    ctx.translate(x, y);
    const t = p.life / p.maxLife;
    const pop = t > 0.85 ? 1 + (t - 0.85) * 2.6 : 1;
    ctx.scale(pop, pop);
    ctx.font = 'bold ' + p.size + 'px "Trebuchet MS", "Arial Black", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const txt = p.text || '+100';
    // dark outline for readability over any background
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(txt, 0, 0);
    ctx.shadowBlur = 10;
    ctx.shadowColor = FX_rgba(PAL.yellow, 0.9);
    const g = FX_linear(ctx, 'scoreGrad', 0, -10, 0, 10, [
      [0, '#fff6cf'], [0.5, PAL.yellow], [1, PAL.yellowD]
    ]);
    ctx.fillStyle = g;
    ctx.fillText(txt, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  FX_drawBat(ctx, p, x, y) {
    const s = Math.max(2, p.size);
    const flap = Math.sin(p.rot * 3 + p.seed) * 0.35;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot * 0.3);
    ctx.globalAlpha *= 0.85;
    ctx.shadowBlur = 9;
    ctx.shadowColor = FX_rgba(PAL.capeHi, 0.7);
    ctx.fillStyle = FX_rgba(PAL.bat, 0.95);
    ctx.beginPath();
    // body
    ctx.moveTo(0, -s * 0.28);
    // right wing
    ctx.bezierCurveTo(s * 0.5, -s * (0.7 + flap), s * 1.15, -s * 0.35, s * 1.5, s * 0.05);
    ctx.lineTo(s * 1.05, -s * 0.02);
    ctx.lineTo(s * 0.78, s * 0.22);
    ctx.lineTo(s * 0.5, s * 0.02);
    ctx.lineTo(s * 0.2, s * 0.34);
    ctx.lineTo(0, s * 0.12);
    // left wing (mirror)
    ctx.lineTo(-s * 0.2, s * 0.34);
    ctx.lineTo(-s * 0.5, s * 0.02);
    ctx.lineTo(-s * 0.78, s * 0.22);
    ctx.lineTo(-s * 1.05, -s * 0.02);
    ctx.lineTo(-s * 1.5, s * 0.05);
    ctx.bezierCurveTo(-s * 1.15, -s * 0.35, -s * 0.5, -s * (0.7 + flap), 0, -s * 0.28);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // rim highlight along the leading edge
    ctx.globalAlpha *= 0.55;
    ctx.strokeStyle = FX_rgba(PAL.capeHi, 0.9);
    ctx.lineWidth = Math.max(0.5, s * 0.09);
    ctx.beginPath();
    ctx.moveTo(-s * 1.5, s * 0.05);
    ctx.bezierCurveTo(-s * 1.15, -s * 0.35, -s * 0.5, -s * (0.7 + flap), 0, -s * 0.28);
    ctx.bezierCurveTo(s * 0.5, -s * (0.7 + flap), s * 1.15, -s * 0.35, s * 1.5, s * 0.05);
    ctx.stroke();
    ctx.restore();
  }

  FX_drawDrop(ctx, p, x, y) {
    const s = Math.max(0.35, p.size);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(p.vy, p.vx));
    ctx.fillStyle = FX_rgba(PAL.rain, 0.85);
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 2.1, s * 0.7, 0, 0, FX_TAU);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================================
// RainSystem -- 3 parallax bands of slanted streaks
// ============================================================================
class RainSystem {
  constructor() {
    this.t = 0;
    this.wind = 0;
    // band: [count, speed, len, alpha, slant, parallax, width]
    // Denser and much fainter than before. Rain reads as rain through DENSITY
    // and through variation in opacity; it was reading as scratches on the lens
    // because there were few streaks, each long, opaque and identical. The old
    // near band drew 46 strokes at 52% — plus "heavy" drops at 72px long, pure
    // white and glowing, which is what the eye was actually catching on.
    this.bands = [
      { n: 170, speed: 620, len: 11, alpha: 0.10, slant: 0.16, par: 0.06, w: 0.8, heavy: 0.0 },
      { n: 130, speed: 980, len: 20, alpha: 0.15, slant: 0.22, par: 0.16, w: 1.1, heavy: 0.05 },
      { n: 78, speed: 1520, len: 32, alpha: 0.22, slant: 0.30, par: 0.34, w: 1.4, heavy: 0.12 }
    ];
    // pre-baked per-drop offsets so nothing is random per frame
    this.cache = [];
    for (let b = 0; b < this.bands.length; b++) {
      const arr = new Float32Array(this.bands[b].n * 4);
      for (let i = 0; i < this.bands[b].n; i++) {
        arr[i * 4 + 0] = FX_rnd2(b * 91 + 5, i) * (CW + 420) - 210;   // x
        arr[i * 4 + 1] = FX_rnd2(b * 57 + 11, i) * (CH + 260);        // y phase
        arr[i * 4 + 2] = 0.72 + FX_rnd2(b * 33 + 19, i) * 0.62;       // speed jitter
        arr[i * 4 + 3] = FX_rnd2(b * 77 + 23, i);                     // misc
      }
      this.cache.push(arr);
    }
  }

  update(dt, wind) {
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    this.t += dt;
    const target = wind || 0;
    this.wind += (target - this.wind) * Math.min(1, dt * 3);
  }

  draw(ctx, camX, intensity) {
    let inten = intensity === undefined ? 1 : FX_clamp(intensity, 0, 1);
    if (inten <= 0.01) return;
    const cx = camX || 0;
    const t = this.t;
    const w = this.wind;
    ctx.save();
    ctx.lineCap = 'round';
    const span = CH + 260;
    const wrapX = CW + 420;
    for (let b = 0; b < this.bands.length; b++) {
      const B = this.bands[b];
      const arr = this.cache[b];
      const count = Math.max(0, Math.round(B.n * (0.35 + inten * 0.65)));
      const slant = B.slant + w * (0.35 + b * 0.25);
      const drift = -cx * B.par + w * 140 * t * (0.4 + b * 0.3);
      // Three opacity buckets per band, batched. One flat alpha for every drop
      // is the single thing that makes procedural rain look like a screen
      // overlay rather than weather — real drops sit at every distance between
      // the lens and the subject, so no two catch the light equally. Splitting
      // the existing per-drop random into buckets buys that variation for two
      // extra strokes per band instead of one path per drop.
      ctx.lineWidth = B.w;
      for (let bucket = 0; bucket < 3; bucket++) {
        const lo = bucket / 3, hi = (bucket + 1) / 3;
        ctx.strokeStyle = FX_rgba(PAL.rain, B.alpha * inten * (0.45 + bucket * 0.42));
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const r = arr[i * 4 + 3];
          if (r < lo || r >= hi) continue;
          const sp = B.speed * arr[i * 4 + 2];
          let y = (arr[i * 4 + 1] + t * sp) % span;
          if (y < 0) y += span;
          y -= 140;
          let x = (arr[i * 4 + 0] + drift + y * slant) % wrapX;
          if (x < 0) x += wrapX;
          x -= 210;
          const L = B.len * (0.75 + arr[i * 4 + 2] * 0.5);
          ctx.moveTo(x, y);
          ctx.lineTo(x - slant * L, y + L);
        }
        ctx.stroke();
      }

      // A few drops closer to the lens. Short and dim: these used to be 1.8x
      // the band length, pure white and carrying a shadowBlur glow, which is
      // exactly how you draw a scratch, not a raindrop.
      if (B.heavy > 0) {
        const hc = Math.max(1, Math.round(count * B.heavy * (0.4 + inten * 0.6)));
        ctx.lineWidth = B.w * 1.5;
        ctx.strokeStyle = FX_rgba(PAL.rain, 0.30 * inten);
        ctx.beginPath();
        for (let i = 0; i < hc; i++) {
          const j = (i * 7 + 3) % count;
          const sp = B.speed * arr[j * 4 + 2] * 1.18;
          let y = (arr[j * 4 + 1] * 1.7 + t * sp) % span;
          if (y < 0) y += span;
          y -= 140;
          let x = (arr[j * 4 + 0] * 1.31 + drift + y * slant) % wrapX;
          if (x < 0) x += wrapX;
          x -= 210;
          const L = B.len * 1.15;
          ctx.moveTo(x, y);
          ctx.lineTo(x - slant * L, y + L);
        }
        ctx.stroke();
      }
    }
    // faint sheet of mist drifting across the lower screen
    ctx.globalAlpha = 0.08 * inten;
    const mist = FX_linear(ctx, 'rainMist', 0, CH * 0.55, 0, CH, [
      [0, 'rgba(134,144,156,0)'],
      [1, 'rgba(134,144,156,0.55)']
    ]);
    ctx.fillStyle = mist;
    ctx.fillRect(0, CH * 0.55, CW, CH * 0.45);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ============================================================================
// Rim light -- the edge that separates a figure from the night behind it
//
// A dark character against a dark city is a hole in the picture. Every modern
// game solves it the same way: a hard, cold light rakes the figure from the
// key's side, catching the cowl, the shoulder and the leading edge of the
// cape. Without it Batman reads as a black blob; with it he reads as a solid
// object standing in weather, and nothing else in this pass comes close for
// the money.
//
// Done generically rather than inside each sprite, because there are five
// character renderers and they are all built from dozens of separate paths
// with their own transform stacks — there is no single silhouette to stroke.
// Instead the sprite is drawn once to a scratch canvas, flattened to a solid
// colour through source-in, stamped offset toward the light, and then the real
// sprite is drawn over it. What survives is a crescent along the lit edge.
//
// Two cached canvases, reused for every character, resized only when something
// bigger comes along. Costs two drawImage calls per figure.
// ============================================================================
var FX_rimA = null, FX_rimB = null, FX_rimAC = null, FX_rimBC = null;

function FX_rimmed(ctx, x, y, w, h, opt, fn) {
  const pad = 6;
  const cw = Math.ceil(w) + pad * 2, chh = Math.ceil(h) + pad * 2;
  if (!FX_rimA) {
    FX_rimA = document.createElement('canvas');
    FX_rimB = document.createElement('canvas');
    FX_rimA.width = FX_rimB.width = 8;
    FX_rimA.height = FX_rimB.height = 8;
  }
  if (FX_rimA.width < cw || FX_rimA.height < chh) {
    // grow to fit the largest figure seen; resizing also clears, and a boss is
    // several times the size of a minion, so this settles after a few frames
    FX_rimA.width = FX_rimB.width = Math.max(cw, FX_rimA.width);
    FX_rimA.height = FX_rimB.height = Math.max(chh, FX_rimA.height);
    FX_rimAC = FX_rimBC = null;
  }
  // getContext is cheap but not free, and this runs once per figure per frame
  const a = FX_rimAC || (FX_rimAC = FX_rimA.getContext('2d'));
  const b = FX_rimBC || (FX_rimBC = FX_rimB.getContext('2d'));
  a.setTransform(1, 0, 0, 1, 0, 0);
  // clear only the area this figure uses, not the whole boss-sized buffer
  a.clearRect(0, 0, cw, chh);
  a.save();
  a.translate(pad, pad);
  fn(a, 0, 0);
  a.restore();

  // flatten the sprite's alpha to a single colour
  b.setTransform(1, 0, 0, 1, 0, 0);
  b.clearRect(0, 0, cw, chh);
  b.drawImage(FX_rimA, 0, 0, cw, chh, 0, 0, cw, chh);
  b.globalCompositeOperation = 'source-in';
  b.fillStyle = opt.colour || 'rgba(188,210,236,1)';
  b.fillRect(0, 0, cw, chh);
  b.globalCompositeOperation = 'source-over';

  const dx = opt.dx === undefined ? 1.6 : opt.dx;
  const dy = opt.dy === undefined ? -1.8 : opt.dy;
  // Every blit takes the explicit source rect. The buffers are sized to the
  // LARGEST figure ever drawn but only the current figure's corner is cleared,
  // so a whole-canvas drawImage would drag in whatever the boss left behind.
  const al = opt.alpha === undefined ? 0.5 : opt.alpha;
  ctx.save();
  ctx.globalAlpha = al;
  ctx.drawImage(FX_rimB, 0, 0, cw, chh, x - pad + dx, y - pad + dy, cw, chh);
  // a second, wider, fainter stamp reads as the light wrapping the form
  if (opt.wrap) {
    ctx.globalAlpha = al * 0.34;
    ctx.drawImage(FX_rimB, 0, 0, cw, chh, x - pad + dx * 2.1, y - pad + dy * 2.1, cw, chh);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.drawImage(FX_rimA, 0, 0, cw, chh, x - pad, y - pad, cw, chh);
}

// ============================================================================
// Lightning -- deterministic strike scheduler + forked bolt
// ============================================================================
class Lightning {
  constructor() {
    this.clock = 0;
    this.strikeIdx = 0;
    this.nextAt = 3.2;
    this.strikeT = -1;      // seconds since current strike began, <0 = idle
    this.duration = 0;
    this.boltSeed = 1;
    this._flash = 0;
    this.boltX = CW * 0.5;
  }

  FX_schedule() {
    const n = ++this.strikeIdx;
    // 4.5 .. 13.5 seconds between strikes
    this.nextAt = this.clock + 4.5 + FX_rnd(n * 3.1) * 9.0;
    this.boltSeed = n * 17 + 5;
    this.boltX = 60 + FX_rnd(n * 7.7) * (CW - 120);
    this.duration = 0.55 + FX_rnd(n * 5.3) * 0.4;
    this.strikeT = 0;
  }

  update(dt) {
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    this.clock += dt;
    if (this.strikeT >= 0) {
      this.strikeT += dt;
      if (this.strikeT > this.duration) this.strikeT = -1;
    }
    if (this.strikeT < 0 && this.clock >= this.nextAt) this.FX_schedule();

    // double-blink envelope: fast attack, drop, second pop, long tail
    let f = 0;
    const t = this.strikeT;
    if (t >= 0) {
      const d = this.duration;
      if (t < 0.045) {
        f = t / 0.045;                              // attack
      } else if (t < 0.14) {
        f = 1 - (t - 0.045) / 0.095 * 0.82;         // drop to 0.18
      } else if (t < 0.20) {
        f = 0.18 + (t - 0.14) / 0.06 * 0.72;        // second pop to 0.9
      } else {
        const k = (t - 0.20) / Math.max(0.001, d - 0.20);
        f = 0.9 * Math.pow(1 - FX_clamp(k, 0, 1), 2.4);
      }
    }
    this._flash = FX_clamp(f, 0, 1);
  }

  get flash() { return this._flash; }

  // draws a forked bolt; t is 0..1 progress within the strike (defaults to internal)
  drawBolt(ctx, t) {
    let prog = (t === undefined || t === null)
      ? (this.strikeT >= 0 ? this.strikeT / Math.max(0.001, this.duration) : -1)
      : t;
    if (prog < 0 || prog > 1) return;
    // bolt is only visible in the first third of the strike
    const vis = prog < 0.30 ? Math.pow(1 - prog / 0.30, 0.7) : 0;
    if (vis <= 0.01) return;

    const seed = this.boltSeed;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = vis;

    // --- build main channel points
    const segs = 14;
    const endY = CH * (0.48 + FX_rnd(seed + 91) * 0.22);
    const pts = [];
    let x = this.boltX, y = -20;
    const drift = FX_srnd(seed, 3) * 90;
    for (let i = 0; i <= segs; i++) {
      const k = i / segs;
      const jitter = FX_srnd(seed + i * 13, i) * (34 * (1 - k * 0.45));
      pts.push([
        this.boltX + drift * k + jitter,
        FX_lerp(-20, endY, k) + FX_srnd(seed + i * 5, i + 2) * 8
      ]);
    }
    pts[0][0] = this.boltX; pts[0][1] = -20;

    const strokeChain = (chain, width, color, blur) => {
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.shadowBlur = blur;
      ctx.shadowColor = FX_rgba(PAL.moonGlow, 0.9);
      ctx.beginPath();
      ctx.moveTo(chain[0][0], chain[0][1]);
      for (let i = 1; i < chain.length; i++) ctx.lineTo(chain[i][0], chain[i][1]);
      ctx.stroke();
    };

    // outer violet glow -> mid blue -> white core
    strokeChain(pts, 16, FX_rgba(PAL.skyGlow, 0.22), 26);
    strokeChain(pts, 7, FX_rgba(PAL.moonGlow, 0.6), 18);
    strokeChain(pts, 2.6, 'rgba(255,255,255,0.95)', 12);

    // --- forks
    ctx.shadowBlur = 10;
    for (let f = 0; f < 4; f++) {
      const at = 3 + Math.floor(FX_rnd(seed + f * 29) * (segs - 5));
      const base = pts[at];
      const dir = FX_srnd(seed + f * 41, f) >= 0 ? 1 : -1;
      const n = 4 + Math.floor(FX_rnd(seed + f * 17) * 3);
      const chain = [[base[0], base[1]]];
      let fx = base[0], fy = base[1];
      for (let i = 1; i <= n; i++) {
        fx += dir * (14 + FX_rnd2(seed + f, i) * 30);
        fy += 16 + FX_rnd2(seed + f * 3, i + 5) * 34;
        chain.push([fx, fy]);
      }
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = FX_rgba(PAL.moonGlow, 0.45);
      ctx.shadowColor = FX_rgba(PAL.moonGlow, 0.8);
      ctx.beginPath();
      ctx.moveTo(chain[0][0], chain[0][1]);
      for (let i = 1; i < chain.length; i++) ctx.lineTo(chain[i][0], chain[i][1]);
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
    }

    // --- glow bloom around the strike origin
    ctx.shadowBlur = 0;
    ctx.globalAlpha = vis * 0.22;
    ctx.save();
    ctx.translate(this.boltX, 0);
    ctx.scale(190, 190);
    ctx.fillStyle = FX_radial(ctx, 'boltBloom', 1, [
      [0, 'rgba(230,238,255,0.55)'],
      [0.4, FX_rgba(PAL.skyGlow, 0.22)],
      [1, 'rgba(0,0,0,0)']
    ]);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, FX_TAU); ctx.fill();
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.restore();
  }
}

// ============================================================================
// ScreenShake -- deterministic multi-frequency decay
// ============================================================================
class ScreenShake {
  constructor() {
    this.clock = 0;
    this.mag = 0;
    this.dur = 0;
    this.left = 0;
    this.phase = 0;
    this._x = 0;
    this._y = 0;
  }

  trigger(magnitude, duration) {
    const m = Math.max(0, magnitude || 0);
    const d = Math.max(0.01, duration || 0.25);
    // stacking: take the stronger impulse, extend a little
    if (m >= this.mag || this.left <= 0) {
      this.mag = m;
      this.dur = d;
      this.left = d;
      this.phase += 1.7;  // deterministic decorrelation between triggers
    } else {
      this.left = Math.max(this.left, d * 0.6);
    }
  }

  update(dt) {
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    this.clock += dt;
    if (this.left <= 0) { this._x = 0; this._y = 0; this.mag = 0; return; }
    this.left -= dt;
    if (this.left <= 0) { this.left = 0; this._x = 0; this._y = 0; this.mag = 0; return; }
    const k = this.left / this.dur;              // 1 -> 0
    const amp = this.mag * k * k;                // quadratic ease-out
    const t = this.clock * 1.0 + this.phase;
    this._x = amp * (
      Math.sin(t * 47.3) * 0.6 +
      Math.sin(t * 23.1 + 1.3) * 0.3 +
      Math.cos(t * 71.7 + 2.1) * 0.18
    );
    this._y = amp * (
      Math.cos(t * 41.9 + 0.7) * 0.55 +
      Math.sin(t * 29.7 + 2.9) * 0.28 +
      Math.sin(t * 83.3) * 0.14
    );
  }

  get x() { return this._x; }
  get y() { return this._y; }
}

// ============================================================================
// drawSpeedLines -- edge motion streaks
// ============================================================================
function drawSpeedLines(ctx, t, strength) {
  const s = FX_clamp(strength || 0, 0, 1);
  if (s <= 0.01) return;
  const time = t || 0;
  ctx.save();
  ctx.lineCap = 'round';

  // soft vignette-ish darkening at both edges to seat the streaks
  const gL = FX_linear(ctx, 'spdL', 0, 0, 170, 0, [
    [0, 'rgba(5,6,15,0.45)'], [1, 'rgba(5,6,15,0)']
  ]);
  ctx.globalAlpha = s * 0.7;
  ctx.fillStyle = gL;
  ctx.fillRect(0, 0, 170, CH);
  ctx.save();
  ctx.translate(CW, 0);
  ctx.scale(-1, 1);
  ctx.fillStyle = gL;
  ctx.fillRect(0, 0, 170, CH);
  ctx.restore();

  const count = 12 + Math.round(s * 14);
  for (let i = 0; i < count; i++) {
    const r0 = FX_rnd(i * 3.7 + 1.3);
    const r1 = FX_rnd2(i, 9);
    const r2 = FX_rnd2(i, 21);
    const y = 22 + r0 * (CH - 44);
    const speed = 480 + r1 * 900;
    const travel = ((time * speed + r2 * 900) % 620);
    const len = 55 + r1 * 150 * (0.4 + s);
    const thick = 0.8 + r2 * 2.1;
    const side = (i & 1) === 0 ? -1 : 1;

    // fade in/out as the streak sweeps past the edge zone
    const edgeT = travel / 620;
    const fade = Math.sin(edgeT * Math.PI);
    const a = s * fade * (0.16 + r1 * 0.34);
    if (a <= 0.01) continue;

    let x0, x1;
    if (side < 0) { x0 = -60 + travel * 0.42; x1 = x0 + len; }
    else { x0 = CW + 60 - travel * 0.42; x1 = x0 - len; }

    const grad = ctx.createLinearGradient(x0, y, x1, y);
    const col = (i % 5 === 0) ? PAL.yellow : PAL.moonGlow;
    grad.addColorStop(0, FX_rgba(col, 0));
    grad.addColorStop(0.45, FX_rgba(col, a));
    grad.addColorStop(0.72, FX_rgba(PAL.white, a * 0.9));
    grad.addColorStop(1, FX_rgba(col, 0));

    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = thick;
    ctx.shadowBlur = 6 * s;
    ctx.shadowColor = FX_rgba(col, a);
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y + side * 1.5);
    ctx.stroke();
  }

  // a couple of thick foreground blurs that whip past fast
  ctx.shadowBlur = 0;
  for (let i = 0; i < 3; i++) {
    const y = 60 + FX_rnd(i * 11.1) * (CH - 120);
    const tt = ((time * (1500 + FX_rnd(i + 31) * 900) + i * 400) % 1600) / 1600;
    const a = s * Math.sin(tt * Math.PI) * 0.22;
    if (a <= 0.01) continue;
    const side = i % 2 === 0 ? 1 : -1;
    const w = 120 + FX_rnd(i + 7) * 140;
    const x = side > 0 ? -80 + tt * 300 : CW + 80 - tt * 300;
    ctx.globalAlpha = a;
    ctx.fillStyle = FX_rgba(PAL.moonGlow, 0.5);
    FX_roundRect(ctx, Math.min(x, x + side * w), y, w, 2.4 + FX_rnd(i) * 3, 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}


// ═══ UI ═══════════════════════════════════════
// ===========================================================================
//  ui.js  --  HUD + full-screen states.   Prefix: UI_
//  Pure Canvas2D. No images, no libraries. Deterministic (time-driven) only.
// ===========================================================================

const UI_gcache = Object.create(null);

function UI_rnd(n){ const s = Math.sin(n*127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function UI_clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function UI_dispFont(size){ return '800 ' + size + 'px Oswald, "Arial Black", Impact, system-ui, sans-serif'; }
function UI_numFont(size){ return '700 ' + size + 'px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace'; }
function UI_pad(n,len){ let s = String(Math.max(0, Math.floor(n||0))); while(s.length < len) s = '0' + s; return s; }

// --- cached gradients ------------------------------------------------------
function UI_lg(ctx, key, x0,y0,x1,y1, stops){
  let g = UI_gcache[key];
  if(!g){
    g = ctx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
    UI_gcache[key] = g;
  }
  return g;
}
function UI_rg(ctx, key, x0,y0,r0, x1,y1,r1, stops){
  let g = UI_gcache[key];
  if(!g){
    g = ctx.createRadialGradient(x0,y0,r0,x1,y1,r1);
    for(let i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
    UI_gcache[key] = g;
  }
  return g;
}

// --- rounded rect (per-corner radii), roundRect-free ----------------------
function UI_roundRect(ctx, x, y, w, h, r){
  let tl,tr,br,bl;
  if(Array.isArray(r)){ tl=r[0]; tr=r[1]; br=r[2]; bl=r[3]; } else { tl=tr=br=bl=r||0; }
  const m = Math.min(w,h)/2;
  tl=Math.min(tl,m); tr=Math.min(tr,m); br=Math.min(br,m); bl=Math.min(bl,m);
  ctx.moveTo(x+tl, y);
  ctx.lineTo(x+w-tr, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+tr);
  ctx.lineTo(x+w, y+h-br);
  ctx.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
  ctx.lineTo(x+bl, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-bl);
  ctx.lineTo(x, y+tl);
  ctx.quadraticCurveTo(x, y, x+tl, y);
}

// --- letter-spaced text (canvas has no reliable letterSpacing) ------------
function UI_measure(ctx, text, track){
  if(!track) return ctx.measureText(text).width;
  let w = 0;
  for(let i=0;i<text.length;i++) w += ctx.measureText(text[i]).width + track;
  return text.length ? w - track : 0;
}
function UI_tracked(ctx, text, x, y, track, align, stroke){
  const w = UI_measure(ctx, text, track);
  let sx = x;
  if(align === 'center') sx = x - w/2;
  else if(align === 'right') sx = x - w;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  if(!track){
    if(stroke) ctx.strokeText(text, sx, y); else ctx.fillText(text, sx, y);
  } else {
    let cx = sx;
    for(let i=0;i<text.length;i++){
      if(stroke) ctx.strokeText(text[i], cx, y); else ctx.fillText(text[i], cx, y);
      cx += ctx.measureText(text[i]).width + track;
    }
  }
  ctx.textAlign = prevAlign;
  return w;
}

// ===========================================================================
//  SHARED HEADING TEXT  (public)
// ===========================================================================
function drawPanelText(ctx, text, x, y, size, opts){
  opts = opts || {};
  const align = opts.align || 'center';
  const track = opts.track || 0;
  const c1    = opts.color1 || '#fff4c2';
  const c2    = opts.color2 || PAL.yellowD;
  const glow  = opts.glow == null ? 22 : opts.glow;

  ctx.save();
  ctx.font = UI_dispFont(size);
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  // 1. atmospheric glow behind the letters
  if(glow > 0){
    ctx.save();
    ctx.shadowColor = opts.glowColor || 'rgba(245,197,24,0.55)';
    ctx.shadowBlur = glow;
    ctx.fillStyle = 'rgba(120,90,10,0.85)';
    UI_tracked(ctx, text, x, y, track, align, false);
    ctx.shadowBlur = glow * 0.5;
    UI_tracked(ctx, text, x, y, track, align, false);
    ctx.restore();
  }

  // 2. dark bevel / cast shadow, offset down
  ctx.fillStyle = 'rgba(4,4,9,0.92)';
  UI_tracked(ctx, text, x, y + Math.max(2, size*0.055), track, align, false);

  // 3. hard dark outline
  ctx.strokeStyle = '#06060d';
  ctx.lineWidth = Math.max(2, size*0.085);
  UI_tracked(ctx, text, x, y, track, align, true);

  // 4. main gradient fill
  const top = y - size*0.80, bot = y + size*0.18;
  const key = 'pt' + size + '|' + c1 + '|' + c2 + '|' + Math.round(top);
  ctx.fillStyle = UI_lg(ctx, key, 0, top, 0, bot, [
    [0.00, c1],
    [0.34, opts.colorMid || PAL.yellow],
    [0.62, c2],
    [1.00, opts.color3 || '#6d4f05']
  ]);
  UI_tracked(ctx, text, x, y, track, align, false);

  // 5. upper specular sheen
  const sk = 'pts' + size + '|' + Math.round(top);
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = UI_lg(ctx, sk, 0, top, 0, top + size*0.46, [
    [0, 'rgba(255,255,255,0.55)'], [0.7,'rgba(255,255,255,0.06)'], [1,'rgba(255,255,255,0)']
  ]);
  UI_tracked(ctx, text, x, y, track, align, false);
  ctx.restore();

  // 6. thin bright top rim
  ctx.strokeStyle = 'rgba(255,246,214,0.35)';
  ctx.lineWidth = Math.max(0.7, size*0.012);
  UI_tracked(ctx, text, x, y - Math.max(1, size*0.02), track, align, true);

  ctx.restore();
}

// small dim caption in the display stack
function UI_caption(ctx, text, x, y, size, color, track, align, alpha){
  ctx.save();
  ctx.font = UI_dispFont(size);
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color || 'rgba(158,172,212,0.72)';
  UI_tracked(ctx, text, x, y, track == null ? 2.4 : track, align || 'center', false);
  ctx.restore();
}

// numeric stack, gold gradient + dark outline, tabular
function UI_num(ctx, text, x, y, size, align, c1, c2, glow){
  ctx.save();
  ctx.font = UI_numFont(size);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = align || 'left';
  ctx.lineJoin = 'round';
  if(glow){ ctx.shadowColor = 'rgba(245,197,24,0.5)'; ctx.shadowBlur = glow; }
  ctx.strokeStyle = '#07070e';
  ctx.lineWidth = Math.max(2, size*0.20);
  ctx.strokeText(text, x, y);
  ctx.shadowBlur = 0;
  const top = y - size*0.82;
  ctx.fillStyle = UI_lg(ctx, 'n'+size+'|'+Math.round(top)+'|'+(c1||'a'), 0, top, 0, y + size*0.14, [
    [0, c1 || '#fff3c4'], [0.45, PAL.yellow], [1, c2 || PAL.yellowD]
  ]);
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ===========================================================================
//  SMALL ICONS
// ===========================================================================
function UI_batarangIcon(ctx, cx, cy, r, ang){
  ctx.save();
  ctx.translate(cx, cy);
  let sx = Math.cos(ang);
  if(Math.abs(sx) < 0.14) sx = sx < 0 ? -0.14 : 0.14;
  ctx.rotate(Math.sin(ang) * 0.30);
  ctx.scale(sx, 1);
  ctx.beginPath();
  ctx.moveTo(0, -r*1.05);
  ctx.quadraticCurveTo(r*0.34, -r*0.30, r*0.98, r*0.62);
  ctx.quadraticCurveTo(r*0.30, r*0.22, 0, r*0.52);
  ctx.quadraticCurveTo(-r*0.30, r*0.22, -r*0.98, r*0.62);
  ctx.quadraticCurveTo(-r*0.34, -r*0.30, 0, -r*1.05);
  ctx.closePath();
  ctx.fillStyle = UI_lg(ctx, 'bar'+Math.round(r), 0,-r, 0, r*0.7, [
    [0,'#8f9ab8'], [0.35,'#4a5170'], [0.6,'#272c42'], [1,'#12141f']
  ]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,197,24,0.55)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
  // specular edge
  ctx.beginPath();
  ctx.moveTo(-r*0.05, -r*0.92);
  ctx.quadraticCurveTo(r*0.28, -r*0.26, r*0.80, r*0.50);
  ctx.strokeStyle = 'rgba(226,236,255,0.65)';
  ctx.lineWidth = 1.0;
  ctx.stroke();
  ctx.restore();
}

// gold hairline rule with a soft bloom and a centre diamond
function UI_rule(ctx, cx, y, w, alpha, color, diamond){
  const c = color || PAL.yellow;
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.85 : alpha;
  ctx.fillStyle = UI_lg(ctx, 'rl'+Math.round(cx)+'_'+Math.round(w)+c, cx-w/2,0, cx+w/2,0, [
    [0,'rgba(0,0,0,0)'], [0.22, c], [0.5, c], [0.78, c], [1,'rgba(0,0,0,0)']
  ]);
  ctx.shadowColor = c; ctx.shadowBlur = 14;
  ctx.fillRect(cx - w/2, y, w, 1.5);
  ctx.shadowBlur = 0;
  if(diamond){
    ctx.translate(cx, y + 0.75);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = c;
    ctx.shadowColor = c; ctx.shadowBlur = 10;
    ctx.fillRect(-3.2,-3.2, 6.4, 6.4);
  }
  ctx.restore();
}

// full-screen dark wash + coloured bloom + vignette + drifting light bar
function UI_wash(ctx, t, bloom, strength){
  ctx.save();
  ctx.fillStyle = UI_lg(ctx, 'wash', 0,0,0,CH, [
    [0,'rgba(3,4,11,0.93)'], [0.45,'rgba(6,7,17,0.86)'], [1,'rgba(2,2,6,0.95)']
  ]);
  ctx.globalAlpha = strength == null ? 1 : strength;
  ctx.fillRect(0,0,CW,CH);
  ctx.globalAlpha = 1;
  if(bloom){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.50 + 0.10*Math.sin(t*1.1);
    ctx.fillStyle = UI_rg(ctx, 'bl'+bloom, CW/2, CH*0.40, 20, CW/2, CH*0.40, CW*0.58, [
      [0, bloom], [0.55,'rgba(0,0,0,0)'], [1,'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(0,0,CW,CH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  // slow vertical sweep of haze
  const sy = ((t*26) % (CH + 320)) - 160;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = UI_lg(ctx, 'sweep', 0,0,0,160, [
    [0,'rgba(0,0,0,0)'], [0.5,'rgba(150,170,235,1)'], [1,'rgba(0,0,0,0)']
  ]);
  ctx.translate(0, sy);
  ctx.fillRect(0, 0, CW, 160);
  ctx.restore();
  // vignette
  ctx.fillStyle = UI_rg(ctx, 'vig', CW/2, CH/2, CH*0.28, CW/2, CH/2, CH*0.95, [
    [0,'rgba(0,0,0,0)'], [1,'rgba(0,0,0,0.72)']
  ]);
  ctx.fillRect(0,0,CW,CH);
  ctx.restore();
}

// deterministic drifting dust motes
function UI_motes(ctx, t, n, seed, color){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = color || 'rgba(210,220,255,0.5)';
  for(let i=0;i<n;i++){
    const a = UI_rnd(seed+i), b = UI_rnd(seed+i*3.7), c = UI_rnd(seed+i*7.3);
    const x = (a*CW + Math.sin(t*(0.18+b*0.3) + i)*26 + CW) % CW;
    const y = (b*CH - t*(7 + c*16)) % CH;
    const yy = y < 0 ? y + CH : y;
    const r = 0.6 + c*1.7;
    ctx.globalAlpha = 0.14 + 0.36*Math.abs(Math.sin(t*0.8 + i*1.7));
    ctx.beginPath(); ctx.arc(x, yy, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function UI_prompt(ctx, text, y, t, blink){
  const pulse = 0.55 + 0.45*Math.sin(t*4.2);
  ctx.save();
  ctx.globalAlpha = blink ? (0.80 + 0.20*pulse) : 0.16;
  ctx.font = UI_dispFont(19);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(245,197,24,0.75)';
  ctx.shadowBlur = 16 + 10*pulse;
  ctx.fillStyle = '#ffe9a3';
  UI_tracked(ctx, text, CW/2, y, 7, 'center', false);
  ctx.restore();
}

// layered bat emblem: halo, gold rim, dark body, inner sheen
function UI_emblem(ctx, cx, cy, r, t, halo){
  ctx.save();
  if(halo > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = halo * (0.82 + 0.18*Math.sin(t*1.5));
    ctx.fillStyle = UI_rg(ctx, 'hal'+Math.round(r), cx, cy, r*0.12, cx, cy, r*1.85, [
      [0,'rgba(245,197,24,0.55)'], [0.32,'rgba(200,150,40,0.20)'], [1,'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(cx - r*2, cy - r*2, r*4, r*4);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  // gold rim = slightly larger emblem behind
  ctx.save();
  ctx.shadowColor = 'rgba(245,197,24,0.9)';
  ctx.shadowBlur = r*0.28;
  drawBatSymbol(ctx, cx, cy, r*1.035, PAL.yellow);
  ctx.restore();
  // body with vertical steel gradient (coords are symbol-local)
  const body = UI_lg(ctx, 'emb'+Math.round(r), 0, -r*0.55, 0, r*0.5, [
    [0, PAL.batHi], [0.42, PAL.bat], [1, PAL.batLo]
  ]);
  drawBatSymbol(ctx, cx, cy, r, body);
  // inner top sheen
  ctx.save();
  ctx.globalAlpha = 0.5;
  const sheen = UI_lg(ctx, 'embs'+Math.round(r), 0, -r*0.55, 0, -r*0.05, [
    [0,'rgba(190,205,245,0.7)'], [1,'rgba(190,205,245,0)']
  ]);
  drawBatSymbol(ctx, cx, cy, r*0.955, sheen);
  ctx.restore();
  ctx.restore();
}

// ===========================================================================
//  HUD
// ===========================================================================
function drawHUD(ctx, s){
  s = s || {};
  const t     = s.time || 0;
  const star  = !!s.starActive;
  const lives = Math.max(0, s.lives|0);
  const pulse = 0.5 + 0.5*Math.sin(t*7);

  ctx.save();

  // A scrim, not a panel. The old HUD was a glass slab with a gold border and
  // heavy letterpress type — unmistakably arcade. A modern one gets out of the
  // way: a soft darkening so text stays legible over a bright sky, and nothing
  // else. No frame, no fill, no glow.
  const scrim = UI_lg(ctx, 'hudScrim2', 0, 0, 0, 96, [
    [0, 'rgba(4,6,10,0.78)'], [0.55, 'rgba(4,6,10,0.34)'], [1, 'rgba(4,6,10,0)']
  ]);
  ctx.fillStyle = scrim;
  ctx.fillRect(0, 0, CW, 96);

  // --- helpers -----------------------------------------------------------
  function label(txt, x, y, align){
    ctx.font = '600 9px Oswald, system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(196,210,228,0.42)';
    UI_tracked(ctx, txt, x, y, 2.9, align || 'left', false);
  }
  function value(txt, x, y, size, align, alpha){
    ctx.font = '500 ' + size + 'px "JetBrains Mono", ui-monospace, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = align || 'left';
    ctx.fillStyle = 'rgba(233,240,250,' + (alpha == null ? 0.92 : alpha) + ')';
    ctx.fillText(txt, x, y);
    ctx.textAlign = 'left';
  }

  // --- lives: small glyphs, not gold medallions ---------------------------
  label('VIDAS', 24, 30, 'left');
  for(let i=0;i<Math.max(3, lives);i++){
    const ex = 30 + i*19, ey = 46;
    ctx.save();
    if(i < lives){
      ctx.globalAlpha = 0.88;
      drawBatSymbol(ctx, ex, ey, 7.4, 'rgba(226,236,248,1)');
    } else {
      ctx.globalAlpha = 0.16;
      drawBatSymbol(ctx, ex, ey, 7.4, 'rgba(200,214,232,1)');
    }
    ctx.restore();
  }

  // --- score / batarangs / time ------------------------------------------
  label('PUNTOS', 150, 30, 'left');
  value(UI_pad(s.score, 6), 150, 52, 21, 'left', 0.95);

  label('BATARANGS', 290, 30, 'left');
  ctx.save();
  ctx.globalAlpha = 0.72;
  UI_batarangIcon(ctx, 299, 44, 7.5, t*3.4);
  ctx.restore();
  value(UI_pad(Math.max(0, s.batarangs|0), 2), 314, 51, 18, 'left', 0.82);

  const secs = Math.max(0, Math.floor(t));
  label('TIEMPO', 392, 30, 'left');
  value(UI_pad(Math.floor(secs/60), 2) + ':' + UI_pad(secs%60, 2), 392, 51, 18, 'left', 0.82);

  // --- bat-power: a thin rule, not a chunky meter ------------------------
  if(star){
    const bx = 500, by = 40, bw = 172;
    const frac = UI_clamp((s.starTimer||0)/10, 0, 1);
    label('PODER MURCIÉLAGO', bx, 30, 'left');
    ctx.fillStyle = 'rgba(180,196,216,0.18)';
    ctx.fillRect(bx, by, bw, 2);
    ctx.fillStyle = 'rgba(240,246,255,' + (0.72 + 0.24*pulse).toFixed(3) + ')';
    ctx.fillRect(bx, by, bw*frac, 2);
  }

  // --- level, right aligned ----------------------------------------------
  const rx = CW - 24;
  ctx.font = '600 15px Oswald, system-ui, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(236,243,252,0.90)';
  UI_tracked(ctx, String(s.levelName || 'GOTHAM').toUpperCase(), rx, 32, 3.6, 'right', false);
  label(String(s.levelId == null ? '1-1' : s.levelId), rx, 50, 'right');
  ctx.save();
  ctx.globalAlpha = 0.38;
  value('RÉCORD ' + UI_pad(s.best, 6), rx, 68, 10, 'right', 1);
  ctx.restore();
