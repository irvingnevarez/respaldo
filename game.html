  ctx.quadraticCurveTo(L * 0.60, -H * 0.04, L * 0.48, H * 0.26);
  ctx.quadraticCurveTo(L * 0.38, H * 0.06, L * 0.26, H * 0.34);
  ctx.quadraticCurveTo(L * 0.16, H * 0.12, 0, H * 0.24);
  ctx.closePath();
  const mg = EN_linGrad(ctx, 'dwm', 0, -H * 0.6, L, H * 0.34, [
    [0, 'rgba(120,70,180,0.92)'], [0.4, 'rgba(70,35,115,0.88)'],
    [0.75, 'rgba(45,20,80,0.90)'], [1, 'rgba(25,10,45,0.95)']
  ]);
  ctx.fillStyle = mg;
  ctx.fill();

  // translucent green backlight through the membrane
  ctx.save();
  ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.25 + 0.15 * (0.5 + 0.5 * Math.sin(t * 5.1));
  ctx.fillStyle = EN_radGrad(ctx, 'dwg', L * 0.15, H * 0.2, 0.1, L * 0.15, H * 0.2, L * 0.9, [
    [0, 'rgba(110,240,100,0.8)'], [1, 'rgba(63,160,44,0)']
  ]);
  ctx.fillRect(-2, -H, L + 4, H * 2);
  ctx.restore();

  // ribs / struts
  ctx.strokeStyle = 'rgba(200,180,255,0.55)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -H * 0.16); ctx.quadraticCurveTo(L * 0.55, -H * 0.55, L, -H * 0.20);
  ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#c9aef0';
  ctx.lineWidth = 0.8;
  const tips = [[L * 0.72, H * 0.12], [L * 0.48, H * 0.26], [L * 0.26, H * 0.34]];
  for (let i = 0; i < tips.length; i++) {
    ctx.beginPath();
    ctx.moveTo(L * 0.06, -H * 0.10);
    ctx.quadraticCurveTo(tips[i][0] * 0.6, -H * 0.18, tips[i][0], tips[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // leading-edge rim light
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, -H * 0.18);
  ctx.quadraticCurveTo(L * 0.55, -H * 0.62, L, -H * 0.20);
  EN_rimStroke(ctx, '#eadcff', 1.2, 0.6);
  ctx.restore();

  ctx.restore();
}

function EN_droneProp(ctx, cx, cy, w, h, t) {
  ctx.save();
  // mast
  ctx.strokeStyle = '#2a2038';
  ctx.lineWidth = Math.max(1, w * 0.035);
  ctx.beginPath();
  ctx.moveTo(cx, cy + h * 0.06);
  ctx.lineTo(cx, cy - h * 0.02);
  ctx.stroke();

  const pr = w * 0.30;
  const spin = t * 26;
  // blur disc
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = EN_radGrad(ctx, 'dpr', cx, cy, 0.1, cx, cy, pr, [
    [0, 'rgba(180,200,255,0.0)'], [0.55, 'rgba(170,190,250,0.55)'], [1, 'rgba(120,140,210,0)']
  ]);
  EN_ellipse(ctx, cx, cy - h * 0.02, pr, pr * 0.26, 0);
  ctx.fill();
  ctx.globalAlpha = 1;

  // three streaked blades
  for (let i = 0; i < 3; i++) {
    const a = spin + i * (Math.PI * 2 / 3);
    ctx.globalAlpha = 0.30 + 0.30 * Math.abs(Math.cos(a));
    ctx.strokeStyle = '#cfd8ff';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(cx, cy - h * 0.02, pr, pr * 0.26, 0, a, a + 0.9);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // hub
  ctx.fillStyle = EN_radGrad(ctx, 'dhb', cx - 1, cy - h * 0.03, 0.1, cx, cy - h * 0.02, w * 0.06, [
    [0, '#d8dcf0'], [0.5, '#6d7490'], [1, '#171a26']
  ]);
  ctx.beginPath();
  ctx.arc(cx, cy - h * 0.02, w * 0.05, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();
}


// ═══ ENVIRONMENT ═══════════════════════════════════════
// =====================================================================
//  environment.js  --  Gotham backdrop  (prefix: ENV_)
//  Sky, moon, bat-signal, three parallax skyline layers, smog, vignette.
//  Everything drawn with Canvas2D primitives. Deterministic: all motion
//  is a function of the passed-in time `t`; all "randomness" is hashed.
// =====================================================================

// ---------- deterministic pseudo-random ------------------------------
function ENV_rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function ENV_rnd2(n, k) {
  const s = Math.sin(n * 269.5 + k * 183.3 + 71.7) * 27183.1234;
  return s - Math.floor(s);
}

// ---------- gradient cache (keyed to the ctx that made them) ---------
let ENV_C = { ctx: null, rad: {}, lin: {} };
function ENV_cache(ctx) {
  if (ENV_C.ctx !== ctx) ENV_C = { ctx: ctx, rad: {}, lin: {} };
  return ENV_C;
}
// unit radial gradient centred on 0,0 radius 1 -- scale it with transforms
function ENV_radial(ctx, key, stops) {
  const c = ENV_cache(ctx);
  let g = c.rad[key];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    c.rad[key] = g;
  }
  return g;
}
function ENV_linear(ctx, key, x0, y0, x1, y1, stops) {
  const c = ENV_cache(ctx);
  let g = c.lin[key];
  if (!g) {
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    c.lin[key] = g;
  }
  return g;
}
// soft elliptical puff using the cached unit radial
function ENV_puff(ctx, key, x, y, rx, ry, stops, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  ctx.fillStyle = ENV_radial(ctx, key, stops);
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function ENV_poly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
}

// ---------- the bat emblem (used faintly in the sky) -----------------
function ENV_batPath(ctx, cx, cy, w) {
  const s = w / 150;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.bezierCurveTo(6, -30, 22, -34, 30, -24);
  ctx.bezierCurveTo(28, -16, 34, -12, 44, -14);
  ctx.bezierCurveTo(62, -18, 76, -8, 74, 6);
  ctx.bezierCurveTo(64, 0, 56, 2, 52, 10);
  ctx.lineTo(58, 26);
  ctx.lineTo(40, 16);
  ctx.bezierCurveTo(30, 12, 18, 16, 12, 26);
  ctx.lineTo(0, 44);
  ctx.lineTo(-12, 26);
  ctx.bezierCurveTo(-18, 16, -30, 12, -40, 16);
  ctx.lineTo(-58, 26);
  ctx.lineTo(-52, 10);
  ctx.bezierCurveTo(-56, 2, -64, 0, -74, 6);
  ctx.bezierCurveTo(-76, -8, -62, -18, -44, -14);
  ctx.bezierCurveTo(-34, -12, -28, -16, -30, -24);
  ctx.bezierCurveTo(-22, -34, -6, -30, 0, -14);
  ctx.closePath();
  ctx.restore();
}

// =====================================================================
//  SKY
// =====================================================================
function drawGothamSky(ctx, camX, t, lightning) {
  const L = lightning || 0;
  ctx.save();

  // --- base vertical gradient -----------------------------------------
  const sky = ENV_linear(ctx, 'sky', 0, 0, 0, CH, [
    [0.00, PAL.skyTop],
    [0.24, '#080b1b'],
    [0.46, PAL.skyMid],
    [0.70, PAL.skyLow],
    [0.86, '#241540'],
    [1.00, '#2b1a3d']
  ]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, CH);

  // --- stars (deterministic, twinkling) --------------------------------
  const starPar = camX * 0.012;
  ctx.fillStyle = PAL.white;
  for (let i = 0; i < 150; i++) {
    const sx = ((ENV_rnd(i) * 2400) - starPar) % 2400;
    const x = sx < 0 ? sx + 2400 : sx;
    if (x > CW + 4) continue;
    const y = ENV_rnd2(i, 7) * 300 + 4;
    const tw = 0.5 + 0.5 * Math.sin(t * (0.8 + ENV_rnd2(i, 3) * 2.4) + i * 1.7);
    const a = (0.10 + 0.55 * tw) * (1 - y / 380);
    if (a <= 0.01) continue;
    const r = 0.6 + ENV_rnd2(i, 11) * 1.1;
    ctx.globalAlpha = a;
    ctx.fillRect(x, y, r, r);
    if (r > 1.4) {
      ctx.globalAlpha = a * 0.28;
      ctx.fillRect(x - 1.6, y + r * 0.5 - 0.3, 4.4, 0.7);
      ctx.fillRect(x + r * 0.5 - 0.3, y - 1.6, 0.7, 4.4);
    }
  }
  ctx.globalAlpha = 1;

  // --- the moon --------------------------------------------------------
  const mper = 3000;
  let mx = 706 - (camX * 0.02) % mper;
  if (mx < -320) mx += mper;
  const my = 104;
  const mr = 42;

  // wide atmospheric halo
  ENV_puff(ctx, 'moonHaloFar', mx, my, mr * 7.4, mr * 6.2, [
    [0, 'rgba(150,168,216,0.30)'], [0.4, 'rgba(110,126,180,0.13)'],
    [0.72, 'rgba(70,82,130,0.05)'], [1, 'rgba(60,70,120,0)']
  ], 0.85);
  ENV_puff(ctx, 'moonHalo', mx, my, mr * 2.9, mr * 2.9, [
    [0, 'rgba(232,234,240,0.55)'], [0.35, 'rgba(190,200,228,0.24)'],
    [1, 'rgba(170,180,216,0)']
  ], 0.95);

  // disc with a shaded limb
  const mg = ENV_linear(ctx, 'moonDisc', -1, -1, 1, 1, [
    [0, '#ffffff'], [0.42, PAL.moon], [0.78, '#b9c0d4'], [1, '#8c93ad']
  ]);
  ctx.save();
  ctx.translate(mx, my);
  ctx.scale(mr, mr);
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  // craters
  ctx.fillStyle = '#000000';
  const cr = [[-0.30, -0.24, 0.22], [0.26, -0.06, 0.15], [-0.06, 0.36, 0.19],
              [0.44, 0.40, 0.11], [-0.50, 0.24, 0.10], [0.08, -0.48, 0.09]];
  for (let i = 0; i < cr.length; i++) {
    ctx.globalAlpha = 0.055 + (i % 3) * 0.022;
    ctx.beginPath();
    ctx.arc(cr[i][0], cr[i][1], cr[i][2], 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.05;
    ctx.beginPath();
    ctx.arc(cr[i][0] - cr[i][2] * 0.22, cr[i][1] - cr[i][2] * 0.22, cr[i][2] * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.fillStyle = '#000000';
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- drifting cloud bands (some cross the moon) ----------------------
  const cloudStops = [
    [0, 'rgba(58,64,100,0.55)'], [0.45, 'rgba(44,50,84,0.30)'],
    [0.8, 'rgba(32,36,64,0.08)'], [1, 'rgba(28,32,58,0)']
  ];
  for (let i = 0; i < 9; i++) {
    const span = 1600;
    const speed = 5 + ENV_rnd(i) * 13;
    let cx = ((ENV_rnd2(i, 5) * span) + t * speed - camX * 0.03) % span;
    if (cx < 0) cx += span;
    cx -= 220;
    if (cx > CW + 260) continue;
    const cy = 40 + ENV_rnd2(i, 9) * 250;
    const rx = 110 + ENV_rnd2(i, 13) * 170;
    const ry = 9 + ENV_rnd2(i, 17) * 14;
    const a = 0.24 + ENV_rnd2(i, 19) * 0.30;
    ENV_puff(ctx, 'cloud', cx, cy, rx, ry, cloudStops, a);
    ENV_puff(ctx, 'cloud', cx + rx * 0.45, cy + ry * 0.55, rx * 0.62, ry * 0.8, cloudStops, a * 0.7);
  }

  // --- bat-signal beam -------------------------------------------------
  const pulse = 0.62 + 0.38 * Math.sin(t * 0.75) + 0.05 * Math.sin(t * 3.1);
  const bx = -150 - camX * 0.03 % 40;
  const by = CH + 30;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(bx, by);
  ctx.rotate(-Math.PI * 0.345);
  const beam = ENV_linear(ctx, 'beam', 0, 0, 900, 0, [
    [0, 'rgba(245,197,24,0.30)'], [0.25, 'rgba(240,190,40,0.16)'],
    [0.62, 'rgba(220,175,60,0.07)'], [1, 'rgba(200,160,70,0)']
  ]);
  ctx.globalAlpha = 0.55 * pulse;
  ctx.fillStyle = beam;
  ENV_poly(ctx, [0, -10, 920, -190, 920, 190, 0, 10]);
  ctx.fill();
  // hot inner core
  const core = ENV_linear(ctx, 'beamCore', 0, 0, 760, 0, [
    [0, 'rgba(255,240,190,0.34)'], [0.4, 'rgba(245,205,70,0.11)'], [1, 'rgba(240,200,80,0)']
  ]);
  ctx.globalAlpha = 0.6 * pulse;
  ctx.fillStyle = core;
  ENV_poly(ctx, [0, -4, 780, -66, 780, 66, 0, 4]);
  ctx.fill();
  ctx.restore();

  // emblem burnt faintly into the cloud deck at the head of the beam
  const ex = bx + Math.cos(-Math.PI * 0.345) * 820;
  const ey = by + Math.sin(-Math.PI * 0.345) * 820;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ENV_puff(ctx, 'sigGlow', ex, ey, 150, 112, [
    [0, 'rgba(245,197,24,0.26)'], [0.5, 'rgba(220,175,50,0.10)'], [1, 'rgba(200,160,60,0)']
  ], 0.85 * pulse);
  ctx.globalAlpha = 0.30 * pulse;
  ctx.fillStyle = 'rgba(250,225,150,0.9)';
  ctx.beginPath();
  ctx.ellipse(ex, ey, 96, 72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.34 * pulse;
  ctx.fillStyle = '#12101c';
  ENV_batPath(ctx, ex, ey - 6, 150);
  ctx.fill();
  ctx.globalAlpha = 0.16 * pulse;
  ctx.strokeStyle = PAL.yellow;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // --- sodium-vapour city glow bleeding up from the horizon -------------
  const glow = ENV_linear(ctx, 'horizon', 0, CH * 0.42, 0, CH, [
    [0, 'rgba(42,27,74,0)'],
    [0.34, 'rgba(58,36,92,0.34)'],
    [0.62, 'rgba(108,60,86,0.40)'],
    [0.84, 'rgba(176,96,52,0.38)'],
    [1, 'rgba(206,120,54,0.46)']
  ]);
  ctx.fillStyle = glow;
  ctx.fillRect(0, CH * 0.42, CW, CH * 0.58);

  // hot pools of sodium light along the horizon line
  for (let i = 0; i < 6; i++) {
    let gx = ((i * 230 + ENV_rnd(i + 40) * 160) - camX * 0.06) % 1380;
    if (gx < -260) gx += 1380;
    if (gx > CW + 260) continue;
    ENV_puff(ctx, 'sodium', gx, 452, 250, 96, [
      [0, 'rgba(232,144,58,0.30)'], [0.45, 'rgba(190,104,46,0.13)'], [1, 'rgba(150,80,40,0)']
    ], 0.55 + 0.12 * Math.sin(t * 0.5 + i));
  }

  // --- lightning wash ---------------------------------------------------
  if (L > 0.001) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(112,134,190,' + (L * 0.55).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(214,228,255,' + (L * 0.20).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  SKYLINE
// =====================================================================

// Returns a flat [x,y,x,y,...] silhouette for building style `st`.
function ENV_silhouette(x, y0, w, h, st) {
  const T = y0 - h;
  if (st === 0) {              // art-deco stepped ziggurat
    return [x, y0, x, y0 - h * 0.55, x + w * 0.10, y0 - h * 0.55,
      x + w * 0.10, y0 - h * 0.78, x + w * 0.26, y0 - h * 0.78,
      x + w * 0.26, y0 - h * 0.93, x + w * 0.50, T,
      x + w * 0.74, y0 - h * 0.93, x + w * 0.74, y0 - h * 0.78,
      x + w * 0.90, y0 - h * 0.78, x + w * 0.90, y0 - h * 0.55,
      x + w, y0 - h * 0.55, x + w, y0];
  }
  if (st === 1) {              // gothic cathedral spire + corner needles
    return [x, y0, x, y0 - h * 0.70,
      x + w * 0.06, y0 - h * 0.70, x + w * 0.13, y0 - h * 0.87, x + w * 0.20, y0 - h * 0.70,
      x + w * 0.35, y0 - h * 0.70, x + w * 0.50, T, x + w * 0.65, y0 - h * 0.70,
      x + w * 0.80, y0 - h * 0.70, x + w * 0.87, y0 - h * 0.87, x + w * 0.94, y0 - h * 0.70,
      x + w, y0 - h * 0.70, x + w, y0];
  }
  if (st === 2) {              // slab tower with an overhanging cornice
    return [x, y0, x, y0 - h * 0.95, x - w * 0.06, y0 - h * 0.95,
      x - w * 0.06, T, x + w * 1.06, T, x + w * 1.06, y0 - h * 0.95,
      x + w, y0 - h * 0.95, x + w, y0];
  }
  if (st === 3) {              // clock tower, pitched roof with eaves
    return [x, y0, x, y0 - h * 0.78, x - w * 0.12, y0 - h * 0.78,
      x + w * 0.50, T, x + w * 1.12, y0 - h * 0.78, x + w, y0 - h * 0.78, x + w, y0];
  }
  // st === 4 : twin gothic peaks over a lower nave
  return [x, y0, x, y0 - h * 0.84, x + w * 0.16, T, x + w * 0.32, y0 - h * 0.84,
    x + w * 0.32, y0 - h * 0.60, x + w * 0.68, y0 - h * 0.60,
    x + w * 0.68, y0 - h * 0.84, x + w * 0.84, T, x + w, y0 - h * 0.84, x + w, y0];
}

// lit-window field, drawn clipped to the silhouette
function ENV_windows(ctx, i, x, y0, w, h, tier, t) {
  const cw = tier === 2 ? 5 : (tier === 1 ? 3.6 : 2.6);
  const ch = tier === 2 ? 7 : (tier === 1 ? 5 : 3.4);
  const gx = tier === 2 ? 13 : (tier === 1 ? 9.5 : 7);
  const gy = tier === 2 ? 16 : (tier === 1 ? 12 : 8.5);
  const cols = Math.max(1, Math.floor(w / gx));
  const rows = Math.max(1, Math.floor(h / gy));
  const ox = x + (w - (cols - 1) * gx - cw) * 0.5;
  const density = tier === 2 ? 0.42 : (tier === 1 ? 0.30 : 0.20);
  const baseA = tier === 2 ? 0.95 : (tier === 1 ? 0.68 : 0.40);

  ctx.fillStyle = PAL.bldgWin;
  for (let r = 0; r < rows; r++) {
    const wy = y0 - 10 - r * gy;
    if (wy < y0 - h) break;
    for (let c = 0; c < cols; c++) {
      const k = i * 911 + r * 57 + c * 7;
      const v = ENV_rnd(k);
      if (v > density) continue;
      let a = baseA * (0.55 + ENV_rnd2(k, 3) * 0.45);
      const fl = ENV_rnd2(k, 21);
      if (fl > 0.86) {          // a few bad ballasts flickering
        const s = Math.sin(t * (7 + fl * 9) + k);
        a *= s > 0.25 ? 1 : (s > -0.1 ? 0.30 : 0.06);
      }
      ctx.globalAlpha = a;
      // slight hue split: some windows cold fluorescent
      ctx.fillStyle = ENV_rnd2(k, 31) > 0.82 ? '#bfd6ff' : PAL.bldgWin;
      ctx.fillRect(ox + c * gx, wy, cw, ch);
      if (tier === 2 && a > 0.6) {
        ctx.globalAlpha = a * 0.14;
        ctx.fillRect(ox + c * gx - 2.5, wy - 2.5, cw + 5, ch + 5);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function ENV_roofDetail(ctx, i, x, y0, w, h, st, tier, t, fill, edge, L) {
  const T = y0 - h;
  ctx.fillStyle = fill;
  // antenna mast + aircraft warning light on tall slabs and spires
  if (st === 2 || st === 0) {
    const mh = 14 + ENV_rnd2(i, 41) * (tier === 2 ? 42 : 26);
    const mx = x + w * (0.25 + ENV_rnd2(i, 43) * 0.5);
    ctx.fillRect(mx - 0.9, T - mh, 1.8, mh);
    ctx.fillRect(mx - 4, T - mh * 0.55, 8, 1.2);
    ctx.fillRect(mx - 2.6, T - mh * 0.78, 5.2, 1.1);
    const blink = Math.sin(t * 2.1 + i * 1.31);
    if (blink > 0.55) {
      const bi = (blink - 0.55) / 0.45;
      ENV_puff(ctx, 'redlamp', mx, T - mh - 1, 9, 9, [
        [0, 'rgba(224,59,59,0.85)'], [0.4, 'rgba(200,40,40,0.30)'], [1, 'rgba(180,30,30,0)']
      ], bi * (tier === 0 ? 0.5 : 0.9));
      ctx.fillStyle = PAL.danger;
      ctx.globalAlpha = 0.5 + bi * 0.5;
      ctx.fillRect(mx - 1.2, T - mh - 2.4, 2.4, 2.4);
      ctx.globalAlpha = 1;
      ctx.fillStyle = fill;
    }
  }
  // water tower on the wider mid/near slabs
  if ((st === 2 || st === 0) && tier > 0 && ENV_rnd2(i, 47) > 0.55) {
    const tw = tier === 2 ? 20 : 13;
    const th = tier === 2 ? 16 : 10;
    const tx = x + w * (ENV_rnd2(i, 53) > 0.5 ? 0.68 : 0.16);
    const ty = T;
    ctx.fillRect(tx + tw * 0.12, ty - 4, 2, 4);
    ctx.fillRect(tx + tw * 0.80, ty - 4, 2, 4);
    ENV_poly(ctx, [tx, ty - 4, tx + tw * 0.10, ty - 4 - th, tx + tw * 0.90, ty - 4 - th, tx + tw, ty - 4]);
    ctx.fill();
    ENV_poly(ctx, [tx + tw * 0.10, ty - 4 - th, tx + tw * 0.5, ty - 4 - th * 1.5, tx + tw * 0.90, ty - 4 - th]);
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.globalAlpha = 0.35 + L * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx, ty - 4 - th * 0.55);
    ctx.lineTo(tx + tw, ty - 4 - th * 0.55);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // clock face
  if (st === 3 && tier > 0) {
    const cx = x + w * 0.5, cy = y0 - h * 0.66, r = Math.min(w * 0.22, 13);
    ctx.globalAlpha = 0.9;
    ENV_puff(ctx, 'clockGlow', cx, cy, r * 3.2, r * 3.2, [
      [0, 'rgba(245,197,24,0.34)'], [0.5, 'rgba(220,170,40,0.10)'], [1, 'rgba(200,160,50,0)']
    ], 0.9);
    ctx.fillStyle = 'rgba(244,224,150,0.92)';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0d0b16';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.stroke();
    // hands: slow, deterministic
    const hh = t * 0.10, mm = t * 0.55;
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(hh - Math.PI / 2) * r * 0.45, cy + Math.sin(hh - Math.PI / 2) * r * 0.45);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(mm - Math.PI / 2) * r * 0.74, cy + Math.sin(mm - Math.PI / 2) * r * 0.74);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = fill;
  }
  // flying buttresses on the cathedral / twin-peak forms
  if (st === 4 && tier === 2) {
    ctx.strokeStyle = fill;
    ctx.lineWidth = 4;
    for (let s = 0; s < 2; s++) {
      const sx = s === 0 ? x + w * 0.10 : x + w * 0.90;
      const dir = s === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(sx, y0 - h * 0.52);
      ctx.quadraticCurveTo(sx + dir * w * 0.18, y0 - h * 0.30, sx + dir * w * 0.20, y0);
      ctx.stroke();
      ctx.strokeStyle = edge;
      ctx.globalAlpha = 0.20 + L * 0.6;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = fill;
      ctx.lineWidth = 4;
    }
  }
  ctx.globalAlpha = 1;
}

function ENV_layer(ctx, camX, t, L, tier) {
  // tier 0 = far, 1 = mid, 2 = near
  const factor = tier === 0 ? 0.08 : (tier === 1 ? 0.22 : 0.45);
  const slot = tier === 0 ? 78 : (tier === 1 ? 116 : 168);
  const baseY = tier === 0 ? 398 : (tier === 1 ? 424 : 462);
  const minH = tier === 0 ? 70 : (tier === 1 ? 110 : 150);
  const maxH = tier === 0 ? 190 : (tier === 1 ? 265 : 330);
  const seed = tier * 1000 + 17;
  const body = tier === 0 ? PAL.bldgFar : (tier === 1 ? PAL.bldgMid : PAL.bldgNear);
  const bodyTop = tier === 0 ? '#171b35' : (tier === 1 ? '#232848' : '#2c3159');
  const bodyBot = tier === 0 ? '#090b1a' : (tier === 1 ? '#0e1126' : '#121533');
  const rimCol = tier === 0 ? 'rgba(120,140,200,' : (tier === 1 ? 'rgba(140,160,215,' : 'rgba(165,185,235,');

  const off = camX * factor;
  const i0 = Math.floor(off / slot) - 2;
  const i1 = i0 + Math.ceil(CW / slot) + 4;

  ctx.save();
  for (let i = i0; i <= i1; i++) {
    const r0 = ENV_rnd(i + seed);
    const r1 = ENV_rnd2(i + seed, 3);
    const r2 = ENV_rnd2(i + seed, 9);
    const w = slot * (0.62 + r1 * 0.42);
    const x = Math.round(i * slot - off + (slot - w) * 0.5 + (r2 - 0.5) * slot * 0.12);
    if (x > CW + 60 || x + w < -60) continue;
    const h = Math.round(minH + r0 * (maxH - minH));
    const st = Math.floor(ENV_rnd2(i + seed, 13) * 5) % 5;
    const pts = ENV_silhouette(x, baseY, w, h, st);

    // ---- body: vertical gradient (cached per tier + quantised height) --
    const hk = Math.round(h / 16) * 16;
    const gk = 'b' + tier + '_' + hk;
    const c = ENV_cache(ctx);
    let bg = c.lin[gk];
    if (!bg) {
      bg = ctx.createLinearGradient(0, baseY - hk, 0, baseY);
      bg.addColorStop(0, bodyTop);
      bg.addColorStop(0.30, body);
      bg.addColorStop(1, bodyBot);
      c.lin[gk] = bg;
    }
    ENV_poly(ctx, pts);
    ctx.fillStyle = bg;
    ctx.fill();

    // ---- interior shading + window field, clipped to the silhouette ----
    ctx.save();
    ctx.clip();
    // one side falls away into shadow
    const sk = 's' + tier + '_' + Math.round(w / 12) * 12;
    let sg = c.lin[sk];
    if (!sg) {
      sg = ctx.createLinearGradient(0, 0, Math.round(w / 12) * 12 || 12, 0);
      sg.addColorStop(0, 'rgba(120,140,200,0.10)');
      sg.addColorStop(0.22, 'rgba(0,0,0,0)');
      sg.addColorStop(1, 'rgba(0,0,0,0.42)');
      c.lin[sk] = sg;
    }
    ctx.save();
    ctx.translate(x, 0);
    ctx.fillStyle = sg;
    ctx.fillRect(0, baseY - h - 60, w + 2, h + 62);
    ctx.restore();

    // faint floor banding on the front layers
    if (tier > 0) {
      ctx.globalAlpha = tier === 2 ? 0.16 : 0.10;
      ctx.fillStyle = '#000000';
      const step = tier === 2 ? 16 : 12;
      for (let yy = baseY - 6; yy > baseY - h; yy -= step) ctx.fillRect(x - 4, yy, w + 8, 1);
      ctx.globalAlpha = 1;
    }
    ENV_windows(ctx, i + seed, x, baseY, w, h, tier, t);
    ctx.restore();

    // ---- edge rim light ------------------------------------------------
    ENV_poly(ctx, pts);
    ctx.strokeStyle = rimCol + (0.10 + L * 0.75).toFixed(3) + ')';
    ctx.lineWidth = tier === 2 ? 1.6 : 1.1;
    ctx.stroke();
    if (L > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(200,220,255,' + (L * 0.55).toFixed(3) + ')';
      ctx.lineWidth = tier === 2 ? 2.6 : 1.8;
      ctx.stroke();
      ctx.restore();
    }

    ENV_roofDetail(ctx, i + seed, x, baseY, w, h, st, tier, t, bodyBot, rimCol + '0.5)', L);
  }

  // ---- haze sitting on top of the layer, pushing it back ---------------
  const hz = tier === 0 ? 0.40 : (tier === 1 ? 0.26 : 0.13);
  const hk2 = 'haze' + tier;
  let hg = ENV_cache(ctx).lin[hk2];
  if (!hg) {
    hg = ctx.createLinearGradient(0, baseY - maxH, 0, baseY + 20);
    hg.addColorStop(0, 'rgba(46,32,74,0)');
    hg.addColorStop(0.55, 'rgba(62,42,86,' + (hz * 0.55).toFixed(3) + ')');
    hg.addColorStop(1, 'rgba(150,84,52,' + hz.toFixed(3) + ')');
    ENV_cache(ctx).lin[hk2] = hg;
  }
  ctx.fillStyle = hg;
  ctx.fillRect(0, baseY - maxH, CW, maxH + 20);

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

function drawGothamSkyline(ctx, camX, t, lightning) {
  const L = lightning || 0;
  ctx.save();
  ENV_layer(ctx, camX, t, L, 0);
  ENV_layer(ctx, camX, t, L, 1);
  ENV_layer(ctx, camX, t, L, 2);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  SMOG BANDS
// =====================================================================
function drawCityFog(ctx, camX, t) {
  ctx.save();
  const stops = [
    [0, 'rgba(132,110,150,0.42)'], [0.4, 'rgba(104,84,126,0.22)'],
    [0.75, 'rgba(80,64,104,0.07)'], [1, 'rgba(70,56,96,0)']
  ];
  const warm = [
    [0, 'rgba(198,124,70,0.30)'], [0.45, 'rgba(160,96,58,0.14)'], [1, 'rgba(130,78,50,0)']
  ];
  const span = 1500;
  for (let i = 0; i < 14; i++) {
    const drift = t * (5 + ENV_rnd(i) * 16) - camX * 0.6 * (0.5 + ENV_rnd2(i, 3) * 0.6);
    let x = ((ENV_rnd2(i, 7) * span) + drift) % span;
    if (x < 0) x += span;
    x -= 270;
    if (x > CW + 300) continue;
    const y = 388 + ENV_rnd2(i, 11) * 106 + Math.sin(t * 0.4 + i * 1.7) * 5;
    const rx = 150 + ENV_rnd2(i, 13) * 210;
    const ry = 11 + ENV_rnd2(i, 17) * 20;
    const a = 0.16 + ENV_rnd2(i, 19) * 0.26;
    ENV_puff(ctx, i % 3 === 0 ? 'fogWarm' : 'fogCool', x, y, rx, ry,
      i % 3 === 0 ? warm : stops, a);
    ENV_puff(ctx, i % 3 === 0 ? 'fogWarm' : 'fogCool', x + rx * 0.5, y + ry * 0.7,
      rx * 0.6, ry * 0.75, i % 3 === 0 ? warm : stops, a * 0.62);
  }
  // a settled ground-level sheet
  const sheet = ENV_linear(ctx, 'fogSheet', 0, 400, 0, 520, [
    [0, 'rgba(120,100,142,0)'], [0.45, 'rgba(118,96,140,0.15)'], [1, 'rgba(96,76,120,0.05)']
  ]);
  ctx.fillStyle = sheet;
  ctx.fillRect(0, 400, CW, 120);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  VIGNETTE
// =====================================================================
function drawForegroundVignette(ctx, lightning) {
  const L = lightning || 0;
  ctx.save();
  const c = ENV_cache(ctx);
  let vg = c.lin['vig'];
  if (!vg) {
    vg = ctx.createRadialGradient(CW * 0.5, CH * 0.46, CH * 0.24, CW * 0.5, CH * 0.5, CW * 0.74);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.52, 'rgba(4,4,12,0.14)');
    vg.addColorStop(0.80, 'rgba(3,3,10,0.42)');
    vg.addColorStop(1, 'rgba(2,2,8,0.72)');
    c.lin['vig'] = vg;
  }
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CW, CH);

  const wash = ENV_linear(ctx, 'wash', 0, 0, 0, CH, [
    [0, 'rgba(126,147,201,0.13)'], [0.30, 'rgba(110,130,185,0.05)'],
    [0.68, 'rgba(20,18,40,0.06)'], [1, 'rgba(8,6,20,0.26)']
  ]);
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, CW, CH);

  if (L > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(150,175,230,' + (L * 0.14).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}


// ═══ TILES ═══════════════════════════════════════
// ============================================================================
// TL_ -- level tiles, blocks and pickups. Canvas2D only, no assets.
// Light direction: upper-left. Top/left faces lit, bottom/right faces shaded.
// ============================================================================

function TL_rnd(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function TL_rnd2(n, k) { const s = Math.sin(n * 269.5 + k * 183.3 + 78.233) * 43758.5453; return s - Math.floor(s); }

const TL_gcache = Object.create(null);
// key -> gradient factory result. Gradients are created at origin (0,0) and the
// caller translates, so they can be reused across every tile of the same size.
function TL_grad(ctx, key, x0, y0, x1, y1, stops) {
  let g = TL_gcache[key];
  if (g) return g;
  g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  TL_gcache[key] = g;
  return g;
}
function TL_rgrad(ctx, key, x0, y0, r0, x1, y1, r1, stops) {
  let g = TL_gcache[key];
  if (g) return g;
  g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
  for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  TL_gcache[key] = g;
  return g;
}

function TL_roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, rr); return; }
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function TL_clearFx(ctx) { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1; }

// --- the canonical bat emblem, drawn into a box of width w centred on (cx,cy) ---
function TL_batPath(ctx, cx, cy, w) {
  const u = w / 100, X = (a) => cx + a * u, Y = (b) => cy + b * u;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(-16));
  ctx.bezierCurveTo(X(6), Y(-26), X(14), Y(-30), X(20), Y(-24));
  ctx.bezierCurveTo(X(22), Y(-14), X(30), Y(-14), X(38), Y(-20));
  ctx.bezierCurveTo(X(46), Y(-26), X(52), Y(-22), X(50), Y(-8));
  ctx.bezierCurveTo(X(49), Y(0), X(46), Y(6), X(40), Y(10));
  ctx.bezierCurveTo(X(34), Y(6), X(30), Y(10), X(31), Y(18));
  ctx.bezierCurveTo(X(24), Y(12), X(16), Y(12), X(11), Y(18));
  ctx.bezierCurveTo(X(8), Y(24), X(4), Y(28), X(0), Y(30));
  ctx.bezierCurveTo(X(-4), Y(28), X(-8), Y(24), X(-11), Y(18));
  ctx.bezierCurveTo(X(-16), Y(12), X(-24), Y(12), X(-31), Y(18));
  ctx.bezierCurveTo(X(-30), Y(10), X(-34), Y(6), X(-40), Y(10));
  ctx.bezierCurveTo(X(-46), Y(6), X(-49), Y(0), X(-50), Y(-8));
  ctx.bezierCurveTo(X(-52), Y(-22), X(-46), Y(-26), X(-38), Y(-20));
  ctx.bezierCurveTo(X(-30), Y(-14), X(-22), Y(-14), X(-20), Y(-24));
  ctx.bezierCurveTo(X(-14), Y(-30), X(-6), Y(-26), X(0), Y(-16));
  ctx.closePath();
}

// ============================================================================
// GROUND
// ============================================================================
function drawGroundTile(ctx, x, y, s, o) {
  const top = !!(o && o.top), idx = (o && o.idx) | 0;
  ctx.save();
  ctx.translate(x, y);

  // base body gradient (lit at top-left, deep at bottom-right)
  ctx.fillStyle = TL_grad(ctx, 'gnd' + s, 0, 0, s * 0.7, s, [
    [0, PAL.stoneL], [0.35, PAL.stone], [1, PAL.stoneD]
  ]);
  ctx.fillRect(0, 0, s, s);

  // mortar wash so cobbles read as inset
  ctx.fillStyle = PAL.mortar;
  ctx.globalAlpha = 0.55; ctx.fillRect(0, 0, s, s); ctx.globalAlpha = 1;

  // irregular cobble courses -- 3 rows, offset per row by hash
  const rows = 3, rh = s / rows;
  // one clip for every cobble + the grain pass (cheaper than clipping per stone)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();
  ctx.lineWidth = 1;
  for (let r = 0; r < rows; r++) {
    const off = TL_rnd2(idx, r) * s;
    const cols = 2 + ((TL_rnd2(idx + 7, r) * 2) | 0);
    const cw = s / cols;
    for (let c = -1; c <= cols; c++) {
      const h = TL_rnd2(idx * 3 + c, r * 5);
      let bx = c * cw + (off % cw) - cw;
      let by = r * rh;
      let bw = cw - 1.5 - h * 1.2, bh = rh - 1.6;
      if (bx + bw < 0 || bx > s) continue;
      const lum = 0.75 + h * 0.5 - (r * 0.08) - (by / s) * 0.25;
      const rr = Math.max(10, Math.min(70, 58 * lum));
      const gg = Math.max(8, Math.min(66, 52 * lum));
      const bb = Math.max(16, Math.min(96, 84 * lum));
      TL_roundRect(ctx, bx, by, bw, bh, 2.2);
      ctx.fillStyle = 'rgb(' + (rr | 0) + ',' + (gg | 0) + ',' + (bb | 0) + ')';
      ctx.fill();
      // per-stone bevel: light top-left edge
      ctx.strokeStyle = 'rgba(140,150,190,' + (0.10 + h * 0.18).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(bx + 1, by + bh - 1.5); ctx.lineTo(bx + 1, by + 1.5); ctx.lineTo(bx + bw - 1.5, by + 1);
      ctx.stroke();
      // dark bottom-right
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.moveTo(bx + bw - 1, by + 1.5); ctx.lineTo(bx + bw - 1, by + bh - 1); ctx.lineTo(bx + 1.5, by + bh - 1);
      ctx.stroke();
    }
  }

  // speckled grain (same clip)
  for (let i = 0; i < 22; i++) {
    const px = TL_rnd2(idx * 11 + i, 1) * s;
    const py = TL_rnd2(idx * 11 + i, 2) * s;
    const a = TL_rnd2(idx * 11 + i, 3);
    ctx.fillStyle = a > 0.5 ? 'rgba(190,200,235,0.13)' : 'rgba(0,0,0,0.30)';
    ctx.fillRect(px, py, 1 + (a > 0.85 ? 1 : 0), 1);
  }
  ctx.restore();

  // vertical ambient occlusion toward the bottom
  ctx.fillStyle = TL_grad(ctx, 'gndao' + s, 0, s * 0.45, 0, s, [
    [0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.42)']
  ]);
  ctx.fillRect(0, 0, s, s);

  if (top) {
    // damp sheen: wet reflective band along the exposed surface
    ctx.fillStyle = TL_grad(ctx, 'gndwet' + s, 0, 0, 0, s * 0.5, [
      [0, 'rgba(150,175,235,0.30)'], [0.35, 'rgba(110,135,200,0.10)'], [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(0, 0, s, s * 0.5);
    // bright top lip
    ctx.fillStyle = 'rgba(205,218,255,0.55)';
    ctx.fillRect(0, 0, s, 1.5);
    ctx.fillStyle = 'rgba(140,158,205,0.32)';
    ctx.fillRect(0, 1.5, s, 1);
    // dark inner shadow just under the lip
    ctx.fillStyle = TL_grad(ctx, 'gndlip' + s, 0, 2.5, 0, 9, [
      [0, 'rgba(0,0,0,0.55)'], [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(0, 2.5, s, 7);
    // a couple of moss/dew glints keyed to idx
    for (let i = 0; i < 3; i++) {
      const gx = TL_rnd2(idx + i * 31, 9) * s;
      ctx.globalAlpha = 0.35 + TL_rnd2(idx + i, 4) * 0.3;
      ctx.fillStyle = PAL.rain;
      ctx.fillRect(gx, 2 + TL_rnd2(idx + i, 5) * 3, 1, 1);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, s, 2);
  }

  // tile seam (right/bottom) for course separation
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(s - 1, 0, 1, s);
  ctx.fillRect(0, s - 1, s, 1);

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// STONE BLOCK
// ============================================================================
function drawStoneBlock(ctx, x, y, s, idx) {
  idx = idx | 0;
  ctx.save();
  ctx.translate(x, y);

  // drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fillRect(2.5, 3, s, s);

  // body
  ctx.fillStyle = TL_grad(ctx, 'stb' + s, 0, 0, s, s, [
    [0, '#5a5379'], [0.45, PAL.stone], [1, '#221d36']
  ]);
  ctx.fillRect(0, 0, s, s);

  // grain speckle
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();
  for (let i = 0; i < 16; i++) {
    const px = TL_rnd2(idx * 5 + i, 11) * s, py = TL_rnd2(idx * 5 + i, 12) * s;
    ctx.fillStyle = TL_rnd2(i, idx) > 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.25)';
    ctx.fillRect(px, py, 1.5, 1.5);
  }
  ctx.restore();

  const bev = Math.max(2.5, s * 0.11);
  // lit top face
  ctx.fillStyle = 'rgba(150,160,205,0.40)';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(s, 0); ctx.lineTo(s - bev, bev); ctx.lineTo(bev, bev); ctx.closePath(); ctx.fill();
  // lit left face
  ctx.fillStyle = 'rgba(120,132,180,0.28)';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(bev, bev); ctx.lineTo(bev, s - bev); ctx.lineTo(0, s); ctx.closePath(); ctx.fill();
  // shaded right face
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath();
  ctx.moveTo(s, 0); ctx.lineTo(s, s); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s - bev, bev); ctx.closePath(); ctx.fill();
  // shaded bottom face
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.moveTo(0, s); ctx.lineTo(bev, s - bev); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s, s); ctx.closePath(); ctx.fill();

  // chiselled cross groove on the inner face
  const c = s / 2;
  ctx.lineWidth = Math.max(1.5, s * 0.055);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.moveTo(bev + 2, c); ctx.lineTo(s - bev - 2, c);
  ctx.moveTo(c, bev + 2); ctx.lineTo(c, s - bev - 2);
  ctx.stroke();
  // groove highlight on the lower-right wall of the cut
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(160,170,215,0.30)';
  ctx.beginPath();
  ctx.moveTo(bev + 2, c + ctx.lineWidth + 1.2); ctx.lineTo(s - bev - 2, c + ctx.lineWidth + 1.2);
  ctx.moveTo(c + ctx.lineWidth + 1.2, bev + 2); ctx.lineTo(c + ctx.lineWidth + 1.2, s - bev - 2);
  ctx.stroke();

  // corner rivets
  const rr = Math.max(1.4, s * 0.055), inset = bev + rr + 0.5;
  for (let i = 0; i < 4; i++) {
    const rx = (i & 1) ? s - inset : inset;
    const ry = (i & 2) ? s - inset : inset;
    ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2);
    ctx.fillStyle = '#1b1830'; ctx.fill();
    ctx.beginPath(); ctx.arc(rx - rr * 0.28, ry - rr * 0.3, rr * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(170,180,220,0.55)'; ctx.fill();
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BRICK BLOCK
// ============================================================================
function drawBrickBlock(ctx, x, y, s, idx) {
  idx = idx | 0;
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(2.5, 3, s, s);

  // mortar bed
  ctx.fillStyle = TL_grad(ctx, 'brkm' + s, 0, 0, 0, s, [[0, '#2a1c2c'], [1, '#150e1a']]);
  ctx.fillRect(0, 0, s, s);

  const rows = 4, rh = s / rows;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();
  for (let r = 0; r < rows; r++) {
    const stagger = (r % 2) ? -s * 0.25 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = c * (s / 2) + stagger + 0.8;
      const by = r * rh + 0.8;
      const bw = s / 2 - 1.6, bh = rh - 1.6;
      if (bx > s || bx + bw < 0) continue;
      const h = TL_rnd2(idx * 13 + c, r);
      const lum = 0.8 + h * 0.45 - r * 0.06;
      const cr = Math.min(150, 108 * lum) | 0;
      const cg = Math.min(70, 40 * lum) | 0;
      const cb = Math.min(110, 66 * lum) | 0;
      // crumbling: nibble a corner off some bricks
      ctx.beginPath();
      const nib = h > 0.72 ? bh * 0.35 : 0;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + bw - nib, by);
      if (nib) ctx.lineTo(bx + bw, by + nib); else ctx.lineTo(bx + bw, by);
      ctx.lineTo(bx + bw, by + bh);
      ctx.lineTo(bx + (h > 0.45 ? bh * 0.2 : 0), by + bh);
      ctx.closePath();
      ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
      ctx.fill();
      // top lit edge
      ctx.fillStyle = 'rgba(255,190,175,0.16)';
      ctx.fillRect(bx, by, bw - nib, 1.2);
      ctx.fillStyle = 'rgba(255,190,175,0.10)';
      ctx.fillRect(bx, by, 1.2, bh);
      // bottom/right shade
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(bx, by + bh - 1.4, bw, 1.4);
      ctx.fillRect(bx + bw - 1.4, by + nib, 1.4, bh - nib);
      // pitting
      for (let p = 0; p < 3; p++) {
        const px = bx + TL_rnd2(idx + c * 3 + p, r * 7) * bw;
        const py = by + TL_rnd2(idx + c * 5 + p, r * 3) * bh;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(px, py, 1.2, 1.2);
      }
    }
  }

  // hairline cracks
  ctx.strokeStyle = 'rgba(0,0,0,0.62)'; ctx.lineWidth = 1;
  const ncr = 1 + (TL_rnd(idx) > 0.55 ? 1 : 0);
  for (let k = 0; k < ncr; k++) {
    let cx0 = TL_rnd2(idx, k * 3) * s, cy0 = 0;
    ctx.beginPath(); ctx.moveTo(cx0, cy0);
    for (let seg = 1; seg <= 5; seg++) {
      cx0 += (TL_rnd2(idx * 2 + seg, k) - 0.5) * s * 0.35;
      cy0 += s / 5;
      ctx.lineTo(cx0, cy0);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,170,190,0.12)';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.62)';
  }
  ctx.restore();

  // overall AO + rim
  ctx.fillStyle = TL_grad(ctx, 'brkao' + s, 0, 0, s, s, [
    [0, 'rgba(255,220,200,0.10)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.45)']
  ]);
  ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SIGNAL BLOCK (question block)
// ============================================================================
function drawBatSignalBlock(ctx, x, y, s, used, t) {
  ctx.save();
  ctx.translate(x, y);
  const c = s / 2, bev = Math.max(2.5, s * 0.12);

  if (!used) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 2.6);
    // outward glow
    ctx.globalAlpha = 0.30 + pulse * 0.30;
    ctx.fillStyle = TL_rgrad(ctx, 'bsglow' + s, c, c, s * 0.34, c, c, s * 1.15, [
      [0, 'rgba(245,197,24,0.85)'], [0.5, 'rgba(220,150,20,0.25)'], [1, 'rgba(245,197,24,0)']
    ]);
    ctx.fillRect(-s * 0.7, -s * 0.7, s * 2.4, s * 2.4);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(2.5, 3, s, s);

  if (used) {
    ctx.fillStyle = TL_grad(ctx, 'bsu' + s, 0, 0, s, s, [
      [0, '#4a4363'], [0.5, '#332d4c'], [1, '#1c172e']
    ]);
    ctx.fillRect(0, 0, s, s);
  } else {
    ctx.fillStyle = TL_grad(ctx, 'bsb' + s, 0, 0, s * 0.6, s, [
      [0, '#ffe89a'], [0.28, PAL.yellow], [0.72, PAL.yellowD], [1, '#6d5205']
    ]);
    ctx.fillRect(0, 0, s, s);
  }

  // bevels
  ctx.fillStyle = used ? 'rgba(150,158,200,0.22)' : 'rgba(255,248,210,0.60)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s, 0); ctx.lineTo(s - bev, bev); ctx.lineTo(bev, bev); ctx.closePath(); ctx.fill();
  ctx.fillStyle = used ? 'rgba(150,158,200,0.13)' : 'rgba(255,240,180,0.36)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(bev, bev); ctx.lineTo(bev, s - bev); ctx.lineTo(0, s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(s, s); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s - bev, bev); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.52)';
  ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(bev, s - bev); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s, s); ctx.closePath(); ctx.fill();

  // inset dark medallion
  const mr = s * 0.30;
  ctx.beginPath(); ctx.arc(c, c, mr, 0, Math.PI * 2);
  ctx.fillStyle = used
    ? TL_grad(ctx, 'bsmu' + s, 0, c - mr, 0, c + mr, [[0, '#24203a'], [1, '#3a3352']])
    : TL_grad(ctx, 'bsm' + s, 0, c - mr, 0, c + mr, [[0, '#1a1406'], [1, '#3d2e08']]);
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = used ? 'rgba(120,128,168,0.35)' : 'rgba(255,236,160,0.55)';
  ctx.beginPath(); ctx.arc(c, c, mr, Math.PI * 0.85, Math.PI * 1.95); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(c, c, mr, Math.PI * 1.95, Math.PI * 0.85); ctx.stroke();

  // emblem
  if (used) {
    ctx.globalAlpha = 0.5;
    TL_batPath(ctx, c, c + s * 0.01, s * 0.44);
    ctx.fillStyle = '#2b2542'; ctx.fill();
    ctx.globalAlpha = 0.35;
    TL_batPath(ctx, c, c + s * 0.01 - 0.8, s * 0.44);
    ctx.strokeStyle = 'rgba(150,158,200,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.shadowColor = 'rgba(255,215,90,0.9)'; ctx.shadowBlur = s * 0.22;
    TL_batPath(ctx, c, c + s * 0.01, s * 0.46);
    ctx.fillStyle = TL_grad(ctx, 'bsem' + s, 0, c - s * 0.2, 0, c + s * 0.2, [
      [0, '#fff2b8'], [0.55, PAL.yellow], [1, '#b8860a']
    ]);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,230,0.55)'; ctx.lineWidth = 0.7; ctx.stroke();

    // sweeping specular glint across the whole block face
    const sw = ((t * 0.55) % 1.6) - 0.3; // 0..1.3 with pause
    if (sw > -0.05 && sw < 1.1) {
      ctx.save();
      ctx.beginPath(); ctx.rect(bev * 0.5, bev * 0.5, s - bev, s - bev); ctx.clip();
      const gx = sw * s * 1.6 - s * 0.3;
      ctx.translate(gx, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = TL_grad(ctx, 'bsgl' + s, -s * 0.22, 0, s * 0.22, 0, [
        [0, 'rgba(255,255,255,0)'], [0.5, 'rgba(255,255,255,0.85)'], [1, 'rgba(255,255,255,0)']
      ]);
      ctx.beginPath();
      ctx.moveTo(-s * 0.25, -s * 0.2); ctx.lineTo(s * 0.05, -s * 0.2);
      ctx.lineTo(s * 0.25, s * 1.2); ctx.lineTo(-s * 0.05, s * 1.2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // corner studs
    ctx.fillStyle = 'rgba(90,66,8,0.9)';
    const si = bev + 2;
    for (let i = 0; i < 4; i++) {
      const sx = (i & 1) ? s - si : si, sy = (i & 2) ? s - si : si;
      ctx.beginPath(); ctx.arc(sx, sy, s * 0.035, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);
  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// GARGOYLE (the "pipe")
// ============================================================================
function drawGargoyle(ctx, x, y, w, h, t) {
  ctx.save();
  ctx.translate(x, y);

  const colTop = Math.min(h * 0.42, h - 8);
  const ch = h - colTop;

  // ---- column ----
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(w * 0.10 + 4, colTop + 5, w * 0.80, ch);

  ctx.fillStyle = TL_grad(ctx, 'ggcol' + Math.round(w), w * 0.08, 0, w * 0.95, 0, [
    [0, '#453e60'], [0.22, PAL.stoneL], [0.55, PAL.stone], [1, '#1a1530']
  ]);
  ctx.fillRect(w * 0.10, colTop, w * 0.80, ch);

  // fluting
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const fx = w * 0.10 + (w * 0.80) * (i / 4);
    ctx.beginPath(); ctx.moveTo(fx, colTop + 6); ctx.lineTo(fx, h); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,160,205,0.16)';
    ctx.beginPath(); ctx.moveTo(fx + 1.2, colTop + 6); ctx.lineTo(fx + 1.2, h); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  }
  // weathering streaks
  ctx.save();
  ctx.beginPath(); ctx.rect(w * 0.10, colTop, w * 0.80, ch); ctx.clip();
  for (let i = 0; i < 9; i++) {
    const sx = w * 0.12 + TL_rnd(i * 3 + 1) * w * 0.76;
    const sl = ch * (0.25 + TL_rnd(i * 5) * 0.7);
    ctx.globalAlpha = 0.10 + TL_rnd(i * 7) * 0.16;
    ctx.fillStyle = TL_grad(ctx, 'ggstr' + Math.round(colTop), 0, colTop, 0, colTop + ch, [
      [0, 'rgba(20,16,34,0.9)'], [1, 'rgba(20,16,34,0)']
    ]);
    ctx.fillRect(sx, colTop + 4, 1 + TL_rnd(i) * 2.5, sl);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ledge / capital
  const lw = w * 1.0, lx = (w - lw) / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(lx + 3, colTop + 4, lw, 10);
  ctx.fillStyle = TL_grad(ctx, 'ggledge' + Math.round(w), 0, colTop - 6, 0, colTop + 12, [
    [0, '#5e567d'], [0.4, PAL.stone], [1, '#201a36']
  ]);
  ctx.fillRect(lx, colTop - 6, lw, 14);
  ctx.fillStyle = 'rgba(200,210,250,0.35)';
  ctx.fillRect(lx, colTop - 6, lw, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(lx, colTop + 6.5, lw, 1.5);

  // ---- body (hunched) ----
  const bx = w / 2, by = colTop - 6;
  const bodyH = colTop - 6;
  const bodyW = w * 0.62;
  const gk = Math.round(bodyW) + '_' + Math.round(bodyH);

  ctx.save();
  ctx.translate(bx, by);

  // wings behind, folded
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.save();
    ctx.scale(sgn, 1);
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.12, -bodyH * 0.72);
    ctx.bezierCurveTo(bodyW * 0.85, -bodyH * 0.95, bodyW * 1.05, -bodyH * 0.45, bodyW * 0.72, -bodyH * 0.05);
    ctx.bezierCurveTo(bodyW * 0.62, -bodyH * 0.18, bodyW * 0.52, -bodyH * 0.10, bodyW * 0.46, -bodyH * 0.22);
    ctx.bezierCurveTo(bodyW * 0.40, -bodyH * 0.12, bodyW * 0.30, -bodyH * 0.14, bodyW * 0.24, -bodyH * 0.30);
    ctx.bezierCurveTo(bodyW * 0.18, -bodyH * 0.42, bodyW * 0.14, -bodyH * 0.58, bodyW * 0.12, -bodyH * 0.72);
    ctx.closePath();
    ctx.fillStyle = sgn < 0
      ? TL_grad(ctx, 'ggwl'+gk, 0, -bodyH, 0, 0, [[0, '#4a4368'], [1, '#191430']])
      : TL_grad(ctx, 'ggwr'+gk, 0, -bodyH, 0, 0, [[0, '#332d4c'], [1, '#120e24']]);
    ctx.fill();
    // wing ribs
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(bodyW * 0.14, -bodyH * (0.66 - k * 0.04));
      ctx.quadraticCurveTo(bodyW * 0.5, -bodyH * (0.5 - k * 0.14), bodyW * (0.30 + k * 0.16), -bodyH * (0.20 - k * 0.05));
      ctx.stroke();
    }
    // rim light only on left wing
    if (sgn < 0) {
      ctx.strokeStyle = 'rgba(175,190,240,0.40)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bodyW * 0.12, -bodyH * 0.72);
      ctx.bezierCurveTo(bodyW * 0.85, -bodyH * 0.95, bodyW * 1.05, -bodyH * 0.45, bodyW * 0.72, -bodyH * 0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  // torso
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.34, 0);
  ctx.bezierCurveTo(-bodyW * 0.42, -bodyH * 0.34, -bodyW * 0.36, -bodyH * 0.58, -bodyW * 0.18, -bodyH * 0.66);
  ctx.lineTo(bodyW * 0.18, -bodyH * 0.66);
  ctx.bezierCurveTo(bodyW * 0.36, -bodyH * 0.58, bodyW * 0.42, -bodyH * 0.34, bodyW * 0.34, 0);
  ctx.closePath();
  ctx.fillStyle = TL_grad(ctx, 'ggtor'+gk, -bodyW * 0.4, -bodyH * 0.6, bodyW * 0.4, 0, [
    [0, '#5b5379'], [0.45, PAL.stone], [1, '#1e1936']
  ]);
  ctx.fill();
  // chest shading + rim
  ctx.strokeStyle = 'rgba(190,202,248,0.30)'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.34, 0);
  ctx.bezierCurveTo(-bodyW * 0.42, -bodyH * 0.34, -bodyW * 0.36, -bodyH * 0.58, -bodyW * 0.18, -bodyH * 0.66);
  ctx.stroke();

  // head
  const hy = -bodyH * 0.76, hr = bodyW * 0.27;
  ctx.beginPath();
  ctx.ellipse(0, hy, hr, hr * 0.92, 0, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'gghead'+gk, -hr, hy - hr, hr, hy + hr, [
    [0, '#6a6289'], [0.5, PAL.stone], [1, '#1c1733']
  ]);
  ctx.fill();
  // snout
  ctx.beginPath();
  ctx.moveTo(-hr * 0.5, hy + hr * 0.18);
  ctx.quadraticCurveTo(0, hy + hr * 1.15, hr * 0.5, hy + hr * 0.18);
  ctx.closePath();
  ctx.fillStyle = '#2a2442'; ctx.fill();
  // fangs
  ctx.fillStyle = 'rgba(225,230,250,0.75)';
  ctx.beginPath(); ctx.moveTo(-hr * 0.22, hy + hr * 0.62); ctx.lineTo(-hr * 0.08, hy + hr * 0.60); ctx.lineTo(-hr * 0.16, hy + hr * 0.92); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hr * 0.22, hy + hr * 0.62); ctx.lineTo(hr * 0.08, hy + hr * 0.60); ctx.lineTo(hr * 0.16, hy + hr * 0.92); ctx.closePath(); ctx.fill();
  // horns
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.beginPath();
    ctx.moveTo(sgn * hr * 0.55, hy - hr * 0.45);
    ctx.quadraticCurveTo(sgn * hr * 1.25, hy - hr * 1.15, sgn * hr * 1.5, hy - hr * 2.0);
    ctx.quadraticCurveTo(sgn * hr * 0.95, hy - hr * 1.10, sgn * hr * 0.28, hy - hr * 0.78);
    ctx.closePath();
    ctx.fillStyle = sgn < 0 ? '#514a70' : '#2c2645';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
  }
  // ember eyes -- flicker deterministically on t
  const flick = 0.62 + 0.38 * Math.sin(t * 7.3) * Math.sin(t * 2.1 + 1.3);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    const ex = sgn * hr * 0.40, ey = hy - hr * 0.05;
    ctx.globalAlpha = 0.30 + flick * 0.45;
    ctx.fillStyle = TL_rgrad(ctx, 'ggeye', 0, 0, 0, 0, 0, 10, [
      [0, 'rgba(255,150,40,1)'], [0.4, 'rgba(230,70,20,0.5)'], [1, 'rgba(180,40,10,0)']
    ]);
    ctx.save(); ctx.translate(ex, ey); ctx.scale(hr * 0.42, hr * 0.42);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 0.7 + flick * 0.3;
    ctx.fillStyle = '#ffd0a0';
    ctx.beginPath(); ctx.ellipse(ex, ey, hr * 0.15, hr * 0.11, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // clawed feet gripping the ledge
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    ctx.save(); ctx.scale(sgn, 1);
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.10, -bodyH * 0.12);
    ctx.quadraticCurveTo(bodyW * 0.46, -bodyH * 0.10, bodyW * 0.50, bodyH * 0.02);
    ctx.quadraticCurveTo(bodyW * 0.30, bodyH * 0.06, bodyW * 0.10, bodyH * 0.02);
    ctx.closePath();
    ctx.fillStyle = sgn < 0 ? '#4d466b' : '#2b2543';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const cxk = bodyW * (0.18 + k * 0.13);
      ctx.beginPath();
      ctx.moveTo(cxk, bodyH * 0.01);
      ctx.quadraticCurveTo(cxk + bodyW * 0.05, bodyH * 0.10, cxk - bodyW * 0.01, bodyH * 0.13);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore(); // body transform

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BEACON (level goal)
// ============================================================================
function drawBeacon(ctx, x, y, s, t, reached) {
  ctx.save();
  ctx.translate(x, y);
  const baseH = s * 0.55, baseW = s * 1.05;
  const dishCx = 0, dishCy = -s * 0.82, dishR = s * 0.52;
  const boost = reached ? 1 : 0;

  // ---------- volumetric cone (drawn first, behind hardware) ----------
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const sweep = Math.sin(t * 0.45) * (reached ? 0.10 : 0.22);
  const spread = (reached ? 3.1 : 1.9) * s;
  const reach = CH * 1.25;
  ctx.translate(dishCx, dishCy);
  ctx.rotate(sweep);

  const coneG = TL_rgrad(ctx, 'bcone' + (reached ? 'R' : 'N'), 0, 0, 0, 0, 0, reach, [
    [0, reached ? 'rgba(255,248,220,0.95)' : 'rgba(230,238,255,0.62)'],
    [0.18, reached ? 'rgba(250,225,150,0.45)' : 'rgba(170,196,255,0.26)'],
    [0.55, reached ? 'rgba(200,170,90,0.16)' : 'rgba(110,138,210,0.09)'],
    [1, 'rgba(60,80,150,0)']
  ]);
  ctx.fillStyle = coneG;
  ctx.beginPath();
  ctx.moveTo(-s * 0.30, 0);
  ctx.lineTo(-spread, -reach);
  ctx.lineTo(spread, -reach);
  ctx.lineTo(s * 0.30, 0);
  ctx.closePath();
  ctx.fill();

  // inner hot core
  ctx.globalAlpha = 0.55 + 0.35 * boost + 0.10 * Math.sin(t * 3.1);
  ctx.fillStyle = TL_grad(ctx, 'bcore', 0, 0, 0, -reach * 0.75, [
    [0, 'rgba(255,255,255,0.75)'], [0.4, 'rgba(210,225,255,0.20)'], [1, 'rgba(200,220,255,0)']
  ]);
  ctx.beginPath();
  ctx.moveTo(-s * 0.14, 0); ctx.lineTo(-spread * 0.42, -reach); ctx.lineTo(spread * 0.42, -reach); ctx.lineTo(s * 0.14, 0);
  ctx.closePath(); ctx.fill();

  // god-ray striations
  ctx.globalAlpha = 0.16 + boost * 0.14;
  for (let i = 0; i < 7; i++) {
    const f = (i / 7) - 0.5 + Math.sin(t * 0.5 + i) * 0.03;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.5)' : 'rgba(160,190,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(f * s * 0.30, 0);
    ctx.lineTo(f * spread - s * 0.06, -reach);
    ctx.lineTo(f * spread + s * 0.10, -reach);
    ctx.closePath(); ctx.fill();
  }

  // projected bat emblem inside the beam
  const projY = -s * (4.0 + Math.sin(t * 0.7) * 0.25);
  const projW = s * (2.5 + boost * 0.8);
  ctx.globalAlpha = 0.34 + boost * 0.34 + 0.07 * Math.sin(t * 2.0);
  ctx.shadowColor = reached ? 'rgba(255,235,160,0.9)' : 'rgba(190,210,255,0.8)';
  ctx.shadowBlur = s * 0.7;
  TL_batPath(ctx, 0, projY, projW);
  ctx.fillStyle = reached ? 'rgba(255,246,205,0.85)' : 'rgba(225,236,255,0.75)';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = reached ? 'rgba(255,255,230,0.9)' : 'rgba(255,255,255,0.6)';
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;

  // ---------- base ----------
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 2, baseW * 0.58, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = TL_grad(ctx, 'bbase' + Math.round(s), -baseW / 2, 0, baseW / 2, 0, [
    [0, '#3b3f55'], [0.25, '#2a2d40'], [0.6, '#1a1c2b'], [1, '#0c0d16']
  ]);
  TL_roundRect(ctx, -baseW / 2, -baseH, baseW, baseH, s * 0.06);
  ctx.fill();
  // top lit lip
  ctx.fillStyle = 'rgba(160,175,225,0.30)';
  ctx.fillRect(-baseW / 2, -baseH, baseW, 2);
  // rivets
  ctx.fillStyle = '#0a0b12';
  for (let i = 0; i < 6; i++) {
    const rx = -baseW * 0.42 + (baseW * 0.84) * (i / 5);
    for (let r = 0; r < 2; r++) {
      const ry = -baseH + s * 0.10 + r * s * 0.26;
      ctx.beginPath(); ctx.arc(rx, ry, s * 0.026, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(170,185,235,0.40)';
      ctx.beginPath(); ctx.arc(rx - s * 0.008, ry - s * 0.010, s * 0.016, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0b12';
    }
  }
  // yoke arms
  ctx.strokeStyle = '#22253a'; ctx.lineWidth = s * 0.09;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-baseW * 0.30, -baseH + 2); ctx.lineTo(-dishR * 0.82, dishCy + dishR * 0.35);
  ctx.moveTo(baseW * 0.30, -baseH + 2); ctx.lineTo(dishR * 0.82, dishCy + dishR * 0.35);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,165,215,0.22)'; ctx.lineWidth = s * 0.02;
  ctx.beginPath();
  ctx.moveTo(-baseW * 0.30 - s * 0.03, -baseH + 2); ctx.lineTo(-dishR * 0.86, dishCy + dishR * 0.35);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // ---------- lens dish ----------
  ctx.save();
  ctx.translate(dishCx, dishCy);
  // housing shell
  ctx.beginPath(); ctx.arc(0, 0, dishR * 1.16, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'bhouse' + Math.round(s), -dishR, -dishR, dishR, dishR, [
    [0, '#454a63'], [0.4, '#262a3c'], [1, '#0d0f18']
  ]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(170,185,235,0.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, dishR * 1.16, Math.PI * 0.8, Math.PI * 1.85); ctx.stroke();

  // lens
  ctx.beginPath(); ctx.arc(0, 0, dishR, 0, Math.PI * 2);
  ctx.fillStyle = TL_rgrad(ctx, 'blens' + (reached ? 'R' : 'N') + Math.round(s),
    -dishR * 0.3, -dishR * 0.3, dishR * 0.05, 0, 0, dishR, [
      [0, reached ? '#ffffff' : '#e9f0ff'],
      [0.35, reached ? '#ffeeb0' : '#9fb6ee'],
      [0.72, reached ? '#c79a2a' : '#41508a'],
      [1, '#131728']
    ]);
  ctx.fill();

  // lattice grille
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, dishR * 0.98, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(10,12,22,0.72)'; ctx.lineWidth = Math.max(1, s * 0.028);
  for (let i = -4; i <= 4; i++) {
    const p = i * dishR * 0.24;
    ctx.beginPath(); ctx.moveTo(p, -dishR); ctx.lineTo(p, dishR); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-dishR, p); ctx.lineTo(dishR, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(200,215,255,0.16)'; ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    const p = i * dishR * 0.24 - Math.max(1, s * 0.028) * 0.6;
    ctx.beginPath(); ctx.moveTo(p, -dishR); ctx.lineTo(p, dishR); ctx.stroke();
  }
  // bat emblem cut into the lens
  ctx.globalAlpha = 0.85;
  TL_batPath(ctx, 0, dishR * 0.04, dishR * 1.5);
  ctx.fillStyle = 'rgba(8,10,20,0.90)'; ctx.fill();
  ctx.restore();

  // lens rim + hotspot
  ctx.strokeStyle = 'rgba(20,22,36,0.9)'; ctx.lineWidth = Math.max(2, s * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, dishR, 0, Math.PI * 2); ctx.stroke();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.45 + boost * 0.4;
  ctx.fillStyle = TL_rgrad(ctx, 'bhot' + Math.round(s), 0, 0, 0, 0, 0, dishR * 2.1, [
    [0, reached ? 'rgba(255,250,225,0.95)' : 'rgba(215,232,255,0.7)'],
    [0.45, 'rgba(150,180,255,0.18)'], [1, 'rgba(120,150,255,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, dishR * 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BATARANG (coin)
// ============================================================================
function drawBatarang(ctx, cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // motion arc trailing the spin
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 1; k <= 3; k++) {
    ctx.globalAlpha = 0.16 / k;
    ctx.strokeStyle = k === 1 ? 'rgba(255,235,170,0.9)' : 'rgba(180,200,255,0.8)';
    ctx.lineWidth = r * (0.18 / k);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, angle - 1.5 - k * 0.35, angle - 0.12 - k * 0.1);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  ctx.rotate(angle);
  // foreshorten as it spins so it reads as a flat object turning
  const sx = Math.max(0.14, Math.abs(Math.cos(angle * 0.9)) * 0.82 + 0.18);
  ctx.scale(1, 1);

  const blade = (dir) => {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.12);
    ctx.bezierCurveTo(dir * r * 0.35, -r * 0.62, dir * r * 0.86, -r * 0.72, dir * r * 1.02, -r * 0.30);
    ctx.bezierCurveTo(dir * r * 0.80, -r * 0.34, dir * r * 0.58, -r * 0.16, dir * r * 0.46, r * 0.12);
    ctx.bezierCurveTo(dir * r * 0.30, r * 0.02, dir * r * 0.14, r * 0.04, 0, r * 0.30);
    ctx.closePath();
  };

  ctx.save();
  ctx.scale(sx, 1);

  // soft shadow under the metal
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = r * 0.35;
  ctx.shadowOffsetY = r * 0.12;

  const metal = TL_grad(ctx, 'btrg' + Math.round(r), -r, -r, r, r, [
    [0, '#fdf6d8'], [0.18, '#e8d089'], [0.42, '#9a8a5e'], [0.58, '#5b5540'],
    [0.76, '#c9b073'], [1, '#3c3728']
  ]);

  for (let d = -1; d <= 1; d += 2) {
    blade(d);
    ctx.fillStyle = metal;
    ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // darker underside wash on the lower-right of the pair
  ctx.save();
  for (let d = -1; d <= 1; d += 2) blade(d);
  ctx.fillStyle = TL_grad(ctx, 'btrgsh' + Math.round(r), -r * 0.3, -r * 0.3, r, r * 0.6, [
    [0, 'rgba(255,255,255,0.10)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.45)']
  ]);
  ctx.fill();
  ctx.restore();

  // bright leading-edge specular
  ctx.strokeStyle = 'rgba(255,252,225,0.92)';
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.lineJoin = 'round';
  for (let d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.12);
    ctx.bezierCurveTo(d * r * 0.35, -r * 0.62, d * r * 0.86, -r * 0.72, d * r * 1.02, -r * 0.30);
    ctx.stroke();
  }
  // shadowed trailing edge
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.05);
  for (let d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.moveTo(d * r * 0.46, r * 0.12);
    ctx.bezierCurveTo(d * r * 0.30, r * 0.02, d * r * 0.14, r * 0.04, 0, r * 0.30);
    ctx.stroke();
  }

  // central hub
  ctx.beginPath(); ctx.arc(0, -r * 0.06, r * 0.17, 0, Math.PI * 2);
  ctx.fillStyle = '#14121c'; ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.05, -r * 0.11, r * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,240,190,0.6)'; ctx.fill();
  ctx.restore();

  // travelling glint across the blades
  const gl = (Math.sin(angle * 2.0) + 1) * 0.5;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30 + gl * 0.55;
  ctx.fillStyle = TL_rgrad(ctx, 'btglint', 0, 0, 0, 0, 0, 12, [
    [0, 'rgba(255,255,245,1)'], [0.4, 'rgba(255,230,150,0.35)'], [1, 'rgba(255,220,120,0)']
  ]);
  ctx.save();
  ctx.translate((gl - 0.5) * r * 1.6 * sx, -r * 0.34);
  ctx.scale(r * 0.055, r * 0.055);
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SUIT PICKUP
// ============================================================================
function drawBatSuitPickup(ctx, x, y, s, t) {
  ctx.save();
  const bob = Math.sin(t * 2.2) * s * 0.07;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.0);
  ctx.translate(x + s / 2, y + s / 2 + bob);

  // crimson energy aura
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.28 + pulse * 0.32;
  ctx.fillStyle = TL_rgrad(ctx, 'bsaura' + Math.round(s), 0, 0, s * 0.18, 0, 0, s * 1.05, [
    [0, 'rgba(255,120,110,0.85)'], [0.45, 'rgba(224,59,59,0.32)'], [1, 'rgba(160,20,30,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 1.05, 0, Math.PI * 2); ctx.fill();
  // rising energy motes
  for (let i = 0; i < 6; i++) {
    const ph = (t * 0.55 + TL_rnd(i * 17)) % 1;
    const mx = (TL_rnd(i * 5 + 3) - 0.5) * s * 0.85;
    const my = s * 0.5 - ph * s * 1.15;
    ctx.globalAlpha = (1 - ph) * 0.55;
    ctx.fillStyle = PAL.danger;
    ctx.beginPath(); ctx.arc(mx, my, s * 0.035 * (1 - ph * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // ground-contact shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, s * 0.62 - bob, s * 0.34, s * 0.07, 0, 0, Math.PI * 2); ctx.fill();

  // ---- armored chest plate ----
  const pw = s * 0.72, ph2 = s * 0.78;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.5, -ph2 * 0.46);
  ctx.quadraticCurveTo(-pw * 0.30, -ph2 * 0.56, 0, -ph2 * 0.50);
  ctx.quadraticCurveTo(pw * 0.30, -ph2 * 0.56, pw * 0.5, -ph2 * 0.46);
  ctx.lineTo(pw * 0.44, ph2 * 0.18);
  ctx.quadraticCurveTo(pw * 0.36, ph2 * 0.46, 0, ph2 * 0.54);
  ctx.quadraticCurveTo(-pw * 0.36, ph2 * 0.46, -pw * 0.44, ph2 * 0.18);
  ctx.closePath();
  ctx.fillStyle = TL_grad(ctx, 'bsplate' + Math.round(s), -pw * 0.5, -ph2 * 0.5, pw * 0.5, ph2 * 0.5, [
    [0, PAL.batHi], [0.35, PAL.bat], [1, PAL.batLo]
  ]);
  ctx.fill();
  // rim light upper-left
  ctx.strokeStyle = 'rgba(180,196,245,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.44, ph2 * 0.10);
  ctx.lineTo(-pw * 0.5, -ph2 * 0.46);
  ctx.quadraticCurveTo(-pw * 0.30, -ph2 * 0.56, 0, -ph2 * 0.50);
  ctx.stroke();
  // dark inner shade on the right
  ctx.fillStyle = TL_grad(ctx, 'bsplsh' + Math.round(s), 0, 0, pw * 0.5, ph2 * 0.4, [
    [0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.5)']
  ]);
  ctx.fill();

  // armor plate seams
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(-pw * 0.40, -ph2 * 0.16); ctx.quadraticCurveTo(0, -ph2 * 0.06, pw * 0.40, -ph2 * 0.16);
  ctx.moveTo(-pw * 0.34, ph2 * 0.12); ctx.quadraticCurveTo(0, ph2 * 0.24, pw * 0.34, ph2 * 0.12);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,165,215,0.20)';
  ctx.beginPath();
  ctx.moveTo(-pw * 0.40, -ph2 * 0.16 + 1.3); ctx.quadraticCurveTo(0, -ph2 * 0.06 + 1.3, pw * 0.40, -ph2 * 0.16 + 1.3);
  ctx.stroke();

  // yellow oval emblem
  ctx.beginPath();
  ctx.ellipse(0, -ph2 * 0.10, pw * 0.34, ph2 * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'bsoval' + Math.round(s), 0, -ph2 * 0.34, 0, ph2 * 0.14, [
    [0, '#fff0a8'], [0.5, PAL.yellow], [1, PAL.yellowD]
  ]);
  ctx.shadowColor = 'rgba(245,197,24,0.75)'; ctx.shadowBlur = s * 0.18;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(120,88,6,0.7)'; ctx.lineWidth = 1; ctx.stroke();

  TL_batPath(ctx, 0, -ph2 * 0.10, pw * 0.62);
  ctx.fillStyle = PAL.batLo; ctx.fill();

  // glass specular sweep over the emblem
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -ph2 * 0.10, pw * 0.34, ph2 * 0.24, 0, 0, Math.PI * 2); ctx.clip();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  ctx.ellipse(-pw * 0.10, -ph2 * 0.20, pw * 0.20, ph2 * 0.07, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SIGNAL STAR (invincibility)
// ============================================================================
function drawBatSignalStar(ctx, x, y, s, t) {
  ctx.save();
  const bob = Math.sin(t * 2.6) * s * 0.06;
  ctx.translate(x + s / 2, y + s / 2 + bob);
  const pulse = 0.5 + 0.5 * Math.sin(t * 4.2);

  // additive halo
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.45 + pulse * 0.35;
  ctx.fillStyle = TL_rgrad(ctx, 'bsthalo' + Math.round(s), 0, 0, s * 0.10, 0, 0, s * 1.15, [
    [0, 'rgba(255,255,225,0.95)'], [0.25, 'rgba(255,215,90,0.50)'],
    [0.6, 'rgba(230,160,20,0.16)'], [1, 'rgba(255,190,40,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 1.15, 0, Math.PI * 2); ctx.fill();

  // rotating starburst rays -- two counter-rotating sets
  for (let set = 0; set < 2; set++) {
    const n = set === 0 ? 8 : 12;
    const rot = t * (set === 0 ? 0.9 : -0.55);
    const len = s * (set === 0 ? 1.05 : 0.78) * (0.86 + pulse * 0.18);
    const wdt = set === 0 ? 0.085 : 0.045;
    ctx.globalAlpha = set === 0 ? 0.55 + pulse * 0.3 : 0.30 + pulse * 0.2;
    ctx.fillStyle = TL_grad(ctx, 'bstray' + set + Math.round(s), 0, 0, len, 0, [
      [0, 'rgba(255,255,235,0.95)'], [0.35, 'rgba(255,208,80,0.45)'], [1, 'rgba(255,180,30,0)']
    ]);
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const lm = len * (0.7 + 0.3 * TL_rnd(i + set * 31));
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(s * 0.16, 0);
      ctx.lineTo(lm, -s * wdt * 0.45);
      ctx.lineTo(lm, s * wdt * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // long lens-flare cross
  ctx.globalAlpha = 0.5 + pulse * 0.4;
  ctx.fillStyle = TL_grad(ctx, 'bstflare' + Math.round(s), -s * 1.5, 0, s * 1.5, 0, [
    [0, 'rgba(255,220,120,0)'], [0.42, 'rgba(255,245,200,0.75)'],
    [0.5, 'rgba(255,255,255,0.95)'], [0.58, 'rgba(255,245,200,0.75)'], [1, 'rgba(255,220,120,0)']
  ]);
  ctx.fillRect(-s * 1.5, -s * 0.022, s * 3, s * 0.044);
  ctx.save(); ctx.rotate(Math.PI / 2);
  ctx.fillRect(-s * 1.5, -s * 0.018, s * 3, s * 0.036);
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;

  // spinning medallion
  const spin = t * 1.7;
  const sq = Math.abs(Math.cos(spin)) * 0.85 + 0.15;
  ctx.save();
  ctx.scale(sq, 1);
  const dr = s * 0.32;
  ctx.beginPath(); ctx.arc(0, 0, dr, 0, Math.PI * 2);
  ctx.fillStyle = TL_rgrad(ctx, 'bstdisc' + Math.round(s), -dr * 0.35, -dr * 0.35, dr * 0.05, 0, 0, dr, [
    [0, '#fffbe0'], [0.4, PAL.yellow], [0.8, PAL.yellowD], [1, '#5d4506']
  ]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,210,0.8)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, dr, Math.PI * 0.85, Math.PI * 1.9); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,66,6,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, dr, Math.PI * 1.9, Math.PI * 0.85); ctx.stroke();

  TL_batPath(ctx, 0, 0, dr * 1.35);
  ctx.fillStyle = '#16121f'; ctx.fill();
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = 'rgba(255,235,150,0.8)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // hot centre dot
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.fillStyle = TL_rgrad(ctx, 'bstcore' + Math.round(s), 0, 0, 0, 0, 0, s * 0.22, [
    [0, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,220,120,0)']
  ]);
  ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  TL_clearFx(ctx);
  ctx.restore();
}


// ═══ FX ═══════════════════════════════════════
// ============================================================================
// fx.js -- particles, weather, lightning, camera feel.  Module prefix: FX_
// Batman / Arkham-flavoured atmospherics, 100% canvas primitives.
// ============================================================================

const FX_MAX_PARTICLES = 400;
const FX_TAU = Math.PI * 2;

// ---- deterministic pseudo-random ------------------------------------------
function FX_rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function FX_rnd2(n, k) {
  const s = Math.sin(n * 269.5 + k * 183.3 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}
// signed -1..1
function FX_srnd(n, k) { return FX_rnd2(n, k) * 2 - 1; }

function FX_clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function FX_lerp(a, b, t) { return a + (b - a) * t; }

// module-level gradient cache (keyed by string) -- gradients are screen-space
// radial/linear built at origin then translated, so they can be reused freely.
const FX_gradCache = Object.create(null);
function FX_radial(ctx, key, r, stops) {
  let g = FX_gradCache[key];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    FX_gradCache[key] = g;
  }
  return g;
}
function FX_linear(ctx, key, x0, y0, x1, y1, stops) {
  let g = FX_gradCache[key];
  if (!g) {
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    FX_gradCache[key] = g;
  }
  return g;
}

function FX_roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

// color helpers -------------------------------------------------------------
function FX_hex2rgb(hex) {
  if (typeof hex !== 'string' || hex.charAt(0) !== '#') return [255, 255, 255];
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function FX_rgba(hex, a) {
  const c = FX_hex2rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function FX_shade(hex, amt) { // amt -1..1
  const c = FX_hex2rgb(hex);
  const f = amt < 0 ? (1 + amt) : 1;
  const add = amt > 0 ? 255 * amt : 0;
  const r = FX_clamp(Math.round(c[0] * f + add), 0, 255);
  const g = FX_clamp(Math.round(c[1] * f + add), 0, 255);
  const b = FX_clamp(Math.round(c[2] * f + add), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ============================================================================
// ParticleSystem
// ============================================================================
class ParticleSystem {
  constructor() {
    this.parts = [];
    this.seed = 0;          // deterministic spawn counter
    this.time = 0;
  }

  clear() { this.parts.length = 0; }

  // internal: push with cap. Oldest non-score particles are evicted first.
  FX_push(p) {
    const arr = this.parts;
    if (arr.length >= FX_MAX_PARTICLES) {
      let idx = -1;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i].kind !== 'score') { idx = i; break; }
      }
      if (idx < 0) idx = 0;
      arr.splice(idx, 1);
    }
    arr.push(p);
  }

  FX_mk(kind, x, y, vx, vy, life, size, color) {
    return {
      kind: kind, x: x, y: y, vx: vx, vy: vy,
      life: life, maxLife: life, size: size, size0: size,
      rot: 0, vrot: 0, grav: 260, drag: 1.6, color: color || PAL.stoneL,
      alpha: 1, spin: 0, text: null, glow: 0, seed: 0
    };
  }

  // -- stomp: dust ring + bright impact shards -------------------------------
  spawnStomp(x, y) {
    const s = ++this.seed;
    // flat expanding shock ring
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.32, 6, PAL.eye);
    ring.grav = 0; ring.glow = 1;
    this.FX_push(ring);
    const ring2 = this.FX_mk('ring', x, y, 0, 0, 0.5, 2, PAL.yellow);
    ring2.grav = 0; ring2.glow = 1;
    this.FX_push(ring2);

    // dust puffs low and wide
    for (let i = 0; i < 12; i++) {
      const a = Math.PI + (i / 11) * Math.PI + FX_srnd(s, i) * 0.22;
      const sp = 60 + FX_rnd2(s, i + 40) * 130;
      const p = this.FX_mk('dust', x + FX_srnd(s, i + 7) * 6, y + FX_srnd(s, i + 9) * 3,
        Math.cos(a) * sp, Math.sin(a) * sp * 0.55 - 20,
        0.45 + FX_rnd2(s, i + 3) * 0.4, 5 + FX_rnd2(s, i + 11) * 7, PAL.stoneL);
      p.grav = 130; p.drag = 2.6;
      p.vrot = FX_srnd(s, i + 17) * 3;
      this.FX_push(p);
    }
    // hard shards flung upward
    for (let i = 0; i < 8; i++) {
      const a = -Math.PI * 0.5 + FX_srnd(s, i + 60) * 1.25;
      const sp = 150 + FX_rnd2(s, i + 70) * 190;
      const p = this.FX_mk('shard', x, y - 2, Math.cos(a) * sp, Math.sin(a) * sp,
        0.4 + FX_rnd2(s, i + 80) * 0.35, 2 + FX_rnd2(s, i + 90) * 3.5,
        i % 3 === 0 ? PAL.yellow : PAL.eye);
      p.grav = 620; p.drag = 0.5; p.vrot = FX_srnd(s, i + 100) * 12; p.glow = 1;
      this.FX_push(p);
    }
  }

  // -- landing puff ----------------------------------------------------------
  spawnLand(x, y) {
    const s = ++this.seed;
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1;
      const sp = 40 + FX_rnd2(s, i) * 90;
      const p = this.FX_mk('dust', x + side * (2 + FX_rnd2(s, i + 5) * 5), y,
        side * sp, -18 - FX_rnd2(s, i + 12) * 34,
        0.32 + FX_rnd2(s, i + 20) * 0.3, 4 + FX_rnd2(s, i + 25) * 5, PAL.stone);
      p.grav = 90; p.drag = 3.2; p.vrot = FX_srnd(s, i + 31) * 2.4;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.24, 4, PAL.stoneL);
    ring.grav = 0; ring.glow = 0.5;
    this.FX_push(ring);
  }

  // -- running scuff ---------------------------------------------------------
  spawnRunDust(x, y, dir) {
    const s = ++this.seed;
    const d = dir >= 0 ? 1 : -1;
    for (let i = 0; i < 2; i++) {
      const p = this.FX_mk('dust', x - d * (2 + FX_rnd2(s, i) * 4), y - FX_rnd2(s, i + 2) * 3,
        -d * (25 + FX_rnd2(s, i + 4) * 55), -14 - FX_rnd2(s, i + 6) * 26,
        0.28 + FX_rnd2(s, i + 8) * 0.24, 2.5 + FX_rnd2(s, i + 10) * 3.5, PAL.stone);
      p.grav = 70; p.drag = 3.6; p.vrot = FX_srnd(s, i + 13) * 3;
      this.FX_push(p);
    }
  }

  // -- block break: chunky rotating stone debris -----------------------------
  spawnBlockBreak(x, y) {
    const s = ++this.seed;
    const cols = [PAL.stone, PAL.stoneD, PAL.stoneL, PAL.mortar];
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI * 0.5 + FX_srnd(s, i) * 2.2;
      const sp = 110 + FX_rnd2(s, i + 20) * 230;
      const p = this.FX_mk('chunk',
        x + FX_srnd(s, i + 3) * 12, y + FX_srnd(s, i + 4) * 12,
        Math.cos(a) * sp, Math.sin(a) * sp - 60,
        0.7 + FX_rnd2(s, i + 30) * 0.6,
        4 + FX_rnd2(s, i + 40) * 8, cols[i & 3]);
      p.grav = 760; p.drag = 0.35;
      p.vrot = FX_srnd(s, i + 50) * 11;
      p.rot = FX_rnd2(s, i + 60) * FX_TAU;
      p.seed = i + s;
      this.FX_push(p);
    }
    // fine dust cloud left behind
    for (let i = 0; i < 8; i++) {
      const a = FX_rnd2(s, i + 90) * FX_TAU;
      const sp = 20 + FX_rnd2(s, i + 95) * 60;
      const p = this.FX_mk('dust', x, y, Math.cos(a) * sp, Math.sin(a) * sp - 30,
        0.6 + FX_rnd2(s, i + 99) * 0.5, 7 + FX_rnd2(s, i + 101) * 9, PAL.stoneD);
      p.grav = 30; p.drag = 2.0;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.3, 8, PAL.stoneL);
    ring.grav = 0; ring.glow = 0.6;
    this.FX_push(ring);
  }

  // -- pickup sparkle burst --------------------------------------------------
  spawnPickup(x, y, color) {
    const s = ++this.seed;
    const c = color || PAL.yellow;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * FX_TAU + FX_srnd(s, i) * 0.3;
      const sp = 90 + FX_rnd2(s, i + 15) * 160;
      const p = this.FX_mk('spark', x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.4 + FX_rnd2(s, i + 25) * 0.45, 1.6 + FX_rnd2(s, i + 35) * 2.6, c);
      p.grav = 210; p.drag = 2.2; p.glow = 1; p.vrot = FX_srnd(s, i + 45) * 8;
      this.FX_push(p);
    }
    // four long cross-flares
    for (let i = 0; i < 4; i++) {
      const p = this.FX_mk('flare', x, y, 0, 0, 0.3, 16 + i * 2, c);
      p.grav = 0; p.rot = (i / 4) * Math.PI; p.glow = 1;
      this.FX_push(p);
    }
    const ring = this.FX_mk('ring', x, y, 0, 0, 0.42, 3, c);
    ring.grav = 0; ring.glow = 1;
    this.FX_push(ring);
  }

  // -- floating score text ---------------------------------------------------
  spawnScore(x, y, value) {
    const p = this.FX_mk('score', x, y, 0, -54, 1.05, 15, PAL.yellow);
    p.grav = 26; p.drag = 0.6;
    p.text = (typeof value === 'string') ? value : ('+' + value);
    this.FX_push(p);
  }

  // -- bat afterimage --------------------------------------------------------
  spawnBatTrail(x, y) {
    const s = ++this.seed;
    const p = this.FX_mk('bat', x, y, FX_srnd(s, 1) * 18, -10 - FX_rnd2(s, 2) * 24,
      0.55 + FX_rnd2(s, 3) * 0.3, 7 + FX_rnd2(s, 4) * 5, PAL.bat);
    p.grav = -14; p.drag = 1.1;
    p.rot = FX_srnd(s, 5) * 0.5;
    p.vrot = FX_srnd(s, 6) * 1.6;
