    [0, '#03030a'], [0.35, '#15151f'], [0.62, '#2b2b3c'], [0.8, '#141420'], [1, '#04040a']
  ]);
  ctx.fill();

  // purple band
  ctx.fillStyle = EN_linGrad(ctx, 'phb', -cw, -ch * 0.34, cw, -ch * 0.10, [
    [0, '#3b1f63'], [0.45, PAL.joker], [0.7, PAL.jokerHi], [1, '#2a1247']
  ]);
  ctx.beginPath();
  ctx.moveTo(-cw * 0.985, -ch * 0.36);
  ctx.lineTo(cw * 0.985, -ch * 0.36);
  ctx.lineTo(cw, -ch * 0.06);
  ctx.lineTo(-cw, -ch * 0.06);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = '#c8a8f0';
  ctx.lineWidth = 0.6;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // brim
  EN_ellipse(ctx, 0, 2, bw, h * 0.025, 0);
  ctx.fillStyle = EN_linGrad(ctx, 'phbr', -bw, 0, bw, 4, [
    [0, '#04040a'], [0.5, '#23232f'], [1, '#04040a']
  ]);
  ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#7b88b4';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // crown rim light
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(face * cw * 0.94, -ch + 1);
  ctx.lineTo(face * cw * 0.99, 1);
  EN_rimStroke(ctx, '#aab8e4', 1.2, 0.55);
  ctx.restore();

  ctx.restore();
}

function EN_penguinMonocle(ctx, ex, ey, r, face, w, h, chainX, chainY) {
  ctx.save();
  // lens glass
  ctx.beginPath();
  ctx.arc(ex, ey, r, 0, Math.PI * 2);
  ctx.fillStyle = EN_radGrad(ctx, 'pmg', ex - r * 0.4, ey - r * 0.4, 0.1, ex, ey, r, [
    [0, 'rgba(230,245,255,0.42)'], [0.55, 'rgba(120,160,210,0.14)'], [1, 'rgba(60,80,130,0.22)']
  ]);
  ctx.fill();
  // gold rim
  ctx.strokeStyle = EN_linGrad(ctx, 'pmr', ex - r, ey - r, ex + r, ey + r, [
    [0, '#fff0a8'], [0.4, PAL.yellow], [0.75, PAL.yellowD], [1, '#6d5205']
  ]);
  ctx.lineWidth = Math.max(1, r * 0.28);
  ctx.stroke();
  // specular streak on glass
  ctx.globalAlpha = 0.65;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(ex, ey, r * 0.68, Math.PI * 0.95, Math.PI * 1.45);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // chain
  ctx.strokeStyle = PAL.yellowD;
  ctx.lineWidth = 0.7;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(ex + face * r * 0.9, ey + r * 0.5);
  ctx.quadraticCurveTo(ex + face * r * 1.6, ey + r * 3.0, chainX + face * w * 0.16, chainY);
  ctx.stroke();
  // chain glints
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = PAL.yellow;
  for (let i = 1; i <= 3; i++) {
    const u = i / 4;
    const px = (1 - u) * (1 - u) * (ex + face * r * 0.9) + 2 * (1 - u) * u * (ex + face * r * 1.6) + u * u * (chainX + face * w * 0.16);
    const py = (1 - u) * (1 - u) * (ey + r * 0.5) + 2 * (1 - u) * u * (ey + r * 3.0) + u * u * chainY;
    ctx.beginPath();
    ctx.arc(px, py, 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function EN_penguinUmbrella(ctx, ax, ay, w, h, dir, t) {
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(dir * 0.55 + Math.sin(t * 5.4) * 0.05);

  const L = h * 0.42;
  // shaft
  ctx.strokeStyle = EN_linGrad(ctx, 'pum', 0, -L * 0.5, 0, L * 0.5, [
    [0, '#5c4a33'], [0.5, '#8a6f4c'], [1, '#3a2d1e']
  ]);
  ctx.lineWidth = Math.max(1.2, w * 0.045);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -L * 0.45);
  ctx.lineTo(0, L * 0.45);
  ctx.stroke();

  // furled canopy
  ctx.beginPath();
  ctx.moveTo(0, -L * 0.42);
  ctx.quadraticCurveTo(w * 0.085, -L * 0.10, w * 0.045, L * 0.20);
  ctx.quadraticCurveTo(0, L * 0.30, -w * 0.045, L * 0.20);
  ctx.quadraticCurveTo(-w * 0.085, -L * 0.10, 0, -L * 0.42);
  ctx.closePath();
  ctx.fillStyle = EN_linGrad(ctx, 'pumc', -w * 0.09, -L * 0.4, w * 0.09, L * 0.25, [
    [0, '#1d1030'], [0.45, PAL.joker], [0.8, PAL.jokerHi], [1, '#221040']
  ]);
  ctx.fill();
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = '#cbb0f2';
  ctx.lineWidth = 0.7;
  ctx.stroke();
  ctx.globalAlpha = 1;
  // ribs
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = '#0d0618';
  ctx.lineWidth = 0.6;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(i * w * 0.02, -L * 0.38);
    ctx.quadraticCurveTo(i * w * 0.05, 0, i * w * 0.028, L * 0.20);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // crook handle
  ctx.strokeStyle = '#7d6344';
  ctx.lineWidth = Math.max(1.2, w * 0.045);
  ctx.beginPath();
  ctx.arc(-w * 0.055, L * 0.44, w * 0.055, -Math.PI * 0.1, Math.PI * 0.95);
  ctx.stroke();
  // tip
  ctx.fillStyle = PAL.yellow;
  ctx.beginPath();
  ctx.arc(0, -L * 0.46, Math.max(1, w * 0.028), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function EN_penguinShell(ctx, cx, baseY, w, h, t, face, spinning) {
  ctx.save();
  const R = Math.min(w * 0.48, h * 0.40);
  const cy = baseY - R * 0.84;
  const spin = spinning ? t * 14 * (face >= 0 ? 1 : -1) : 0;

  EN_groundShadow(ctx, cx, baseY + 1, R * 1.05, R * 0.30, spinning ? 0.62 : 0.5);

  // --- motion blur arcs + spark trail (behind dome) -----------------------
  if (spinning) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const rr = R * (1.06 + i * 0.12);
      const a0 = spin * 0.35 + i * 0.5;
      ctx.strokeStyle = i % 2 ? 'rgba(160,180,230,0.55)' : 'rgba(90,110,170,0.45)';
      ctx.lineWidth = 1.6 - i * 0.22;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, a0, a0 + 1.1 + i * 0.12);
      ctx.stroke();
    }
    // spark trail streaming opposite to travel
    for (let i = 0; i < 9; i++) {
      const ph = (t * 5 + i * 0.31) % 1;
      const sx = cx - face * (R * 0.9 + ph * R * 2.3);
      const sy = baseY - 1 - Math.sin(ph * Math.PI) * R * (0.25 + EN_rnd(i) * 0.5);
      ctx.globalAlpha = (1 - ph) * 0.75;
      ctx.fillStyle = i % 3 === 0 ? PAL.white : PAL.yellow;
      ctx.beginPath();
      ctx.arc(sx, sy, (1 - ph) * 1.7 + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // --- dark-steel dome -----------------------------------------------------
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI, Math.PI * 2);
  ctx.lineTo(cx + R, baseY - R * 0.06);
  ctx.quadraticCurveTo(cx, baseY + R * 0.10, cx - R, baseY - R * 0.06);
  ctx.closePath();
  const dg = EN_linGrad(ctx, 'psd', cx - R * 0.6, cy - R, cx + R * 0.8, baseY, [
    [0, '#454b60'], [0.22, '#2a2e3e'], [0.5, '#171a26'], [0.78, '#242938'], [1, '#0a0b12']
  ]);
  ctx.fillStyle = dg;
  ctx.fill();

  ctx.save();
  ctx.clip();

  // riveted bands (rotate with spin)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(spin * 0.25);
  ctx.translate(-cx, -cy);
  for (let b = 0; b < 3; b++) {
    const ry = cy - R * 0.55 + b * R * 0.52;
    ctx.fillStyle = EN_linGrad(ctx, 'psb' + b, cx, ry - R * 0.10, cx, ry + R * 0.10, [
      [0, '#5a627c'], [0.45, '#333a4d'], [1, '#14161f']
    ]);
    ctx.fillRect(cx - R * 1.1, ry - R * 0.11, R * 2.2, R * 0.22);
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#8f9ac2';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(cx - R * 1.1, ry - R * 0.11);
    ctx.lineTo(cx + R * 1.1, ry - R * 0.11);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // rivets around the dome, spinning
  const rivets = 10;
  for (let i = 0; i < rivets; i++) {
    const a = spin + (i / rivets) * Math.PI * 2;
    const rr = R * 0.66;
    const px = cx + Math.cos(a) * rr;
    const py = cy + Math.sin(a) * rr * 0.86;
    const depth = 0.45 + 0.55 * (0.5 + 0.5 * Math.cos(a - Math.PI * 0.75));
    // drawn at the origin so the cached gradient key stays constant while spinning
    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = depth;
    ctx.fillStyle = EN_radGrad(ctx, 'psrv' + (R | 0), -1, -1, 0.1, 0, 0, R * 0.11, [
      [0, '#c3cbe4'], [0.45, '#6d768f'], [1, '#1a1d28']
    ]);
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.085, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = depth * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-R * 0.03, -R * 0.03, R * 0.026, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // hat-brim ridge cast onto the dome (he is in there somewhere)
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#05050c';
  EN_ellipse(ctx, cx, cy + R * 0.86, R * 1.0, R * 0.18, 0);
  ctx.fill();
  ctx.globalAlpha = 1;

  // glossy specular highlight
  const spx = cx - R * 0.34, spy = cy - R * 0.44;
  ctx.fillStyle = EN_radGrad(ctx, 'pssp', spx, spy, 0.1, spx, spy, R * 0.62, [
    [0, 'rgba(255,255,255,0.55)'], [0.35, 'rgba(190,205,240,0.20)'], [1, 'rgba(255,255,255,0)']
  ]);
  EN_ellipse(ctx, spx, spy, R * 0.48, R * 0.30, -0.5);
  ctx.fill();

  // purple band echo of the top hat
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = PAL.jokerHi;
  ctx.lineWidth = Math.max(1.2, R * 0.10);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.86, Math.PI * 1.06, Math.PI * 1.94);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore(); // clip

  // dome outline + rim light on the facing edge
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI * 0.98, Math.PI * 2.02);
  ctx.strokeStyle = 'rgba(5,6,12,0.9)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(0.1, R - 0.6), face > 0 ? -Math.PI * 0.62 : Math.PI * 1.06,
    face > 0 ? -Math.PI * 0.02 : Math.PI * 1.66);
  EN_rimStroke(ctx, '#b9c8f2', 1.5, 0.7);
  ctx.restore();

  // gold monocle glint stuck on the shell rim (character tell)
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = PAL.yellow;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.arc(cx + face * R * 0.46, cy + R * 0.30, R * 0.17, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowColor = PAL.yellow;
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ============================================================================
// JOKER DRONE (flying) -- box ~30x26
// ============================================================================
function drawJokerDrone(ctx, x, y, w, h, o) {
  o = o || {};
  const t = o.animTime || 0;
  const face = o.facingRight === false ? -1 : 1;

  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));   // entity-local space (gradient cache)
  x = 0; y = 0;

  const sway = Math.sin(t * 2.4) * w * 0.10;
  const hover = Math.sin(t * 3.3) * h * 0.07;
  const cx = x + w * 0.5;
  const cy = y + h * 0.52 + hover;
  const bodyRx = w * 0.26, bodyRy = h * 0.34;

  // --- sway-offset ground shadow (far below, soft & faint) -----------------
  EN_groundShadow(ctx, cx + sway * 1.6, y + h + h * 0.75, w * 0.34, w * 0.10, 0.34);

  // --- green underglow -----------------------------------------------------
  // quantised so the pulse can be part of the gradient cache key (see EN_linGrad)
  const gl = EN_qz(0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 5.1)), 12);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = EN_radGrad(ctx, 'dgl' + gl, cx, cy + bodyRy * 0.78, 0.1, cx, cy + bodyRy * 0.78, w * 0.62, [
    [0, 'rgba(110,255,110,' + (0.40 * gl).toFixed(3) + ')'],
    [0.35, 'rgba(63,160,44,' + (0.24 * gl).toFixed(3) + ')'],
    [1, 'rgba(63,160,44,0)']
  ]);
  ctx.beginPath();
  ctx.arc(cx, cy + bodyRy * 0.78, w * 0.62, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- wings (behind body) --------------------------------------------------
  const flap = Math.sin(t * 11.5);
  for (let s = -1; s <= 1; s += 2) {
    EN_droneWing(ctx, cx, cy - bodyRy * 0.12, w, h, s, flap, t);
  }

  // --- propeller blur on top -----------------------------------------------
  EN_droneProp(ctx, cx, cy - bodyRy * 1.05, w, h, t);

  // --- balloon/mech body ----------------------------------------------------
  EN_ellipse(ctx, cx, cy, bodyRx, bodyRy, 0);
  const bgd = EN_radGrad(ctx, 'dbd', cx - bodyRx * 0.45, cy - bodyRy * 0.5, 0.1, cx, cy, bodyRx * 1.7, [
    [0, '#b48be0'], [0.30, PAL.jokerHi], [0.62, PAL.joker], [0.88, '#2c1450'], [1, '#140829']
  ]);
  ctx.fillStyle = bgd;
  ctx.fill();

  ctx.save();
  EN_ellipse(ctx, cx, cy, bodyRx, bodyRy, 0);
  ctx.clip();

  // plated seam bands
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#1a0c30';
  ctx.lineWidth = 1.1;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * bodyRx * 0.55, cy - bodyRy);
    ctx.quadraticCurveTo(cx + i * bodyRx * 0.78, cy, cx + i * bodyRx * 0.55, cy + bodyRy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // green glowing belly vent
  const vg = EN_linGrad(ctx, 'dvn' + gl, cx, cy + bodyRy * 0.20, cx, cy + bodyRy, [
    [0, 'rgba(63,160,44,0)'], [0.5, 'rgba(90,220,70,' + (0.55 * gl).toFixed(3) + ')'], [1, 'rgba(160,255,140,' + (0.85 * gl).toFixed(3) + ')']
  ]);
  ctx.fillStyle = vg;
  ctx.fillRect(cx - bodyRx, cy + bodyRy * 0.15, bodyRx * 2, bodyRy);
  // vent slats
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#0d2a08';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const vy = cy + bodyRy * (0.45 + i * 0.16);
    ctx.beginPath();
    ctx.moveTo(cx - bodyRx * 0.55, vy);
    ctx.lineTo(cx + bodyRx * 0.55, vy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // trailing-side shading
  ctx.fillStyle = EN_linGrad(ctx, 'dsh', cx - face * bodyRx, 0, cx + face * bodyRx, 0, [
    [0, 'rgba(0,0,0,0.5)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.12)']
  ]);
  ctx.fillRect(cx - bodyRx * 1.2, cy - bodyRy * 1.2, bodyRx * 2.4, bodyRy * 2.4);
  ctx.restore();

  // --- grinning face plate ---------------------------------------------------
  const fy = cy - bodyRy * 0.12;
  // sunken plate
  EN_ellipse(ctx, cx + face * bodyRx * 0.10, fy, bodyRx * 0.78, bodyRy * 0.52, 0);
  ctx.fillStyle = EN_linGrad(ctx, 'dfp', cx, fy - bodyRy * 0.5, cx, fy + bodyRy * 0.5, [
    [0, '#2b1450'], [0.6, '#180a30'], [1, '#0c0420']
  ]);
  ctx.fill();

  // glowing green eye slits
  for (let i = 0; i < 2; i++) {
    const ex = cx + face * bodyRx * 0.10 + (i ? bodyRx * 0.33 : -bodyRx * 0.33);
    const ey = fy - bodyRy * 0.13;
    ctx.save();
    ctx.shadowColor = 'rgba(120,255,110,0.95)';
    ctx.shadowBlur = 8 * gl;
    ctx.fillStyle = EN_linGrad(ctx, 'dey', ex, ey - 3, ex, ey + 3, [
      [0, '#e6ffd9'], [0.5, '#7bff5e'], [1, '#1d7a12']
    ]);
    ctx.beginPath();
    ctx.moveTo(ex - bodyRx * 0.22, ey - bodyRy * 0.10);
    ctx.lineTo(ex + bodyRx * 0.22, ey - bodyRy * 0.02);
    ctx.lineTo(ex + bodyRx * 0.16, ey + bodyRy * 0.11);
    ctx.lineTo(ex - bodyRx * 0.20, ey + bodyRy * 0.04);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // metal rictus grin
  const my = fy + bodyRy * 0.24;
  const gw = bodyRx * 0.62;
  ctx.beginPath();
  ctx.moveTo(cx + face * bodyRx * 0.10 - gw, my - bodyRy * 0.06);
  ctx.quadraticCurveTo(cx + face * bodyRx * 0.10, my + bodyRy * 0.26, cx + face * bodyRx * 0.10 + gw, my - bodyRy * 0.06);
  ctx.quadraticCurveTo(cx + face * bodyRx * 0.10, my + bodyRy * 0.10, cx + face * bodyRx * 0.10 - gw, my - bodyRy * 0.06);
  ctx.closePath();
  ctx.fillStyle = EN_linGrad(ctx, 'dgn', cx, my - 4, cx, my + 6, [
    [0, '#f0efe4'], [0.55, '#b9b3a4'], [1, '#4d4840']
  ]);
  ctx.fill();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#20101c';
  ctx.lineWidth = 0.6;
  for (let i = 1; i < 5; i++) {
    const tx = cx + face * bodyRx * 0.10 - gw + (i / 5) * gw * 2;
    ctx.beginPath();
    ctx.moveTo(tx, my - bodyRy * 0.03);
    ctx.lineTo(tx, my + bodyRy * 0.17);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // --- rim light on the facing edge of the body ----------------------------
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, cy, bodyRx, bodyRy, 0,
    face > 0 ? -Math.PI * 0.58 : Math.PI * 0.42,
    face > 0 ? Math.PI * 0.42 : Math.PI * 1.42);
  EN_rimStroke(ctx, '#d7c2ff', 1.5, 0.65);
  ctx.restore();

  // top specular
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = EN_radGrad(ctx, 'dsp', cx - bodyRx * 0.4, cy - bodyRy * 0.6, 0.1, cx - bodyRx * 0.4, cy - bodyRy * 0.6, bodyRx * 0.8, [
    [0, 'rgba(255,255,255,0.85)'], [1, 'rgba(255,255,255,0)']
  ]);
  EN_ellipse(ctx, cx - bodyRx * 0.38, cy - bodyRy * 0.58, bodyRx * 0.30, bodyRy * 0.16, -0.4);
  ctx.fill();
  ctx.globalAlpha = 1;

  // --- laughing-gas puffs drifting below ------------------------------------
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const ph = (t * 0.9 + i * 0.25) % 1;
    const px = cx + sway * 0.5 + Math.sin(t * 2 + i * 2.1) * w * 0.16;
    const py = cy + bodyRy * 0.9 + ph * h * 0.55;
    const pr = (2 + ph * 5) * (0.7 + EN_rnd(i * 11) * 0.6);
    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = (1 - ph) * 0.30;
    ctx.fillStyle = EN_radGrad(ctx, 'dpf', 0, 0, 0.1, 0, 0, pr, [
      [0, 'rgba(150,255,130,0.7)'], [1, 'rgba(63,160,44,0)']
    ]);
    ctx.beginPath();
    ctx.arc(0, 0, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();
}

function EN_droneWing(ctx, ax, ay, w, h, side, flap, t) {
  ctx.save();
  ctx.translate(ax + side * w * 0.20, ay);
  const a = side * (0.18 + flap * 0.62);
  ctx.rotate(a);
  ctx.scale(side, 1);

  const L = w * 0.42, H = h * 0.46;
  // membrane: scalloped bat wing
  ctx.beginPath();
  ctx.moveTo(0, -H * 0.18);
  ctx.quadraticCurveTo(L * 0.55, -H * 0.60, L, -H * 0.20);
  ctx.quadraticCurveTo(L * 0.80, -H * 0.02, L * 0.72, H * 0.12);
  ctx.quadraticCurveTo(L * 0.60, -H * 0.04, L * 0.48, H * 0.26);
  ctx.quadraticCurveTo(L * 0.38, H * 0.06, L * 0.26, H * 0.34);
  ctx.quadraticCurveTo(L * 0.16, H * 0.12, 0, H * 0.24);
  ctx.closePath();
  const mg = EN_linGrad(ctx, 'dwm', 0, -H * 0.6, L, H * 0.34, [
    [0, 'rgba(120,70,180,0.92)'], [0.4, 'rgba(70,35,115,0.88)'],
    [0.75, 'rgba(45,20,80,0.90)'], [1, 'rgba(25,10,45,0.95)']
  ]);
  ctx.fillStyle = mg;
  ctx.fill();

  // translucent green backlight through the membrane
  ctx.save();
  ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.25 + 0.15 * (0.5 + 0.5 * Math.sin(t * 5.1));
  ctx.fillStyle = EN_radGrad(ctx, 'dwg', L * 0.15, H * 0.2, 0.1, L * 0.15, H * 0.2, L * 0.9, [
    [0, 'rgba(110,240,100,0.8)'], [1, 'rgba(63,160,44,0)']
  ]);
  ctx.fillRect(-2, -H, L + 4, H * 2);
  ctx.restore();

  // ribs / struts
  ctx.strokeStyle = 'rgba(200,180,255,0.55)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -H * 0.16); ctx.quadraticCurveTo(L * 0.55, -H * 0.55, L, -H * 0.20);
  ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#c9aef0';
  ctx.lineWidth = 0.8;
  const tips = [[L * 0.72, H * 0.12], [L * 0.48, H * 0.26], [L * 0.26, H * 0.34]];
  for (let i = 0; i < tips.length; i++) {
    ctx.beginPath();
    ctx.moveTo(L * 0.06, -H * 0.10);
    ctx.quadraticCurveTo(tips[i][0] * 0.6, -H * 0.18, tips[i][0], tips[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // leading-edge rim light
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, -H * 0.18);
  ctx.quadraticCurveTo(L * 0.55, -H * 0.62, L, -H * 0.20);
  EN_rimStroke(ctx, '#eadcff', 1.2, 0.6);
  ctx.restore();

  ctx.restore();
}

function EN_droneProp(ctx, cx, cy, w, h, t) {
  ctx.save();
  // mast
  ctx.strokeStyle = '#2a2038';
  ctx.lineWidth = Math.max(1, w * 0.035);
  ctx.beginPath();
  ctx.moveTo(cx, cy + h * 0.06);
  ctx.lineTo(cx, cy - h * 0.02);
  ctx.stroke();

  const pr = w * 0.30;
  const spin = t * 26;
  // blur disc
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = EN_radGrad(ctx, 'dpr', cx, cy, 0.1, cx, cy, pr, [
    [0, 'rgba(180,200,255,0.0)'], [0.55, 'rgba(170,190,250,0.55)'], [1, 'rgba(120,140,210,0)']
  ]);
  EN_ellipse(ctx, cx, cy - h * 0.02, pr, pr * 0.26, 0);
  ctx.fill();
  ctx.globalAlpha = 1;

  // three streaked blades
  for (let i = 0; i < 3; i++) {
    const a = spin + i * (Math.PI * 2 / 3);
    ctx.globalAlpha = 0.30 + 0.30 * Math.abs(Math.cos(a));
    ctx.strokeStyle = '#cfd8ff';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(cx, cy - h * 0.02, pr, pr * 0.26, 0, a, a + 0.9);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // hub
  ctx.fillStyle = EN_radGrad(ctx, 'dhb', cx - 1, cy - h * 0.03, 0.1, cx, cy - h * 0.02, w * 0.06, [
    [0, '#d8dcf0'], [0.5, '#6d7490'], [1, '#171a26']
  ]);
  ctx.beginPath();
  ctx.arc(cx, cy - h * 0.02, w * 0.05, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();
}


// ═══ ENVIRONMENT ═══════════════════════════════════════
// NOTE ON LIGHTNING: every term below that scales with L was authored when
// the post chain ran at exposure 1.30. The grade rework took it to 1.95 and a
// strike began blowing the entire frame to flat white — silhouettes and all.
// They are scaled to match; if exposure moves again, these move with it.
// =====================================================================
//  environment.js  --  Gotham backdrop  (prefix: ENV_)
//  Sky, moon, bat-signal, three parallax skyline layers, smog, vignette.
//  Everything drawn with Canvas2D primitives. Deterministic: all motion
//  is a function of the passed-in time `t`; all "randomness" is hashed.
// =====================================================================

// ---------- deterministic pseudo-random ------------------------------
function ENV_rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function ENV_rnd2(n, k) {
  const s = Math.sin(n * 269.5 + k * 183.3 + 71.7) * 27183.1234;
  return s - Math.floor(s);
}

// ---------- gradient cache (keyed to the ctx that made them) ---------
let ENV_C = { ctx: null, rad: {}, lin: {} };
function ENV_cache(ctx) {
  if (ENV_C.ctx !== ctx) ENV_C = { ctx: ctx, rad: {}, lin: {} };
  return ENV_C;
}
// unit radial gradient centred on 0,0 radius 1 -- scale it with transforms
function ENV_radial(ctx, key, stops) {
  const c = ENV_cache(ctx);
  let g = c.rad[key];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    c.rad[key] = g;
  }
  return g;
}
function ENV_linear(ctx, key, x0, y0, x1, y1, stops) {
  const c = ENV_cache(ctx);
  let g = c.lin[key];
  if (!g) {
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    c.lin[key] = g;
  }
  return g;
}
// soft elliptical puff using the cached unit radial
function ENV_puff(ctx, key, x, y, rx, ry, stops, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  ctx.fillStyle = ENV_radial(ctx, key, stops);
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function ENV_poly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
}

// ---------- the bat emblem (used faintly in the sky) -----------------
function ENV_batPath(ctx, cx, cy, w) {
  const s = w / 150;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.bezierCurveTo(6, -30, 22, -34, 30, -24);
  ctx.bezierCurveTo(28, -16, 34, -12, 44, -14);
  ctx.bezierCurveTo(62, -18, 76, -8, 74, 6);
  ctx.bezierCurveTo(64, 0, 56, 2, 52, 10);
  ctx.lineTo(58, 26);
  ctx.lineTo(40, 16);
  ctx.bezierCurveTo(30, 12, 18, 16, 12, 26);
  ctx.lineTo(0, 44);
  ctx.lineTo(-12, 26);
  ctx.bezierCurveTo(-18, 16, -30, 12, -40, 16);
  ctx.lineTo(-58, 26);
  ctx.lineTo(-52, 10);
  ctx.bezierCurveTo(-56, 2, -64, 0, -74, 6);
  ctx.bezierCurveTo(-76, -8, -62, -18, -44, -14);
  ctx.bezierCurveTo(-34, -12, -28, -16, -30, -24);
  ctx.bezierCurveTo(-22, -34, -6, -30, 0, -14);
  ctx.closePath();
  ctx.restore();
}

// =====================================================================
//  SKY
// =====================================================================
function drawGothamSky(ctx, camX, t, lightning) {
  const L = lightning || 0;
  ctx.save();

  // --- base vertical gradient -----------------------------------------
  // Neutral slate, not navy. PAL was moved to cold steel a while back but the
  // sky kept its own hardcoded purples, so the palette change never reached the
  // thing that occupies two thirds of every frame — the whole picture still
  // graded blue. The ramp now runs near-black at the zenith to a desaturated
  // slate at the cloud base, which is where the city's own glow lands.
  const sky = ENV_linear(ctx, 'sky', 0, 0, 0, CH, [
    [0.00, PAL.skyTop],
    [0.24, '#1e252c'],
    [0.46, PAL.skyMid],
    [0.70, PAL.skyLow],
    [0.86, '#525c65'],
    [1.00, '#5d666e']
  ]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, CH);

  // --- stars (deterministic, twinkling) --------------------------------
  // Few, and faint. A city throwing this much light into low cloud washes out
  // all but the brightest handful; a full field of 150 twinkling points is the
  // single most "illustrated" thing a night sky can do.
  const starPar = camX * 0.012;
  ctx.fillStyle = PAL.white;
  for (let i = 0; i < 46; i++) {
    const sx = ((ENV_rnd(i) * 2400) - starPar) % 2400;
    const x = sx < 0 ? sx + 2400 : sx;
    if (x > CW + 4) continue;
    const y = ENV_rnd2(i, 7) * 300 + 4;
    const tw = 0.5 + 0.5 * Math.sin(t * (0.8 + ENV_rnd2(i, 3) * 2.4) + i * 1.7);
    const a = (0.06 + 0.30 * tw) * (1 - y / 380);
    if (a <= 0.01) continue;
    const r = 0.6 + ENV_rnd2(i, 11) * 1.1;
    ctx.globalAlpha = a;
    ctx.fillRect(x, y, r, r);
    if (r > 1.4) {
      ctx.globalAlpha = a * 0.28;
      ctx.fillRect(x - 1.6, y + r * 0.5 - 0.3, 4.4, 0.7);
      ctx.fillRect(x + r * 0.5 - 0.3, y - 1.6, 0.7, 4.4);
    }
  }
  ctx.globalAlpha = 1;

  // --- the moon --------------------------------------------------------
  const mper = 3000;
  let mx = 706 - (camX * 0.02) % mper;
  if (mx < -320) mx += mper;
  const my = 104;
  const mr = 42;

  // wide atmospheric halo
  ENV_puff(ctx, 'moonHaloFar', mx, my, mr * 7.4, mr * 6.2, [
    [0, 'rgba(158,172,188,0.26)'], [0.4, 'rgba(118,130,146,0.11)'],
    [0.72, 'rgba(80,90,104,0.04)'], [1, 'rgba(70,80,94,0)']
  ], 0.85);
  ENV_puff(ctx, 'moonHalo', mx, my, mr * 2.9, mr * 2.9, [
    [0, 'rgba(228,234,240,0.50)'], [0.35, 'rgba(186,196,208,0.21)'],
    [1, 'rgba(166,178,192,0)']
  ], 0.95);

  // disc with a shaded limb
  const mg = ENV_linear(ctx, 'moonDisc', -1, -1, 1, 1, [
    [0, '#ffffff'], [0.42, PAL.moon], [0.78, '#b9c0d4'], [1, '#8c93ad']
  ]);
  ctx.save();
  ctx.translate(mx, my);
  ctx.scale(mr, mr);
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  // craters
  ctx.fillStyle = '#000000';
  const cr = [[-0.30, -0.24, 0.22], [0.26, -0.06, 0.15], [-0.06, 0.36, 0.19],
              [0.44, 0.40, 0.11], [-0.50, 0.24, 0.10], [0.08, -0.48, 0.09]];
  for (let i = 0; i < cr.length; i++) {
    ctx.globalAlpha = 0.055 + (i % 3) * 0.022;
    ctx.beginPath();
    ctx.arc(cr[i][0], cr[i][1], cr[i][2], 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.05;
    ctx.beginPath();
    ctx.arc(cr[i][0] - cr[i][2] * 0.22, cr[i][1] - cr[i][2] * 0.22, cr[i][2] * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.fillStyle = '#000000';
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- drifting cloud deck ---------------------------------------------
  // Two-tone, and that is the whole point. A cloud lit from below by a city is
  // DARK on top and PALE underneath, and a flat puff — one colour, symmetric
  // falloff — is why the old sky read as a painted backdrop. Each band is now
  // a dark mass with a separate, lower, brighter belly stacked under it, so the
  // deck has a direction of light instead of just a shape.
  const cloudStops = [
    [0, 'rgba(50,58,68,0.60)'], [0.45, 'rgba(38,45,54,0.32)'],
    [0.8, 'rgba(28,34,41,0.09)'], [1, 'rgba(24,29,36,0)']
  ];
  const bellyStops = [
    [0, 'rgba(126,140,154,0.34)'], [0.5, 'rgba(96,110,124,0.13)'], [1, 'rgba(80,92,106,0)']
  ];
  for (let i = 0; i < 11; i++) {
    const span = 1600;
    const speed = 5 + ENV_rnd(i) * 13;
    let cx = ((ENV_rnd2(i, 5) * span) + t * speed - camX * 0.03) % span;
    if (cx < 0) cx += span;
    cx -= 220;
    if (cx > CW + 260) continue;
    const cy = 40 + ENV_rnd2(i, 9) * 250;
    const rx = 110 + ENV_rnd2(i, 13) * 170;
    const ry = 9 + ENV_rnd2(i, 17) * 14;
    const a = 0.24 + ENV_rnd2(i, 19) * 0.30;
    // underlit belly first, so the dark mass settles on top of it
    ENV_puff(ctx, 'cloudBelly', cx + rx * 0.08, cy + ry * 0.85, rx * 0.88, ry * 0.72,
      bellyStops, a * (0.5 + ENV_rnd2(i, 23) * 0.5));
    ENV_puff(ctx, 'cloud', cx, cy, rx, ry, cloudStops, a);
    ENV_puff(ctx, 'cloud', cx + rx * 0.45, cy + ry * 0.55, rx * 0.62, ry * 0.8, cloudStops, a * 0.7);
  }

  // --- bat-signal beam -------------------------------------------------
  const pulse = 0.62 + 0.38 * Math.sin(t * 0.75) + 0.05 * Math.sin(t * 3.1);
  const bx = -150 - camX * 0.03 % 40;
  const by = CH + 30;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(bx, by);
  ctx.rotate(-Math.PI * 0.345);
  const beam = ENV_linear(ctx, 'beam', 0, 0, 900, 0, [
    [0, 'rgba(245,197,24,0.30)'], [0.25, 'rgba(240,190,40,0.16)'],
    [0.62, 'rgba(220,175,60,0.07)'], [1, 'rgba(200,160,70,0)']
  ]);
  ctx.globalAlpha = 0.55 * pulse;
  ctx.fillStyle = beam;
  ENV_poly(ctx, [0, -10, 920, -190, 920, 190, 0, 10]);
  ctx.fill();
  // hot inner core
  const core = ENV_linear(ctx, 'beamCore', 0, 0, 760, 0, [
    [0, 'rgba(255,240,190,0.34)'], [0.4, 'rgba(245,205,70,0.11)'], [1, 'rgba(240,200,80,0)']
  ]);
  ctx.globalAlpha = 0.6 * pulse;
  ctx.fillStyle = core;
  ENV_poly(ctx, [0, -4, 780, -66, 780, 66, 0, 4]);
  ctx.fill();
  ctx.restore();

  // emblem burnt faintly into the cloud deck at the head of the beam
  const ex = bx + Math.cos(-Math.PI * 0.345) * 820;
  const ey = by + Math.sin(-Math.PI * 0.345) * 820;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ENV_puff(ctx, 'sigGlow', ex, ey, 150, 112, [
    [0, 'rgba(245,197,24,0.26)'], [0.5, 'rgba(220,175,50,0.10)'], [1, 'rgba(200,160,60,0)']
  ], 0.85 * pulse);
  ctx.globalAlpha = 0.30 * pulse;
  ctx.fillStyle = 'rgba(250,225,150,0.9)';
  ctx.beginPath();
  ctx.ellipse(ex, ey, 96, 72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.34 * pulse;
  ctx.fillStyle = '#12101c';
  ENV_batPath(ctx, ex, ey - 6, 150);
  ctx.fill();
  ctx.globalAlpha = 0.16 * pulse;
  ctx.strokeStyle = PAL.yellow;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // --- sodium-vapour city glow bleeding up from the horizon -------------
  // The glow runs cold high up and WARMS as it nears the rooftops. That hue
  // split is what sells an expensive night exterior: the sky is one
  // temperature, the light the city makes is another, and the eye reads the
  // difference as distance. A single blue-grey ramp — which is what this was —
  // flattens the two together and the whole frame goes monochrome navy.
  const glow = ENV_linear(ctx, 'horizon', 0, CH * 0.42, 0, CH, [
    [0, 'rgba(44,56,68,0)'],
    [0.34, 'rgba(66,80,94,0.32)'],
    [0.62, 'rgba(100,112,118,0.40)'],
    [0.84, 'rgba(140,142,132,0.44)'],
    [1, 'rgba(172,164,140,0.50)']
  ]);
  ctx.fillStyle = glow;
  ctx.fillRect(0, CH * 0.42, CW, CH * 0.58);

  // hot pools of sodium light along the horizon line
  for (let i = 0; i < 6; i++) {
    let gx = ((i * 230 + ENV_rnd(i + 40) * 160) - camX * 0.06) % 1380;
    if (gx < -260) gx += 1380;
    if (gx > CW + 260) continue;
    ENV_puff(ctx, 'sodium', gx, 452, 250, 96, [
      [0, 'rgba(206,176,122,0.26)'], [0.45, 'rgba(158,132,92,0.12)'], [1, 'rgba(120,100,72,0)']
    ], 0.55 + 0.12 * Math.sin(t * 0.5 + i));
  }

  // --- lightning wash ---------------------------------------------------
  if (L > 0.001) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(112,134,190,' + (L * 0.042).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(214,228,255,' + (L * 0.012).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  SKYLINE
// =====================================================================

// Returns a flat [x,y,x,y,...] silhouette for building style `st`.
function ENV_silhouette(x, y0, w, h, st) {
  const T = y0 - h;
  if (st === 0) {              // art-deco stepped ziggurat
    return [x, y0, x, y0 - h * 0.55, x + w * 0.10, y0 - h * 0.55,
      x + w * 0.10, y0 - h * 0.78, x + w * 0.26, y0 - h * 0.78,
      x + w * 0.26, y0 - h * 0.93, x + w * 0.50, T,
      x + w * 0.74, y0 - h * 0.93, x + w * 0.74, y0 - h * 0.78,
      x + w * 0.90, y0 - h * 0.78, x + w * 0.90, y0 - h * 0.55,
      x + w, y0 - h * 0.55, x + w, y0];
  }
  if (st === 1) {              // gothic cathedral spire + corner needles
    return [x, y0, x, y0 - h * 0.70,
      x + w * 0.06, y0 - h * 0.70, x + w * 0.13, y0 - h * 0.87, x + w * 0.20, y0 - h * 0.70,
      x + w * 0.35, y0 - h * 0.70, x + w * 0.50, T, x + w * 0.65, y0 - h * 0.70,
      x + w * 0.80, y0 - h * 0.70, x + w * 0.87, y0 - h * 0.87, x + w * 0.94, y0 - h * 0.70,
      x + w, y0 - h * 0.70, x + w, y0];
  }
  if (st === 2) {              // slab tower with an overhanging cornice
    return [x, y0, x, y0 - h * 0.95, x - w * 0.06, y0 - h * 0.95,
      x - w * 0.06, T, x + w * 1.06, T, x + w * 1.06, y0 - h * 0.95,
      x + w, y0 - h * 0.95, x + w, y0];
  }
  if (st === 3) {              // clock tower, pitched roof with eaves
    return [x, y0, x, y0 - h * 0.78, x - w * 0.12, y0 - h * 0.78,
      x + w * 0.50, T, x + w * 1.12, y0 - h * 0.78, x + w, y0 - h * 0.78, x + w, y0];
  }
  // st === 4 : twin gothic peaks over a lower nave
  return [x, y0, x, y0 - h * 0.84, x + w * 0.16, T, x + w * 0.32, y0 - h * 0.84,
    x + w * 0.32, y0 - h * 0.60, x + w * 0.68, y0 - h * 0.60,
    x + w * 0.68, y0 - h * 0.84, x + w * 0.84, T, x + w, y0 - h * 0.84, x + w, y0];
}

// lit-window field, drawn clipped to the silhouette
function ENV_windows(ctx, i, x, y0, w, h, tier, t) {
  const cw = tier === 2 ? 5 : (tier === 1 ? 3.6 : 2.6);
  const ch = tier === 2 ? 7 : (tier === 1 ? 5 : 3.4);
  const gx = tier === 2 ? 13 : (tier === 1 ? 9.5 : 7);
  const gy = tier === 2 ? 16 : (tier === 1 ? 12 : 8.5);
  const cols = Math.max(1, Math.floor(w / gx));
  const rows = Math.max(1, Math.floor(h / gy));
  const ox = x + (w - (cols - 1) * gx - cw) * 0.5;
  const density = tier === 2 ? 0.42 : (tier === 1 ? 0.30 : 0.20);
  const baseA = tier === 2 ? 0.95 : (tier === 1 ? 0.68 : 0.40);

  ctx.fillStyle = PAL.bldgWin;
  for (let r = 0; r < rows; r++) {
    const wy = y0 - 10 - r * gy;
    if (wy < y0 - h) break;
    for (let c = 0; c < cols; c++) {
      const k = i * 911 + r * 57 + c * 7;
      const v = ENV_rnd(k);
      if (v > density) continue;
      let a = baseA * (0.55 + ENV_rnd2(k, 3) * 0.45);
      const fl = ENV_rnd2(k, 21);
      if (fl > 0.86) {          // a few bad ballasts flickering
        const s = Math.sin(t * (7 + fl * 9) + k);
        a *= s > 0.25 ? 1 : (s > -0.1 ? 0.30 : 0.06);
      }
      ctx.globalAlpha = a;
      // slight hue split: some windows cold fluorescent
      ctx.fillStyle = ENV_rnd2(k, 31) > 0.82 ? '#bfd6ff' : PAL.bldgWin;
      ctx.fillRect(ox + c * gx, wy, cw, ch);
      if (tier === 2 && a > 0.6) {
        ctx.globalAlpha = a * 0.14;
        ctx.fillRect(ox + c * gx - 2.5, wy - 2.5, cw + 5, ch + 5);
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Facade structure, drawn clipped to the silhouette under the window field.
//
// A building is not a flat rectangle with lit windows scattered on it, but
// that is exactly what this skyline was, and it is why the city read as a
// backdrop painted on card. What the eye actually uses to identify masonry at
// distance is the VERTICAL RHYTHM: the piers between window bays catch the sky
// and the recesses between them fall into shadow, so a tower reads as a run of
// narrow stripes long before any individual window is resolvable. Add a
// cornice at the crown and a darker plinth at the street and the shape stops
// being a rectangle and starts being a building.
//
// All of it is a handful of fillRects against a clip that is already set, so
// it costs essentially nothing next to the window field it sits under.
function ENV_facade(ctx, i, x, y0, w, h, tier, gx) {
  const T = y0 - h;
  // piers: one per window bay, lit edge on the left, recess on the right
  const pitch = Math.max(6, gx);
  const nb = Math.floor(w / pitch);
  if (nb > 1 && tier > 0) {
    const lit = tier === 2 ? 0.075 : 0.05;
    for (let c = 0; c <= nb; c++) {
      const px = x + (w * c) / nb;
      ctx.fillStyle = 'rgba(176,192,210,' + lit.toFixed(3) + ')';
      ctx.fillRect(px - 0.9, T, 1.1, h);
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(px + 0.3, T, 1.3, h);
    }
  }
  // cornice: a bright lip and the shadow it throws down the wall
  const cb = tier === 2 ? 5 : (tier === 1 ? 3.5 : 2.4);
  ctx.fillStyle = 'rgba(186,202,220,0.16)';
  ctx.fillRect(x - 2, T + 1, w + 4, cb * 0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.fillRect(x - 2, T + 1 + cb * 0.5, w + 4, cb);
  // a second setback band partway up on the taller forms
  if (h > 150 && ENV_rnd2(i, 61) > 0.45) {
    const sy = T + h * (0.22 + ENV_rnd2(i, 67) * 0.2);
    ctx.fillStyle = 'rgba(176,192,210,0.10)';
    ctx.fillRect(x, sy, w, 1.6);
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(x, sy + 1.6, w, cb * 0.8);
  }
  // plinth: the first two storeys are always darker than the shaft
  const pg = ENV_cache(ctx).lin['plinth' + tier];
  if (pg) { ctx.fillStyle = pg; ctx.fillRect(x - 2, y0 - 46, w + 4, 48); }
}

function ENV_roofDetail(ctx, i, x, y0, w, h, st, tier, t, fill, edge, L) {
  const T = y0 - h;
  ctx.fillStyle = fill;
  // antenna mast + aircraft warning light on tall slabs and spires
  if (st === 2 || st === 0) {
    const mh = 14 + ENV_rnd2(i, 41) * (tier === 2 ? 42 : 26);
    const mx = x + w * (0.25 + ENV_rnd2(i, 43) * 0.5);
    ctx.fillRect(mx - 0.9, T - mh, 1.8, mh);
    ctx.fillRect(mx - 4, T - mh * 0.55, 8, 1.2);
    ctx.fillRect(mx - 2.6, T - mh * 0.78, 5.2, 1.1);
    const blink = Math.sin(t * 2.1 + i * 1.31);
    if (blink > 0.55) {
      const bi = (blink - 0.55) / 0.45;
      ENV_puff(ctx, 'redlamp', mx, T - mh - 1, 9, 9, [
        [0, 'rgba(224,59,59,0.85)'], [0.4, 'rgba(200,40,40,0.30)'], [1, 'rgba(180,30,30,0)']
      ], bi * (tier === 0 ? 0.5 : 0.9));
      ctx.fillStyle = PAL.danger;
      ctx.globalAlpha = 0.5 + bi * 0.5;
      ctx.fillRect(mx - 1.2, T - mh - 2.4, 2.4, 2.4);
      ctx.globalAlpha = 1;
      ctx.fillStyle = fill;
    }
  }
  // water tower on the wider mid/near slabs
  if ((st === 2 || st === 0) && tier > 0 && ENV_rnd2(i, 47) > 0.55) {
    const tw = tier === 2 ? 20 : 13;
    const th = tier === 2 ? 16 : 10;
    const tx = x + w * (ENV_rnd2(i, 53) > 0.5 ? 0.68 : 0.16);
    const ty = T;
    ctx.fillRect(tx + tw * 0.12, ty - 4, 2, 4);
    ctx.fillRect(tx + tw * 0.80, ty - 4, 2, 4);
    ENV_poly(ctx, [tx, ty - 4, tx + tw * 0.10, ty - 4 - th, tx + tw * 0.90, ty - 4 - th, tx + tw, ty - 4]);
    ctx.fill();
    ENV_poly(ctx, [tx + tw * 0.10, ty - 4 - th, tx + tw * 0.5, ty - 4 - th * 1.5, tx + tw * 0.90, ty - 4 - th]);
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.globalAlpha = 0.35 + L * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx, ty - 4 - th * 0.55);
    ctx.lineTo(tx + tw, ty - 4 - th * 0.55);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // clock face
  if (st === 3 && tier > 0) {
    const cx = x + w * 0.5, cy = y0 - h * 0.66, r = Math.min(w * 0.22, 13);
    ctx.globalAlpha = 0.9;
    ENV_puff(ctx, 'clockGlow', cx, cy, r * 3.2, r * 3.2, [
      [0, 'rgba(245,197,24,0.34)'], [0.5, 'rgba(220,170,40,0.10)'], [1, 'rgba(200,160,50,0)']
    ], 0.9);
    ctx.fillStyle = 'rgba(244,224,150,0.92)';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0d0b16';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.stroke();
    // hands: slow, deterministic
    const hh = t * 0.10, mm = t * 0.55;
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(hh - Math.PI / 2) * r * 0.45, cy + Math.sin(hh - Math.PI / 2) * r * 0.45);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(mm - Math.PI / 2) * r * 0.74, cy + Math.sin(mm - Math.PI / 2) * r * 0.74);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = fill;
  }
  // flying buttresses on the cathedral / twin-peak forms
  if (st === 4 && tier === 2) {
    ctx.strokeStyle = fill;
    ctx.lineWidth = 4;
    for (let s = 0; s < 2; s++) {
      const sx = s === 0 ? x + w * 0.10 : x + w * 0.90;
      const dir = s === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(sx, y0 - h * 0.52);
      ctx.quadraticCurveTo(sx + dir * w * 0.18, y0 - h * 0.30, sx + dir * w * 0.20, y0);
      ctx.stroke();
      ctx.strokeStyle = edge;
      ctx.globalAlpha = 0.20 + L * 0.6;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = fill;
      ctx.lineWidth = 4;
    }
  }
  ctx.globalAlpha = 1;
}

function ENV_layer(ctx, camX, t, L, tier) {
  // tier 0 = far, 1 = mid, 2 = near
  const factor = tier === 0 ? 0.08 : (tier === 1 ? 0.22 : 0.45);
  const slot = tier === 0 ? 78 : (tier === 1 ? 116 : 168);
  const baseY = tier === 0 ? 398 : (tier === 1 ? 424 : 462);
  const minH = tier === 0 ? 70 : (tier === 1 ? 110 : 150);
  const maxH = tier === 0 ? 190 : (tier === 1 ? 265 : 330);
  const seed = tier * 1000 + 17;
  const body = tier === 0 ? PAL.bldgFar : (tier === 1 ? PAL.bldgMid : PAL.bldgNear);
  // Neutral, like PAL. These three pairs were the last of the old navy palette
  // and they paint every building in the game, so they outvoted PAL outright.
  const bodyTop = tier === 0 ? '#1b232c' : (tier === 1 ? '#1e2831' : '#232d38');
  const bodyBot = tier === 0 ? '#0a0f14' : (tier === 1 ? '#0c1217' : '#10161c');
  const rimCol = tier === 0 ? 'rgba(132,148,166,' : (tier === 1 ? 'rgba(150,168,186,' : 'rgba(174,192,210,');

  const off = camX * factor;
  const i0 = Math.floor(off / slot) - 2;
  const i1 = i0 + Math.ceil(CW / slot) + 4;

  ctx.save();
  // the darker first-two-storeys band, built once per layer
  const pc = ENV_cache(ctx);
  if (!pc.lin['plinth' + tier]) {
    const g2 = ctx.createLinearGradient(0, baseY - 46, 0, baseY + 2);
    g2.addColorStop(0, 'rgba(0,0,0,0)');
    g2.addColorStop(0.45, 'rgba(0,0,0,0.20)');
    g2.addColorStop(1, 'rgba(0,0,0,0.42)');
    pc.lin['plinth' + tier] = g2;
  }
  for (let i = i0; i <= i1; i++) {
    const r0 = ENV_rnd(i + seed);
    const r1 = ENV_rnd2(i + seed, 3);
    const r2 = ENV_rnd2(i + seed, 9);
    const w = slot * (0.62 + r1 * 0.42);
    const x = Math.round(i * slot - off + (slot - w) * 0.5 + (r2 - 0.5) * slot * 0.12);
    if (x > CW + 60 || x + w < -60) continue;
    // Every building drawn from one height band gives a picket fence. A real
    // skyline is mostly even with a few towers well clear of it, and those
    // outliers are what the eye uses to read the whole thing as a city.
    let h = Math.round(minH + r0 * (maxH - minH));
    if (ENV_rnd2(i + seed, 71) > 0.88) h = Math.round(h * (1.35 + ENV_rnd2(i + seed, 73) * 0.5));
    const st = Math.floor(ENV_rnd2(i + seed, 13) * 5) % 5;
    const pts = ENV_silhouette(x, baseY, w, h, st);

    // ---- body: vertical gradient (cached per tier + quantised height) --
    const hk = Math.round(h / 16) * 16;
    const gk = 'b' + tier + '_' + hk;
    const c = ENV_cache(ctx);
    let bg = c.lin[gk];
    if (!bg) {
      bg = ctx.createLinearGradient(0, baseY - hk, 0, baseY);
      bg.addColorStop(0, bodyTop);
      bg.addColorStop(0.30, body);
      bg.addColorStop(1, bodyBot);
      c.lin[gk] = bg;
    }
    ENV_poly(ctx, pts);
    ctx.fillStyle = bg;
    ctx.fill();

    // ---- interior shading + window field, clipped to the silhouette ----
    ctx.save();
    ctx.clip();
    // one side falls away into shadow
    const sk = 's' + tier + '_' + Math.round(w / 12) * 12;
    let sg = c.lin[sk];
    if (!sg) {
      sg = ctx.createLinearGradient(0, 0, Math.round(w / 12) * 12 || 12, 0);
      sg.addColorStop(0, 'rgba(136,152,170,0.11)');
      sg.addColorStop(0.22, 'rgba(0,0,0,0)');
      sg.addColorStop(1, 'rgba(0,0,0,0.42)');
      c.lin[sk] = sg;
    }
    ctx.save();
    ctx.translate(x, 0);
    ctx.fillStyle = sg;
    ctx.fillRect(0, baseY - h - 60, w + 2, h + 62);
    ctx.restore();

    // faint floor banding on the front layers
    if (tier > 0) {
      ctx.globalAlpha = tier === 2 ? 0.16 : 0.10;
      ctx.fillStyle = '#000000';
      const step = tier === 2 ? 16 : 12;
      for (let yy = baseY - 6; yy > baseY - h; yy -= step) ctx.fillRect(x - 4, yy, w + 8, 1);
      ctx.globalAlpha = 1;
    }
    // structure first, lit windows on top of it
    ENV_facade(ctx, i + seed, x, baseY, w, h, tier,
      tier === 2 ? 13 : (tier === 1 ? 9.5 : 7));
    ENV_windows(ctx, i + seed, x, baseY, w, h, tier, t);
    ctx.restore();

    // ---- edge rim light ------------------------------------------------
    ENV_poly(ctx, pts);
    ctx.strokeStyle = rimCol + (0.10 + L * 0.22).toFixed(3) + ')';
    ctx.lineWidth = tier === 2 ? 1.6 : 1.1;
    ctx.stroke();
    if (L > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(200,220,255,' + (L * 0.28).toFixed(3) + ')';
      ctx.lineWidth = tier === 2 ? 2.6 : 1.8;
      ctx.stroke();
      ctx.restore();
    }

    ENV_roofDetail(ctx, i + seed, x, baseY, w, h, st, tier, t, bodyBot, rimCol + '0.5)', L);
  }

  // ---- haze sitting on top of the layer, pushing it back ---------------
  // Aerial perspective, pushed hard. This is the single effect that makes a
  // frame read as "deep" rather than "flat": each layer further back is washed
  // further toward the sky's value, so the near playfield reads dark against a
  // pale, misty city instead of every layer sharing one muddy blue.
  // Eased back from 0.92/0.66/0.34. Those were set while the grade was
  // crushing the frame, so the haze had to shout to survive; at a correct
  // exposure the same numbers turn the whole city into milk and the playfield
  // loses its separation from the backdrop.
  const hz = tier === 0 ? 0.78 : (tier === 1 ? 0.52 : 0.25);
  // tall enough to cover the hero towers too: a spire poking out above the
  // haze band keeps its full contrast and instantly breaks the depth read
  const hTop = baseY - maxH * 1.9;
  const hk2 = 'haze' + tier;
  let hg = ENV_cache(ctx).lin[hk2];
  if (!hg) {
    hg = ctx.createLinearGradient(0, hTop, 0, baseY + 20);
    hg.addColorStop(0, 'rgba(80,90,102,0)');
    hg.addColorStop(0.55, 'rgba(100,110,120,' + (hz * 0.66).toFixed(3) + ')');
    // the bottom of the haze sits in the sodium band, so it warms to match
    hg.addColorStop(1, 'rgba(146,146,138,' + hz.toFixed(3) + ')');
    ENV_cache(ctx).lin[hk2] = hg;
  }
  ctx.fillStyle = hg;
  ctx.fillRect(0, hTop, CW, baseY + 20 - hTop);

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

function drawGothamSkyline(ctx, camX, t, lightning) {
  const L = lightning || 0;
  ctx.save();
  ENV_layer(ctx, camX, t, L, 0);
  ENV_layer(ctx, camX, t, L, 1);
  ENV_layer(ctx, camX, t, L, 2);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  SMOG BANDS
// =====================================================================
function drawCityFog(ctx, camX, t) {
  ctx.save();
  // Smog is grey. The old bands were frankly violet, which put a magenta cast
  // over the entire lower third of the frame — the one place the player is
  // actually looking. One band in three stays warm, because sodium light does
  // tint the smoke it passes through, but it is now dirt-amber rather than
  // traffic-cone orange.
  const stops = [
    [0, 'rgba(118,128,140,0.40)'], [0.4, 'rgba(92,101,112,0.21)'],
    [0.75, 'rgba(70,78,88,0.07)'], [1, 'rgba(62,69,79,0)']
  ];
  const warm = [
    [0, 'rgba(178,142,94,0.28)'], [0.45, 'rgba(142,112,74,0.13)'], [1, 'rgba(112,88,58,0)']
  ];
  const span = 1500;
  for (let i = 0; i < 14; i++) {
    const drift = t * (5 + ENV_rnd(i) * 16) - camX * 0.6 * (0.5 + ENV_rnd2(i, 3) * 0.6);
    let x = ((ENV_rnd2(i, 7) * span) + drift) % span;
    if (x < 0) x += span;
    x -= 270;
    if (x > CW + 300) continue;
    const y = 388 + ENV_rnd2(i, 11) * 106 + Math.sin(t * 0.4 + i * 1.7) * 5;
    const rx = 150 + ENV_rnd2(i, 13) * 210;
    const ry = 11 + ENV_rnd2(i, 17) * 20;
    const a = 0.16 + ENV_rnd2(i, 19) * 0.26;
    ENV_puff(ctx, i % 3 === 0 ? 'fogWarm' : 'fogCool', x, y, rx, ry,
      i % 3 === 0 ? warm : stops, a);
    ENV_puff(ctx, i % 3 === 0 ? 'fogWarm' : 'fogCool', x + rx * 0.5, y + ry * 0.7,
      rx * 0.6, ry * 0.75, i % 3 === 0 ? warm : stops, a * 0.62);
  }
  // a settled ground-level sheet
  const sheet = ENV_linear(ctx, 'fogSheet', 0, 400, 0, 520, [
    [0, 'rgba(112,120,132,0)'], [0.45, 'rgba(108,116,128,0.15)'], [1, 'rgba(88,96,108,0.05)']
  ]);
  ctx.fillStyle = sheet;
  ctx.fillRect(0, 400, CW, 120);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// =====================================================================
//  VIGNETTE
// =====================================================================
function drawForegroundVignette(ctx, lightning) {
  const L = lightning || 0;
  ctx.save();
  const c = ENV_cache(ctx);
  let vg = c.lin['vig'];
  if (!vg) {
    vg = ctx.createRadialGradient(CW * 0.5, CH * 0.46, CH * 0.24, CW * 0.5, CH * 0.5, CW * 0.74);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.52, 'rgba(4,4,12,0.14)');
    vg.addColorStop(0.80, 'rgba(3,3,10,0.42)');
    vg.addColorStop(1, 'rgba(2,2,8,0.72)');
    c.lin['vig'] = vg;
  }
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CW, CH);

  const wash = ENV_linear(ctx, 'wash', 0, 0, 0, CH, [
    [0, 'rgba(136,152,170,0.12)'], [0.30, 'rgba(118,132,148,0.05)'],
    [0.68, 'rgba(18,22,27,0.06)'], [1, 'rgba(6,9,12,0.26)']
  ]);
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, CW, CH);

  if (L > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(150,175,230,' + (L * 0.009).toFixed(3) + ')';
    ctx.fillRect(0, 0, CW, CH);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}


// ═══ TILES ═══════════════════════════════════════
// ============================================================================
// TL_ -- level tiles, blocks and pickups. Canvas2D only, no assets.
// Light direction: upper-left. Top/left faces lit, bottom/right faces shaded.
// ============================================================================

function TL_rnd(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function TL_rnd2(n, k) { const s = Math.sin(n * 269.5 + k * 183.3 + 78.233) * 43758.5453; return s - Math.floor(s); }

const TL_gcache = Object.create(null);
// key -> gradient factory result. Gradients are created at origin (0,0) and the
// caller translates, so they can be reused across every tile of the same size.
function TL_grad(ctx, key, x0, y0, x1, y1, stops) {
  let g = TL_gcache[key];
  if (g) return g;
  g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  TL_gcache[key] = g;
  return g;
}
function TL_rgrad(ctx, key, x0, y0, r0, x1, y1, r1, stops) {
  let g = TL_gcache[key];
  if (g) return g;
  g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
  for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  TL_gcache[key] = g;
  return g;
}

function TL_roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, rr); return; }
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function TL_clearFx(ctx) { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1; }

// --- quarried-stone colour ramp ---------------------------------------------
// Albedo only. The deferred pass supplies every highlight, so these stay dark
// and nearly neutral: separation is by VALUE, with a few counts of warm/cool
// drift so one sett reads as a different block of stone from its neighbour.
// Quantised into a lookup so the per-stone inner loop never builds a string.
const TL_STONEPAL = (function () {
  const a = [];
  for (let w = 0; w < 3; w++) {
    const wm = w - 1;
    for (let i = 0; i < 16; i++) {
      // 46..134. This ramp has been moved twice and it is worth saying why.
      // It started at 20..74, which came out near-black; a probe (painting the
      // stone red) showed colour reaching the screen at about half strength, so
      // it was pushed to 70..165 to compensate. That halving was the contrast
      // pivot crushing everything below 51/255, not a property of the lighting
      // — with the pivot fixed, 70..165 renders as pale concrete and the street
      // stops being the darkest plane in the picture, which is what gives a
      // night exterior its weight. Back down, but not all the way: the original
      // 20..74 was genuinely too dark even under a correct grade.
      //
      // The underlying point still holds: ambient sits near 1.0, so for most of
      // the frame the albedo IS the final value. The playfield has to carry
      // itself; the deferred pass only adds highlights where a light strikes.
      const b = 46 + (i / 15) * 88;
      a.push('rgb(' + ((b + wm * 4.0) | 0) + ',' +
        ((b + wm * 1.2) | 0) + ',' + ((b - wm * 3.0 + 5) | 0) + ')');
    }
  }
  return a;
})();
const TL_PBUF = new Float64Array(16);
function TL_stone(v, w) {
  let i = (v * 15.99) | 0;
  if (i < 0) i = 0; else if (i > 15) i = 15;
  return TL_STONEPAL[w * 16 + i];
}

// --- the canonical bat emblem, drawn into a box of width w centred on (cx,cy) ---
function TL_batPath(ctx, cx, cy, w) {
  const u = w / 100, X = (a) => cx + a * u, Y = (b) => cy + b * u;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(-16));
  ctx.bezierCurveTo(X(6), Y(-26), X(14), Y(-30), X(20), Y(-24));
  ctx.bezierCurveTo(X(22), Y(-14), X(30), Y(-14), X(38), Y(-20));
  ctx.bezierCurveTo(X(46), Y(-26), X(52), Y(-22), X(50), Y(-8));
  ctx.bezierCurveTo(X(49), Y(0), X(46), Y(6), X(40), Y(10));
  ctx.bezierCurveTo(X(34), Y(6), X(30), Y(10), X(31), Y(18));
  ctx.bezierCurveTo(X(24), Y(12), X(16), Y(12), X(11), Y(18));
  ctx.bezierCurveTo(X(8), Y(24), X(4), Y(28), X(0), Y(30));
  ctx.bezierCurveTo(X(-4), Y(28), X(-8), Y(24), X(-11), Y(18));
  ctx.bezierCurveTo(X(-16), Y(12), X(-24), Y(12), X(-31), Y(18));
  ctx.bezierCurveTo(X(-30), Y(10), X(-34), Y(6), X(-40), Y(10));
  ctx.bezierCurveTo(X(-46), Y(6), X(-49), Y(0), X(-50), Y(-8));
  ctx.bezierCurveTo(X(-52), Y(-22), X(-46), Y(-26), X(-38), Y(-20));
  ctx.bezierCurveTo(X(-30), Y(-14), X(-22), Y(-14), X(-20), Y(-24));
  ctx.bezierCurveTo(X(-14), Y(-30), X(-6), Y(-26), X(0), Y(-16));
  ctx.closePath();
}

// ============================================================================
// GROUND
// ============================================================================
// Granite setts bedded in grime. The courses are generated in WORLD space, not
// per tile, so a run of ground reads as one paved surface instead of a row of
// 32px stamps -- that repeating grid was the single loudest tell that this was
// tile art. idx = cx*31 + cy*17 and y is the world row, so both cell
// coordinates can be recovered and used as the seed.
function drawGroundTile(ctx, x, y, s, o) {
  const top = !!(o && o.top), idx = (o && o.idx) | 0;
  const cy = Math.round(y / s), cx = Math.round((idx - cy * 17) / 31);
  const wx0 = cx * s;
  ctx.save();
  ctx.translate(x, y);

  // 1. the bed the setts sit in: wet grime, almost black, so every joint is a
  //    hole rather than a drawn line
  ctx.fillStyle = TL_grad(ctx, 'gbed' + s, 0, 0, 0, s, [
    [0, '#39414c'], [0.5, '#2a313a'], [1, '#1d232a']
  ]);
  ctx.fillRect(0, 0, s, s);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();

  const CP = s / 2;            // nominal course pitch -- quarried, not cobbled
  const SB = 64;               // world-space run the stones of a course repeat in
  const sb0 = Math.floor(wx0 / SB), sb1 = Math.floor((wx0 + s - 0.01) / SB);

  for (let r = -1; r <= 2; r++) {
    const gr = cy * 2 + r;                       // global course index
    const yT = r * CP + (TL_rnd(gr) - 0.5) * 3.4;
    const yB = (r + 1) * CP + (TL_rnd(gr + 1) - 0.5) * 3.4;
    if (yB < -0.5 || yT > s + 0.5) continue;
    const ch = yB - yT;
    // depth cue: lower courses of the mass sit further from the sky
    const depth = top ? (yT / s) * 0.13 : 0.12 + (yT / s) * 0.08;
    // every course slips sideways, so vertical joints never stack
    const ph = TL_rnd(gr * 3 + 1) * SB;

    for (let sb = sb0 - 1; sb <= sb1; sb++) {
      const org = sb * SB - wx0 + ph, end = org + SB;
      if (org > s + 1 || end < -1) continue;
      let px = org;
      for (let k = 0; k < 4 && px < end - 2; k++) {
        const h = TL_rnd2(sb * 9 + k, gr * 3 + 1);
        const h2 = TL_rnd2(sb * 17 + k, gr * 7 + 5);
        let bw = SB * (0.26 + h * 0.22);
        if (px + bw > end - 6) bw = end - px;     // last stone closes the run
        const jw = 1.1 + h2 * 1.0;                // joint width
        const bx = px + jw * 0.5, by = yT + 0.8;
        const bwi = bw - jw, bhi = ch - 1.7;
        px += bw;
        if (bwi < 1.2 || bhi < 1.2 || bx + bwi < -1 || bx > s + 1) continue;

        // chipped corner: one chamfer per stone, knocked off by a century of
        // traffic. Capped so it never eats more than a third of the face.
        const cs = TL_rnd2(sb * 5 + k, gr * 11);
        const chip = cs > 0.52 ? Math.min(bwi, bhi) * (0.12 + (cs - 0.52) * 0.44) : 0;
        const corner = (TL_rnd2(sb * 23 + k, gr) * 4) | 0;
        ctx.beginPath();
        if (chip && corner === 0) ctx.moveTo(bx + chip, by); else ctx.moveTo(bx, by);
        if (chip && corner === 1) { ctx.lineTo(bx + bwi - chip, by); ctx.lineTo(bx + bwi, by + chip); }
        else ctx.lineTo(bx + bwi, by);
        if (chip && corner === 2) { ctx.lineTo(bx + bwi, by + bhi - chip); ctx.lineTo(bx + bwi - chip, by + bhi); }
        else ctx.lineTo(bx + bwi, by + bhi);
        if (chip && corner === 3) { ctx.lineTo(bx + chip, by + bhi); ctx.lineTo(bx, by + bhi - chip); }
        else ctx.lineTo(bx, by + bhi);
        if (chip && corner === 0) ctx.lineTo(bx, by + chip);
        ctx.closePath();

        const hw = TL_rnd2(sb + k * 3, gr * 13);
        const v = 0.22 + h2 * 0.54 + (h - 0.5) * 0.09 - depth;
        ctx.fillStyle = TL_stone(v, hw < 0.26 ? 0 : (hw > 0.80 ? 2 : 1));
        ctx.fill();

        // grime wedged into the joint under and beside every stone
        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.fillRect(bx, by + bhi - 1.2, bwi, 1.2);
        ctx.fillRect(bx + bwi - 1.1, by, 1.1, bhi);
        // the barest cool catch on the worn upper arris -- the lighting pass
        // does the rest, so this only has to say "there is an edge here"
        if (h2 > 0.30) {
          ctx.fillStyle = 'rgba(158,176,200,' + (0.10 + h2 * 0.15).toFixed(3) + ')';
          ctx.fillRect(bx + (chip && corner === 0 ? chip : 0), by,
            bwi - (chip && corner === 1 ? chip : 0) - 1.1, 0.9);
          ctx.fillStyle = 'rgba(142,160,186,' + (0.05 + h2 * 0.08).toFixed(3) + ')';
          ctx.fillRect(bx, by + (chip && corner === 0 ? chip : 0), 0.9,
            bhi - 1.2 - (chip && corner === 3 ? chip : 0));
        }
        // worn dish in the middle of the stone, where boots have been
        if (h > 0.55) {
          ctx.globalAlpha = 0.10 + h * 0.13;
          ctx.fillStyle = '#04060a';
          ctx.beginPath();
          ctx.ellipse(bx + bwi * (0.34 + h2 * 0.32), by + bhi * (0.46 + h * 0.2),
            bwi * 0.22, bhi * 0.20, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        // tooling marks: a couple of chisel scores across the face
        if (h2 < 0.34 && bwi > 7) {
          ctx.globalAlpha = 0.18;
          ctx.fillStyle = '#05070c';
          for (let q = 0; q < 2; q++)
            ctx.fillRect(bx + 1.5 + TL_rnd2(sb * 31 + k, gr + q) * (bwi - 4),
              by + 1.2 + q * bhi * 0.42, 0.9, bhi * 0.36);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  // 2. grain: pecked granite, mostly dark so it reads as pitting not sparkle
  for (let i = 0; i < 14; i++) {
    const px = TL_rnd2(idx * 11 + i, 1) * s;
    const py = TL_rnd2(idx * 11 + i, 2) * s;
    const a = TL_rnd2(idx * 11 + i, 3);
    ctx.fillStyle = a > 0.76 ? 'rgba(160,176,198,0.10)' : 'rgba(0,0,0,0.34)';
    ctx.fillRect(px, py, 1 + (a > 0.9 ? 1 : 0), 1);
  }

  // 3. staining. Exposed tops collect standing water; buried faces weep.
  if (top) {
    // dark, not bright: a film of water DARKENS albedo. The occluder buffer
    // already tags this band as near-mirror, so the renderer puts the shine
    // back as reflection and specular instead of us painting it in.
    ctx.fillStyle = TL_grad(ctx, 'gwet' + s, 0, 0, 0, 7.5, [
      [0, 'rgba(4,7,12,0.46)'], [0.6, 'rgba(6,9,14,0.22)'], [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(0, 0, s, 8);
    // standing water pooled in the low spots between setts
    for (let i = 0; i < 2; i++) {
      const pw = s * (0.18 + TL_rnd2(idx + i * 13, 21) * 0.34);
      ctx.globalAlpha = 0.30 + TL_rnd2(idx + i, 23) * 0.22;
      ctx.fillStyle = '#04060a';
      ctx.fillRect(TL_rnd2(idx + i * 7, 22) * (s - pw), 0.8, pw, 2.4 + TL_rnd2(idx + i, 24) * 2);
      ctx.globalAlpha = 1;
    }
  } else {
    // run-off weeping down the face, and the lime it leaves behind
    for (let i = 0; i < 3; i++) {
      const sx = TL_rnd2(idx * 3 + i * 29, 31) * s;
      const sw = 1.2 + TL_rnd2(idx + i, 32) * 3.4;
      ctx.globalAlpha = 0.10 + TL_rnd2(idx + i * 5, 33) * 0.16;
      ctx.fillStyle = TL_grad(ctx, 'gstain' + s, 0, 0, 0, s, [
        [0, 'rgba(0,0,0,0.9)'], [0.65, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']
      ]);
      ctx.fillRect(sx, 0, sw, s);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  // 4. ambient occlusion down the mass
  ctx.fillStyle = TL_grad(ctx, 'gndao' + s, 0, s * 0.3, 0, s, [
    [0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.30)']
  ]);
  ctx.fillRect(0, 0, s, s);

  if (top) {
    // one cool arris along the walked edge -- enough to carry the silhouette
    // of the playfield against the fog without being a baked highlight
    ctx.fillStyle = 'rgba(176,196,220,0.80)';
    ctx.fillRect(0, 0, s, 1.2);
    ctx.fillStyle = 'rgba(120,142,170,0.36)';
    ctx.fillRect(0, 1.2, s, 1);
    ctx.fillStyle = TL_grad(ctx, 'gndlip' + s, 0, 2.2, 0, 8, [
      [0, 'rgba(0,0,0,0.46)'], [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillRect(0, 2.2, s, 6);
  }

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// STONE BLOCK
// ============================================================================
// Rusticated ashlar: a drafted margin cut round a rough-hewn boss. That is what
// a quarried structural block actually looks like, and it gives the lighting
// pass a real recess to pool shadow in -- unlike the old cross-groove-and-rivets,
// which was a cartoon of a crate.
function drawStoneBlock(ctx, x, y, s, idx) {
  idx = idx | 0;
  ctx.save();
  ctx.translate(x, y);

  // contact shadow
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(2.5, 3.5, s, s);

  const bev = Math.max(2.5, s * 0.115);
  // the drafted margin -- the flat chiselled border, sunk below the boss
  ctx.fillStyle = TL_grad(ctx, 'stbm' + s, 0, 0, s * 0.8, s, [
    [0, '#2b323b'], [0.45, '#1a2027'], [1, '#0b0e13']
  ]);
  ctx.fillRect(0, 0, s, s);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();

  // --- the boss: irregular, because it was never dressed flat ---
  const ins = bev + 0.8, bw = s - ins * 2;
  const j = (k) => (TL_rnd2(idx * 7 + k, 3) - 0.5) * s * 0.045;
  const P = TL_PBUF;
  P[0] = ins + j(0);                 P[1] = ins + j(1);
  P[2] = ins + bw * 0.52 + j(2);     P[3] = ins + j(3);
  P[4] = ins + bw + j(4);            P[5] = ins + j(5);
  P[6] = ins + bw + j(6);            P[7] = ins + bw * 0.48 + j(7);
  P[8] = ins + bw + j(8);            P[9] = ins + bw + j(9);
  P[10] = ins + bw * 0.46 + j(10);   P[11] = ins + bw + j(11);
  P[12] = ins + j(12);               P[13] = ins + bw + j(13);
  P[14] = ins + j(14);               P[15] = ins + bw * 0.5 + j(15);
  const boss = () => {
    ctx.beginPath();
    ctx.moveTo(P[0], P[1]);
    for (let i = 2; i < 16; i += 2) ctx.lineTo(P[i], P[i + 1]);
    ctx.closePath();
  };

  // the channel round the boss is in shade all the way round
  ctx.save();
  ctx.translate(0.9, 1.0);
  boss();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();
  ctx.restore();

  boss();
  ctx.fillStyle = TL_grad(ctx, 'stbb' + s, 0, 0, s * 0.75, s, [
    [0, '#4d5760'], [0.4, '#343c45'], [1, '#191e25']
  ]);
  ctx.fill();

  // rough face: pecked, with the tooling running one way
  ctx.save();
  boss(); ctx.clip();
  for (let i = 0; i < 13; i++) {
    const px = ins + TL_rnd2(idx * 5 + i, 11) * bw;
    const py = ins + TL_rnd2(idx * 5 + i, 12) * bw;
    const a = TL_rnd2(i * 3, idx);
    ctx.fillStyle = a > 0.68 ? 'rgba(170,186,208,0.09)' : 'rgba(0,0,0,0.30)';
    ctx.fillRect(px, py, 1 + (a > 0.88 ? 1.4 : 0), 1 + (a < 0.3 ? 1.2 : 0));
  }
  // short chisel runs, never edge to edge
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const py = ins + (0.22 + i * 0.28) * bw + TL_rnd2(idx + i, 41) * 2.5;
    const x0 = ins + TL_rnd2(idx * 3 + i, 42) * bw * 0.4;
    ctx.beginPath(); ctx.moveTo(x0, py);
    ctx.lineTo(x0 + bw * (0.3 + TL_rnd2(idx + i, 43) * 0.45), py + (TL_rnd2(idx, i) - 0.5) * 2.4);
    ctx.stroke();
  }
  // weeping stain down the face
  ctx.globalAlpha = 0.20 + TL_rnd(idx) * 0.16;
  ctx.fillStyle = TL_grad(ctx, 'stbst' + s, 0, 0, 0, s, [
    [0, 'rgba(0,0,0,0.85)'], [0.7, 'rgba(0,0,0,0.4)'], [1, 'rgba(0,0,0,0)']
  ]);
  ctx.fillRect(ins + TL_rnd2(idx, 51) * bw * 0.7, ins, 1.5 + TL_rnd(idx * 3) * 3, bw);
  ctx.globalAlpha = 1;
  ctx.restore();

  // the raised face meets the channel: lit on the up-light side, dark opposite
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.moveTo(P[4], P[5]); ctx.lineTo(P[6], P[7]); ctx.lineTo(P[8], P[9]);
  ctx.lineTo(P[10], P[11]); ctx.lineTo(P[12], P[13]);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(158,176,202,0.19)';
  ctx.beginPath();
  ctx.moveTo(P[12], P[13]); ctx.lineTo(P[14], P[15]); ctx.lineTo(P[0], P[1]);
  ctx.lineTo(P[2], P[3]); ctx.lineTo(P[4], P[5]);
  ctx.stroke();

  // --- a corner knocked off, exposing a fresh fracture ---
  const ck = TL_rnd(idx * 13);
  if (ck > 0.38) {
    const corner = (TL_rnd(idx * 29) * 4) | 0;
    const cl = s * (0.12 + ck * 0.16);
    ctx.save();
    ctx.translate(s / 2, s / 2);
    ctx.rotate((Math.PI / 2) * corner);
    ctx.translate(-s / 2, -s / 2);
    ctx.beginPath();
    ctx.moveTo(-1, -1); ctx.lineTo(cl, -1);
    ctx.lineTo(cl * 0.45, cl * 0.42); ctx.lineTo(-1, cl * 0.95);
    ctx.closePath();
    ctx.fillStyle = 'rgba(6,8,11,0.92)'; ctx.fill();
    // the break face still catches a little light
    ctx.beginPath();
    ctx.moveTo(cl, -1); ctx.lineTo(cl * 0.45, cl * 0.42); ctx.lineTo(-1, cl * 0.95);
    ctx.strokeStyle = 'rgba(150,168,194,0.16)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // overall occlusion down and right
  ctx.fillStyle = TL_grad(ctx, 'stbao' + s, 0, 0, s, s, [
    [0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,0.10)'], [1, 'rgba(0,0,0,0.42)']
  ]);
  ctx.fillRect(0, 0, s, s);
  // the top arris: this block is a ledge, and ledges are wet
  ctx.fillStyle = 'rgba(158,176,202,0.34)';
  ctx.fillRect(0, 0, s, 1);
  ctx.strokeStyle = 'rgba(0,0,0,0.62)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BRICK BLOCK
// ============================================================================
// Sooted Gotham brick. The old version was a bright pink lattice -- the single
// most saturated thing in a frame that is meant to be near-monochrome. Now it
// is a dark, weathered, mostly-grey wall: the warmth is a couple of counts of
// red, not a hue, and the interest comes from spalled faces, missing bricks and
// lime weeping out of the joints.
function drawBrickBlock(ctx, x, y, s, idx) {
  idx = idx | 0;
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fillRect(2.5, 3.5, s, s);

  // mortar bed, raked back so every joint is a shadow not a line
  ctx.fillStyle = TL_grad(ctx, 'brkm' + s, 0, 0, 0, s, [
    [0, '#1d1d20'], [0.5, '#141416'], [1, '#0a0a0c']
  ]);
  ctx.fillRect(0, 0, s, s);

  const rows = 4, rh = s / rows;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();
  for (let r = 0; r < rows; r++) {
    const stagger = (r % 2) ? -s * 0.25 : 0;
    for (let c = -1; c < 3; c++) {
      const h = TL_rnd2(idx * 13 + c, r);
      const h2 = TL_rnd2(idx * 29 + c * 3, r * 5 + 1);
      const jx = (TL_rnd2(idx + c * 7, r * 11) - 0.5) * 1.4;
      const bx = c * (s / 2) + stagger + 0.9 + jx;
      const by = r * rh + 0.9;
      const bw = s / 2 - 1.9, bh = rh - 1.8;
      if (bx > s || bx + bw < 0) continue;

      // a brick fell out. The hole is the darkest thing on the block.
      if (h2 > 0.90) {
        ctx.fillStyle = '#05060a';
        ctx.fillRect(bx - 0.6, by - 0.6, bw + 1.2, bh + 1.2);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(bx - 0.6, by - 0.6, bw + 1.2, bh * 0.45);
        // the lit lower lip of the recess
        ctx.fillStyle = 'rgba(120,134,152,0.16)';
        ctx.fillRect(bx - 0.6, by + bh - 1, bw + 1.2, 1);
        continue;
      }

      // body: value-led, 4-6 counts of warmth at most
      const v = 0.30 + h * 0.46 - r * 0.05 + (h2 - 0.5) * 0.14;
      const soot = h2 < 0.22 ? 0.45 : 0;        // some are nearly black with soot
      const b = (14 + v * 48) * (1 - soot);
      const cr = (b + 7) | 0, cg = (b + 1) | 0, cb = (b - 3) | 0;

      // spalled faces: a corner or an edge sheared off
      const nib = h > 0.66 ? bh * (0.22 + h * 0.30) : 0;
      const nib2 = h2 > 0.62 ? bh * 0.26 : 0;
      ctx.beginPath();
      ctx.moveTo(bx + nib2 * 0.6, by);
      ctx.lineTo(bx + bw - nib, by);
      if (nib) ctx.lineTo(bx + bw, by + nib); else ctx.lineTo(bx + bw, by);
      ctx.lineTo(bx + bw, by + bh);
      ctx.lineTo(bx + (h > 0.40 ? bh * 0.22 : 0), by + bh);
      ctx.lineTo(bx, by + bh - nib2 * 0.5);
      ctx.closePath();
      ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
      ctx.fill();

      // worn arris, cool because the light is cool -- not a warm brick glow
      ctx.fillStyle = 'rgba(152,166,186,' + (0.07 + h * 0.08).toFixed(3) + ')';
      ctx.fillRect(bx + nib2 * 0.6, by, bw - nib - nib2 * 0.6, 1);
      // bottom/right into the raked joint
      ctx.fillStyle = 'rgba(0,0,0,0.50)';
      ctx.fillRect(bx, by + bh - 1.5, bw, 1.5);
      ctx.fillRect(bx + bw - 1.3, by + nib, 1.3, bh - nib);
      // pitting and frost damage
      for (let p = 0; p < 3; p++) {
        const px = bx + TL_rnd2(idx + c * 3 + p, r * 7) * (bw - 2);
        const py = by + TL_rnd2(idx + c * 5 + p, r * 3) * (bh - 2);
        ctx.fillStyle = p === 0 && h2 > 0.5 ? 'rgba(150,160,176,0.08)' : 'rgba(0,0,0,0.32)';
        ctx.fillRect(px, py, 1.3, 1.1);
      }
    }
  }

  // lime leaching out of the joints and running down the face
  for (let i = 0; i < 2; i++) {
    const sx = TL_rnd2(idx * 19 + i * 5, 61) * s;
    ctx.globalAlpha = 0.07 + TL_rnd2(idx + i, 62) * 0.07;
    ctx.fillStyle = TL_grad(ctx, 'brkeff' + s, 0, 0, 0, s, [
      [0, 'rgba(188,196,206,0)'], [0.3, 'rgba(188,196,206,0.9)'], [1, 'rgba(188,196,206,0)']
    ]);
    ctx.fillRect(sx, 0, 1.4 + TL_rnd2(idx + i * 3, 63) * 2.6, s);
    ctx.globalAlpha = 1;
  }

  // cracks step through the joints the way real brickwork fails, rather than
  // running diagonally across whole bricks
  ctx.strokeStyle = 'rgba(0,0,0,0.70)'; ctx.lineWidth = 1;
  const ncr = 1 + (TL_rnd(idx) > 0.55 ? 1 : 0);
  for (let k = 0; k < ncr; k++) {
    let cx0 = TL_rnd2(idx, k * 3) * s, cy0 = 0;
    ctx.beginPath(); ctx.moveTo(cx0, cy0);
    for (let seg = 1; seg <= 4; seg++) {
      cx0 += (TL_rnd2(idx * 2 + seg, k) - 0.5) * s * 0.30;
      ctx.lineTo(cx0, cy0);                   // run along the bed joint
      cy0 += s / 4;
      ctx.lineTo(cx0, cy0);                   // drop down a perp joint
    }
    ctx.stroke();
  }
  ctx.restore();

  // soot settles at the top, grime pools at the bottom
  ctx.fillStyle = TL_grad(ctx, 'brkao' + s, 0, 0, s, s, [
    [0, 'rgba(170,184,206,0.07)'], [0.45, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.46)']
  ]);
  ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = 'rgba(142,158,180,0.26)';
  ctx.fillRect(0, 0, s, 1);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);

  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// BAT SIGNAL BLOCK (question block)
// ============================================================================
function drawBatSignalBlock(ctx, x, y, s, used, t) {
  ctx.save();
  ctx.translate(x, y);
  const c = s / 2, bev = Math.max(2.5, s * 0.115);
  const mr = s * 0.30;

  if (!used) {
    // the lamp spills onto the air around it. Tighter and cooler than the old
    // sodium bloom -- collectLights() already puts a real point light here, so
    // this only has to seat the housing in its own glow.
    const pulse = 0.58 + 0.42 * Math.sin(t * 2.6);
    ctx.globalAlpha = 0.22 + pulse * 0.20;
    ctx.fillStyle = TL_rgrad(ctx, 'bsglow' + s, c, c, s * 0.26, c, c, s * 1.0, [
      [0, 'rgba(226,186,96,0.75)'], [0.45, 'rgba(176,140,66,0.20)'], [1, 'rgba(150,120,60,0)']
    ]);
    ctx.fillRect(-s * 0.6, -s * 0.6, s * 2.2, s * 2.2);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = 'rgba(0,0,0,0.44)';
  ctx.fillRect(2.5, 3.5, s, s);

  // ---- cast-steel housing. Same material whether it is live or spent. ----
  ctx.fillStyle = TL_grad(ctx, 'bshouse' + s, 0, 0, s * 0.8, s, [
    [0, '#333a44'], [0.42, '#222831'], [1, '#0d1116']
  ]);
  ctx.fillRect(0, 0, s, s);

  // chamfer: a thin cool catch up-light, deep shade down-light
  ctx.fillStyle = 'rgba(150,168,194,0.26)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s, 0); ctx.lineTo(s - bev, bev); ctx.lineTo(bev, bev); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(132,150,176,0.15)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(bev, bev); ctx.lineTo(bev, s - bev); ctx.lineTo(0, s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.44)';
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(s, s); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s - bev, bev); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(bev, s - bev); ctx.lineTo(s - bev, s - bev); ctx.lineTo(s, s); ctx.closePath(); ctx.fill();

  // plate texture: scuffs and a weeping stain, so the casing looks used
  ctx.save();
  ctx.beginPath(); ctx.rect(bev * 0.6, bev * 0.6, s - bev * 1.2, s - bev * 1.2); ctx.clip();
  for (let i = 0; i < 7; i++) {
    const px = TL_rnd2(i * 7 + 3, 71) * s, py = TL_rnd2(i * 11 + 5, 72) * s;
    ctx.fillStyle = TL_rnd2(i, 73) > 0.6 ? 'rgba(170,186,208,0.07)' : 'rgba(0,0,0,0.26)';
    ctx.fillRect(px, py, 1.4, 1.1);
  }
  ctx.restore();

  // four countersunk bolts holding the lens ring on
  const si = bev + s * 0.055;
  for (let i = 0; i < 4; i++) {
    const sx = (i & 1) ? s - si : si, sy = (i & 2) ? s - si : si;
    ctx.beginPath(); ctx.arc(sx, sy, s * 0.045, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0d12'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx - s * 0.012, sy - s * 0.014, s * 0.026, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(146,162,186,0.30)'; ctx.fill();
  }

  // ---- the lens ----
  ctx.beginPath(); ctx.arc(c, c, mr * 1.20, 0, Math.PI * 2);
  ctx.fillStyle = TL_grad(ctx, 'bsring' + s, 0, c - mr, 0, c + mr, [
    [0, '#39414c'], [0.5, '#1d222a'], [1, '#0b0e13']
  ]);
  ctx.fill();
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = 'rgba(152,170,196,0.30)';
  ctx.beginPath(); ctx.arc(c, c, mr * 1.20, Math.PI * 0.85, Math.PI * 1.95); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.60)';
  ctx.beginPath(); ctx.arc(c, c, mr * 1.20, Math.PI * 1.95, Math.PI * 0.85); ctx.stroke();

  ctx.beginPath(); ctx.arc(c, c, mr, 0, Math.PI * 2);
  if (used) {
    // dead glass: dark, with the lamp behind it gone cold
    ctx.fillStyle = TL_rgrad(ctx, 'bslensu' + s, c - mr * 0.35, c - mr * 0.35, mr * 0.05, c, c, mr, [
      [0, '#2b313a'], [0.55, '#171b22'], [1, '#090c11']
    ]);
    ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(c, c, mr, 0, Math.PI * 2); ctx.clip();
    // the filament shattered
    ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const a0 = k * 2.1 + 0.6;
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(a0) * mr * 0.1, c + Math.sin(a0) * mr * 0.1);
      ctx.lineTo(c + Math.cos(a0 + 0.3) * mr, c + Math.sin(a0 + 0.3) * mr);
      ctx.stroke();
    }
    TL_batPath(ctx, c, c + s * 0.01, s * 0.40);
    ctx.fillStyle = 'rgba(8,10,14,0.80)'; ctx.fill();
    ctx.strokeStyle = 'rgba(140,156,180,0.18)'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.restore();
  } else {
    // live: an arc lamp behind a fresnel. The housing stays steel; only the
    // glass carries colour, which is the whole point of a near-monochrome frame.
    ctx.fillStyle = TL_rgrad(ctx, 'bslens' + s, c - mr * 0.3, c - mr * 0.32, mr * 0.04, c, c, mr, [
      [0, '#fff6dc'], [0.30, '#e8bf63'], [0.70, '#8a6520'], [1, '#2a1e09']
    ]);
    ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(c, c, mr, 0, Math.PI * 2); ctx.clip();
    // fresnel steps
    ctx.strokeStyle = 'rgba(28,20,6,0.30)'; ctx.lineWidth = 1;
    for (let k = 1; k <= 3; k++) {
      ctx.beginPath(); ctx.arc(c, c, mr * (k / 3.4), 0, Math.PI * 2); ctx.stroke();
    }
    // the emblem is a stencil in front of the lamp, so it is a HOLE of darkness
    TL_batPath(ctx, c, c + s * 0.01, s * 0.42);
    ctx.fillStyle = 'rgba(14,11,4,0.88)'; ctx.fill();
    ctx.restore();
    // hot core bleeding round the stencil
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 + 0.18 * Math.sin(t * 2.6);
    ctx.fillStyle = TL_rgrad(ctx, 'bshot' + s, c, c, 0, c, c, mr * 1.5, [
      [0, 'rgba(255,232,170,0.55)'], [0.5, 'rgba(226,170,70,0.16)'], [1, 'rgba(200,150,60,0)']
    ]);
    ctx.beginPath(); ctx.arc(c, c, mr * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.62)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);
  TL_clearFx(ctx);
  ctx.restore();
}

// ============================================================================
// GARGOYLE (the "pipe")
// ============================================================================
function drawGargoyle(ctx, x, y, w, h, t) {
  ctx.save();
  ctx.translate(x, y);

  const colTop = Math.min(h * 0.42, h - 8);
  const ch = h - colTop;

  // ---- column ----
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(w * 0.10 + 4, colTop + 5, w * 0.80, ch);
