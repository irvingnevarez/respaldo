<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gotham Voxel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* One deliberate visual world: a night city. Single theme, every colour explicit. */
:root{
  color-scheme:dark;
  --ink:#04060b;
  --night:#0a0e17;
  --gold:#e8c34a;
  --gold-dim:#8a7220;
  --steel:#9db0c8;
  --muted:#5d6b82;
  --alarm:#d94a3f;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{
  background:var(--ink);
  color:var(--steel);
  font-family:Oswald,"Helvetica Neue",system-ui,sans-serif;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
#stage{
  position:relative;
  width:min(100%,1280px);
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  background:var(--ink);
  box-shadow:0 0 0 1px rgba(232,195,74,.20),0 0 40px rgba(232,195,74,.06),0 24px 64px rgba(0,0,0,.85);
  touch-action:none;
}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}

#boot{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,#10182a 0%,#04060b 78%);
  color:var(--steel);letter-spacing:.32em;font-size:13px;text-transform:uppercase;text-align:center;
}
#boot b{font-size:26px;letter-spacing:.42em;color:var(--gold);font-weight:700}
#bar{width:min(260px,60vw);height:3px;background:rgba(157,176,200,.18);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

#rail{
  width:min(100%,1280px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
#rail b{
  color:var(--gold);font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;
  letter-spacing:.04em;font-size:11px;border:1px solid var(--gold-dim);border-radius:4px;padding:2px 6px;margin-right:5px;
}
#rail span{white-space:nowrap}

/* ── touch controls: floating over the picture, sized for thumbs ── */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:132px;height:132px;pointer-events:auto;touch-action:none}
#stick .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(232,195,74,.40);background:rgba(8,10,18,.38)}
#stick .nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(232,195,74,.34);border:1.5px solid rgba(232,195,74,.7)}
#acts{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
.tb{
  -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;
  width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(232,195,74,.55);
  background:rgba(8,10,18,.5);color:var(--gold);font:600 11px/1 Oswald,sans-serif;letter-spacing:.06em;
  display:grid;place-items:center;
}
.tb.big{width:76px;height:76px;grid-column:2}
.tb.on,.tb:active{background:rgba(232,195,74,.34)}
#sys{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;gap:8px;pointer-events:auto}
#sys .tb{width:38px;height:38px;font-size:13px}

@media (pointer:coarse),(max-width:720px){
  #touch{display:block}
  #rail{display:none}
  body{justify-content:flex-start;justify-content:safe center;padding-block:8px;gap:8px}
}
@media (max-width:560px) and (orientation:portrait){
  #stage{aspect-ratio:9/15;width:100%}
  #stick{width:112px;height:112px}
  .tb{width:56px;height:56px}.tb.big{width:68px;height:68px}
  #acts{grid-template-columns:repeat(2,56px);gap:8px}
}
@media (max-height:560px) and (orientation:landscape){
  body{padding-block:6px}
  #stage{height:calc(100dvh - 12px);width:auto;max-width:100%}
}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Mundo abierto de Gotham en vóxeles"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="boot"><b>GOTHAM</b><span id="bootmsg">Generando la ciudad</span><div id="bar"><i id="barfill"></i></div></div>
  <div id="touch">
    <div id="stick"><div class="ring"></div><div class="nub" id="nub"></div></div>
    <div id="acts">
      <button class="tb" id="tbG" type="button" aria-label="Garfio">GARFIO</button>
      <button class="tb" id="tbB" type="button" aria-label="Batarang">BATARANG</button>
      <button class="tb" id="tbP" type="button" aria-label="Golpear">GOLPE</button>
      <button class="tb big" id="tbJ" type="button" aria-label="Saltar y planear">SALTO</button>
    </div>
    <div id="sys"><button class="tb" id="tbM" type="button" aria-label="Mapa">MAPA</button><button class="tb" id="tbS" type="button" aria-label="Sonido">&#9834;</button></div>
  </div>
</div>
<div id="rail">
  <span><b>WASD</b>Mover</span>
  <span><b>Ratón</b>Cámara</span>
  <span><b>Espacio</b>Saltar / planear</span>
  <span><b>Shift</b>Correr</span>
  <span><b>E</b>Garfio</span>
  <span><b>Clic</b>Golpear</span>
  <span><b>F</b>Batarang</span>
  <span><b>Q</b>Esquivar</span>
  <span><b>M</b>Mapa</span>
  <span><b>N</b>Sonido</span>
</div>
<script type="text/plain" id="vx-worker-src">/*WORKER_SRC*/</script>
<script>
