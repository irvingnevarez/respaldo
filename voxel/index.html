// ═══ ANIM ═══
// ═══════════════════════════════════════════════════════════════════════
//  ANIM — turns a few smoothed numbers into the pose of a humanoid.
//
//  The controller never sets an angle. It keeps blend weights (how much is this
//  body walking, airborne, gliding, punching) and this file turns them into joint
//  rotations. Because every input is a weight that eases in and out, no pose ever
//  pops. Rotation conventions, for a part hanging BELOW its joint:
//     rx < 0 swings it forward, rx > 0 swings it back; rz > 0 swings the +x limb out.
//  and for the torso (which stands ABOVE its joint) rx > 0 leans it forward.
// ═══════════════════════════════════════════════════════════════════════

function AN_state() {
  return {
    t: 0, phase: 0, walk: 0, sprint: 0, air: 0, vy: 0, glide: 0, gth: 0.2, swim: 0, land: 0,
    atk: 0, atkP: 0, grap: 0, grapPitch: 0, hurt: 0, dead: 0, aim: 0, aimPitch: 0, stun: 0,
    dodge: 0, dodgeAng: 0, wingFlap: 0, crouch: 0,
    cape: new Float32Array(8),
  };
}

function AN_lerp(a, b, t) { return a + (b - a) * t; }
function AN_clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// 0..1 extension of a strike over its progress: a short wind-up (a little negative),
// a fast strike, a slower recovery.
function AN_strike(p) {
  if (p < 0.26) return -0.28 * (p / 0.26);
  if (p < 0.46) { const q = (p - 0.26) / 0.20; return -0.28 + 1.28 * q * (2 - q); }
  const q = (p - 0.46) / 0.54;
  return 1 - q * q * (3 - 2 * q);
}

// Spring chain for the four cape strips. `fwd` is the speed the body moves along its
// facing, `vy` the vertical speed, `g` the glide blend.
function AN_capeStep(st, dt, fwd, vy, g) {
  const C = st.cape;
  dt = Math.min(dt, 1 / 30);
  const run = AN_clamp(fwd * 0.050, -0.2, 0.85);
  const fall = AN_clamp(-vy * 0.045, -0.35, 1.1);
  const total = 0.10 + run * (1 - g) + fall * (1 - g * 0.6) + g * 0.30;
  let lag = 0;
  for (let i = 0; i < 4; i++) {
    const wave = Math.sin(st.t * (2.0 + 2.4 * g) + i * 0.9) * (0.05 + 0.10 * g + 0.04 * run);
    const target = total / 4 * (0.85 + 0.1 * i) + wave + lag * 0.35;
    const k = 70, d = 9;
    const acc = k * (target - C[i]) - d * C[4 + i];
    C[4 + i] += acc * dt;
    C[i] += C[4 + i] * dt;
    C[i] = AN_clamp(C[i], -0.9, 1.35);
    lag = C[i] - target;
  }
}

// Fill `P` (6 numbers per part) for a humanoid model. Works for Batman (which has a
// cape and wings) and for the thugs (which do not): parts that are missing are
// skipped by index.
function AN_humanoid(M, P, st) {
  P.fill(0);
  const o = i => i * 6;
  const T = o(MD_TORSO), H = o(MD_HEAD), AL = o(MD_ARML), AR = o(MD_ARMR), LL = o(MD_LEGL), LR = o(MD_LEGR);
  const w = st.walk, sp = st.sprint, s = Math.sin(st.phase), c = Math.cos(st.phase);
  const A = w * (0.58 + 0.42 * sp);

  // ── walking / idle ──
  P[LL] = -s * A; P[LR] = s * A;
  P[AL] = s * A * 0.85; P[AR] = -s * A * 0.85;
  P[AL + 2] = 0.07; P[AR + 2] = -0.07;
  P[T] = 0.05 * w + 0.26 * sp * w;                               // lean into the run
  P[T + 1] = s * 0.12 * A;
  P[T + 4] = (Math.abs(c) - 0.6) * 0.8 * w;                      // bob, in voxels
  P[H] = -P[T] * 0.7; P[H + 1] = -P[T + 1] * 1.2;
  const br = Math.sin(st.t * 2.2) * (1 - w);
  P[T + 4] += br * 0.16; P[AL + 2] += br * 0.03; P[AR + 2] -= br * 0.03;

  // ── airborne: a rising pose that opens into a falling one ──
  const a = st.air * (1 - st.glide);
  if (a > 0.001) {
    const f = AN_clamp(-st.vy / 12, 0, 1);
    const lL = AN_lerp(-0.85, -0.25, f), lR = AN_lerp(0.45, 0.20, f);
    const aL = AN_lerp(-1.15, -0.2, f), aR = AN_lerp(-0.55, -0.2, f);
    P[LL] = AN_lerp(P[LL], lL, a); P[LR] = AN_lerp(P[LR], lR, a);
    P[AL] = AN_lerp(P[AL], aL, a); P[AR] = AN_lerp(P[AR], aR, a);
    P[AL + 2] = AN_lerp(P[AL + 2], AN_lerp(0.35, 1.0, f), a); P[AR + 2] = AN_lerp(P[AR + 2], -AN_lerp(0.35, 1.0, f), a);
    P[LL + 2] = 0.10 * a * f; P[LR + 2] = -0.10 * a * f;
    P[T] = AN_lerp(P[T], 0.10, a); P[H] = AN_lerp(P[H], -0.05, a);
  }

  // ── swimming: prone, kicking ──
  if (st.swim > 0.001) {
    const k = st.swim, sw = Math.sin(st.phase * 0.7);
    P[T] = AN_lerp(P[T], 1.2, k); P[H] = AN_lerp(P[H], -0.9, k);
    P[LL] = AN_lerp(P[LL], sw * 0.4, k); P[LR] = AN_lerp(P[LR], -sw * 0.4, k);
    P[AL] = AN_lerp(P[AL], -2.2 + sw * 0.5, k); P[AR] = AN_lerp(P[AR], -2.2 - sw * 0.5, k);
  }

  // ── gliding: horizontal, arms along the leading edge of the opened cape ──
  const g = st.glide;
  const caped = !!M.caped;
  if (caped) { P[o(MD_CAPE0 + 4) + 5] = 999; P[o(MD_CAPE0 + 5) + 5] = 999; }     // wings parked until needed
  if (g > 0.001) {
    P[T] = AN_lerp(P[T], 1.34 + st.gth * 0.8, g);
    P[H] = AN_lerp(P[H], -(1.0 + st.gth * 0.6), g);
    P[T + 4] = AN_lerp(P[T + 4], 0, g);
    P[AL] = AN_lerp(P[AL], 0, g); P[AR] = AN_lerp(P[AR], 0, g);
    P[AL + 2] = AN_lerp(P[AL + 2], 1.22, g); P[AR + 2] = AN_lerp(P[AR + 2], -1.22, g);
    P[LL] = AN_lerp(P[LL], 0.10, g); P[LR] = AN_lerp(P[LR], 0.02, g);
    P[LL + 2] = 0.05 * g; P[LR + 2] = -0.05 * g;
    const fl = Math.sin(st.t * 13) * 0.025 * g;
    const WL = o(MD_CAPE0 + 4), WR = o(MD_CAPE0 + 5);
    if (caped && g > 0.15) {
      P[WL + 5] = 0; P[WR + 5] = 0;
      const open = AN_clamp((g - 0.15) / 0.5, 0, 1);
      P[WL + 2] = -0.38 * open + fl - (1 - open) * 1.2; P[WR + 2] = 0.38 * open - fl + (1 - open) * 1.2;
    }
  }

  // ── landing crouch ──
  if (st.land > 0.001) {
    P[T + 4] -= 3.4 * st.land;
    P[LL] += -0.55 * st.land; P[LR] += 0.65 * st.land;
    P[T] += 0.25 * st.land;
  }

  // ── attacks ──
  if (st.atk) {
    const e = AN_strike(st.atkP);
    switch (st.atk) {
      case 1:                                                      // jab, right arm
        P[AR] = -1.58 * e; P[T + 1] = 0.40 * e; P[LL] += -0.55 * e; P[LR] += 0.45 * e; P[AL] = 0.5 * e; P[AL + 2] = 0.2;
        break;
      case 2:                                                      // hook, left arm
        P[AL] = -1.45 * e; P[AL + 2] = 0.55 * e + 0.07; P[T + 1] = -0.55 * e; P[LR] += -0.55 * e; P[LL] += 0.45 * e; P[AR] = 0.4 * e;
        break;
      case 3:                                                      // kick
        P[LR] = -1.65 * e; P[T] -= 0.30 * e; P[LL] += 0.20 * e;
        P[AL + 2] += 0.65 * e; P[AR + 2] -= 0.65 * e;
        break;
      case 4:                                                      // throw over the shoulder
        P[AR] = -2.1 * e; P[T + 1] = 0.30 * e; P[AR + 2] = -0.25 * e; P[AL] = 0.4 * e;
        break;
      case 5:                                                      // both fists down (slam)
        P[AL] = -3.0 + 2.6 * e; P[AR] = -3.0 + 2.6 * e; P[T] += 0.5 * e;
        break;
    }
  }

  // ── grapple: the right arm points at the anchor ──
  if (st.grap > 0.001) {
    const k = st.grap;
    P[AR] = AN_lerp(P[AR], -(1.5708 + AN_clamp(st.grapPitch, -0.5, 1.1)), k);
    P[AR + 2] = AN_lerp(P[AR + 2], -0.1, k);
    P[T] = AN_lerp(P[T], 0.30, k);
  }

  // ── ranged stance: gun arm forward ──
  if (st.aim > 0.001) {
    P[AR] = AN_lerp(P[AR], -1.45 - st.aimPitch, st.aim);
    P[T + 1] = AN_lerp(P[T + 1], 0.35, st.aim);
  }

  // ── dodge roll: tucked, pitched all the way over ──
  if (st.dodge > 0.001) {
    P[T] = st.dodgeAng; P[T + 4] = -2.0;
    P[LL] = -1.75; P[LR] = -1.75; P[AL] = -1.6; P[AR] = -1.6; P[H] = -0.2;
  }

  // ── hurt, dazed ──
  if (st.hurt > 0.001) { P[T] -= 0.55 * st.hurt; P[H] -= 0.35 * st.hurt; P[AL + 2] += 0.5 * st.hurt; P[AR + 2] -= 0.5 * st.hurt; }
  if (st.stun > 0.001) { P[H + 1] = Math.sin(st.t * 17) * 0.45 * st.stun; P[T] += 0.25 * st.stun; P[AL] = 0; P[AR] = 0; }

  // ── cape ──
  if (caped) for (let i = 0; i < 4; i++) P[o(MD_CAPE0 + i)] = st.cape[i];

  // ── dead: topples backwards and lies on the ground ──
  if (st.dead > 0.001) {
    const d = st.dead;
    P[T] = AN_lerp(P[T], -1.50, d); P[T + 4] = AN_lerp(P[T + 4], -7.6, d);
    P[AL + 2] = AN_lerp(P[AL + 2], 0.7, d); P[AR + 2] = AN_lerp(P[AR + 2], -0.7, d);
    P[LL] = AN_lerp(P[LL], 0, d); P[LR] = AN_lerp(P[LR], 0, d);
  }
  return P;
}


// ═══ FX ═══
// ═══════════════════════════════════════════════════════════════════════
//  FX — particles, projectiles, the grapple rope and floating text.
//
//  Particles and the rope are tiny cubes drawn in one instanced call; there is no
//  texture anywhere. Projectiles are small voxel models. Everything here is
//  simulated on the CPU in fixed-size arrays, so a firefight allocates nothing.
// ═══════════════════════════════════════════════════════════════════════

var FX_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aCorner;        // cube corner, -0.5..0.5
layout(location = 1) in vec3 aNrm;
layout(location = 2) in vec4 aPosSize;       // centre, size
layout(location = 3) in vec4 aColE;          // rgb, emission
uniform mat4 uVP;
out vec3 vW;
out vec4 vCol;
out vec3 vN;
void main() {
  vec3 p = aPosSize.xyz + aCorner * aPosSize.w;
  vW = p; vCol = aColE; vN = aNrm;
  gl_Position = uVP * vec4(p, 1.0);
}`;

var FX_FS = `#version 300 es
precision highp float;
in vec3 vW;
in vec4 vCol;
in vec3 vN;
uniform vec3 uSkyTint;
uniform float uSkyI;
${SH_COMMON}
layout(location = 0) out vec4 oColor;
void main() {
  vec3 albedo = pow(vCol.rgb, vec3(2.2));
  float shade = 0.55 + 0.45 * vN.y * 0.5 + 0.25 * max(dot(vN, uMoonDir), 0.0);
  vec3 col = albedo * uSkyTint * uSkyI * 0.45 * shade;
  col += albedo * vCol.a * 4.0;
  col = mix(col, uFog, fogAmt(vW) * (1.0 - min(vCol.a, 1.0)));
  oColor = vec4(col, 1.0);
}`;

var FX_MAX = 900;

class VxFx {
  constructor(r) {
    this.r = r;
    const gl = r.gl;
    // a unit cube as 36 vertices with flat normals
    const V = [], N = [];
    for (let f = 0; f < 6; f++) {
      const F = MD_FACES[f];
      const q = [[0, 0], [1, 0], [1, 1], [0, 1]].map(function (ab) {
        return [F.b[0] + F.u[0] * ab[0] + F.v[0] * ab[1] - 0.5, F.b[1] + F.u[1] * ab[0] + F.v[1] * ab[1] - 0.5, F.b[2] + F.u[2] * ab[0] + F.v[2] * ab[1] - 0.5];
      });
      for (const i of [0, 1, 2, 0, 2, 3]) { V.push(q[i][0], q[i][1], q[i][2]); N.push(F.n[0], F.n[1], F.n[2]); }
    }
    this.prog = GL_prog(gl, FX_VS, FX_FS, 'fx');
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(V), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    const nb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, nb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(N), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 12, 0);
    this.inst = new Float32Array(FX_MAX * 8);
    this.ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferData(gl.ARRAY_BUFFER, this.inst.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(2, 1);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(3, 1);
    gl.bindVertexArray(null);

    // particle store: x y z  vx vy vz  life max  size  r g b  emit  grav  drag  shrink
    this.P = new Float32Array(FX_MAX * 16); this.n = 0;
    this.glows = [];           // short-lived light sprites: x y z radius r g b intensity life max
    this.texts = [];           // floating text: world position, string, colour, life

    P[o + 6] = life; P[o + 7] = life; P[o + 8] = size; P[o + 9] = r; P[o + 10] = g; P[o + 11] = b;
    P[o + 12] = emit; P[o + 13] = grav; P[o + 14] = drag; P[o + 15] = shrink;
  }

        0.22 + Math.random() * 0.25, 0.07 + Math.random() * 0.06, 1.0, hot ? 0.55 : 0.85, hot ? 0.25 : 0.45, 1.6, 14, 1.5, 1);
    }
  }
  debris(x, y, z, n, rgb, power) {

    for (let i = 0; i < n; i++) {
      const sp = (2 + Math.random() * 6) * power;
      const k = 0.8 + Math.random() * 0.4;
      this.add(x + this.rnd() * 0.25, y + this.rnd() * 0.2, z + this.rnd() * 0.25, this.rnd() * sp, Math.random() * sp + 2, this.rnd() * sp,
        0.55 + Math.random() * 0.5, 0.10 + Math.random() * 0.10, rgb[0] / 255 * k, rgb[1] / 255 * k, rgb[2] / 255 * k, 0, 24, 0.4, 0.7);
    }
  }
  puff(x, y, z, n, size, shade) {

      this.add(x + this.rnd() * 0.3, y + this.rnd() * 0.2, z + this.rnd() * 0.3, this.rnd() * 1.4, 0.8 + Math.random() * 1.6, this.rnd() * 1.4,
        0.6 + Math.random() * 0.5, size * (0.7 + Math.random() * 0.6), s, s, s * 1.1, 0, -1.2, 1.8, -0.9);
    }
  }
  dust(x, y, z, n, power) {

      this.add(x + Math.cos(a) * 0.3, y + 0.08, z + Math.sin(a) * 0.3, Math.cos(a) * sp, 0.6 + Math.random(), Math.sin(a) * sp,
        0.35 + Math.random() * 0.25, 0.10 + Math.random() * 0.08, 0.34, 0.36, 0.40, 0, 2, 4, 0.8);
    }
  }
  burst(x, y, z, n, rgb, emit, power) {

  text(x, y, z, str, color, size) { this.texts.push({ x: x, y: y, z: z, s: str, c: color || '#ffe08a', life: 1.05, max: 1.05, size: size || 1 }); }

  update(dt) {

      P[o + 6] -= dt;
      if (P[o + 6] <= 0) {                                  // swap-remove
        const l = (this.n - 1) * 16;
        if (o !== l) for (let k = 0; k < 16; k++) P[o + k] = P[l + k];

  // Dynamic lights handed to the glow-sprite pass: appended after the world's own.

  }

  // ── drawing ──
  // Called inside the scene pass. Rope points are added here so it is one draw.
  draw(r, cam, ropes) {
    const gl = r.gl, P = this.P, I = this.inst;

    for (let i = 0; i < this.n && m < FX_MAX; i++) {
      const o = i * 16, k = P[o + 6] / P[o + 7];

      const n = Math.min(260, Math.max(2, Math.ceil(L / 0.16)));
      for (let k = 0; k <= n && m < FX_MAX; k++) {
        const t = k / n, q = m++ * 8;
        // a slight sag that vanishes as the rope pulls taut
        const sag = Math.sin(t * Math.PI) * (rp.sag || 0);
        I[q] = rp.ax + dx * t; I[q + 1] = rp.ay + dy * t - sag; I[q + 2] = rp.az + dz * t; I[q + 3] = 0.075;
        I[q + 4] = 0.22; I[q + 5] = 0.23; I[q + 6] = 0.27; I[q + 7] = 0.0;
      }
    }
    if (!m) return;
    const p = this.prog;
    gl.useProgram(p.id);
    gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
    r.common(p, cam);
    gl.uniform3f(p.u('uSkyTint'), r.P.skyTint[0], r.P.skyTint[1], r.P.skyTint[2]);
    gl.uniform1f(p.u('uSkyI'), r.P.skyI);
    gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ib);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, I, 0, m * 8);
    gl.enable(gl.CULL_FACE);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, m);
    gl.bindVertexArray(null);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  PROJECTILES — batarangs, bullets, bolts, cards, bombs.
//  They fly in short steps tested against the voxels and against the bodies they
//  can hurt, so nothing at 44 blocks a second passes through a thin target.
// ═══════════════════════════════════════════════════════════════════════
var PJ_KIND = {
  batarang: { model: 'batarang', spin: 18, r: 0.55, grav: 0, trail: [0.4, 0.8, 1.0] },
  bullet: { model: 'bullet', spin: 0, r: 0.4, grav: 0, trail: [1.0, 0.8, 0.3] },
  bolt: { model: 'bolt', spin: 0, r: 0.5, grav: 0, trail: [1.0, 0.4, 0.2] },
  card: { model: 'card', spin: 14, r: 0.55, grav: 0, trail: [1.0, 0.3, 0.4] },
  bomb: { model: 'bomb', spin: 3, r: 0.5, grav: 22, trail: [1.0, 0.4, 0.2], explode: 3.4 },

function PJ_spawn(o) {
  const k = PJ_KIND[o.kind];
  const p = { kind: o.kind, K: k, x: o.x, y: o.y, z: o.z, vx: o.vx, vy: o.vy, vz: o.vz, dmg: o.dmg || 1, life: o.life || 2, own: o.own || 'enemy',
    target: o.target || null, age: 0, spin: Math.random() * 6, heavy: !!o.heavy, grav: o.grav !== undefined ? o.grav : k.grav, fuse: o.fuse || 0, dead: false };
  GS.projs.push(p);

}

function PJ_explode(p) {
  const K = p.K, R = K.explode || 0;
  if (p.gas) {                                   // a gas canister: a lingering cloud instead of a blast
    GS.zones.push({ x: p.x, y: Math.max(p.y - 0.4, WG_GY + 1.9), z: p.z, r: 4.2, life: 7, t: 0, hurt: 0.3 });
    GS.fx.puff(p.x, p.y + 0.4, p.z, 12, 0.7, 0.3);
    GS.events.push({ t: 'poof' });
    return;
  }
  GS.fx.burst(p.x, p.y, p.z, 26, [1, 0.6, 0.2], 1.6, 1.3);
  GS.fx.puff(p.x, p.y, p.z, 10, 0.55, 0.22);
  GS.fx.glow(p.x, p.y + 0.3, p.z, 7, 1.0, 0.55, 0.2, 5.0, 0.35);
  GS.events.push({ t: 'boom', x: p.x, y: p.y, z: p.z });
  if (R > 0) {
    const pl = GS.player;
    const d = Math.hypot(pl.b.x - p.x, pl.b.y + 0.9 - p.y, pl.b.z - p.z);
    if (d < R && p.own !== 'player' && p.dmg > 0) pl.hurt(p.dmg, pl.b.x - p.x, pl.b.z - p.z, true);
  }
}

function PJ_update(dt) {
  const w = GS.world, pl = GS.player, L = GS.projs;
  for (let i = L.length - 1; i >= 0; i--) {
    const p = L[i], K = p.K;
    p.age += dt; p.life -= dt; p.spin += K.spin * dt;
    if (p.fuse > 0) { p.fuse -= dt; if (p.fuse <= 0) { PJ_explode(p); p.dead = true; } }
    if (p.life <= 0 && !p.dead) { if (K.explode) PJ_explode(p); p.dead = true; }
    if (!p.dead) {
      // homing for the player's batarang: steer toward a living target, but never turn sharply
      if (p.target && p.own === 'player') {
        const t = p.target;
        if (t.dead || t.hp <= 0) p.target = null;
        else {
          const c = t.center(), dx = c[0] - p.x, dy = c[1] - p.y, dz = c[2] - p.z, d = Math.hypot(dx, dy, dz) || 1;
          const sp = Math.hypot(p.vx, p.vy, p.vz) || 1, k = Math.min(1, 7 * dt);
          p.vx += (dx / d * sp - p.vx) * k; p.vy += (dy / d * sp - p.vy) * k; p.vz += (dz / d * sp - p.vz) * k;
          const s2 = Math.hypot(p.vx, p.vy, p.vz) || 1; p.vx *= sp / s2; p.vy *= sp / s2; p.vz *= sp / s2;

        // the world: a voxel at the new point ends the flight
        const nx = p.x + sx, ny = p.y + sy, nz = p.z + sz;
        if (w.isSolid(Math.floor(nx), Math.floor(ny), Math.floor(nz))) {
          GS.fx.sparks(p.x, p.y, p.z, 7, -p.vx * 0.05, -p.vz * 0.05, false);
          GS.fx.debris(p.x, p.y, p.z, 3, [90, 94, 104], 0.5);
          if (K.explode) PJ_explode(p);
          GS.events.push({ t: 'clink', x: p.x, y: p.y, z: p.z });
          p.dead = true; break;
        }
        // bodies
        if (p.own === 'player') {
          const e = EN_hitSegment(p.x, p.y, p.z, sx, sy, sz, K.r);
          if (e) {
            e.damage(p.dmg, p.vx, p.vz, 4);
            GS.fx.sparks(nx, ny, nz, 10, 0, 0, true);
            GS.events.push({ t: 'batHit' });
            p.dead = true; break;
          }
        } else {
          const cx = pl.b.x, cy = pl.b.y + 1.0, cz = pl.b.z;
          const t = PH_segSphere(p.x, p.y, p.z, sx, sy, sz, cx, cy, cz, 0.62 + K.r * 0.5);
          if (t >= 0) {
            if (pl.hurt(p.dmg, p.vx, p.vz, p.heavy)) { GS.fx.sparks(nx, ny, nz, 8, 0, 0, true); }
            if (K.explode) PJ_explode(p);
            p.dead = true; break;
          }
        }
        p.x = nx; p.y = ny; p.z = nz;
      }
    }
    if (!p.dead && K.trail && Math.random() < 0.7) GS.fx.add(p.x, p.y, p.z, 0, 0, 0, 0.22, 0.07, K.trail[0], K.trail[1], K.trail[2], 1.2, 0, 3, 1);
    if (p.dead) { L.splice(i, 1); }
  }
}

function PJ_draw(r) {
  for (const p of GS.projs) {
    const model = GS.models[p.K.model];
    M4_model(PJ_m, p.x, p.y, p.z, Math.atan2(p.vx, p.vz) + (p.K.spin ? 0 : 0), 0, 0, 1);

//  chase, wind-up (a visible, readable tell), strike, recover, stun, dead.

var GS = {

// ── lighting a body: cheap probes against the same voxels the terrain was lit from ──
function EN_lightProbe(x, y, z, L) {
  const w = GS.world;
  L.t -= 1;
  if (L.t > 0) return L;
  L.t = 6 + (Math.random() * 4 | 0);
  let sky = 1;
  const up = w.raycast(x, y + 1.6, z, 0, 1, 0, 36);
  if (up) sky = 0.12 + 0.18 * Math.min(1, up.t / 24);
  else {
    // open overhead; a tall wall close by still takes some of the sky
    const side = [[0.7, 0.7, 0], [-0.7, 0.7, 0], [0, 0.7, 0.7], [0, 0.7, -0.7]];
    let o = 0;
    for (const s of side) if (w.raycast(x, y + 1.6, z, s[0], s[1], s[2], 14)) o++;
    sky = 1 - 0.14 * o;
  }
  const mh = w.raycast(x, y + 1.6, z, BX_MOON.x, BX_MOON.y, BX_MOON.z, 60);
  const moon = mh ? 0 : 1;
  let r = 0, g = 0, b = 0;
  const cx = Math.floor(x / 16), cz = Math.floor(z / 16);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const c = w.chunks.get(JB_key(cx + i, cz + j));
    if (!c) continue;
    for (const e of c.emitters) {
      const dx = e[0] - x, dy = e[1] - (y + 1), dz = e[2] - z, d = Math.hypot(dx, dy, dz);
      if (d > 17) continue;
      const f = (1 - d / 17), k = f * f * e[6];
      r += e[3] * k; g += e[4] * k; b += e[5] * k;
    }
  }
  L.tsky = sky; L.tmoon = moon; L.tbl = [Math.min(1.1, r), Math.min(1.1, g), Math.min(1.1, b)];
  return L;
}
function EN_lightStep(L, dt) {
  const k = 1 - Math.exp(-7 * dt);
  if (L.tsky === undefined) { L.sky = 0.6; L.moon = 0.5; L.bl = [0, 0, 0]; return; }
  L.sky += (L.tsky - L.sky) * k; L.moon += (L.tmoon - L.moon) * k;
  for (let i = 0; i < 3; i++) L.bl[i] += (L.tbl[i] - L.bl[i]) * k;
}

// ═══════════════════════════════════════════════════════════════════════
class Enemy {
  constructor(kind, x, y, z, camp) {
    const T = EN_TYPES[kind];
    this.kind = kind; this.T = T; this.camp = camp || null;
    this.b = PH_body(x, y, z, T.hw, T.h);
    this.a = Math.random() * 6.28;
    this.hp = T.hp; this.dead = false; this.deadT = 0;
    this.state = 'idle'; this.stT = 0; this.alert = false;
    this.st = AN_state(); this.st.t = Math.random() * 10; this.pose = null;
    this.flash = 0; this.stun = 0; this.cool = 1 + Math.random() * 1.5;
    this.home = { x: x, z: z }; this.wanderT = Math.random() * 3; this.wx = x; this.wz = z;
    this.strafe = Math.random() < 0.5 ? 1 : -1; this.stuck = 0; this.lost = 0;
    this.light = { sky: 0.6, moon: 0.5, bl: [0, 0, 0], t: (Math.random() * 6) | 0 };
    this.hit = false; this.model = GS.models[T.model];
    this.isEnemy = true; this.hov = Math.random() * 6.28; this.orbit = Math.random() * 6.28;
    this.slot = false;
  }

  get x() { return this.b.x; } get z() { return this.b.z; }

  damage(dmg, dx, dz, kind) {
    if (this.dead) return false;
    this.hp -= dmg;
    this.flash = 1; this.alert = true; this.state = this.state === 'idle' ? 'chase' : this.state;
    if (this.camp) EN_alertCamp(this.camp);
    const heavy = this.T.heavy;
    const d = Math.hypot(dx, dz) || 1, kb = (kind === 3 ? 10 : (kind === 4 ? 4 : 5.5)) * (heavy ? 0.35 : 1);
    this.b.vx += dx / d * kb; this.b.vz += dz / d * kb;
    if (!this.T.flying) this.b.vy = Math.max(this.b.vy, kind === 3 ? 6.5 : 2.4);
    this.stun = heavy ? (kind === 3 ? 0.45 : 0.12) : (kind === 3 ? 0.7 : 0.38);
    if (this.state === 'windup' && !heavy) this.state = 'stun';
    this.stT = 0;
    const c = this.center();
    GS.fx.sparks(c[0], c[1] + 0.2, c[2], kind === 3 ? 16 : 9, dx / d, dz / d, true);

  }
  return best;
}
// Everything within reach and within `half` radians of facing `a`.
function EN_meleeHit(p, a, reach, half, dmg, kind) {
  let n = 0;
  for (const e of GS.enemies) {
    if (e.dead || e.hp <= 0) continue;
    const dx = e.b.x - p.b.x, dz = e.b.z - p.b.z, d = Math.hypot(dx, dz);
    const rr = reach + (e.T ? e.T.hw : 0.4) + (e.isBoss ? e.reachBonus : 0);
    if (d > rr) continue;
    const dy = e.b.y - p.b.y;
    if (dy > 2.2 || dy < -e.b.h) continue;
    if (d > 0.6 && Math.abs(PL_angDiff(a, Math.atan2(dx, dz))) > half) continue;
    if (e.damage(dmg, dx, dz, kind)) n++;
  }
  if (n > 0) { GS.slow = kind === 3 ? 0.11 : 0.05; p.shake = Math.max(p.shake, kind === 3 ? 0.25 : 0.1); }
  return n;
}
function EN_hitSegment(x, y, z, sx, sy, sz, r) {
  for (const e of GS.enemies) {
    if (e.dead || e.hp <= 0) continue;
    const c = e.center(), rad = Math.max(e.b.hw, e.b.h * 0.5) + r;
    if (PH_segSphere(x, y, z, sx, sy, sz, c[0], c[1], c[2], rad) >= 0) return e;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMPS
// ═══════════════════════════════════════════════════════════════════════
var EN_DANGER = {};
EN_DANGER[WG_D.AZOTEAS] = { p: 0.34, n: [2, 3], mix: ['goon', 'goon', 'clown', 'drone'] };
EN_DANGER[WG_D.PUENTE] = { p: 0.30, n: [2, 3], mix: ['goon', 'clown', 'drone'] };
EN_DANGER[WG_D.MUELLES] = { p: 0.42, n: [2, 4], mix: ['goon', 'clown', 'clown', 'drone'] };
EN_DANGER[WG_D.ARKHAM] = { p: 0.44, n: [3, 4], mix: ['clown', 'clown', 'goon', 'drone', 'heavy'] };
EN_DANGER[WG_D.ALCANT] = { p: 0.44, n: [3, 4], mix: ['clown', 'clown', 'clown', 'goon'] };
EN_DANGER[WG_D.FUNDI] = { p: 0.50, n: [3, 5], mix: ['heavy', 'goon', 'clown', 'drone'] };
EN_DANGER[WG_D.HIELO] = { p: 0.46, n: [3, 4], mix: ['goon', 'goon', 'heavy', 'drone'] };
EN_DANGER[WG_D.CARNAVAL] = { p: 0.50, n: [3, 5], mix: ['clown', 'clown', 'heavy', 'drone', 'goon'] };

var EN_MAX = 22;
var EN_tmpCol = { kind: 0, top: 0, b: null };

// A walkable spot near (cx, cz): a street, sidewalk, plaza, lot or park column.
function EN_findSpot(cx, cz, rad, seed, i) {
  const w = GS.world;
  for (let t = 0; t < 14; t++) {
    const x = Math.floor(cx + ((NZ_hash(seed, i * 17 + t, 3) % 1000) / 500 - 1) * rad);
    const z = Math.floor(cz + ((NZ_hash(seed, i * 17 + t, 5) % 1000) / 500 - 1) * rad);
    if (!WG_isLand(x, z)) continue;
    const ci = WG_colInfo(x, z, EN_tmpCol);
    const k = ci.kind;
    if (k === WG_K.WATER || k === WG_K.BUILDING) continue;
    const y = k === WG_K.ROAD ? WG_GY + 1 : WG_GY + 2;
    const probe = PH_body(x + 0.5, y + 0.01, z + 0.5, 0.45, 2.0);
    if (!PH_free(w, probe, probe.x, probe.y, probe.z)) continue;
    return { x: x + 0.5, y: y, z: z + 0.5 };
  }
  return null;
}

function EN_campAt(bx, bz) {
  const info = WG_blockInfo(bx, bz);
  if (!info.full || info.kind === 'water' || info.kind === 'shore') return null;
  if (info.special) return null;
  const D = EN_DANGER[info.d];
  if (!D) return null;
  const s = NZ_hash(bx, bz, 4242);
  if ((s & 1023) / 1023 > D.p) return null;
  const n = D.n[0] + ((s >>> 10) % (D.n[1] - D.n[0] + 1));
  const open = info.kind === 'plaza' || info.kind === 'yard' || info.kind === 'park';
  // an open block holds its camp inside; otherwise it stands in the crossing at the block's corner
  const cx = open ? info.ox + 19 : bx * WG_PITCH + 5, cz = open ? info.oz + 19 : bz * WG_PITCH + 5;
  return { key: bx + ',' + bz, bx: bx, bz: bz, cx: cx, cz: cz, n: n, seed: s, D: D, rad: open ? 14 : 7 };
}

function EN_manage(dt) {
  GS.mgT = (GS.mgT || 0) - dt;
  if (GS.mgT > 0) return;
  GS.mgT = 0.45;
  const pl = GS.player, w = GS.world;
  const pbx = Math.floor(pl.b.x / WG_PITCH), pbz = Math.floor(pl.b.z / WG_PITCH);
  // despawn camps the player has left far behind
  for (const [key, c] of GS.camps) {
    const d = Math.hypot(c.cx - pl.b.x, c.cz - pl.b.z);
    if (d > 190 && !GS.boss) {
      for (const e of c.list) e.gone = true;
      GS.camps.delete(key);
    }
  }
  if (GS.enemies.length >= EN_MAX || GS.spawnOff || GS.boss) return;
  for (let r = 0; r <= 2; r++) for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
    if (Math.max(Math.abs(i), Math.abs(j)) !== r) continue;
    const bx = pbx + i, bz = pbz + j, key = bx + ',' + bz;
    if (GS.camps.has(key) || GS.cleared.has(key)) continue;
    const cd = EN_campAt(bx, bz);
    if (!cd) { GS.cleared.add(key); continue; }               // never a camp: remember so it is not recomputed
    const d = Math.hypot(cd.cx - pl.b.x, cd.cz - pl.b.z);
    if (d < 38 || d > 120) continue;                            // never pop in on top of the player
    // only once the chunks it stands on are loaded
    if (w.getBlock(Math.floor(cd.cx), WG_GY, Math.floor(cd.cz)) < 0) continue;
    const camp = { key: key, cx: cd.cx, cz: cd.cz, alive: 0, alert: false, list: [] };
    for (let k = 0; k < cd.n; k++) {
      const spot = EN_findSpot(cd.cx, cd.cz, cd.rad, cd.seed, k);
      if (!spot) continue;
      const kind = cd.D.mix[NZ_hash(cd.seed, k, 9) % cd.D.mix.length];
      const e = new Enemy(kind, spot.x, spot.y, spot.z, camp);
      if (kind === 'drone') { e.b.y = spot.y + 4.5; e.home.y = e.b.y; }
      camp.list.push(e); camp.alive++;
      GS.enemies.push(e);
    }
    if (camp.alive) GS.camps.set(key, camp); else GS.cleared.add(key);
    if (GS.enemies.length >= EN_MAX) return;
  }
}

function EN_update(dt) {
  EN_manage(dt);
  const L = GS.enemies;
  for (let i = L.length - 1; i >= 0; i--) {
    const e = L[i];
    e.update(dt);
    if (e.gone) {
      if (e.camp) { const k = e.camp.list.indexOf(e); if (k >= 0) e.camp.list.splice(k, 1); if (!e.dead) e.camp.alive--; }
      L.splice(i, 1);
    }
  }
  // enemies do not stand inside each other
  for (let i = 0; i < L.length; i++) {
    const a = L[i]; if (a.dead || a.T && a.T.flying) continue;
    for (let j = i + 1; j < L.length; j++) {
      const b = L[j]; if (b.dead || b.T && b.T.flying) continue;
      const dx = b.b.x - a.b.x, dz = b.b.z - a.b.z, d = Math.hypot(dx, dz), m = a.b.hw + b.b.hw + 0.15;
      if (d < m && d > 1e-4 && Math.abs(a.b.y - b.b.y) < 1.5) {
        const push = (m - d) * 0.5, ux = dx / d, uz = dz / d;
        if (PH_free(GS.world, a.b, a.b.x - ux * push, a.b.y, a.b.z - uz * push)) { a.b.x -= ux * push; a.b.z -= uz * push; }
        if (PH_free(GS.world, b.b, b.b.x + ux * push, b.b.y, b.b.z + uz * push)) { b.b.x += ux * push; b.b.z += uz * push; }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  PICKUPS
// ═══════════════════════════════════════════════════════════════════════
var PK_m = new Float32Array(16);
function PK_update(dt) {
  const pl = GS.player, L = GS.pickups;
  for (let i = L.length - 1; i >= 0; i--) {
    const p = L[i];
    p.t += dt;
    if (p.vy !== undefined) {                                  // a drop pops up and settles
      p.vy -= 18 * dt; p.y += p.vy * dt;
      const g = GS.world.groundY(p.x, p.z, p.y + 1) + 0.55;
      if (p.y < g) { p.y = g; p.vy = undefined; p.base = g; }
    }
    if (p.life !== undefined) { p.life -= dt; if (p.life <= 0) { L.splice(i, 1); continue; } }
    if (pl.dead) continue;
    const dx = pl.b.x - p.x, dy = pl.b.y + 0.9 - p.y, dz = pl.b.z - p.z, d = Math.hypot(dx, dy, dz);
    const wantsIt = p.kind === 'heart' ? pl.hp < pl.maxHp : (p.kind === 'ammo' ? pl.bats < pl.maxBats : true);
    if (wantsIt && d < 4.2 && p.vy === undefined) { const k = Math.min(1, (4.2 - d) * 5 * dt); p.x += dx * k; p.y += dy * k; p.z += dz * k; }
    if (wantsIt && d < 1.2) {
      if (p.kind === 'heart') { pl.heal(1); GS.fx.text(p.x, p.y + 0.6, p.z, '+1 ❤', '#ff8090', 1); }
      else if (p.kind === 'ammo') { pl.bats = Math.min(pl.maxBats, pl.bats + 4); GS.fx.text(p.x, p.y + 0.6, p.z, '+4 BATARANG', '#9fe8ff', 1); }
      else if (p.kind === 'trophy') { GS.trophies.add(p.id); GS.score += 300; GS.fx.text(p.x, p.y + 0.8, p.z, 'TROFEO +300', '#6ff08a', 1.2); }
      GS.fx.burst(p.x, p.y, p.z, 12, p.kind === 'heart' ? [1, 0.3, 0.4] : (p.kind === 'trophy' ? [0.3, 1, 0.5] : [0.6, 0.9, 1]), 1.5, 0.8);
      GS.events.push({ t: 'pickup', kind: p.kind });
      L.splice(i, 1);
    }
  }
}
function PK_draw(r) {
  const cam = GS.cam;
  for (const p of GS.pickups) {
    const M = GS.models[p.kind === 'heart' ? 'heart' : (p.kind === 'trophy' ? 'trophy' : 'crate')];
    const bob = Math.sin(p.t * 3 + (p.id || 0)) * 0.12;
    M4_model(PK_m, p.x, p.y + bob, p.z, p.t * 1.6, 0, 0, p.kind === 'trophy' ? 1.7 : 1.15);
    const L = p.light || (p.light = { sky: 1, moon: 1, bl: [0.3, 0.3, 0.3] });
    MD_drawModel(r, M, PK_m, M.poseNew(), { sky: 1, moon: 1, bl: [0.2, 0.2, 0.2], emit: 1, rim: [0, 0, 0] });
  }
}


// ═══ PLAYER ═══
// ═══════════════════════════════════════════════════════════════════════
//  PLAYER — Batman: walking, jumping, the cape glide, the grapple, fists and
//  batarangs, and the camera that follows him.
//
//  Everything that feels like "movement" is a few rules on top of the voxel
//  physics: the glide steers by the camera, the grapple pulls to the nearest
//  ledge of whatever wall you aim at, and the punch pulls you onto its target so
//  that it connects. The rules are tuned for a city built of towers.
// ═══════════════════════════════════════════════════════════════════════

var PL_WALK = 7.4, PL_SPRINT = 11.8, PL_JUMP = 10.7;
var PL_REACH = 3.5;                 // punch reach
var PL_GRAP_RANGE = 85;

function PL_angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

class Player {
  constructor(x, y, z) {
    this.b = PH_body(x, y, z, 0.3, 1.8);
    this.a = 0;
    this.hp = 5; this.maxHp = 5; this.bats = 8; this.maxBats = 15; this.batRegen = 0;
    this.inv = 0; this.dead = false; this.deadT = 0;
    this.mode = 'ground';
    this.coyote = 0; this.jumpBuf = 0; this.airT = 0; this.cutDone = false;
    this.gl = { v: 0, th: 0, head: 0, bank: 0 };
    this.glideCd = 0;
    this.grap = null; this.grapCd = 0; this.grapHint = 0;
    this.atkT = 0; this.atkDur = 0.4; this.atkKind = 0; this.combo = 0; this.comboWin = 0; this.atkHit = true; this.atkQueue = false;
    this.lunge = 0; this.lungeX = 0; this.lungeZ = 0;
    this.batT = 0; this.batCd = 0; this.batFired = true;
    this.dodgeT = 0; this.dodgeCd = 0; this.dodgeX = 0; this.dodgeZ = 0;
    this.kbx = 0; this.kbz = 0; this.stunT = 0;
    this.st = AN_state();
    this.pose = null;
    this.speedH = 0;
    this.fallV = 0;
    this.lastSafe = { x: x, y: y, z: z };
    this.shake = 0;
    this.light = { sky: 0.6, moon: 0.5, bl: [0, 0, 0], t: 0 };
    this.stepT = 0;
    this.events = [];                 // things the game should react to: 'land','jump','punch', ...
  }

  get x() { return this.b.x; } get y() { return this.b.y; } get z() { return this.b.z; }
  eye() { return [this.b.x, this.b.y + 1.62, this.b.z]; }
  chest() { return [this.b.x, this.b.y + 1.1, this.b.z]; }

  // ── damage ───────────────────────────────────────────────────────────────
  hurt(dmg, fx, fz, heavy) {
    if (this.dead || this.inv > 0 || this.dodgeT > 0.08) return false;
    this.hp = Math.max(0, this.hp - dmg);
    this.inv = 1.1;
    const d = Math.hypot(fx, fz) || 1;
    this.kbx = fx / d * (heavy ? 9 : 5.5); this.kbz = fz / d * (heavy ? 9 : 5.5);
    if (this.mode === 'glide') this.mode = 'air';
    if (this.grap) this.releaseGrapple(false);
    this.st.hurt = 1; this.shake = Math.max(this.shake, heavy ? 0.45 : 0.28);
    this.atkT = 0; this.batT = 0; this.combo = 0;
    this.events.push('hurt');
    if (this.hp <= 0) { this.dead = true; this.deadT = 0; this.mode = 'dead'; this.events.push('die'); }
    return true;
  }
  heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); }

  respawn(x, y, z) {
    this.b.x = x; this.b.y = y; this.b.z = z; this.b.vx = this.b.vy = this.b.vz = 0;
    this.hp = this.maxHp; this.dead = false; this.mode = 'air'; this.inv = 2.0; this.st.dead = 0; this.st.hurt = 0;
    this.grap = null; this.atkT = 0; this.combo = 0; this.kbx = this.kbz = 0;
    this.bats = Math.max(this.bats, 6);
  }

  // ── the frame ────────────────────────────────────────────────────────────
  update(dt, cam, world, GSx) {
    const b = this.b, st = this.st;
    st.t += dt;
    this.inv = Math.max(0, this.inv - dt);
    this.glideCd = Math.max(0, this.glideCd - dt);
    this.grapCd = Math.max(0, this.grapCd - dt);
    this.batCd = Math.max(0, this.batCd - dt);
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.stunT = Math.max(0, this.stunT - dt);
    this.shake = Math.max(0, this.shake - dt * 1.6);
    st.hurt = Math.max(0, st.hurt - dt * 5);
    this.comboWin = Math.max(0, this.comboWin - dt);
    if (this.comboWin <= 0 && this.atkT <= 0) this.combo = 0;
    this.batRegen += dt;
    if (this.batRegen > 11) { this.batRegen = 0; if (this.bats < 5) this.bats++; }

    if (this.dead) { this.updateDead(dt, world); return; }

    // ── what the player is asking for ──
    const mv = IN_move();
    const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    let wx = cy * mv.x + sy * mv.z, wz = sy * mv.x - cy * mv.z;
    const mag = Math.hypot(wx, wz);
    const want = IN.sprint && mag > 0.3;
    const jumpEdge = IN.jumpEdge, jumpHeld = IN.jump;
    if (jumpEdge) this.jumpBuf = 0.13;
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);

    // dodge roll
    if (IN.dodgeEdge && this.dodgeCd <= 0 && this.dodgeT <= 0 && (b.onGround || this.mode === 'ground') && this.atkT <= 0.12 && !this.grap) {
      let dx = wx, dz = wz;
      if (mag < 0.2) { dx = Math.sin(this.a); dz = Math.cos(this.a); }
      const l = Math.hypot(dx, dz) || 1;
      this.dodgeX = dx / l; this.dodgeZ = dz / l; this.dodgeT = 0.46; this.dodgeCd = 0.75;
      this.a = Math.atan2(this.dodgeX, this.dodgeZ);
      this.events.push('dodge');
    }

    // attacks
    if (IN.attackEdge) this.tryPunch(GSx, wx, wz, mag);
    if (IN.batEdge) this.tryBatarang(GSx, cam);
    if (IN.grappleEdge) { if (this.grap) { /* second press: let go */ this.releaseGrapple(true); } else this.tryGrapple(world, cam); }

    // ── mode logic ──
    const wasGround = b.onGround;
    if (b.onGround) { this.coyote = 0.11; this.airT = 0; } else { this.coyote = Math.max(0, this.coyote - dt); this.airT += dt; }

    // water takes over from everything but a grapple
    if (b.inWater && !this.grap) { if (this.mode === 'glide') this.mode = 'air'; this.mode = 'swim'; }
    else if (this.mode === 'swim') this.mode = b.onGround ? 'ground' : 'air';

    if (this.grap) this.stepGrapple(dt, world, jumpEdge);
    else if (this.mode === 'glide') this.stepGlide(dt, cam, mv, jumpEdge, world);
    else if (this.mode === 'swim') this.stepSwim(dt, wx, wz, mag, jumpHeld);
    else this.stepWalk(dt, wx, wz, mag, want, jumpEdge, jumpHeld, world);

    // punches and lunges move the body regardless of the mode (except the grapple)
    this.stepAttack(dt, GSx, world);

    // knockback
    if (this.kbx || this.kbz) {
      b.vx += this.kbx; b.vz += this.kbz; this.kbx = this.kbz = 0;
      if (b.onGround) b.vy = Math.max(b.vy, 3.2);
    }

    // dodge overrides horizontal control
    if (this.dodgeT > 0) {
      this.dodgeT -= dt;
      const k = Math.max(0, this.dodgeT / 0.46);
      const sp = 7 + 7 * k;
      b.vx = this.dodgeX * sp; b.vz = this.dodgeZ * sp;
      st.dodge = 1; st.dodgeAng = (1 - k) * Math.PI * 2;
    } else st.dodge = Math.max(0, st.dodge - dt * 8);

    // ── integrate ──
    const px = b.x, pz = b.z;
    PH_move(world, b, dt);
    if (wasGround && !b.onGround && b.vy <= 0 && this.mode === 'ground' && this.coyote > 0.05 && !this.grap) {
      // a kerb or a stair going down is a step, not a fall
      PH_stick(world, b, 1.06);
    }
    if (b.onGround && !wasGround) this.land(world);
    // lava: stand on it and it burns; the hurt throws you clear
    this.burnT = Math.max(0, (this.burnT || 0) - dt);
    if (b.groundBlock === BK.LAVA && b.onGround && this.burnT <= 0 && !this.dead) {
      this.burnT = 0.35;
      if (this.hurt(1, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, false)) { b.vy = 10; b.onGround = false; this.events.push('burn'); }
      else b.vy = Math.max(b.vy, 6);
    }
    this.speedH = Math.hypot(b.x - px, b.z - pz) / Math.max(dt, 1e-4);
    if (b.onGround && this.mode !== 'ground' && this.mode !== 'swim' && !this.grap) { this.mode = 'ground'; this.glideCd = 0; }
    if (!b.onGround && this.mode === 'ground') this.mode = 'air';
    if (b.onGround && !b.inWater) { this.lastSafe.x = b.x; this.lastSafe.y = b.y; this.lastSafe.z = b.z; }
    if (b.y < 6) { this.respawn(this.lastSafe.x, this.lastSafe.y + 0.5, this.lastSafe.z); }   // never lost under the world

    this.animate(dt, world);
  }

  // ── walking, jumping, air control ────────────────────────────────────────
  stepWalk(dt, wx, wz, mag, sprint, jumpEdge, jumpHeld, world) {
    const b = this.b, st = this.st;
    const top = sprint ? PL_SPRINT : PL_WALK;
    let tx = wx * top, tz = wz * top;
    const accel = b.onGround ? 64 : 22;
    // in the air, keep what you have if it is more than you could build
    let dvx = tx - b.vx, dvz = tz - b.vz;
    const dl = Math.hypot(dvx, dvz);
    if (dl > 1e-5) {
      let step = accel * dt;
      if (mag < 0.05 && b.onGround) step = 78 * dt;                         // brake
      if (!b.onGround && mag < 0.05) step = 2.0 * dt;                       // momentum carries
      const k = Math.min(dl, step) / dl;
      b.vx += dvx * k; b.vz += dvz * k;
    }
    // facing
    if (mag > 0.15 && this.atkT <= 0) {
      const ta = Math.atan2(wx, wz);
      this.a += PL_angDiff(this.a, ta) * (1 - Math.exp(-17 * dt));
    }
    // gravity and jumping
    if (b.onGround) { b.vy = Math.min(b.vy, 0); this.cutDone = false; }
    else { b.vy = Math.max(b.vy - PH_GRAV * dt, -60); }
    if (this.jumpBuf > 0 && (b.onGround || this.coyote > 0) && this.dodgeT <= 0) {
      b.vy = PL_JUMP; b.onGround = false; this.coyote = 0; this.jumpBuf = 0; this.cutDone = false; this.mode = 'air';
      this.events.push('jump');
    } else if (jumpEdge && !b.onGround && this.mode === 'air' && this.glideCd <= 0 && this.airT > 0.12) {
      this.startGlide();
    }
    // let go of jump early for a short hop
    if (!jumpHeld && b.vy > 4.5 && !this.cutDone && this.mode === 'air') { b.vy = 4.5; this.cutDone = true; }
    this.fallV = Math.min(this.fallV, b.vy);
  }

  stepSwim(dt, wx, wz, mag, jumpHeld) {
    const b = this.b;
    const sp = (IN.sprint ? 5.6 : 3.9);
    let dvx = wx * sp - b.vx, dvz = wz * sp - b.vz;
    const k = 1 - Math.exp(-4.5 * dt);
    b.vx += dvx * k; b.vz += dvz * k;
    // buoyancy: float with the head just out, swim up when asked, sink slowly otherwise
    const surface = WG_SEA + 1.0 - 1.25;
    let ty = (b.y < surface - 0.2 ? 2.6 : (b.y > surface + 0.1 ? -2.2 : 0));
    if (jumpHeld) ty = 4.4;
    if (!b.headWater && b.y > surface + 0.05 && !jumpHeld) ty = -2.0;
    b.vy += (ty - b.vy) * (1 - Math.exp(-5 * dt));
    if (mag > 0.15) this.a += PL_angDiff(this.a, Math.atan2(wx, wz)) * (1 - Math.exp(-9 * dt));
    this.st.phase += dt * 5;
    // climb out onto a ledge: pressing against solid ground at the surface lets the step-up carry the body
    if (jumpHeld && (b.hitX || b.hitZ)) b.vy = Math.max(b.vy, 6.5);
  }

  // ── gliding ──────────────────────────────────────────────────────────────
  startGlide() {
    const b = this.b, g = this.gl;
    const hs = Math.hypot(b.vx, b.vz);
    g.v = Math.max(11.5, hs * 1.05);
    g.th = AN_clamp(Math.atan2(-b.vy, Math.max(hs, 4)), -0.1, 0.7);
    g.head = hs > 1.5 ? Math.atan2(b.vx, b.vz) : this.a;
    g.bank = 0;
    this.mode = 'glide'; this.events.push('glide');
  }
  stepGlide(dt, cam, mv, jumpEdge, world) {
    const b = this.b, g = this.gl;
    if (jumpEdge || this.glideCd > 0) { this.mode = 'air'; this.glideCd = 0.25; return; }
    // heading follows where the camera looks, at a limited turn rate; A and D add to it
    const camHead = Math.atan2(Math.sin(cam.yaw), -Math.cos(cam.yaw));
    let dh = PL_angDiff(g.head, camHead);
    const rate = 2.1 + Math.abs(mv.x) * 0.5;
    const turn = AN_clamp(dh * 3.0, -rate, rate) + mv.x * 0.7;
    g.head += turn * dt;
    g.bank += (AN_clamp(-turn * 0.34, -0.7, 0.7) - g.bank) * (1 - Math.exp(-6 * dt));
    // flight path angle follows the camera pitch (look down to dive, up to flare); W and S nudge it
    const thT = AN_clamp(-cam.pitch * 1.15 + 0.17 + mv.z * 0.16, -0.30, 1.0);
    g.th += AN_clamp(thT - g.th, -2.4 * dt, 2.4 * dt);
    // energy: a dive builds speed, a climb spends it, drag bounds both
    g.v += (22 * Math.sin(g.th) - 0.0205 * g.v * g.v) * dt;
    if (g.v < 9.6) g.th = Math.max(g.th, 0.22 + (9.6 - g.v) * 0.25);     // stall: the nose drops
    g.v = AN_clamp(g.v, 7.5, 36);
    const ch = Math.cos(g.th);
    b.vx = Math.sin(g.head) * ch * g.v; b.vz = Math.cos(g.head) * ch * g.v; b.vy = -Math.sin(g.th) * g.v;
    this.a = g.head;
    if (b.hitX || b.hitZ) g.v = Math.max(8, g.v * 0.55);
    if (b.hitUp) g.th = Math.max(g.th, 0.3);
  }

  // ── landing ──────────────────────────────────────────────────────────────
  land(world) {
    const b = this.b, st = this.st;
    const v = -this.fallV;
    this.fallV = 0;
    if (this.mode === 'glide') { this.mode = 'ground'; }
    st.land = AN_clamp((v - 8) / 30, 0.15, 1);
    if (v > 6) this.events.push(v > 22 ? 'landHard' : 'land');
    if (v > 24) this.shake = Math.max(this.shake, 0.2);
    if (v > 15 && b.groundBlock !== BK.WATER) this.events.push({ t: 'dust', v: v });
  }

  // ── the grapple ──────────────────────────────────────────────────────────
  // Aim along the camera. A wall is climbed to its nearest ledge; a top face is a
  // point to swing to.
  findGrapple(world, cam) {
    const ox = cam.x, oy = cam.y, oz = cam.z;
    // aim from the camera, but a surface behind the player must not catch the hook
    let h = world.raycast(ox + cam.fx * 1.2, oy + cam.fy * 1.2, oz + cam.fz * 1.2, cam.fx, cam.fy, cam.fz, PL_GRAP_RANGE);
    if (!h) return null;
    const px = this.b.x, pz = this.b.z, py = this.b.y + 1.2;
    const hx = ox + cam.fx * (h.t + 1.2), hy = oy + cam.fy * (h.t + 1.2), hz = oz + cam.fz * (h.t + 1.2);
    const dist = Math.hypot(hx - px, hy - py, hz - pz);
    if (dist > PL_GRAP_RANGE || dist < 2.2) return null;
    let g = null;
    if (h.ny > 0.5) {
      // a floor or roof: pull to a point just above it
      g = { kind: 'top', ax: h.x + 0.5, ay: h.y + 1, az: h.z + 0.5, px: h.x + 0.5, py: h.y + 1.05, pz: h.z + 0.5, nx: 0, nz: 0 };
    } else if (h.ny < -0.5) {
      g = { kind: 'under', ax: h.x + 0.5, ay: h.y, az: h.z + 0.5, px: h.x + 0.5, py: h.y - 2.0, pz: h.z + 0.5, nx: 0, nz: 0 };
    } else {
      // a wall: find the lip. Walk up the column from the hit until it ends, and
      // require standing room (two free cells) on top of it.
      let y = h.y, top = -1;
      for (let k = 0; k < 70 && y < WG_H - 3; k++, y++) {
        if (!world.isSolid(h.x, y + 1, h.z) && !world.isSolid(h.x, y + 2, h.z) && !world.isSolid(h.x, y + 3, h.z)) { top = y; break; }
      }
      if (top < 0) return null;
      const nx = h.nx, nz = h.nz;
      g = { kind: 'wall', ax: h.x + 0.5, ay: top + 1, az: h.z + 0.5,
            px: h.x + 0.5 + nx * 0.9, py: top + 1.15, pz: h.z + 0.5 + nz * 0.9, nx: nx, nz: nz };
      // the pull-up point must itself be open air
      const probe = PH_body(g.px, g.py, g.pz, 0.3, 1.8);
      if (!PH_free(world, probe, g.px, g.py, g.pz)) {
        g.px = h.x + 0.5 + nx * 1.4; g.pz = h.z + 0.5 + nz * 1.4;
        probe.x = g.px; probe.z = g.pz;
        if (!PH_free(world, probe, g.px, g.py, g.pz)) return null;
      }
    }
    g.dist = Math.hypot(g.px - px, g.py - py, g.pz - pz);
    return g;
  }
  tryGrapple(world, cam) {
    if (this.grapCd > 0 || this.dead || this.dodgeT > 0) return;
    const g = this.findGrapple(world, cam);
    this.grapCd = 0.3;
    if (!g) { this.events.push('grappleMiss'); this.grapMiss = 0.25; this.missDir = [cam.fx, cam.fy, cam.fz]; return; }
    g.t = 0; g.phase = 'fly'; g.age = 0; g.speed = 12; g.stuck = 0;
    this.grap = g; this.mode = 'air';
    if (this.b.onGround) { this.b.vy = Math.max(this.b.vy, 0); }
    this.events.push('grapple');
  }
  stepGrapple(dt, world, jumpEdge) {
    const b = this.b, g = this.grap, st = this.st;
    g.age += dt;
    if (g.phase === 'fly') {
      // the hook crosses the gap quickly before the pull starts
      g.t += dt / Math.max(0.10, Math.min(0.3, g.dist / 300));
      b.vy = Math.max(b.vy - PH_GRAV * dt * 0.4, -20);
      if (g.t >= 1) { g.t = 1; g.phase = 'pull'; this.events.push('grappleHit'); }
      if (jumpEdge) this.releaseGrapple(true);
      return;
    }
    // pull: accelerate toward the pull point, ease off on arrival
    const dx = g.px - b.x, dy = g.py - b.y, dz = g.pz - b.z;
    const d = Math.hypot(dx, dy, dz);
    g.speed = Math.min(40, g.speed + 150 * dt);
    const sp = Math.min(g.speed, 6 + d * 7);
    if (d > 0.01) { b.vx = dx / d * sp; b.vy = dy / d * sp; b.vz = dz / d * sp; }
    this.a += PL_angDiff(this.a, Math.atan2(dx, dz)) * (1 - Math.exp(-10 * dt));
    if (jumpEdge) { this.releaseGrapple(true); return; }
    // blocked for a while (the path is not clear): give up rather than grind
    if (b.hitX || b.hitZ || b.hitUp) g.stuck += dt; else g.stuck = Math.max(0, g.stuck - dt);
    if (g.stuck > 0.35 || g.age > 4) { this.releaseGrapple(false); return; }
    if (d < 1.1) this.arriveGrapple();
  }
  arriveGrapple() {
    const b = this.b, g = this.grap;
    if (g.kind === 'wall') {
      // over the lip: a short hop inward carries the body onto the roof
      b.vx = -g.nx * 4.6; b.vz = -g.nz * 4.6; b.vy = 7.2;
      this.a = Math.atan2(-g.nx, -g.nz);
      this.events.push('vault');
    } else if (g.kind === 'top') {
      b.vy = Math.max(b.vy * 0.5, 4.5);
      b.vx *= 0.6; b.vz *= 0.6;
    } else { b.vx *= 0.3; b.vy = 0; b.vz *= 0.3; }
    this.grap = null; this.glideCd = 0; this.grapCd = 0.2; this.cutDone = true; this.airT = 0.2;
  }
  releaseGrapple(keep) {
    const b = this.b;
    if (this.grap) {
      if (keep) { b.vx *= 0.9; b.vz *= 0.9; b.vy = Math.max(b.vy * 0.9, this.grap.phase === 'pull' ? 4 : b.vy); }
      else { b.vx *= 0.4; b.vz *= 0.4; b.vy *= 0.4; }
    }
    this.grap = null; this.grapCd = 0.25; this.mode = 'air'; this.cutDone = true; this.airT = 0.25;
  }

  // ── fists ────────────────────────────────────────────────────────────────
  tryPunch(GSx, wx, wz, mag) {
    if (this.dead || this.grap || this.dodgeT > 0) return;
    if (this.atkT > 0) {                       // already swinging: queue the next one for the end of this one
      if (this.atkT < this.atkDur * 0.62) this.atkQueue = true;
      return;
    }
    this.startPunch(GSx, wx, wz, mag);
  }
  startPunch(GSx, wx, wz, mag) {
    this.combo = this.comboWin > 0 ? (this.combo % 3) + 1 : 1;
    this.atkKind = this.combo === 3 ? 3 : (this.combo === 2 ? 2 : 1);
    this.atkDur = this.combo === 3 ? 0.50 : 0.38;
    this.atkT = this.atkDur; this.atkHit = false; this.atkQueue = false; this.comboWin = 0.9;
    // aim assist: the enemy nearest the direction of travel (or of facing) within reach
    const dir = mag > 0.25 ? Math.atan2(wx, wz) : this.a;
    const t = GSx ? EN_pickTarget(this.b.x, this.b.z, dir, 7.5, 1.15) : null;
    if (t) {
      this.a = Math.atan2(t.b.x - this.b.x, t.b.z - this.b.z);
      const d = Math.hypot(t.b.x - this.b.x, t.b.z - this.b.z);
      this.lunge = d > PL_REACH * 0.55 ? 0.14 : 0; this.lungeX = Math.sin(this.a); this.lungeZ = Math.cos(this.a);
      this.lungeSp = Math.min(22, Math.max(6, (d - 1.4) / 0.14));
    } else {
      if (mag > 0.25) this.a = dir;
      this.lunge = 0.08; this.lungeX = Math.sin(this.a); this.lungeZ = Math.cos(this.a); this.lungeSp = 4.5;
    }
    this.events.push('swing');
  }
  stepAttack(dt, GSx, world) {
    const b = this.b, st = this.st;
    if (this.atkT > 0) {
      this.atkT -= dt;
      const p = 1 - Math.max(0, this.atkT) / this.atkDur;
      st.atk = this.atkKind; st.atkP = Math.min(1, p);
      if (this.lunge > 0) {
        this.lunge -= dt;
        b.vx = this.lungeX * this.lungeSp; b.vz = this.lungeZ * this.lungeSp;
      } else if (b.onGround) { b.vx *= 0.8; b.vz *= 0.8; }
      if (!this.atkHit && p >= 0.40) {
        this.atkHit = true;
        const dmg = this.atkKind === 3 ? 2 : 1;
        const n = EN_meleeHit(this, this.a, PL_REACH, 1.05, dmg, this.atkKind);
        if (n > 0) { this.events.push({ t: 'hit', n: n, kind: this.atkKind }); }
        else this.events.push('whoosh');
      }
      if (this.atkT <= 0) {
        st.atk = 0;
        if (this.atkQueue) { this.atkQueue = false; this.startPunch(GSx, 0, 0, 0); }
      }
    } else if (this.batT > 0) {
      this.batT -= dt;
      const p = 1 - Math.max(0, this.batT) / 0.42;
      st.atk = 4; st.atkP = Math.min(1, p);
      if (!this.batFired && p >= 0.45) { this.batFired = true; this.fireBatarang(); }
      if (this.batT <= 0) st.atk = 0;
    } else st.atk = 0;
  }

  // ── batarang ─────────────────────────────────────────────────────────────
  tryBatarang(GSx, cam) {
    if (this.dead || this.bats <= 0 || this.batCd > 0 || this.batT > 0 || this.atkT > 0.15 || this.grap) return;
    this.batCd = 0.35; this.batT = 0.42; this.batFired = false; this.batCam = { x: cam.x, y: cam.y, z: cam.z, fx: cam.fx, fy: cam.fy, fz: cam.fz };
    // turn to face the throw
    this.a = Math.atan2(cam.fx, cam.fz);
  }
  fireBatarang() {
    const c = this.batCam;
    const hand = [this.b.x + Math.sin(this.a) * 0.5, this.b.y + 1.35, this.b.z + Math.cos(this.a) * 0.5];
    // the target: whatever is nearest the crosshair, within a narrow cone
    const t = EN_pickCrosshair(c, 60, 0.16);
    let dx = c.fx, dy = c.fy, dz = c.fz;
    if (t) {
      const tp = t.center();
      dx = tp[0] - hand[0]; dy = tp[1] - hand[1]; dz = tp[2] - hand[2];
    } else {
      // aim at what the crosshair rests on, so the throw lands where the player looks
      const h = GS.world.raycast(c.x + c.fx * 1.0, c.y + c.fy * 1.0, c.z + c.fz * 1.0, c.fx, c.fy, c.fz, 70);
      const R = h ? h.t + 1.0 : 60;
      dx = c.x + c.fx * R - hand[0]; dy = c.y + c.fy * R - hand[1]; dz = c.z + c.fz * R - hand[2];
    }
    const l = Math.hypot(dx, dy, dz) || 1;
    PJ_spawn({ kind: 'batarang', x: hand[0], y: hand[1], z: hand[2], vx: dx / l * 44, vy: dy / l * 44, vz: dz / l * 44, dmg: 2, life: 1.7, own: 'player', target: t });
    this.bats--;
    this.events.push('throw');
  }

  // ── dead ─────────────────────────────────────────────────────────────────
  updateDead(dt, world) {
    const b = this.b, st = this.st;
    this.deadT += dt;
    st.dead = Math.min(1, this.deadT / 0.6);
    b.vx *= Math.exp(-4 * dt); b.vz *= Math.exp(-4 * dt);
    b.vy = Math.max(b.vy - PH_GRAV * dt, -60);
    PH_move(world, b, dt);
    st.atk = 0; st.grap = 0; st.glide = Math.max(0, st.glide - dt * 4);
    this.animate(dt, world, true);
  }

  // ── animation state ──────────────────────────────────────────────────────
  animate(dt, world, dead) {
    const st = this.st, b = this.b;
    const hs = Math.hypot(b.vx, b.vz);
    const ease = (v, to, r) => v + (to - v) * (1 - Math.exp(-r * dt));
    const onG = b.onGround && this.mode !== 'swim';
    st.walk = ease(st.walk, onG ? AN_clamp(hs / 6.5, 0, 1) : 0, 14);
    st.sprint = ease(st.sprint, onG ? AN_clamp((hs - 7.5) / 4.3, 0, 1) : 0, 8);
    st.phase += dt * (3.2 + hs * 0.95) * (onG ? 1 : 0.2);
    st.air = ease(st.air, (!b.onGround && this.mode !== 'swim' && !this.grap) ? 1 : 0, 16);
    st.vy = b.vy;
    st.glide = ease(st.glide, this.mode === 'glide' ? 1 : 0, 9);
    st.gth = this.gl.th;
    st.swim = ease(st.swim, this.mode === 'swim' ? 1 : 0, 8);
    st.land = Math.max(0, st.land - dt * 4.2);
    st.grap = ease(st.grap, this.grap ? 1 : 0, 18);
    if (this.grap) st.grapPitch = Math.atan2(this.grap.ay - (b.y + 1.3), Math.hypot(this.grap.ax - b.x, this.grap.az - b.z));
    if (!dead) st.dead = ease(st.dead, 0, 10);
    // the cape trails whatever the body does
    const fwd = b.vx * Math.sin(this.a) + b.vz * Math.cos(this.a);
    AN_capeStep(st, dt, this.mode === 'glide' ? this.gl.v * 0.6 : fwd, b.vy, st.glide);
    if (this.grapMiss > 0) this.grapMiss -= dt;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  The camera that follows him.
// ═══════════════════════════════════════════════════════════════════════
class ThirdCam {
  constructor() {
    this.yaw = 2.52; this.pitch = -0.18;
    this.dist = 4.8; this.want = 4.8;
    this.tx = 0; this.ty = 0; this.tz = 0;
    this.shakeT = 0;
    this.fov = 1.12;
  }
  snap(p) { this.tx = p.b.x; this.ty = p.b.y + 1.5; this.tz = p.b.z; }
  update(dt, cam, p, world, look) {
    this.yaw += look.x;
    this.pitch = AN_clamp(this.pitch - look.y, -1.38, 1.15);
    // the pivot trails the body a little so a run has weight, but never far
    const px = p.b.x, py = p.b.y + 1.5 + (p.mode === 'glide' ? 0.2 : 0), pz = p.b.z;
    const k = 1 - Math.exp(-(p.mode === 'glide' ? 12 : 20) * dt);
    this.tx += (px - this.tx) * k; this.ty += (py - this.ty) * (1 - Math.exp(-14 * dt)); this.tz += (pz - this.tz) * k;
    // how far back: farther when moving fast, in a glide, on a grapple
    let want = 4.6;
    if (p.mode === 'glide') want = 5.6 + Math.min(2.5, (p.gl.v - 12) * 0.12);
    else if (p.grap) want = 6.0;
    else if (p.st.sprint > 0.5) want = 5.2;
    this.want += (want - this.want) * (1 - Math.exp(-2.5 * dt));
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const fx = Math.sin(this.yaw) * cp, fy = sp, fz = -Math.cos(this.yaw) * cp;
    const rx = Math.cos(this.yaw), rz = Math.sin(this.yaw);
    const side = 0.55 * (this.want / 4.6);
    // the centre of the orbit is shifted to the right shoulder
    const ox = this.tx + rx * side, oy = this.ty, oz = this.tz + rz * side;
    // pull the camera in so it never sits inside a wall: five rays, the shortest wins
    let dmax = this.want;
    const offs = [[0, 0], [0.22, 0], [-0.22, 0], [0, 0.22], [0, -0.22]];
    for (let i = 0; i < offs.length; i++) {
      const ux = rx * offs[i][0], uz = rz * offs[i][0], uy = offs[i][1];
      const sx = ox + ux, sy = oy + uy, sz = oz + uz;
      const h = world.raycast(sx, sy, sz, -fx, -fy, -fz, this.want + 0.4);
      if (h) dmax = Math.min(dmax, Math.max(0.7, h.t - 0.45));
    }
    // a collision pulls in at once, a clear path lets it ease back out
    if (dmax < this.dist) this.dist = dmax; else this.dist += (dmax - this.dist) * (1 - Math.exp(-3.2 * dt));
    cam.x = ox - fx * this.dist; cam.y = oy - fy * this.dist; cam.z = oz - fz * this.dist;
    cam.yaw = this.yaw; cam.pitch = this.pitch;
    cam.fx = fx; cam.fy = fy; cam.fz = fz;               // aiming reads these before the next render would refresh them
    // shake
    if (p.shake > 0) {
      const s = p.shake * 0.22;
      cam.x += (Math.random() - 0.5) * s; cam.y += (Math.random() - 0.5) * s; cam.z += (Math.random() - 0.5) * s;
    }
    // widen the view in a fast glide or a dive
    const fovT = 1.12 + (p.mode === 'glide' ? AN_clamp((p.gl.v - 12) * 0.008, 0, 0.18) : 0) + (p.grap && p.grap.phase === 'pull' ? 0.10 : 0);
    this.fov += (fovT - this.fov) * (1 - Math.exp(-4 * dt));
    cam.fov = this.fov;
  }
}


// ═══ BOSSES ═══
// ═══════════════════════════════════════════════════════════════════════
//  BOSSES — the Penguin on his ice rink and the Joker in his funhouse ring.
//
//  Each fight is a small script of attacks with a visible tell, and a window of
//  vulnerability after it. Both bosses live in GS.enemies like anyone else, so
//  punches, batarangs and knockback need no special cases; this file only decides
//  what they do. A boss that the player outruns, or that kills the player, resets
//  to full health: the arena is always a fresh fight.
// ═══════════════════════════════════════════════════════════════════════

var BS_FLOOR = WG_GY + 2;

function BS_start(id, arena) {
  if (GS.boss) return;
  // clear the camps around the arena: this fight is between the two of them
  for (const e of GS.enemies) if (Math.hypot(e.b.x - arena.cx, e.b.z - arena.cz) < 60) e.gone = true;
  GS.camps.clear();
  const B = id === 'penguin' ? new PenguinBoss(arena) : new JokerBoss(arena);
  GS.boss = B; GS.enemies.push(B);
  GS.waves = []; GS.zones = [];
  UI_banner(B.name, id === 'penguin' ? 'Rey del hielo' : 'El príncipe payaso del crimen');
  UI_hint(id === 'penguin' ? 'Los batarangs alcanzan al Pingüino en vuelo · golpéalo cuando caiga' : 'Esquiva sus cartas · castígalo en cuanto falle', 7);
  GS.events.push({ t: 'bossStart', id: id });
}

function BS_end(reset) {
  const B = GS.boss;
  if (!B) return;
  B.gone = true;
  for (const e of GS.enemies) if (e.bossMinion) e.gone = true;
  GS.boss = null; GS.zones = []; GS.waves = [];
  WD.bossCool = reset ? 6 : 3;           // a beaten boss stays beaten (bossDone), the other one can start at once
}

function BS_update(dt) {
  const B = GS.boss, pl = GS.player;
  if (!B) return;
  // zones of gas and shockwaves belong to the fight
  BS_zones(dt);
  if (pl.dead) { BS_end(true); return; }
  const d = Math.hypot(pl.b.x - B.arena.cx, pl.b.z - B.arena.cz);
  if (d > 78 && !B.dead) { UI_banner(B.name, 'se retira'); BS_end(true); }
}

function BS_zones(dt) {
  const pl = GS.player, fx = GS.fx;
  for (let i = GS.zones.length - 1; i >= 0; i--) {
    const z = GS.zones[i];
    z.life -= dt; z.t += dt;
    if (z.life <= 0) { GS.zones.splice(i, 1); continue; }
    // a green cloud: boiling puffs, and a hurt for anyone standing in it
    if (Math.random() < dt * 26) fx.add(z.x + (Math.random() * 2 - 1) * z.r * 0.8, z.y + 0.1 + Math.random() * 1.6, z.z + (Math.random() * 2 - 1) * z.r * 0.8, 0, 0.9, 0, 0.9, 0.5 + Math.random() * 0.4, 0.22, 0.85, 0.28, 0.6, -0.2, 0.8, -0.5);
    const dx = pl.b.x - z.x, dz = pl.b.z - z.z;
    if (!pl.dead && dx * dx + dz * dz < z.r * z.r && pl.b.y < z.y + 3 && pl.b.y > z.y - 1.5) {
      z.hurt = (z.hurt || 0) - dt;
      if (z.hurt <= 0) { z.hurt = 0.9; pl.hurt(1, dx, dz, false); }
    }
  }
  for (let i = GS.waves.length - 1; i >= 0; i--) {
    const w = GS.waves[i];
    w.r += w.speed * dt;
    // the ring: a handful of shards every frame
    const n = Math.max(6, Math.floor(w.r * 1.6));
    for (let k = 0; k < n; k += 2) {
      const a = (k + Math.random()) / n * Math.PI * 2;
      if (Math.random() < 0.55) fx.add(w.x + Math.cos(a) * w.r, w.y + 0.2, w.z + Math.sin(a) * w.r, 0, 1.6 + Math.random() * 2, 0, 0.3, 0.16, w.c[0], w.c[1], w.c[2], w.c[3], 9, 1, 0.8);
    }
    const dx = pl.b.x - w.x, dz = pl.b.z - w.z, d = Math.hypot(dx, dz);
    if (!w.hit && !pl.dead && Math.abs(d - w.r) < 1.3 && pl.b.y < w.y + 1.0) { w.hit = true; pl.hurt(1, dx, dz, true); }
    if (w.r > w.maxR) GS.waves.splice(i, 1);
  }
}

// A ballistic arc from (x,y,z) to a target, flight time t, gravity g.
function BS_arc(x, y, z, tx, ty, tz, t, g) {
  return [(tx - x) / t, (ty - y) / t + 0.5 * g * t, (tz - z) / t];
}

// ═══════════════════════════════════════════════════════════════════════
class BossBase {
  constructor(arena, name, hp, T) {
    this.arena = arena; this.name = name; this.hp = hp; this.maxHp = hp; this.phases = 3; this.phase = 1;
    this.T = T; this.isBoss = true; this.reachBonus = 0.6; this.bossMinion = false;
    this.b = PH_body(arena.cx, BS_FLOOR + 0.01, arena.cz, T.hw, T.h);
    this.a = 0; this.dead = false; this.deadT = 0; this.state = 'intro'; this.stT = 0; this.flash = 0;
    this.st = AN_state(); this.pose = null; this.alert = true; this.camp = null;
    this.light = { sky: 1, moon: 1, bl: [0.2, 0.2, 0.25], t: 0 };
    this.hurtStreak = 0; this.streakT = 0; this.slot = false; this.stun = 0;
    this.hit = false;
  }
  center() { return [this.b.x, this.b.y + this.T.h * 0.55, this.b.z]; }
  get x() { return this.b.x; } get z() { return this.b.z; }
  set(state) { this.state = state; this.stT = 0; this.hit = false; }

  // clamp a boss to the arena
  keepIn(m) {
    const A = this.arena, b = this.b;
    b.x = Math.max(A.cx - m, Math.min(A.cx + m, b.x)); b.z = Math.max(A.cz - m, Math.min(A.cz + m, b.z));
  }

  damage(dmg, dx, dz, kind) {
    if (this.dead || !this.vulnerable()) { this.deflect(dx, dz); return false; }
    dmg *= this.damageMul();
    this.hp -= dmg; this.flash = 1;
    this.streakT = 3; this.hurtStreak++;
    const d = Math.hypot(dx, dz) || 1;
    this.b.vx += dx / d * (kind === 3 ? 3.5 : 1.2); this.b.vz += dz / d * (kind === 3 ? 3.5 : 1.2);
    const c = this.center();
    GS.fx.sparks(c[0], c[1] + 0.3, c[2], kind === 3 ? 18 : 10, dx / d, dz / d, true);
    GS.fx.glow(c[0], c[1], c[2], 4, 1, 0.8, 0.4, 3, 0.12);
    GS.combo++; GS.comboT = 3.2; GS.bestCombo = Math.max(GS.bestCombo, GS.combo);
    GS.events.push({ t: 'bossHit' });
    this.onHurt(dmg, kind);
    // phase boundaries
    const k = this.hp / this.maxHp, ph = k > 0.667 ? 1 : (k > 0.333 ? 2 : 3);
    if (ph > this.phase && this.hp > 0) { this.phase = ph; this.onPhase(ph); }
    if (this.hp <= 0) this.die();
    return true;
  }
  vulnerable() { return true; }
  damageMul() { return 1; }
  deflect(dx, dz) {
    // a shielded boss rings off a blow, and the player knows it
    const c = this.center();
    GS.fx.sparks(c[0], c[1], c[2], 4, 0, 0, false);
    GS.events.push({ t: 'clink', x: c[0], y: c[1], z: c[2] });
  }
  onHurt() { } onPhase() { }

  die() {
    this.dead = true; this.deadT = 0; this.set('dead');
    const c = this.center();
    GS.fx.burst(c[0], c[1], c[2], 60, [1, 0.8, 0.4], 1.6, 1.8);
    GS.fx.debris(c[0], c[1], c[2], 30, this.debrisColor, 1.6);
    GS.fx.puff(c[0], c[1], c[2], 14, 0.7, 0.3);
    GS.fx.glow(c[0], c[1], c[2], 10, 1, 0.8, 0.5, 6, 0.6);
    GS.score += 5000;
    GS.fx.text(c[0], c[1] + 2, c[2], 'JEFE DERROTADO +5000', '#ffe08a', 1.6);
    GS.slow = 0.5;
    for (const e of GS.enemies) if (e.bossMinion) e.damage(99, 0, 1, 3);
    GS.bossDone[this.id] = true;
    UI_banner(this.name, 'derrotado');
    GS.events.push({ t: 'bossDown', id: this.id });
    for (let i = 0; i < 3; i++) GS.pickups.push({ kind: 'heart', x: c[0] + (i - 1) * 1.2, y: this.b.y + 0.8, z: c[2], t: 0, vy: 6 });
    GS.pickups.push({ kind: 'ammo', x: c[0], y: this.b.y + 0.8, z: c[2] + 1.2, t: 0, vy: 6 });
    this.winT = 3.8;
  }

  baseUpdate(dt) {
    this.st.t += dt; this.stT += dt;
    this.flash = Math.max(0, this.flash - dt * 6);
    this.streakT -= dt; if (this.streakT <= 0) this.hurtStreak = 0;
    EN_lightProbe(this.b.x, this.b.y, this.b.z, this.light);
    this.st.hurt = this.flash;
  }

  // shared end-of-fight handling
  finishDeath(dt) {
    this.deadT += dt;
    this.st.dead = Math.min(1, this.deadT / 0.9);
    this.b.vx *= Math.exp(-4 * dt); this.b.vz *= Math.exp(-4 * dt); this.b.vy = Math.max(this.b.vy - PH_GRAV * dt, -50);
    PH_move(GS.world, this.b, dt);
    if (this.winT !== undefined) {
      this.winT -= dt;
      if (this.winT <= 0) {
        this.winT = undefined;
        BS_end(false);
        if (GS.bossDone.penguin && GS.bossDone.joker) { VX_setState('win'); VX.fadeTo = 0; }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE PENGUIN
// ═══════════════════════════════════════════════════════════════════════
class PenguinBoss extends BossBase {
  constructor(arena) {
    super(arena, 'EL PINGÜINO', 44, { hw: 0.95, h: 2.9, flying: false });
    this.id = 'penguin'; this.model = GS.models.penguin; this.scale = 1.75;
    this.debrisColor = [30, 32, 40];
    this.b.y = BS_FLOOR + 18; this.b.vy = -7;
    this.open = 1; this.bombsLeft = 0; this.bombT = 0; this.orbit = 0; this.cool = 2; this.target = null; this.spawned2 = false; this.spawned3 = false;
    this.anim = { open: 1, fly: 0, wob: 0 };
    this.walkPh = 0; this.nextSpecial = 4;
    this.set('intro');
    this.pose = this.model.poseNew();
  }
  vulnerable() { return this.state !== 'intro' && this.state !== 'rise' && this.state !== 'dead'; }
  damageMul() {
    if (this.state === 'dazed') return 1.6;
    if (this.state === 'walk' || this.state === 'swing' || this.state === 'shoot') return 0.55;   // the umbrella takes the blows
    return 1;
  }
  onHurt() { if (this.state === 'walk' && this.hurtStreak >= 4) { this.set('rise'); this.hurtStreak = 0; } }
  onPhase(ph) {
    GS.fx.text(this.b.x, this.b.y + 3.5, this.b.z, ph === 2 ? '¡ESBIRROS!' : '¡NO ME RENDIRÉ!', '#ff8a70', 1.3);
    if (ph === 2 && !this.spawned2) { this.spawned2 = true; this.summon(['goon', 'goon']); }
    if (ph === 3 && !this.spawned3) { this.spawned3 = true; this.summon(['drone', 'drone']); }
    if (this.state === 'walk' || this.state === 'swing') this.set('rise');
  }
  summon(kinds) {
    const A = this.arena;
    kinds.forEach((k, i) => {
      const a = (i + 0.5) * Math.PI + Math.random();
      const x = A.cx + Math.cos(a) * 14, z = A.cz + Math.sin(a) * 14;
      const e = new Enemy(k, x, BS_FLOOR + (k === 'drone' ? 5 : 0.01), z, null);
      e.alert = true; e.state = 'chase'; e.bossMinion = true; e.home = { x: x, z: z, y: e.b.y };
      GS.enemies.push(e);
      GS.fx.puff(x, BS_FLOOR + 1, z, 8, 0.6, 0.3);
    });
  }

  update(dt) {
    const b = this.b, pl = GS.player, w = GS.world, A = this.arena;
    this.baseUpdate(dt);
    this.cool = Math.max(0, this.cool - dt);
    if (this.dead) { this.finishDeath(dt); return; }
    const dx = pl.b.x - b.x, dz = pl.b.z - b.z, dist = Math.hypot(dx, dz);
    const pf = this.phase;
    const spd = [0, 3.6, 4.4, 5.2][pf];
    const face = (r) => { this.a += PL_angDiff(this.a, Math.atan2(dx, dz)) * (1 - Math.exp(-(r || 8) * dt)); };
    switch (this.state) {
      case 'intro': {
        // he drifts down under his open umbrella
        b.vy = Math.max(-7, b.vy - 4 * dt);
        b.vx *= 0.9; b.vz *= 0.9;
        this.a = Math.atan2(dx, dz);
        PH_move(w, b, dt);
        if (b.onGround || b.y <= BS_FLOOR + 0.05) { b.y = BS_FLOOR + 0.01; b.vy = 0; GS.fx.dust(b.x, b.y, b.z, 18, 2.0); GS.waves.push({ x: b.x, y: BS_FLOOR, z: b.z, r: 0.5, speed: 10, maxR: 9, hit: true, c: [0.7, 0.85, 1, 0.6] }); this.set('walk'); GS.events.push({ t: 'slamLand' }); }
        break;
      }
      case 'walk': {
        this.anim.open = Math.max(0, this.anim.open - dt * 4);
        face(8);
        if (dist > 2.4) {
          const k = Math.min(1, 14 * dt), tx = dx / dist * spd, tz = dz / dist * spd;
          b.vx += (tx - b.vx) * k; b.vz += (tz - b.vz) * k;
        } else { b.vx *= 0.8; b.vz *= 0.8; }
        this.walkPh += dt * (3 + Math.hypot(b.vx, b.vz) * 1.4);
        // melee when close, a special when the timer says so
        if (dist < 3.6 && this.cool <= 0) { this.set('swing'); GS.events.push({ t: 'tell', x: b.x, z: b.z }); }
        this.nextSpecial -= dt;
        if (this.nextSpecial <= 0) { this.nextSpecial = [0, 5.5, 4.2, 3.4][pf]; if (pf === 3 && Math.random() < 0.4 && dist > 5) this.set('shoot'); else this.set('rise'); }
        break;
      }
      case 'swing': {
        b.vx *= 0.7; b.vz *= 0.7; face(10);
        this.anim.swing = Math.min(1, this.stT / 0.75);
        if (this.stT > 0.75 && !this.hit) {
          this.hit = true;
          const d = Math.hypot(dx, dz), ang = Math.abs(PL_angDiff(this.a, Math.atan2(dx, dz)));
          b.vx += Math.sin(this.a) * 4; b.vz += Math.cos(this.a) * 4;
          if (d < 4.2 && ang < 1.1 && Math.abs(pl.b.y - b.y) < 2.5) pl.hurt(1, dx, dz, true);
          GS.fx.dust(b.x + Math.sin(this.a) * 2.4, b.y, b.z + Math.cos(this.a) * 2.4, 6, 1.0);
          GS.events.push({ t: 'enemySwing', x: b.x, z: b.z });
        }
        if (this.stT > 1.35) { this.cool = 1.4; this.anim.swing = 0; this.set('walk'); }
        break;
      }
      case 'shoot': {
        // phase 3: three umbrella shots in a fan
        b.vx *= 0.8; b.vz *= 0.8; face(14);
        this.anim.swing = 0;
        if (this.stT > 0.7 && !this.hit) {
          this.hit = true;
          const m = [b.x + Math.sin(this.a) * 1.4, b.y + 1.9, b.z + Math.cos(this.a) * 1.4];
          for (let i = -1; i <= 1; i++) {
            const a = this.a + i * 0.2, ty = pl.b.y + 1.1 - m[1], hd = Math.hypot(dx, dz) || 1;
            PJ_spawn({ kind: 'bullet', x: m[0], y: m[1], z: m[2], vx: Math.sin(a) * 24, vy: ty / hd * 24, vz: Math.cos(a) * 24, dmg: 1, life: 2.4, own: 'enemy' });
          }
          GS.fx.glow(m[0], m[1], m[2], 4, 1, 0.8, 0.4, 4, 0.1);
          GS.events.push({ t: 'gun', x: m[0], z: m[2] });
        }
        if (this.stT > 1.5) { this.cool = 1.2; this.set('walk'); }
        break;
      }
      case 'rise': {
        this.anim.open = Math.min(1, this.anim.open + dt * 5);
        b.vy += (11 - b.vy) * Math.min(1, 6 * dt);
        b.vx *= 0.9; b.vz *= 0.9; face(8);
        PH_move(w, b, dt);
        if (b.y > BS_FLOOR + 7 || this.stT > 1.2) { this.bombsLeft = [0, 4, 6, 8][pf]; this.bombT = 0.4; this.orbit = Math.atan2(b.z - A.cz, b.x - A.cx); this.set('bombs'); }
        break;
      }
      case 'bombs': {
        // circle the rink under the umbrella, dropping bombs where the player will be
        this.anim.open = 1;
        this.orbit += dt * (0.8 + pf * 0.2);
        const R = 9.5, tx = A.cx + Math.cos(this.orbit) * R, tz = A.cz + Math.sin(this.orbit) * R, ty = BS_FLOOR + 7.5 + Math.sin(this.stT * 2) * 0.5;
        b.vx += ((tx - b.x) * 3 - b.vx) * Math.min(1, 5 * dt); b.vz += ((tz - b.z) * 3 - b.vz) * Math.min(1, 5 * dt); b.vy += ((ty - b.y) * 4 - b.vy) * Math.min(1, 6 * dt);
        b.vx = Math.max(-14, Math.min(14, b.vx)); b.vz = Math.max(-14, Math.min(14, b.vz));
        PH_move(w, b, dt); face(6);
        this.bombT -= dt;
        if (this.bombT <= 0 && this.bombsLeft > 0) {
          this.bombT = [0, 0.95, 0.8, 0.65][pf]; this.bombsLeft--;
          const lead = 0.5, tpx = pl.b.x + pl.b.vx * lead, tpz = pl.b.z + pl.b.vz * lead;
          const T = 0.95, v = BS_arc(b.x, b.y - 0.6, b.z, tpx, pl.b.y + 0.4, tpz, T, 22);
          PJ_spawn({ kind: 'bomb', x: b.x, y: b.y - 0.6, z: b.z, vx: v[0], vy: v[1], vz: v[2], dmg: 1, life: 1.6, own: 'enemy', heavy: true, grav: 22 });
          GS.events.push({ t: 'throw' });
        }
        if (this.bombsLeft <= 0 && this.bombT <= 0.2) { this.set('aim'); this.target = null; }
        break;
      }
      case 'aim': {
        // hover over the player, then lock the spot he will land on
        const tx = pl.b.x + pl.b.vx * 0.2, tz = pl.b.z + pl.b.vz * 0.2, ty = BS_FLOOR + 9;
        b.vx += ((tx - b.x) * 4 - b.vx) * Math.min(1, 8 * dt); b.vz += ((tz - b.z) * 4 - b.vz) * Math.min(1, 8 * dt); b.vy += ((ty - b.y) * 4 - b.vy) * Math.min(1, 6 * dt);
        PH_move(w, b, dt);
        this.anim.open = 1; this.anim.wob = 1;
        if (this.stT < 0.8) { this.target = { x: pl.b.x, z: pl.b.z }; }
        if (this.stT >= 1.0 - (pf - 1) * 0.1) { this.set('dive'); this.anim.open = 0; b.vx = b.vz = 0; if (this.target) { b.x = this.target.x; b.z = this.target.z; } GS.events.push({ t: 'tell', x: b.x, z: b.z }); }
        break;
      }
      case 'dive': {
        b.vy = Math.max(b.vy - 80 * dt, -40); b.vx = b.vz = 0;
        PH_move(w, b, dt);
        if (b.onGround || b.y <= BS_FLOOR + 0.05) {
          b.y = BS_FLOOR + 0.01; b.vy = 0;
          GS.waves.push({ x: b.x, y: BS_FLOOR, z: b.z, r: 0.6, speed: 15, maxR: 17, hit: false, c: [0.75, 0.9, 1, 0.8] });
          GS.fx.dust(b.x, b.y, b.z, 26, 2.4); GS.fx.debris(b.x, b.y + 0.3, b.z, 16, [170, 205, 230], 1.4);
          GS.fx.glow(b.x, b.y + 0.6, b.z, 9, 0.7, 0.9, 1, 4, 0.3);
          GS.slow = 0.12; pl.shake = Math.max(pl.shake, 0.6);
          GS.events.push({ t: 'slamLand' });
          this.set('dazed');
        }
        break;
      }
      case 'dazed': {
        b.vx *= 0.8; b.vz *= 0.8; this.anim.open = 0;
        const D = [0, 3.6, 3.0, 2.4][pf];
        if (this.stT > D) { this.cool = 1; this.set('walk'); this.nextSpecial = [0, 4.5, 3.6, 3.0][pf]; }
        break;
      }
    }
    if (this.state !== 'dive' && this.state !== 'rise' && this.state !== 'bombs' && this.state !== 'aim' && this.state !== 'intro') {
      b.vy = b.onGround ? 0 : Math.max(b.vy - PH_GRAV * dt, -50);
      const px = b.x, pz = b.z;
      PH_move(w, b, dt);
    }
    this.keepIn(17);
  }

  draw(r) {
    const b = this.b, M = this.model, st = this.st, P = this.pose;
    EN_lightStep(this.light, 1 / 60);
    P.fill(0);
    const A = this.anim, t = st.t;
    const flying = (this.state === 'bombs' || this.state === 'rise' || this.state === 'aim' || this.state === 'intro');
    const dead = st.dead;
    // 0 body 1 head 2 flipL 3 flipR 4 footL 5 footR 6 cane 7 brolly
    const wp = this.walkPh;
    P[0 * 6 + 1] = Math.sin(wp) * 0.14; P[0 * 6 + 2] = Math.sin(wp * 1) * 0.07;     // waddle
    P[0 * 6 + 4] = Math.abs(Math.cos(wp)) * 0.4;
    P[4 * 6] = Math.sin(wp) * 0.55; P[5 * 6] = -Math.sin(wp) * 0.55;
    P[2 * 6 + 2] = 0.12 + Math.sin(wp) * 0.1; P[3 * 6 + 2] = -0.12 - Math.sin(wp) * 0.1;
    if (flying) {
      const k = 1;
      P[2 * 6 + 2] = 0.9 + Math.sin(t * 9) * 0.15; P[3 * 6 + 2] = -0.9 - Math.sin(t * 9) * 0.15;
      P[4 * 6] = -0.4; P[5 * 6] = -0.4;
      P[0 * 6 + 4] = 0;
    }
    if (this.state === 'swing') {
      const s = AN_strike(Math.min(1, A.swing || 0));
      P[3 * 6] = -2.4 * s; P[3 * 6 + 2] = -0.3;         // the cane comes round overhead
      P[0 * 6 + 1] = 0.5 * s;
    }
    if (this.state === 'shoot') { P[3 * 6] = -1.55; }
    if (this.state === 'dive') { P[4 * 6] = -0.7; P[5 * 6] = -0.7; P[2 * 6 + 2] = 1.3; P[3 * 6 + 2] = -1.3; P[0 * 6] = 0.5; }
    if (this.state === 'dazed') {
      P[1 * 6 + 1] = Math.sin(t * 9) * 0.5; P[1 * 6 + 2] = Math.sin(t * 7) * 0.25;
      P[0 * 6] = 0.25; P[0 * 6 + 2] = Math.sin(t * 5) * 0.12;
    }
    // the cane is shown when the umbrella is shut, the open one when he flies
    P[6 * 6 + 5] = A.open > 0.5 ? 999 : 0;
    P[7 * 6 + 5] = A.open > 0.5 ? 0 : 999;
    if (A.open > 0.5) P[7 * 6 + 2] = Math.sin(t * 4) * 0.05;
    if (dead) { P[0] = -1.2 * dead; P[0 * 6 + 4] = -5 * dead; }
    const scale = this.scale;
    M4_model(PK_m, b.x, b.y - (this.state === 'dead' ? 0 : 0), b.z, this.a, 0, 0, scale);
    let flash = null;
    if (this.flash > 0) flash = [1, 0.95, 0.85, this.flash * 0.7];
    else if (this.state === 'swing') { const k = 0.5 + 0.5 * Math.sin(this.stT * 30); flash = [1, 0.4, 0.1, 0.15 + 0.2 * k * Math.min(1, this.stT * 1.4)]; }
    else if (this.state === 'aim') { const k = 0.5 + 0.5 * Math.sin(this.stT * 26); flash = [1, 0.2, 0.1, 0.15 + 0.2 * k]; }
    MD_drawModel(r, M, PK_m, P, { sky: this.light.sky, moon: this.light.moon, bl: this.light.bl, flash: flash, rim: [0.30, 0.34, 0.52] });
    // a danger marker where the dive will land
    if (this.state === 'aim' && this.target) {
      GS.fx.add(this.target.x, BS_FLOOR + 0.15, this.target.z, 0, 0, 0, 0.05, 2.2 + 0.4 * Math.sin(this.stT * 20), 1, 0.2, 0.15, 1.4, 0, 0, 0);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE JOKER
// ═══════════════════════════════════════════════════════════════════════
class JokerBoss extends BossBase {
  constructor(arena) {
    super(arena, 'EL JOKER', 48, { hw: 0.4, h: 2.3, flying: false });
    this.id = 'joker'; this.model = GS.models.joker; this.scale = 1.25;
    this.debrisColor = [110, 50, 150];
    this.b.x = arena.cx; this.b.z = arena.cz - 11;
    this.cool = 1.5; this.hidden = 0; this.nextHit = 0; this.laugh = 0; this.minionsAlive = 0; this.lastTeleport = 0;
    this.strafe = Math.random() < 0.5 ? 1 : -1; this.attackQ = 0; this.gasLeft = 0;
    this.set('intro');
    this.pose = this.model.poseNew();
    GS.fx.puff(this.b.x, BS_FLOOR + 1, this.b.z, 20, 0.8, 0.5);
    GS.fx.burst(this.b.x, BS_FLOOR + 1.2, this.b.z, 24, [0.6, 0.3, 0.9], 1.2, 1.0);
  }
  vulnerable() { return this.state !== 'intro' && this.state !== 'gone' && this.state !== 'dead'; }
  damageMul() { return (this.state === 'summon' || this.state === 'stunned') ? 1.5 : 1; }
  onHurt() {
    // pestered too much, he vanishes
    if (this.hurtStreak >= 3 && this.state !== 'gone' && this.state !== 'stunned') { this.set('gone'); this.hurtStreak = 0; this.vanish(); }
  }
  onPhase(ph) {
    GS.fx.text(this.b.x, this.b.y + 3.3, this.b.z, ph === 2 ? '¡JA JA JA!' : '¡SE ACABÓ EL CHISTE!', '#c58bff', 1.3);
    this.set('gone'); this.vanish();
    this.attackQ = ph === 2 ? 'summon' : 'gas';
  }
  vanish() {
    GS.fx.puff(this.b.x, this.b.y + 1, this.b.z, 16, 0.7, 0.45);
    GS.fx.burst(this.b.x, this.b.y + 1, this.b.z, 22, [0.65, 0.3, 1], 1.4, 1.2);
    GS.events.push({ t: 'poof' });
    this.hidden = 0.7;
  }
  pickSpot() {
    const A = this.arena, pl = GS.player;
    let best = null, bs = -1;
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 9;
      const x = A.cx + Math.cos(a) * r, z = A.cz + Math.sin(a) * r;
      const d = Math.hypot(x - pl.b.x, z - pl.b.z);
      if (d > bs && d > 7) { bs = d; best = [x, z]; }
    }
    return best || [A.cx, A.cz - 10];
  }
  minions() { let n = 0; for (const e of GS.enemies) if (e.bossMinion && !e.dead) n++; return n; }

  update(dt) {
    const b = this.b, pl = GS.player, w = GS.world, A = this.arena;
    this.baseUpdate(dt);
    this.cool = Math.max(0, this.cool - dt);
    if (this.dead) { this.finishDeath(dt); return; }
