          // split the quad along the diagonal that hides the AO seam
          if (aoV[0] + aoV[2] >= aoV[1] + aoV[3]) {
            I[ni] = v0; I[ni + 1] = v0 + 1; I[ni + 2] = v0 + 2; I[ni + 3] = v0; I[ni + 4] = v0 + 2; I[ni + 5] = v0 + 3;
          } else {
            I[ni] = v0 + 1; I[ni + 1] = v0 + 2; I[ni + 2] = v0 + 3; I[ni + 3] = v0 + 1; I[ni + 4] = v0 + 3; I[ni + 5] = v0;
          }
          mesh.nv += 4; mesh.ni += 6;
        }
      }
    }
    if ((x & 3) === 3) yield 0;
  }

  function pack(m) {
    const idx = m.nv < 65536 ? new Uint16Array(m.i.subarray(0, m.ni)) : m.i.slice(0, m.ni);
    return { v: m.v.slice(0, m.nv * 16), i: idx, nv: m.nv, ni: m.ni, wide: m.nv >= 65536 };
  }
  // lamps that belong to THIS chunk, in world coordinates, for the main thread
  const own = [];
  for (let i = 0; i < lampsRaw.length; i++) {
    const e = lampsRaw[i];
    if (e[0] >= ox && e[0] < ox + 16 && e[2] >= oz && e[2] < oz + 16) own.push(e);
  }
  return { opaque: pack(op), water: pack(wa), emitters: own, maxY: gen.maxY };
}


// ═══ JOBS ═══
// ═══════════════════════════════════════════════════════════════════════
//  JOBS — the chunk cache that feeds the baker. Shared with the worker.
//
//  A chunk's mesh depends on its eight neighbours (for face culling, AO and lamp
//  rays) and on the mass heights of chunks far beyond that (for moon shadows), so
//  whoever bakes needs those at hand. They are cached here: generated once, kept
//  while recent, and rebuilt on demand if evicted — generation is deterministic,
//  so an evicted chunk simply comes back identical.
// ═══════════════════════════════════════════════════════════════════════

var JB_gen = new Map();
var JB_mass = new Map();
var JB_GEN_CAP = 360;
var JB_MASS_CAP = 6000;

function JB_key(cx, cz) { return (cx + 32768) * 65536 + (cz + 32768); }

function JB_getGen(cx, cz) {
  const k = JB_key(cx, cz);
  let g = JB_gen.get(k);
  if (!g) {
    g = WG_genChunk(cx, cz);
    JB_gen.set(k, g);
    if (JB_gen.size > JB_GEN_CAP) {
      // Map iterates in insertion order, so the first keys are the oldest
      let n = JB_gen.size - JB_GEN_CAP;
      for (const key of JB_gen.keys()) { if (n-- <= 0) break; JB_gen.delete(key); }
    }
  }
  return g;
}

function JB_getMass(cx, cz) {
  const k = JB_key(cx, cz);
  let m = JB_mass.get(k);
  if (!m) {
    m = WG_massChunk(cx, cz);
    JB_mass.set(k, m);
    if (JB_mass.size > JB_MASS_CAP) {
      let n = JB_mass.size - JB_MASS_CAP;
      for (const key of JB_mass.keys()) { if (n-- <= 0) break; JB_mass.delete(key); }
    }
  }
  return m;
}

var JB_env = {
  getVox: function (cx, cz) { return JB_getGen(cx, cz).vox; },
  getGen: JB_getGen,
  getMass: JB_getMass,
};

// Bake one chunk to the end and package the result for transfer.
function JB_bakeNow(cx, cz) {
  const it = BX_bake(cx, cz, JB_env);
  let r;
  do { r = it.next(); } while (!r.done);
  return JB_package(cx, cz, r.value);
}

function JB_package(cx, cz, out) {
  const g = JB_getGen(cx, cz);
  return {
    t: 'chunk', cx: cx, cz: cz,
    opaque: out.opaque, water: out.water, emitters: out.emitters,
    vox: g.vox.slice(), top: g.top.slice(), maxY: out.maxY,
  };
}

function JB_transfers(m) {
  return [m.opaque.v.buffer, m.opaque.i.buffer, m.water.v.buffer, m.water.i.buffer, m.vox.buffer, m.top.buffer];
}


// ═══ GL ═══
// ═══════════════════════════════════════════════════════════════════════
//  GL — small helpers over WebGL2: compile, link, framebuffers.
// ═══════════════════════════════════════════════════════════════════════

function GL_compile(gl, type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error('shader ' + label + ': ' + log);
  }
  return s;
}

// A linked program with a memoised uniform lookup: prog.u('name') -> location.
function GL_prog(gl, vs, fs, label) {
  const p = gl.createProgram();
  gl.attachShader(p, GL_compile(gl, gl.VERTEX_SHADER, vs, label + '.vs'));
  gl.attachShader(p, GL_compile(gl, gl.FRAGMENT_SHADER, fs, label + '.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link ' + label + ': ' + gl.getProgramInfoLog(p));
  const cache = {};
  return {
    id: p,
    u: function (n) { let l = cache[n]; if (l === undefined) { l = gl.getUniformLocation(p, n); cache[n] = l; } return l; },
  };
}

// A texture usable as a render target. `fmt` is 'f16' (HDR) or 'u8'.
function GL_tex(gl, w, h, fmt, linear) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (fmt === 'f16') gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const f = linear === false ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

// A framebuffer with a colour texture and, optionally, a depth renderbuffer.
function GL_fbo(gl, w, h, fmt, depth) {
  const tex = GL_tex(gl, w, h, fmt);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let rb = null;
  if (depth) {
    rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  }
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb: fb, tex: tex, rb: rb, w: w, h: h, ok: ok, fmt: fmt };
}

function GL_freeFbo(gl, f) {
  if (!f) return;
  gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); if (f.rb) gl.deleteRenderbuffer(f.rb);
}


// ═══ SHADERS ═══
// ═══════════════════════════════════════════════════════════════════════
//  SHADERS — every GLSL program in the game, as strings.
//
//  Lighting arrives pre-baked in the vertices (see bake.js), so the terrain
//  shader does very little: it multiplies albedo by that light, adds the few
//  things that have to be per-pixel (voxel bevel, wet sheen, emission, fog) and
//  writes linear HDR. Everything is tone-mapped and graded afterwards, in
//  display space, in the composite pass.
// ═══════════════════════════════════════════════════════════════════════

// Shared by every fragment shader that needs the sky: the sky pass itself, and
// anything that reflects it (water, wet streets, glass).
var SH_COMMON = `
const vec3 VXN[6] = vec3[6](vec3(1.,0.,0.), vec3(-1.,0.,0.), vec3(0.,1.,0.), vec3(0.,-1.,0.), vec3(0.,0.,1.), vec3(0.,0.,-1.));
float h31(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

uniform vec3 uCam;
uniform vec3 uMoonDir;
uniform vec3 uHorizon;
uniform vec3 uZenith;
uniform float uTime;
uniform float uCloudH;
uniform float uStorm;

// Exponential height fog, integrated along the ray from the camera to p. Fog pools
// near the street and thins with altitude, so a ray that spends its length in clean
// air high above the city is barely fogged, while one that runs along a canyon
// floor is swallowed. Using only the fragment's own height — which this did at
// first — fogged an aerial view as heavily as a street, and from a rooftop the city
// vanished. Closed form: od = a e^{-k h0} (1 - e^{-k dy}) / (k dy / dist).
uniform vec3 uFog;
uniform float uFogD;      // density at the baseline height
uniform float uFogK;      // how fast it thins with altitude
uniform float uFogB;      // a constant floor of haze
uniform float uFogBase;   // the baseline height (street level)
uniform float uFarDist;   // where the loaded world ends
uniform float uFogFar;    // how opaque it is by then
float fogAmt(vec3 p) {
  vec3 d = p - uCam;
  float dist = length(d);
  float base = uFogD * exp(-uFogK * (uCam.y - uFogBase));
  float kdy = uFogK * d.y;
  // a level ray has no altitude change to integrate over
  float od = abs(kdy) > 1e-3 ? base * (1.0 - exp(-kdy)) * dist / kdy : base * dist;
  od += uFogB * dist;
  // Height fog alone leaves the EDGE of the loaded world visible from the air: look
  // down from a rooftop and the city simply stops, a floating island. This term is
  // independent of altitude and climbs steeply to nearly opaque at the load
  // distance, so the world always dissolves before it ends.
  // measured on the HORIZONTAL distance, because that is what the loader limits: from
  // 150 blocks up even a street directly below is far away in 3D and would be fogged out
  od += uFogFar * pow(clamp(length(d.xz) / uFarDist, 0.0, 1.5), 3.0);
  return 1.0 - exp(-clamp(od, 0.0, 12.0));
}

vec3 skyColor(vec3 d) {
  float h = d.y;
  vec3 col = mix(uHorizon, uZenith, pow(clamp(h, 0.0, 1.0), 0.5));
  // sodium glow of the city hugging the horizon
  col += vec3(0.050, 0.028, 0.012) * exp(-abs(h) * 9.0) * 0.8;
  col = mix(col, uFog, clamp(-h * 5.0, 0.0, 1.0));
  if (h > 0.0) {                                     // stars
    vec3 q = d * 90.0, g = floor(q);
    float s = h31(g);
    float tw = 0.65 + 0.35 * sin(uTime * 2.0 + s * 40.0);
    float st = smoothstep(0.9965, 1.0, s) * tw * smoothstep(0.04, 0.3, h);
    float r = 1.0 - smoothstep(0.0, 0.45, length(fract(q) - 0.5));
    col += vec3(0.85, 0.9, 1.0) * st * r * 2.5 * (1.0 - uStorm);
  }
  float md = dot(d, uMoonDir);                       // the moon: disc, halo, glare
  col += vec3(1.0, 0.96, 0.88) * smoothstep(0.99962, 0.99985, md) * 7.0;
  col += vec3(0.55, 0.65, 0.90) * pow(max(md, 0.0), 220.0) * 0.9;
  col += vec3(0.28, 0.38, 0.62) * pow(max(md, 0.0), 18.0) * 0.35;
  if (h > 0.02) {                                    // blocky clouds on a plane
    float t = (uCloudH - uCam.y) / h;
    vec3 p = uCam + d * t;
    vec2 uv = p.xz * 0.012 + vec2(uTime * 0.006, uTime * 0.002);
    float n = 0.55 * h21(floor(uv * 3.0)) + 0.30 * h21(floor(uv * 7.0) + 11.0) + 0.15 * h21(floor(uv * 15.0) + 23.0);
    float cov = smoothstep(0.57, 0.74, n) * smoothstep(0.03, 0.28, h);
    float lit = 0.25 + 0.75 * pow(max(dot(normalize(vec3(d.x, 0.0, d.z) + 1e-4), normalize(vec3(uMoonDir.x, 0.0, uMoonDir.z))), 0.0), 3.0);
    vec3 cc = mix(vec3(0.011, 0.014, 0.020), vec3(0.075, 0.085, 0.108), lit * (0.5 + 0.5 * h21(floor(uv * 7.0) + 3.0)));
    cc += vec3(0.030, 0.018, 0.009) * (1.0 - h);
    col = mix(col, cc, cov * 0.80);
  }
  return col;
}
`;

var SH_SKY_VS = `#version 300 es
precision highp float;
out vec2 vNdc;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vNdc = p * 2.0 - 1.0;
  gl_Position = vec4(vNdc, 1.0, 1.0);
}`;

var SH_SKY_FS = `#version 300 es
precision highp float;
precision highp int;
in vec2 vNdc;
uniform mat4 uInvVP;
${SH_COMMON}
out vec4 oColor;
void main() {
  vec4 w = uInvVP * vec4(vNdc, 1.0, 1.0);
  vec3 d = normalize(w.xyz / w.w - uCam);
  oColor = vec4(skyColor(d), 1.0);
}`;

// ── terrain ───────────────────────────────────────────────────────────────
var SH_TERRAIN_VS = `#version 300 es
precision highp float;
precision highp int;
layout(location = 0) in vec4 aPos;
layout(location = 1) in uvec4 aIds;     // block, face, ao, flags
layout(location = 2) in vec4 aCol;      // albedo rgb, emission
layout(location = 3) in vec4 aLit;      // baked sky, baked lamp rgb
uniform mat4 uVP;
uniform vec3 uOrg;
out vec3 vW;
out vec4 vCol;
out vec4 vLit;
flat out uvec4 vIds;
void main() {
  vec3 p = uOrg + aPos.xyz;
  vW = p; vCol = aCol; vLit = aLit; vIds = aIds;
  gl_Position = uVP * vec4(p, 1.0);
}`;

var SH_TERRAIN_FS = `#version 300 es
precision highp float;
precision highp int;
in vec3 vW;
in vec4 vCol;
in vec4 vLit;
flat in uvec4 vIds;
uniform vec3 uSkyTint;
uniform float uSkyI;
uniform float uBlockI;
uniform float uFlash;
uniform float uBevel;
uniform float uWet;
uniform float uCut;       // the far pass discards everything inside this radius
${SH_COMMON}
layout(location = 0) out vec4 oColor;

void main() {
  if (uCut > 0.0 && dot(vW.xz - uCam.xz, vW.xz - uCam.xz) < uCut * uCut) discard;
  uint face = vIds.y;
  uint fl = vIds.w;
  vec3 N = VXN[face];
  vec3 albedo = pow(vCol.rgb, vec3(2.2));
  float emit = vCol.a * 4.0;
  vec3 V = uCam - vW;
  float dist = length(V);
  V /= dist;

  // The voxel bevel: each face darkens a little toward its edges, which is what
  // makes a wall of cubes read as cubes. It fades with distance, or it turns
  // into moire on far facades.
  vec2 uv = face < 2u ? fract(vW.zy) : (face < 4u ? fract(vW.xz) : fract(vW.xy));
  float e = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  float bev = mix(1.0 - 0.30 * uBevel, 1.0, smoothstep(0.0, 0.17, e));
  bev = mix(bev, 1.0, smoothstep(36.0, 120.0, dist));

  vec3 light = uSkyTint * (vLit.x * uSkyI) + vLit.yzw * (2.0 * uBlockI);
  vec3 col = albedo * light * bev;

  bool wet = (fl & 1u) != 0u;
  bool gloss = (fl & 8u) != 0u;
  if ((wet || gloss) && emit == 0.0) {
    float ndv = clamp(dot(N, V), 0.0, 1.0);
    float fr = pow(1.0 - ndv, 5.0);
    vec3 R = reflect(-V, N);
    // puddles: wet ground is patchy, and the patches are mirrors
    float pud = smoothstep(0.35, 0.65, h21(floor(vW.xz * 0.5) + 7.0)) * 0.7 + 0.3;
    float k = wet ? (N.y > 0.5 ? 1.0 * uWet * pud : 0.15 * uWet) : 0.35;
    vec3 refl = skyColor(R);
    col += refl * (0.03 + 0.95 * fr) * k;
    // lamp light smeared along the view direction on wet ground
    col += vLit.yzw * (2.0 * uBlockI) * fr * 2.2 * k * albedo.r * 4.0;
  }

  if (emit > 0.0) {
    float fk = 1.0;
    if ((fl & 32u) != 0u) fk = 0.82 + 0.18 * sin(uTime * 26.0 + vW.x * 3.1 + vW.z * 1.7) - step(0.985, h21(vec2(floor(uTime * 9.0), vW.x + vW.z))) * 0.7;
    if ((fl & 16u) != 0u) fk = 0.78 + 0.22 * sin(uTime * 1.7 + vW.x * 0.9 + vW.z * 1.3 + vW.y * 0.5);
    col = albedo * emit * fk * mix(1.0, bev, 0.35);
  }

  col += uFlash * uSkyTint * vLit.x * albedo * 6.0;

  float fog = fogAmt(vW);
  vec3 fogc = uFog * (1.0 + 0.8 * pow(max(dot(-V, uMoonDir), 0.0), 6.0));
  col = mix(col, fogc, fog);
  oColor = vec4(col, 1.0);
}`;

// ── water ─────────────────────────────────────────────────────────────────
var SH_WATER_VS = `#version 300 es
precision highp float;
precision highp int;
layout(location = 0) in vec4 aPos;
layout(location = 3) in vec4 aLit;
uniform mat4 uVP;
uniform vec3 uOrg;
uniform float uTime;
out vec3 vW;
out float vSky;
void main() {
  vec3 p = uOrg + aPos.xyz;
  p.y -= 0.14;
  p.y += 0.05 * sin(p.x * 0.7 + uTime * 1.1) * cos(p.z * 0.6 - uTime * 0.9);
  vW = p; vSky = aLit.x;
  gl_Position = uVP * vec4(p, 1.0);
}`;

var SH_WATER_FS = `#version 300 es
precision highp float;
precision highp int;
in vec3 vW;
in float vSky;
uniform float uCut;
${SH_COMMON}
layout(location = 0) out vec4 oColor;
void main() {
  if (uCut > 0.0 && dot(vW.xz - uCam.xz, vW.xz - uCam.xz) < uCut * uCut) discard;
  float t = uTime;
  vec2 g = vec2(cos(vW.x * 0.7 + t * 1.1) * 0.7, cos(vW.z * 0.6 - t * 0.9) * 0.6) * 0.07;
  g += vec2(cos((vW.x + vW.z) * 1.9 + t * 2.3), cos((vW.x - vW.z) * 1.7 - t * 2.0)) * 0.035;
  g += vec2(h21(floor(vW.xz * 2.0 + t * 0.5)) - 0.5, h21(floor(vW.xz * 2.0 - t * 0.4) + 5.0) - 0.5) * 0.025;
  vec3 N = normalize(vec3(-g.x, 1.0, -g.y));
  vec3 V = uCam - vW;
  float dist = length(V);
  V /= dist;
  float fr = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 4.0);
  vec3 refl = skyColor(reflect(-V, N));
  vec3 deep = vec3(0.004, 0.012, 0.020) * (0.4 + vSky);
  vec3 col = mix(deep, refl, clamp(fr * 0.92 + 0.07, 0.0, 1.0));
  col = mix(col, uFog, fogAmt(vW));
  oColor = vec4(col, mix(0.80, 0.97, fr));
}`;

// ── glow sprites: lamp heads, neon, the bat-signal lamp ───────────────────
var SH_GLOW_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;       // -1..1
layout(location = 1) in vec4 aPosSize;      // xyz, radius
layout(location = 2) in vec4 aColI;         // rgb, intensity
uniform mat4 uVP;
uniform vec3 uRight;
uniform vec3 uUp;
out vec2 vC;
out vec4 vColI;
out vec3 vWp;
void main() {
  vC = aCorner; vColI = aColI; vWp = aPosSize.xyz;
  vec3 p = aPosSize.xyz + (uRight * aCorner.x + uUp * aCorner.y) * aPosSize.w;
  gl_Position = uVP * vec4(p, 1.0);
}`;

var SH_GLOW_FS = `#version 300 es
precision highp float;
in vec2 vC;
in vec4 vColI;
in vec3 vWp;
${SH_COMMON}
layout(location = 0) out vec4 oColor;
void main() {
  float r2 = dot(vC, vC);
  if (r2 > 1.0) discard;
  float core = exp(-r2 * 14.0);
  float halo = exp(-r2 * 3.2) * 0.35;
  oColor = vec4(vColI.rgb * (core * 3.0 + halo) * vColI.a * (1.0 - 0.85 * fogAmt(vWp)), 1.0);
}`;

// ── rain: a volume of streaks around the camera, animated entirely on the GPU ─
var SH_RAIN_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;       // x: -1..1 across, y: 0..1 along
uniform mat4 uVP;
uniform vec3 uCam;
uniform float uTime;
uniform float uCount;
uniform float uWind;
out float vA;
float hh(float n) { return fract(sin(n * 127.1) * 43758.5453); }
void main() {
  float id = float(gl_InstanceID);
  float W = 70.0, Hh = 46.0;
  vec3 base = vec3(hh(id) * W, hh(id + 11.3) * Hh, hh(id + 27.7) * W);
  float speed = 26.0 + hh(id + 3.1) * 10.0;
  vec3 p;
  p.y = Hh - mod(base.y + uTime * speed, Hh);
  float slant = uWind * (0.25 + hh(id + 5.5) * 0.15);
  p.x = base.x + (Hh - p.y) * slant;
  p.z = base.z;
  // wrap into a box centred on the camera
  p.x = uCam.x + mod(p.x - uCam.x + W * 0.5, W) - W * 0.5;
  p.z = uCam.z + mod(p.z - uCam.z + W * 0.5, W) - W * 0.5;
  p.y += uCam.y - 14.0;
  float len = 1.1 + hh(id + 8.8) * 0.9;
  vec3 dir = normalize(vec3(slant, 1.0, 0.0)) * len;
  vec3 toCam = normalize(uCam - p);
  float dc = length(p - uCam);
  vec3 side = normalize(cross(dir, toCam)) * (0.012 + dc * 0.0011);
  vec3 pos = p + dir * aCorner.y + side * aCorner.x;
  // a streak a metre from the lens is as long as the screen and reads as a scratch:
  // fade it in over the first few metres, and out again at the far edge of the box
  float fade = smoothstep(2.5, 11.0, dc) * (1.0 - smoothstep(24.0, 58.0, dc));
  vA = (1.0 - aCorner.y * 0.85) * (0.35 + hh(id + 1.9) * 0.65) * fade;
  gl_Position = uVP * vec4(pos, 1.0);
}`;

var SH_RAIN_FS = `#version 300 es
precision highp float;
in float vA;
uniform float uAlpha;
layout(location = 0) out vec4 oColor;
void main() { oColor = vec4(vec3(0.52, 0.62, 0.80) * vA * uAlpha * 0.55, 1.0); }`;

// ── a light beam: the bat-signal ──────────────────────────────────────────
var SH_BEAM_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;       // x: -1..1 across, y: 0..1 along
uniform mat4 uVP;
uniform vec3 uCam;
uniform vec3 uP0;
uniform vec3 uP1;
uniform vec2 uWidth;                        // radius at base, at tip
out vec2 vUV;
void main() {
  vec3 axis = uP1 - uP0;
  vec3 p = uP0 + axis * aCorner.y;
  vec3 toCam = normalize(uCam - p);
  vec3 side = normalize(cross(axis, toCam));
  float w = mix(uWidth.x, uWidth.y, aCorner.y);
  vUV = aCorner;
  gl_Position = uVP * vec4(p + side * aCorner.x * w, 1.0);
}`;

var SH_BEAM_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform float uTime;
uniform float uPulse;
uniform vec3 uTint;
layout(location = 0) out vec4 oColor;
void main() {
  float across = 1.0 - abs(vUV.x);
  float edge = pow(across, 1.6);
  float along = pow(1.0 - vUV.y, 0.8) * smoothstep(0.0, 0.03, vUV.y);
  float a = edge * along * uPulse;
  oColor = vec4(uTint * a * 0.55, 1.0);
}`;

// ── the bat emblem the signal throws on the clouds ─────────────────────────
var SH_EMB_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;
uniform mat4 uVP;
uniform vec3 uCenter;
uniform float uHalf;
out vec2 vUV;
void main() {
  vec2 q = vec2(aCorner.x, aCorner.y * 2.0 - 1.0);
  vUV = q;
  // lies flat in the cloud deck; "up" on the emblem is north (-z)
  gl_Position = uVP * vec4(uCenter + vec3(q.x * uHalf, 0.0, q.y * uHalf * 0.52), 1.0);
}`;
var SH_EMB_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uBat;
uniform float uPulse;
layout(location = 0) out vec4 oColor;
void main() {
  float r = length(vUV);
  float disc = smoothstep(1.0, 0.72, r);
  float bat = texture(uBat, vec2(vUV.x * 0.5 + 0.5, 0.5 - vUV.y * 0.5)).r;
  float a = disc * (1.0 - bat * 0.97) * 0.55 * uPulse;
  // a faint ring of halo outside the disc
  a += smoothstep(1.0, 0.8, r) * smoothstep(0.55, 1.0, r) * 0.18 * uPulse;
  oColor = vec4(vec3(1.0, 0.92, 0.6) * a, 1.0);
}`;

// ── entities: voxel models with their own light ───────────────────────────
var SH_ENT_VS = `#version 300 es
precision highp float;
precision highp int;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec4 aCol;          // rgb, emission
layout(location = 2) in vec4 aNrm;          // face id, ao, 0, 0 (unnormalised bytes)
uniform mat4 uVP;
uniform mat4 uModel;
out vec3 vW;
out vec4 vCol;
out vec3 vN;
void main() {
  vec4 w = uModel * vec4(aPos, 1.0);
  vW = w.xyz; vCol = aCol;
  int f = int(aNrm.x + 0.5);
  vec3 n = f == 0 ? vec3(1.,0.,0.) : f == 1 ? vec3(-1.,0.,0.) : f == 2 ? vec3(0.,1.,0.) : f == 3 ? vec3(0.,-1.,0.) : f == 4 ? vec3(0.,0.,1.) : vec3(0.,0.,-1.);
  vN = normalize(mat3(uModel) * n);
  vCol.rgb *= 0.55 + 0.45 * (aNrm.y / 3.0);
  gl_Position = uVP * w;
}`;

var SH_ENT_FS = `#version 300 es
precision highp float;
precision highp int;
in vec3 vW;
in vec4 vCol;
in vec3 vN;
uniform vec3 uSkyTint;
uniform float uSkyI;
uniform float uBlockI;
uniform vec3 uELight;                       // x: ambient sky, y: moonlit, z: unused
uniform vec3 uEBlock;                       // lamp light on this entity
uniform vec4 uFlash;                        // rgb tint, amount
uniform float uEmitMul;
uniform vec3 uRim;
${SH_COMMON}
layout(location = 0) out vec4 oColor;
void main() {
  vec3 N = normalize(vN);
  vec3 albedo = pow(vCol.rgb, vec3(2.2));
  float emit = vCol.a * 4.0 * uEmitMul;
  vec3 V = uCam - vW;
  float dist = length(V);
  V /= dist;
  float hemi = 0.55 + 0.45 * N.y;
  float moon = max(dot(N, uMoonDir), 0.0);
  vec3 light = uSkyTint * uSkyI * (0.36 * uELight.x * hemi + 0.62 * uELight.y * moon) + uEBlock * (2.0 * uBlockI) * (0.45 + 0.55 * max(N.y * 0.5 + 0.5, 0.0));
  vec3 col = albedo * light;
  // a cold rim: it is what keeps a dark character readable against a dark city
  float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);
  col += uRim * rim * (0.35 + 0.65 * uELight.y) * 0.55;
  if (emit > 0.0) col = albedo * emit;
  col = mix(col, uFlash.rgb * 2.0, uFlash.a);
  col = mix(col, uFog, fogAmt(vW));
  oColor = vec4(col, 1.0);
}`;

// ── post-processing ───────────────────────────────────────────────────────
var SH_FS_VS = `#version 300 es
precision highp float;
out vec2 vUV;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUV = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// Bright pass, with a soft knee so bloom fades in instead of switching on.
var SH_BRIGHT_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform float uThr;
uniform float uKnee;
layout(location = 0) out vec4 oColor;
void main() {
  vec3 c = texture(uTex, vUV).rgb;
  float l = max(c.r, max(c.g, c.b));
  float k = clamp(l - uThr + uKnee, 0.0, 2.0 * uKnee);
  k = k * k / (4.0 * uKnee + 1e-4);
  float w = max(k, l - uThr) / max(l, 1e-4);
  oColor = vec4(min(c * w, vec3(24.0)), 1.0);
}`;

var SH_DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uTexel;
layout(location = 0) out vec4 oColor;
void main() {
  vec3 c = texture(uTex, vUV).rgb * 4.0;
  c += texture(uTex, vUV + uTexel * vec2(-1.0, -1.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2( 1.0, -1.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2(-1.0,  1.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2( 1.0,  1.0)).rgb;
  oColor = vec4(c / 8.0, 1.0);
}`;

var SH_UP_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uMix;
layout(location = 0) out vec4 oColor;
void main() {
  vec3 c = texture(uTex, vUV + uTexel * vec2(-1.0, 0.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2(1.0, 0.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2(0.0, -1.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2(0.0, 1.0)).rgb;
  c += texture(uTex, vUV + uTexel * vec2(-1.0, -1.0)).rgb * 0.5;
  c += texture(uTex, vUV + uTexel * vec2(1.0, -1.0)).rgb * 0.5;
  c += texture(uTex, vUV + uTexel * vec2(-1.0, 1.0)).rgb * 0.5;
  c += texture(uTex, vUV + uTexel * vec2(1.0, 1.0)).rgb * 0.5;
  oColor = vec4(c / 6.0 * uMix, 1.0);
}`;

// Composite: scene + bloom, exposure, tone map, THEN the grade, in display space.
// Grading before the gamma encode is how the 2D game's contrast control ended up
// crushing everything under 51/255 to black: its pivot of 0.5 means mid-grey on a
// screen, but ~0.18 in linear light.
var SH_COMP_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uExposure;
uniform float uBloomAmt;
uniform float uVig;
uniform float uSat;
uniform float uContrast;
uniform vec3 uLift;
uniform vec3 uGain;
uniform float uFade;
uniform vec4 uHurt;
layout(location = 0) out vec4 oColor;

vec3 aces(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
void main() {
  vec3 c = texture(uScene, vUV).rgb + texture(uBloom, vUV).rgb * uBloomAmt;
  c *= uExposure;
  c = aces(c);
  c = pow(c, vec3(1.0 / 2.2));
  c = c * uGain + uLift;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uSat);
  c = clamp((c - 0.5) * uContrast + 0.5, 0.0, 1.0);
  vec2 q = vUV * 2.0 - 1.0;
  float v = 1.0 - dot(q * vec2(0.92, 1.0), q * vec2(0.92, 1.0)) * uVig;
  c *= clamp(v, 0.0, 1.0);
  c = mix(c, uHurt.rgb, uHurt.a * smoothstep(0.35, 1.45, length(q)));
  c *= uFade;
  oColor = vec4(c, 1.0);
}`;

// FXAA (lite) on the display-space image, plus film grain and an ordered dither,
// without which a dark gradient bands hard at 8 bits.
var SH_FXAA_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uGrain;
uniform float uTime;
layout(location = 0) out vec4 oColor;
float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec3 m = texture(uTex, vUV).rgb;
  float lM = luma(m);
  float lN = luma(texture(uTex, vUV + uTexel * vec2(0.0, -1.0)).rgb);
  float lS = luma(texture(uTex, vUV + uTexel * vec2(0.0, 1.0)).rgb);
  float lW = luma(texture(uTex, vUV + uTexel * vec2(-1.0, 0.0)).rgb);
  float lE = luma(texture(uTex, vUV + uTexel * vec2(1.0, 0.0)).rgb);
  float lo = min(lM, min(min(lN, lS), min(lW, lE)));
  float hi = max(lM, max(max(lN, lS), max(lW, lE)));
  vec3 col = m;
  if (hi - lo > max(0.045, hi * 0.12)) {
    vec2 dir = vec2(-((lN + lE) - (lS + lW)), (lW + lN) - (lE + lS));
    float red = 1.0 / (min(abs(dir.x), abs(dir.y)) + max((lN + lS + lW + lE) * 0.03, 0.0078));
    dir = clamp(dir * red, -8.0, 8.0) * uTexel;
    vec3 a = 0.5 * (texture(uTex, vUV + dir * (1.0 / 3.0 - 0.5)).rgb + texture(uTex, vUV + dir * (2.0 / 3.0 - 0.5)).rgb);
    vec3 b = a * 0.5 + 0.25 * (texture(uTex, vUV + dir * -0.5).rgb + texture(uTex, vUV + dir * 0.5).rgb);
    float lb = luma(b);
    col = (lb < lo || lb > hi) ? a : b;
  }
  float n = fract(sin(dot(gl_FragCoord.xy + fract(uTime) * 91.7, vec2(12.9898, 78.233))) * 43758.5453);
  col += (n - 0.5) * uGrain;
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(4.1, 7.3))) * 9371.7) - 0.5) / 255.0;
  oColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;


// ═══ WORLD ═══
// ═══════════════════════════════════════════════════════════════════════
//  WORLD — the main-thread side of the chunk system.
//
//  Decides which chunks should exist around the player, farms the baking out to
//  workers (or does it itself, a few milliseconds a frame, when workers are not
//  available), uploads the finished meshes to the GPU a few per frame so a burst
//  of arrivals never stalls a frame, and answers the questions the game asks of
//  the terrain: what block is here, what is below me, what does this ray hit.
//
//  Chunks that are not loaded count as SOLID. A player who outruns the loader
//  stops at the edge of the known world instead of falling through the floor of
//  a place that does not exist yet.
// ═══════════════════════════════════════════════════════════════════════

class VxWorld {
  constructor(gl, opts) {
    opts = opts || {};
    this.gl = gl;
    this.radius = opts.radius || 7;
    this.chunks = new Map();
    this.pending = new Set();
    this.need = [];
    this.centerKey = null;
    this.dirty = true;
    this.workers = [];
    this.mode = 'init';              // init | workers | main
    this.inflightMax = 2;
    this.uploadQ = [];
    this.job = null;                 // main-thread fallback: the chunk being baked
    this.nextId = 1;
    this.stats = { baked: 0, ms: 0, drawn: 0, tris: 0, upload: 0 };
    this.workerFailed = false;
    this.readyAt = 0;
  }

  // Try to start a pool of workers from the source text embedded in the page. Any
  // failure at all (no Worker, a blocked blob URL, a script error) drops back to
  // baking on the main thread, so the world still loads — just not off-thread.
  startWorkers(src, n) {
    if (typeof Worker === 'undefined' || !src) { this.mode = 'main'; return; }
    try {
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      let alive = 0;
      for (let i = 0; i < n; i++) {
        const w = new Worker(url);
        const slot = { w: w, busy: 0, ready: false };
        w.onmessage = e => {
          const m = e.data;
          if (m.t === 'ready') { slot.ready = true; alive++; if (this.mode === 'init') this.mode = 'workers'; }
          else if (m.t === 'chunk') { slot.busy = Math.max(0, slot.busy - 1); this.uploadQ.push(m); this.stats.baked++; this.stats.ms += m.ms || 0; }
        };
        w.onerror = () => { this.workerFailed = true; };
        this.workers.push(slot);
      }
      this.readyAt = performance.now();
      this.mode = 'init';
    } catch (e) { this.mode = 'main'; this.workerFailed = true; }
  }

  // Called every frame with the player's position.
  update(px, pz, budgetMs) {
    // an init that never produced a ready worker within two seconds is a failed one
    if (this.mode === 'init' && this.workers.length && (this.workerFailed || performance.now() - this.readyAt > 2500)) {
      for (const s of this.workers) { try { s.w.terminate(); } catch (e) { } }
      this.workers = []; this.mode = 'main';
    }
    if (this.mode === 'init' && !this.workers.length) this.mode = 'main';

    this.lastX = px; this.lastZ = pz;
    const pcx = Math.floor(px / 16), pcz = Math.floor(pz / 16);
    const key = JB_key(pcx, pcz);
    if (key !== this.centerKey || this.dirty) {
      this.centerKey = key; this.dirty = false;
      this.rebuildNeed(pcx, pcz);
      this.unloadFar(pcx, pcz);
    }
    if (this.mode === 'workers') this.dispatch();
    else if (this.mode === 'main') this.stepMain(budgetMs === undefined ? 5 : budgetMs);
    this.flushUploads(3);
  }

  rebuildNeed(pcx, pcz) {
    const R = this.radius, list = [];
    for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) {
      const d2 = dx * dx + dz * dz;
      if (d2 > R * R) continue;
      const cx = pcx + dx, cz = pcz + dz, k = JB_key(cx, cz);
      if (this.chunks.has(k) || this.pending.has(k)) continue;
      list.push({ cx: cx, cz: cz, d2: d2, k: k });
    }
    list.sort((a, b) => a.d2 - b.d2);
    this.need = list;
  }

  dispatch() {
    for (const s of this.workers) {
      if (!s.ready) continue;
      while (s.busy < this.inflightMax && this.need.length) {
        const it = this.need.shift();
        if (this.chunks.has(it.k) || this.pending.has(it.k)) continue;
        this.pending.add(it.k);
        s.busy++;
        s.w.postMessage({ t: 'bake', cx: it.cx, cz: it.cz, id: this.nextId++ });
      }
    }
  }

  // The fallback: run the bake generator for a few milliseconds a frame.
  stepMain(budgetMs) {
    const t0 = performance.now();
    while (performance.now() - t0 < budgetMs) {
      if (!this.job) {
        let it = null;
        while (this.need.length) { const c = this.need.shift(); if (!this.chunks.has(c.k) && !this.pending.has(c.k)) { it = c; break; } }
        if (!it) return;
        this.pending.add(it.k);
        this.job = { cx: it.cx, cz: it.cz, k: it.k, gen: BX_bake(it.cx, it.cz, JB_env), t0: performance.now() };
      }
      const r = this.job.gen.next();
      if (r.done) {
        const m = JB_package(this.job.cx, this.job.cz, r.value);
        m.ms = performance.now() - this.job.t0;
        this.uploadQ.push(m); this.stats.baked++; this.stats.ms += m.ms;
        this.job = null;
      }
    }
  }

  flushUploads(max) {
    const gl = this.gl;
    let n = 0;
    while (this.uploadQ.length && n < max) {
      const m = this.uploadQ.shift(), k = JB_key(m.cx, m.cz);
      this.pending.delete(k);
      const old = this.chunks.get(k);
      if (old) this.freeChunk(old);
      const c = { cx: m.cx, cz: m.cz, key: k, vox: m.vox, top: m.top, maxY: m.maxY, emitters: m.emitters,
                  o: this.upload(m.opaque), w: this.upload(m.water) };
      this.chunks.set(k, c);
      n++; this.stats.upload++;
    }
  }

  upload(mesh) {
    if (!mesh || mesh.ni === 0) return null;
    const gl = this.gl;
    const vao = gl.createVertexArray(), vbo = gl.createBuffer(), ibo = gl.createBuffer();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.v, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.UNSIGNED_BYTE, false, 16, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribIPointer(1, 4, gl.UNSIGNED_BYTE, 16, 4);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, 16, 8);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, 16, 12);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.i, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao: vao, vbo: vbo, ibo: ibo, n: mesh.ni, wide: !!mesh.wide };
  }

  freeMesh(o) {
    if (!o) return;
    const gl = this.gl;
    gl.deleteVertexArray(o.vao); gl.deleteBuffer(o.vbo); gl.deleteBuffer(o.ibo);
  }
  freeChunk(c) { this.freeMesh(c.o); this.freeMesh(c.w); }

  unloadFar(pcx, pcz) {
    const lim = (this.radius + 2) * (this.radius + 2);
    for (const [k, c] of this.chunks) {
      const dx = c.cx - pcx, dz = c.cz - pcz;
      if (dx * dx + dz * dz > lim) { this.freeChunk(c); this.chunks.delete(k); }
    }
  }

  // How many of the chunks the player should have are in place (0..1).
  loadedFraction() {
    const R = this.radius; let want = 0, have = 0;
    const pcx = Math.floor(this.lastX / 16) || 0, pcz = Math.floor(this.lastZ / 16) || 0;
    for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) {
      if (dx * dx + dz * dz > R * R) continue;
      want++; if (this.chunks.has(JB_key(pcx + dx, pcz + dz))) have++;
    }
    return want ? have / want : 1;
  }

  // ── queries ─────────────────────────────────────────────────────────────
  chunkAt(x, z) { return this.chunks.get(JB_key(x >> 4, z >> 4)); }

  // Block id at integer coordinates; -1 when that chunk is not loaded.
  getBlock(x, y, z) {
    if (y < 0) return BK.BEDROCK;
    if (y >= WG_H) return 0;
    const c = this.chunks.get(JB_key(x >> 4, z >> 4));
    if (!c) return -1;
    return c.vox[((x & 15) * 16 + (z & 15)) * WG_H + y];
  }
  isSolid(x, y, z) {
    const b = this.getBlock(x, y, z);
    return b < 0 ? true : BK_SOLID[b] === 1;
  }

  // The y of the first free cell above the highest solid voxel at or below `fromY`.
  groundY(x, z, fromY) {
    const ix = Math.floor(x), iz = Math.floor(z);
    for (let y = Math.min(WG_H - 1, Math.floor(fromY)); y >= 0; y--) {
      if (this.isSolid(ix, y, iz)) return y + 1;
    }
    return 0;
  }

  // A ray through the voxels (Amanatides & Woo). Returns the first solid cell, its
  // face normal and the distance, or null.
  raycast(ox, oy, oz, dx, dy, dz, maxDist) {
    let ix = Math.floor(ox), iy = Math.floor(oy), iz = Math.floor(oz);
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
    const tDx = dx !== 0 ? Math.abs(1 / dx) : 1e30, tDy = dy !== 0 ? Math.abs(1 / dy) : 1e30, tDz = dz !== 0 ? Math.abs(1 / dz) : 1e30;
    let tx = dx > 0 ? (ix + 1 - ox) * tDx : (ox - ix) * tDx;
    let ty = dy > 0 ? (iy + 1 - oy) * tDy : (oy - iy) * tDy;
    let tz = dz > 0 ? (iz + 1 - oz) * tDz : (oz - iz) * tDz;
    let nx = 0, ny = 0, nz = 0, t = 0;
    for (let n = 0; n < 400; n++) {
      if (this.isSolid(ix, iy, iz)) return { x: ix, y: iy, z: iz, nx: nx, ny: ny, nz: nz, t: t };
      if (tx < ty && tx < tz) { t = tx; if (t > maxDist) return null; ix += sx; tx += tDx; nx = -sx; ny = 0; nz = 0; }
      else if (ty < tz) { t = ty; if (t > maxDist) return null; iy += sy; ty += tDy; nx = 0; ny = -sy; nz = 0; }
      else { t = tz; if (t > maxDist) return null; iz += sz; tz += tDz; nx = 0; ny = 0; nz = -sz; }
    }
    return null;
  }

  // ── drawing ─────────────────────────────────────────────────────────────
  // Draws every loaded chunk that touches the frustum with whichever mesh `which`
  // names ('o' opaque, 'w' water).
  draw(prog, planes, camX, camZ, which, maxDist) {
    const gl = this.gl, org = prog.u('uOrg');
    const lim = maxDist * maxDist;
    let drawn = 0, tris = 0;
    for (const c of this.chunks.values()) {
      const m = c[which];
      if (!m) continue;
      const x0 = c.cx * 16, z0 = c.cz * 16;
      const dx = x0 + 8 - camX, dz = z0 + 8 - camZ;
      if (dx * dx + dz * dz > lim) continue;
      if (!M4_boxVisible(planes, x0, 0, z0, x0 + 16, c.maxY + 2, z0 + 16)) continue;
      gl.uniform3f(org, x0, 0, z0);
      gl.bindVertexArray(m.vao);
      gl.drawElements(gl.TRIANGLES, m.n, m.wide ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
      drawn++; tris += m.n / 3;
    }
    gl.bindVertexArray(null);
    if (which === 'o') { this.stats.drawn = drawn; this.stats.tris = tris; }
  }

  // Every light source near a point, packed for the glow-sprite pass:
  // x, y, z, sprite radius, r, g, b, intensity.
  collectGlow(cx, cy, cz, maxDist, out) {
    let n = 0;
    const lim = maxDist * maxDist;
    for (const c of this.chunks.values()) {
      const e = c.emitters;
      for (let i = 0; i < e.length; i++) {
        const l = e[i];
        const dx = l[0] - cx, dz = l[2] - cz;
        if (dx * dx + dz * dz > lim) continue;
        if (n >= out.length / 8) return n;
        const o = n * 8;
        out[o] = l[0]; out[o + 1] = l[1]; out[o + 2] = l[2]; out[o + 3] = 1.7;
        out[o + 4] = l[3]; out[o + 5] = l[4]; out[o + 6] = l[5]; out[o + 7] = l[6];
        n++;
      }
    }
    return n;
  }
}


// ═══ FAR ═══
// ═══════════════════════════════════════════════════════════════════════
//  FAR — the distant city, at low resolution.
//
//  The detailed chunks stop at about 120 blocks. From street level that is fine:
//  the fog has long since taken everything. From a rooftop, or gliding, the
//  horizon is hundreds of blocks away, and without something out there the city
//  simply ends in a visible edge, a floating island. This builds the rest, as
//  4x4-block columns taken from the same mass heights the baker uses for shadows,
//  so it is the SAME city: the towers are where the towers are, as tall as they
//  are, with rows of lit windows picked by hash.
//
//  It costs almost nothing. A chunk's mass is about sixty microseconds and a tile
//  of sixteen chunks meshes in a couple of milliseconds, so the whole horizon is
//  built in well under a second without a worker. Tiles are 64 blocks square to
//  keep the draw-call count down; the shader discards the part of a tile that lies
//  inside the detailed chunks, so the two never fight.
// ═══════════════════════════════════════════════════════════════════════

var FR_T = 64;     // tile size in blocks
var FR_CELL = 4;   // column size in blocks
var FR_N = FR_T / FR_CELL;       // 16 columns across a tile

class VxFar {
  constructor(gl, range) {
    this.gl = gl;
    this.range = range || 416;
    this.tiles = new Map();
    this.need = [];
    this.centerKey = null;
    this.stats = { built: 0, ms: 0, drawn: 0 };
  }

  update(px, pz, budgetMs) {
    const tx = Math.floor(px / FR_T), tz = Math.floor(pz / FR_T);
    const key = tx * 100000 + tz;
    if (key !== this.centerKey) {
      this.centerKey = key;
      const R = Math.ceil(this.range / FR_T) + 1, list = [];
      for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) {
        const d = Math.hypot(dx, dz) * FR_T;
        if (d > this.range + FR_T) continue;
        const k = (tx + dx) * 100000 + (tz + dz);
        if (!this.tiles.has(k)) list.push({ tx: tx + dx, tz: tz + dz, d: d, k: k });
      }
      list.sort((a, b) => a.d - b.d);
      this.need = list;
      // let go of tiles that have drifted well out of range
      for (const [k, t] of this.tiles) {
        if (Math.hypot((t.tx - tx) * FR_T, (t.tz - tz) * FR_T) > this.range + FR_T * 3) { this.free(t); this.tiles.delete(k); }
      }
    }
    const t0 = performance.now();
    while (this.need.length && performance.now() - t0 < budgetMs) {
      const n = this.need.shift();
      if (this.tiles.has(n.k)) continue;
      this.tiles.set(n.k, this.build(n.tx, n.tz));
      this.stats.built++;
    }
    this.stats.ms += performance.now() - t0;
  }

  free(t) {
    const gl = this.gl;
    for (const m of [t.o, t.w]) if (m) { gl.deleteVertexArray(m.vao); gl.deleteBuffer(m.vbo); gl.deleteBuffer(m.ibo); }
  }

  done() { return this.need.length === 0; }

  build(tx, tz) {
    const gl = this.gl;
    const x0 = tx * FR_T, z0 = tz * FR_T;
    const cx0 = (x0 >> 4) - 1, cz0 = (z0 >> 4) - 1;
    // the mass arrays of the sixteen chunks and a ring around them
    const masses = [];
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) masses.push(JB_getMass(cx0 + i, cz0 + j));
    const mass = (x, z) => masses[((x >> 4) - cx0) * 6 + ((z >> 4) - cz0)][(x & 15) * 16 + (z & 15)];

    // height and class of every column, with a one-column margin for the side faces
    const G = FR_N + 2, hgt = new Uint8Array(G * G), cls = new Array(G * G);
    const o = { kind: 0, top: 0, b: null };
    for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
      const wx = x0 + (i - 1) * FR_CELL, wz = z0 + (j - 1) * FR_CELL;
      let h = 0;
      for (let a = 0; a < FR_CELL; a++) for (let b = 0; b < FR_CELL; b++) { const m = mass(wx + a, wz + b); if (m > h) h = m; }
      hgt[i * G + j] = h;
      WG_colInfo(wx + 2, wz + 2, o);
      cls[i * G + j] = { kind: o.kind, b: o.b };
    }

    const op = BX_mesh(), wa = BX_mesh();
    const W = WG_K;
    for (let i = 1; i <= FR_N; i++) for (let j = 1; j <= FR_N; j++) {
      const c = cls[i * G + j], h = hgt[i * G + j];
      const bx = (i - 1) * FR_CELL, bz = (j - 1) * FR_CELL;       // tile-local
      const wx = x0 + bx, wz = z0 + bz;
      if (c.kind === W.WATER) { FR_water(wa, bx, bz); continue; }
      let blk = BK.SIDEWALK, wall = BK.CONCRETE_DK, roof = BK.ROOF_TAR;
      if (c.kind === W.ROAD) blk = BK.ASPHALT;
      else if (c.kind === W.PARK) blk = BK.GRASS;
      else if (c.kind === W.BUILDING && c.b) { const st = WG_STY[c.b.st]; wall = st.wall; roof = st.roof; blk = roof; }
      const rnd = NZ_f(wx, wz, 3);
      // the top of the column
      FR_quad(op, 2, bx, h, bz, FR_CELL, 0, FR_CELL, blk, 0.93 + 0.14 * rnd, 0, 0.62);
      // side faces where the neighbour is lower
      const nb = [hgt[(i + 1) * G + j], hgt[(i - 1) * G + j], hgt[i * G + j + 1], hgt[i * G + j - 1]];
      const fc = [0, 1, 4, 5];
      for (let q = 0; q < 4; q++) {
        const lo = nb[q];
        if (lo >= h) continue;
        const f = fc[q];
        const sky = 0.08 + 0.28 * Math.max(0, (f === 0 ? 0.43 : f === 1 ? -0.43 : f === 4 ? 0.60 : -0.60));
        // water or ground below: stop at the waterline or the street
        const base = Math.max(lo, c.kind === W.BUILDING ? WG_GY + 2 : 0);
        FR_side(op, f, bx, bz, base, h, wall, sky, wx, wz, c.kind === W.BUILDING);
      }
    }
    return { tx: tx, tz: tz, o: FR_upload(gl, op), w: FR_upload(gl, wa) };
  }

  draw(prog, planes, camX, camZ, which, maxDist) {
    const gl = this.gl, org = prog.u('uOrg');
    let drawn = 0;
    const lim = maxDist + FR_T;
    for (const t of this.tiles.values()) {
      const m = t[which];
      if (!m) continue;
      const x0 = t.tx * FR_T, z0 = t.tz * FR_T;
      const dx = x0 + FR_T / 2 - camX, dz = z0 + FR_T / 2 - camZ;
      if (dx * dx + dz * dz > lim * lim) continue;
      if (!M4_boxVisible(planes, x0, 0, z0, x0 + FR_T, WG_H, z0 + FR_T)) continue;
      gl.uniform3f(org, x0, 0, z0);
      gl.bindVertexArray(m.vao);
      gl.drawElements(gl.TRIANGLES, m.n, m.wide ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
      drawn++;
    }
    gl.bindVertexArray(null);
    this.stats.drawn = drawn;
  }
}

// One face of a box, in the terrain vertex format. For a +y face (f=2) the box is
// the cell's top plane at height y; w,d are the cell footprint.
function FR_quad(m, f, x, y, z, w, hh, d, blk, vr, emit, sky) {
  BX_ensure(m, 4);
  const F = BX_FACE[f];
  const x1 = x + w, y1 = y + hh, z1 = z + d;
  const r = BK_RGB[blk * 3] * vr, g = BK_RGB[blk * 3 + 1] * vr, b = BK_RGB[blk * 3 + 2] * vr;
  const v0 = m.nv, fl = BK_FLAGS[blk];
  const s = Math.min(255, sky * 255), em = Math.min(255, Math.round(emit / 4 * 255));
  for (let c = 0; c < 4; c++) {
    const p = F.verts[c].p, o = (v0 + c) * 16, dd = m.v;
    dd[o] = p[0] ? x1 : x; dd[o + 1] = p[1] ? y1 : y; dd[o + 2] = p[2] ? z1 : z; dd[o + 3] = 0;
    dd[o + 4] = blk; dd[o + 5] = f; dd[o + 6] = 3; dd[o + 7] = fl;
    dd[o + 8] = Math.min(255, r); dd[o + 9] = Math.min(255, g); dd[o + 10] = Math.min(255, b); dd[o + 11] = em;
    dd[o + 12] = s; dd[o + 13] = 0; dd[o + 14] = 0; dd[o + 15] = 0;
  }
  const I = m.i, ni = m.ni;
  I[ni] = v0; I[ni + 1] = v0 + 1; I[ni + 2] = v0 + 2; I[ni + 3] = v0; I[ni + 4] = v0 + 2; I[ni + 5] = v0 + 3;
  m.nv += 4; m.ni += 6;
}

// A vertical wall of a column, from `y0` to `y1`, in floors: a wall band and a
// window band, the window picked lit or dark by hash. From far away these read as
// rows of lit windows, which is the whole look of a skyline at night.
function FR_side(m, f, bx, bz, y0, y1, wall, sky, wx, wz, windows) {
  const FH = 6;
  for (let y = y0; y < y1; ) {
    const fl = Math.floor((y - WG_BASE) / FH);
    const rel = (y - WG_BASE) - fl * FH;
    let h, blk, em = 0;
    if (windows && y >= WG_BASE + FH) {
      if (rel < 3) { h = Math.min(3 - rel, y1 - y); blk = wall; }
      else {
        h = Math.min(FH - rel, y1 - y);
        const k = NZ_f(wx * 7 + f, fl, wz * 3 + 5);
        if (k < 0.34) { blk = k < 0.20 ? BK.WIN_WARM : (k < 0.30 ? BK.WIN_COOL : BK.WIN_WHITE); em = BK_EMIT[blk]; }
        else blk = BK.GLASS_BLUE;
      }
    } else { h = y1 - y; blk = wall; }
    if (h <= 0) break;
    // the face lies on the cell boundary facing the lower neighbour
    let x = bx, z = bz, w = FR_CELL, d = FR_CELL;
    if (f === 0) { x = bx + FR_CELL; w = 0; }
    else if (f === 1) { w = 0; }
    else if (f === 4) { z = bz + FR_CELL; d = 0; }
    else { d = 0; }
    FR_quad(m, f, x, y, z, w, h, d, blk, 0.92 + 0.16 * NZ_f(wx + y, wz, f), em, em ? 0 : sky);
    y += h;
  }
}

function FR_water(m, bx, bz) {
  // a +y quad at the waterline; the water shader lowers it a hair and shades it
  BX_ensure(m, 4);
  const F = BX_FACE[2], v0 = m.nv;
  for (let c = 0; c < 4; c++) {
    const p = F.verts[c].p, o = (v0 + c) * 16, dd = m.v;
    dd[o] = bx + (p[0] ? FR_CELL : 0); dd[o + 1] = WG_SEA + 1; dd[o + 2] = bz + (p[2] ? FR_CELL : 0); dd[o + 3] = 0;
    dd[o + 4] = BK.WATER; dd[o + 5] = 2; dd[o + 6] = 3; dd[o + 7] = 4;
    dd[o + 8] = 16; dd[o + 9] = 42; dd[o + 10] = 62; dd[o + 11] = 0;
    dd[o + 12] = 150; dd[o + 13] = 0; dd[o + 14] = 0; dd[o + 15] = 0;
  }
  const I = m.i, ni = m.ni;
  I[ni] = v0; I[ni + 1] = v0 + 1; I[ni + 2] = v0 + 2; I[ni + 3] = v0; I[ni + 4] = v0 + 2; I[ni + 5] = v0 + 3;
  m.nv += 4; m.ni += 6;
}

function FR_upload(gl, m) {
  if (!m.ni) return null;
  const vao = gl.createVertexArray(), vbo = gl.createBuffer(), ibo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, m.v.subarray(0, m.nv * 16), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.UNSIGNED_BYTE, false, 16, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribIPointer(1, 4, gl.UNSIGNED_BYTE, 16, 4);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, 16, 8);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, 16, 12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  const wide = m.nv >= 65536;
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wide ? m.i.subarray(0, m.ni) : new Uint16Array(m.i.subarray(0, m.ni)), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao: vao, vbo: vbo, ibo: ibo, n: m.ni, wide: wide };
}


// ═══ RENDER ═══
// ═══════════════════════════════════════════════════════════════════════
//  RENDER — the camera, the frame, and the post-processing chain.
//
//  One frame, in order:  sky -> terrain -> entities -> glow -> water -> rain ->
//  beam, all into a linear-HDR target at a fraction of the screen resolution;
//  then bright-pass, a mip chain of blurs, and a composite that tone-maps and
//  grades in DISPLAY space; then FXAA, grain and dither onto the canvas.
// ═══════════════════════════════════════════════════════════════════════

class VxCamera {
  constructor() {
    this.x = 0; this.y = 60; this.z = 0; this.yaw = 0; this.pitch = 0;
    this.fov = 1.15; this.near = 0.12; this.far = 420; this.aspect = 16 / 9;
    this.view = M4_new(); this.proj = M4_new(); this.vp = M4_new(); this.inv = M4_new();
    this.planes = new Float32Array(24);
    this.fx = 0; this.fy = 0; this.fz = -1;      // forward
    this.rx = 1; this.ry = 0; this.rz = 0;       // right
    this.ux = 0; this.uy = 1; this.uz = 0;       // up
  }
  // yaw 0 looks down -z; positive yaw turns right (towards +x)
  update() {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch), cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
    this.fx = sy * cp; this.fy = sp; this.fz = -cy * cp;
    this.rx = cy; this.ry = 0; this.rz = sy;
    this.ux = this.ry * this.fz - this.rz * this.fy; this.uy = this.rz * this.fx - this.rx * this.fz; this.uz = this.rx * this.fy - this.ry * this.fx;
    // right x forward points down for a right-handed camera, so flip to get up
    this.ux = -this.ux; this.uy = -this.uy; this.uz = -this.uz;
    M4_persp(this.proj, this.fov, this.aspect, this.near, this.far);
    M4_look(this.view, this.x, this.y, this.z, this.x + this.fx, this.y + this.fy, this.z + this.fz, 0, 1, 0);
    M4_mul(this.vp, this.proj, this.view);
    M4_inv(this.inv, this.vp);
    M4_planes(this.planes, this.vp);
  }
}

class VxRenderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: false });
    if (!gl) throw new Error('WebGL2 no está disponible en este navegador');
    this.gl = gl; this.canvas = canvas;
    this.hdr = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
    gl.getExtension('OES_texture_float_linear');

    this.prog = {
      sky: GL_prog(gl, SH_SKY_VS, SH_SKY_FS, 'sky'),
      terrain: GL_prog(gl, SH_TERRAIN_VS, SH_TERRAIN_FS, 'terrain'),
      water: GL_prog(gl, SH_WATER_VS, SH_WATER_FS, 'water'),
      glow: GL_prog(gl, SH_GLOW_VS, SH_GLOW_FS, 'glow'),
      rain: GL_prog(gl, SH_RAIN_VS, SH_RAIN_FS, 'rain'),
      beam: GL_prog(gl, SH_BEAM_VS, SH_BEAM_FS, 'beam'),
      emblem: GL_prog(gl, SH_EMB_VS, SH_EMB_FS, 'emblem'),
      ent: GL_prog(gl, SH_ENT_VS, SH_ENT_FS, 'ent'),
      bright: GL_prog(gl, SH_FS_VS, SH_BRIGHT_FS, 'bright'),
      down: GL_prog(gl, SH_FS_VS, SH_DOWN_FS, 'down'),
      up: GL_prog(gl, SH_FS_VS, SH_UP_FS, 'up'),
      comp: GL_prog(gl, SH_FS_VS, SH_COMP_FS, 'comp'),
      fxaa: GL_prog(gl, SH_FS_VS, SH_FXAA_FS, 'fxaa'),
    };
    this.emptyVao = gl.createVertexArray();

    // unit quads: a centred one for sprites, a strip for streaks and beams
    this.quadVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    this.stripVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.stripVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 0, 1, 0, -1, 1, 1, 1]), gl.STATIC_DRAW);

    this.glowData = new Float32Array(8 * 640);
    this.glowVbo = gl.createBuffer();
    this.glowVao = gl.createVertexArray();
    gl.bindVertexArray(this.glowVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadVbo);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.glowVbo);
    gl.bufferData(gl.ARRAY_BUFFER, this.glowData.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(1, 1);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(2, 1);
    gl.bindVertexArray(null);

    this.stripVao = gl.createVertexArray();
    gl.bindVertexArray(this.stripVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.stripVbo);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
    gl.bindVertexArray(null);

    // the bat symbol as a tiny nearest-filtered bitmap
    const BAT = [".............#...#.............", "#...........##...##...........#", "####........##...##........####", "######......#######......######", "########....#######....########", "##########..#######..##########", "###############################", "###.#######################.###", ".##.###.###.#######.###.###.##.", ".#...#...#...#####...#...#...#.", ".........#....###....#.........", "..............###..............", "...............................", "...............................", "..............................."];
    const bd = new Uint8Array(32 * 16);
    BAT.forEach(function (row, j) { for (let i = 0; i < 31; i++) if (row[i] === '#') bd[j * 32 + i] = 255; });
    this.batTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.batTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 32, 16, 0, gl.RED, gl.UNSIGNED_BYTE, bd);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.w = 0; this.h = 0; this.scale = 1;
    this.scene = null; this.ldr = null; this.bloom = [];
    this.time = 0;
    this.farDist = 416;        // where the far city ends (fog is opaque by then)
    this.nearDist = 118;       // where the detailed chunks end
    this.rain = true;
    this.beam = { on: true, p0: [0, 0, 0], p1: [0, 0, 0] };
    this.P = VxRenderer.defaults();
  }

  static defaults() {
    return {
      skyTint: [0.60, 0.70, 0.90], skyI: 2.1, blockI: 1.0,
      fog: [0.082, 0.082, 0.092], fogD: 0.020, fogK: 0.045, fogB: 0.0018, fogBase: 22, fogFar: 4.6,
      horizon: [0.046, 0.058, 0.076], zenith: [0.005, 0.009, 0.019],
      cloudH: 175, storm: 0, flash: 0,
      bevel: 1.0, wet: 1.0,
      exposure: 1.45, bloom: 0.50, bloomThr: 0.95, bloomKnee: 0.55,
      vig: 0.30, sat: 0.94, contrast: 1.06, lift: [0.003, 0.005, 0.009], gain: [1.0, 1.0, 1.02],
      grain: 0.016, rainAlpha: 0.85, rainCount: 5600, wind: 0.5, fade: 1,
      hurt: [0.6, 0.0, 0.0, 0.0],
    };
  }

  // w,h are the canvas drawing-buffer size; the scene renders at scale*size.
  resize(w, h, scale) {
    const gl = this.gl;
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    const sw = Math.max(8, Math.round(w * scale)), sh = Math.max(8, Math.round(h * scale));
    if (this.scene && this.scene.w === sw && this.scene.h === sh && this.w === w && this.h === h) return;
    GL_freeFbo(gl, this.scene); GL_freeFbo(gl, this.ldr);
    for (const b of this.bloom) GL_freeFbo(gl, b);
    this.w = w; this.h = h; this.scale = scale;
    const fmt = this.hdr ? 'f16' : 'u8';
    this.scene = GL_fbo(gl, sw, sh, fmt, true);
    if (!this.scene.ok && this.hdr) { this.hdr = false; GL_freeFbo(gl, this.scene); this.scene = GL_fbo(gl, sw, sh, 'u8', true); }
    this.ldr = GL_fbo(gl, w, h, 'u8', false);
    this.bloom = [];
    let bw = sw >> 1, bh = sh >> 1;
    for (let i = 0; i < 5; i++) {
      this.bloom.push(GL_fbo(gl, Math.max(2, bw), Math.max(2, bh), this.hdr ? 'f16' : 'u8', false));
      bw >>= 1; bh >>= 1;
    }
  }

  // Set the uniforms every sky-aware program shares.
  common(p, cam) {
    const gl = this.gl, P = this.P;
    gl.uniform3f(p.u('uCam'), cam.x, cam.y, cam.z);
    gl.uniform3f(p.u('uMoonDir'), BX_MOON.x, BX_MOON.y, BX_MOON.z);
    gl.uniform3f(p.u('uHorizon'), P.horizon[0], P.horizon[1], P.horizon[2]);
    gl.uniform3f(p.u('uZenith'), P.zenith[0], P.zenith[1], P.zenith[2]);
    gl.uniform1f(p.u('uTime'), this.time);
    gl.uniform1f(p.u('uCloudH'), P.cloudH);
    gl.uniform1f(p.u('uStorm'), P.storm);
    gl.uniform3f(p.u('uFog'), P.fog[0], P.fog[1], P.fog[2]);
    gl.uniform1f(p.u('uFogD'), P.fogD);
    gl.uniform1f(p.u('uFogK'), P.fogK);
    gl.uniform1f(p.u('uFogB'), P.fogB);
    gl.uniform1f(p.u('uFogBase'), P.fogBase);
    gl.uniform1f(p.u('uFarDist'), this.farDist);
    gl.uniform1f(p.u('uFogFar'), P.fogFar);
  }
  fogUniforms(p) { }

  fullscreen() { const gl = this.gl; gl.bindVertexArray(this.emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3); }

  // `extra(r, cam)` draws entities and anything else the game owns, inside the
  // scene pass, after the terrain and before the transparent things.
  render(cam, world, far, extra) {
    const gl = this.gl, P = this.P, S = this.scene;
    cam.aspect = this.w / this.h;
    cam.far = this.farDist + 80;
    cam.update();

    gl.bindFramebuffer(gl.FRAMEBUFFER, S.fb);
    gl.viewport(0, 0, S.w, S.h);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // sky
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.CULL_FACE);
    let p = this.prog.sky;
    gl.useProgram(p.id);
    gl.uniformMatrix4fv(p.u('uInvVP'), false, cam.inv);
    this.common(p, cam);
    this.fullscreen();

    // terrain
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
    p = this.prog.terrain;
    gl.useProgram(p.id);
    gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
    this.common(p, cam); this.fogUniforms(p);
    gl.uniform3f(p.u('uSkyTint'), P.skyTint[0], P.skyTint[1], P.skyTint[2]);
    gl.uniform1f(p.u('uSkyI'), P.skyI);
    gl.uniform1f(p.u('uBlockI'), P.blockI);
    gl.uniform1f(p.u('uFlash'), P.flash);
    gl.uniform1f(p.u('uBevel'), P.bevel);
    gl.uniform1f(p.u('uWet'), P.wet);
    // the far city first, minus the part the detailed chunks cover
    if (far) {
      gl.uniform1f(p.u('uCut'), this.nearDist - 12);
      far.draw(p, cam.planes, cam.x, cam.z, 'o', this.farDist);
    }
    gl.uniform1f(p.u('uCut'), 0);
    world.draw(p, cam.planes, cam.x, cam.z, 'o', this.nearDist);

    if (extra) extra(this, cam);

    // lamp and neon glow
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false); gl.disable(gl.CULL_FACE);
    let n = world.collectGlow(cam.x, cam.y, cam.z, 150, this.glowData);
    if (this.extraGlow) n = this.extraGlow(this.glowData, n);
    if (n > 0) {
      p = this.prog.glow;
      gl.useProgram(p.id);
      gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
      gl.uniform3f(p.u('uRight'), cam.rx, cam.ry, cam.rz);
      gl.uniform3f(p.u('uUp'), cam.ux, cam.uy, cam.uz);
      this.common(p, cam);
      gl.bindVertexArray(this.glowVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.glowVbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.glowData, 0, n * 8);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
    }

    // water: translucent, so after everything opaque
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    p = this.prog.water;
    gl.useProgram(p.id);
    gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
    this.common(p, cam); this.fogUniforms(p);
    if (far) {
      gl.uniform1f(p.u('uCut'), this.nearDist - 12);
      far.draw(p, cam.planes, cam.x, cam.z, 'w', this.farDist);
    }
    gl.uniform1f(p.u('uCut'), 0);
    world.draw(p, cam.planes, cam.x, cam.z, 'w', this.nearDist);

    // light beams: the bat-signal and the columns over lit beacons
    const beams = this.beams || (this.beam.on ? [{ p0: this.beam.p0, p1: this.beam.p1, tint: [1, 0.93, 0.62], w: 1.4, w1: 16 }] : []);
    if (beams.length) {
      gl.blendFunc(gl.ONE, gl.ONE);
      p = this.prog.beam;
      gl.useProgram(p.id);
      gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
      gl.uniform3f(p.u('uCam'), cam.x, cam.y, cam.z);
      gl.uniform1f(p.u('uTime'), this.time);
      gl.uniform1f(p.u('uPulse'), 0.85 + 0.15 * Math.sin(this.time * 1.7));
      gl.bindVertexArray(this.stripVao);
      for (const bm of beams) {
        gl.uniform3f(p.u('uP0'), bm.p0[0], bm.p0[1], bm.p0[2]);
        gl.uniform3f(p.u('uP1'), bm.p1[0], bm.p1[1], bm.p1[2]);
        gl.uniform2f(p.u('uWidth'), bm.w, bm.w1);
        gl.uniform3f(p.u('uTint'), bm.tint[0], bm.tint[1], bm.tint[2]);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    }

    // the emblem on the clouds, when the signal is up
    if (this.emblem) {
      const e = this.emblem;
      gl.blendFunc(gl.ONE, gl.ONE);
      p = this.prog.emblem;
      gl.useProgram(p.id);
      gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
      gl.uniform3f(p.u('uCenter'), e.x, e.y, e.z);
      gl.uniform1f(p.u('uHalf'), e.half);
      gl.uniform1f(p.u('uPulse'), 0.85 + 0.15 * Math.sin(this.time * 1.7));
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.batTex); gl.uniform1i(p.u('uBat'), 0);
      gl.bindVertexArray(this.stripVao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    // rain
    if (this.rain && P.rainAlpha > 0) {
      gl.blendFunc(gl.ONE, gl.ONE);
      p = this.prog.rain;
      gl.useProgram(p.id);
      gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
      gl.uniform3f(p.u('uCam'), cam.x, cam.y, cam.z);
      gl.uniform1f(p.u('uTime'), this.time);
      gl.uniform1f(p.u('uCount'), P.rainCount);
      gl.uniform1f(p.u('uWind'), P.wind);
      // no rain above the cloud deck: it has nowhere to fall from
      gl.uniform1f(p.u('uAlpha'), P.rainAlpha * Math.max(0, Math.min(1, (P.cloudH + 4 - cam.y) / 45)));
      gl.bindVertexArray(this.stripVao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, P.rainCount | 0);
    }
    gl.disable(gl.BLEND); gl.depthMask(true); gl.bindVertexArray(null);

    this.post();
  }

  post() {
    const gl = this.gl, P = this.P, S = this.scene, B = this.bloom;
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
    const bindTex = (t, unit) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); };

    // bright pass into the first (half-resolution) bloom level
    let p = this.prog.bright;
    gl.useProgram(p.id);
    gl.bindFramebuffer(gl.FRAMEBUFFER, B[0].fb); gl.viewport(0, 0, B[0].w, B[0].h);
    bindTex(S.tex, 0); gl.uniform1i(p.u('uTex'), 0);
    gl.uniform1f(p.u('uThr'), P.bloomThr); gl.uniform1f(p.u('uKnee'), P.bloomKnee);
    this.fullscreen();

    // down the chain
    p = this.prog.down;
    gl.useProgram(p.id);
    for (let i = 1; i < B.length; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i].fb); gl.viewport(0, 0, B[i].w, B[i].h);
      bindTex(B[i - 1].tex, 0); gl.uniform1i(p.u('uTex'), 0);
      gl.uniform2f(p.u('uTexel'), 1 / B[i - 1].w, 1 / B[i - 1].h);
      this.fullscreen();
    }
    // back up, adding each level onto the one above it
    p = this.prog.up;
    gl.useProgram(p.id);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = B.length - 1; i >= 1; i--) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i - 1].fb); gl.viewport(0, 0, B[i - 1].w, B[i - 1].h);
      bindTex(B[i].tex, 0); gl.uniform1i(p.u('uTex'), 0);
      gl.uniform2f(p.u('uTexel'), 1 / B[i].w, 1 / B[i].h);
      gl.uniform1f(p.u('uMix'), 1.0);
      this.fullscreen();
    }
    gl.disable(gl.BLEND);

    // composite into an 8-bit target at canvas resolution
    p = this.prog.comp;
    gl.useProgram(p.id);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.ldr.fb); gl.viewport(0, 0, this.w, this.h);
    bindTex(S.tex, 0); gl.uniform1i(p.u('uScene'), 0);
    bindTex(B[0].tex, 1); gl.uniform1i(p.u('uBloom'), 1);
    gl.uniform1f(p.u('uExposure'), P.exposure); gl.uniform1f(p.u('uBloomAmt'), P.bloom);
    gl.uniform1f(p.u('uVig'), P.vig); gl.uniform1f(p.u('uSat'), P.sat); gl.uniform1f(p.u('uContrast'), P.contrast);
    gl.uniform3f(p.u('uLift'), P.lift[0], P.lift[1], P.lift[2]);
    gl.uniform3f(p.u('uGain'), P.gain[0], P.gain[1], P.gain[2]);
    gl.uniform1f(p.u('uFade'), P.fade);
    gl.uniform4f(p.u('uHurt'), P.hurt[0], P.hurt[1], P.hurt[2], P.hurt[3]);
    this.fullscreen();

    // FXAA + grain onto the screen
    p = this.prog.fxaa;
    gl.useProgram(p.id);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.w, this.h);
    bindTex(this.ldr.tex, 0); gl.uniform1i(p.u('uTex'), 0);
    gl.uniform2f(p.u('uTexel'), 1 / this.w, 1 / this.h);
    gl.uniform1f(p.u('uGrain'), P.grain);
    gl.uniform1f(p.u('uTime'), this.time);
    this.fullscreen();
    gl.bindVertexArray(null);
  }
}


// ═══ PHYS ═══
// ═══════════════════════════════════════════════════════════════════════
//  PHYS — a body is an axis-aligned box standing on its feet.
//
//  Movement is resolved one axis at a time, in steps shorter than a block, so a
//  fast body can never tunnel through a wall. A body that walks into a ledge no
//  taller than a block steps up onto it (the kerb, the sidewalk, a stair). The
//  world answers `isSolid(x, y, z)` and treats unloaded chunks as solid, so a body
//  that outruns the loader stops at the edge of the known world.
//
//  Nothing here touches the GPU: the same code runs under Node for the bot tests.
// ═══════════════════════════════════════════════════════════════════════

var PH_GRAV = 29;          // blocks / s^2
var PH_STEP = 1.06;        // tallest ledge a walking body climbs without jumping
var PH_E = 1e-3;

function PH_body(x, y, z, hw, h) {
  return { x: x, y: y, z: z, vx: 0, vy: 0, vz: 0, hw: hw, h: h, onGround: false, inWater: false, headWater: false, hitX: false, hitZ: false, hitUp: false, groundBlock: 0 };
}

// Does the box [x0,x1) x [y0,y1) x [z0,z1) overlap any solid voxel?
function PH_overlaps(world, x0, y0, z0, x1, y1, z1) {
  const ax = Math.floor(x0), bx = Math.floor(x1 - 1e-6);
  const ay = Math.floor(y0), by = Math.floor(y1 - 1e-6);
  const az = Math.floor(z0), bz = Math.floor(z1 - 1e-6);
  for (let x = ax; x <= bx; x++) for (let z = az; z <= bz; z++) for (let y = ay; y <= by; y++) {
    if (world.isSolid(x, y, z)) return true;
  }
  return false;
}
function PH_free(world, b, x, y, z) { return !PH_overlaps(world, x - b.hw, y, z - b.hw, x + b.hw, y + b.h, z + b.hw); }

// Move along one axis; snap flush against whatever blocks it. Returns true if blocked.
function PH_axis(world, b, axis, d) {
  if (d === 0) return false;
  const hw = b.hw, h = b.h;
  let nx = b.x, ny = b.y, nz = b.z;
  if (axis === 0) nx += d; else if (axis === 1) ny += d; else nz += d;
  if (!PH_overlaps(world, nx - hw, ny, nz - hw, nx + hw, ny + h, nz + hw)) { b.x = nx; b.y = ny; b.z = nz; return false; }
  if (axis === 0) b.x = d > 0 ? Math.floor(nx + hw) - hw - PH_E : Math.floor(nx - hw) + 1 + hw + PH_E;
  else if (axis === 1) b.y = d > 0 ? Math.floor(ny + h) - h - PH_E : Math.floor(ny) + 1 + PH_E;
  else b.z = d > 0 ? Math.floor(nz + hw) - hw - PH_E : Math.floor(nz - hw) + 1 + hw + PH_E;
  return true;
}

// One horizontal sub-step with step-up. `canStep` is false in the air.
function PH_horiz(world, b, dx, dz, canStep) {
  const x0 = b.x, z0 = b.z;
  let hitX = false, hitZ = false;
  if (dx !== 0 && PH_axis(world, b, 0, dx)) hitX = true;
  if (dz !== 0 && PH_axis(world, b, 2, dz)) hitZ = true;
  if ((hitX || hitZ) && canStep) {
    // try to climb: find the smallest lift that frees the intended move
    const wantX = x0 + dx, wantZ = z0 + dz;
    for (let lift = 0.25; lift <= PH_STEP + 1e-6; lift += 0.2) {
      const ty = b.y + lift;
      // room above the body for the lift itself
      if (!PH_free(world, b, b.x, ty, b.z)) break;
      // the move, taken on whichever axes were blocked, must now be clear
      const nx = hitX ? wantX : b.x, nz = hitZ ? wantZ : b.z;
      if (PH_free(world, b, nx, ty, nz)) {
        b.x = nx; b.z = nz; b.y = ty;
        // settle back down onto the ledge so the climb is not a hop
        PH_axis(world, b, 1, -lift);
        hitX = hitZ = false;
        break;
      }
    }
  }
  if (hitX) b.hitX = true;
  if (hitZ) b.hitZ = true;
}

// Advance a body by dt using its own velocity. Gravity is NOT applied here: the
// controller decides that (a glide, a grapple and a swim all differ).
function PH_move(world, b, dt) {
  b.hitX = b.hitZ = b.hitUp = false;
  const was = b.onGround;
  const dist = Math.max(Math.abs(b.vx), Math.abs(b.vy), Math.abs(b.vz)) * dt;
  const n = Math.max(1, Math.ceil(dist / 0.4));
  const sx = b.vx * dt / n, sz = b.vz * dt / n;
  let sy = b.vy * dt / n, landed = false;
  for (let i = 0; i < n; i++) {
    if (sy !== 0) {
      if (PH_axis(world, b, 1, sy)) {
        // a floor ends the fall, a ceiling ends the rise; either way the sideways
        // part of the move carries on for the rest of the frame
        if (sy < 0) landed = true; else b.hitUp = true;
        b.vy = 0; sy = 0;
      }
    }
    PH_horiz(world, b, sx, sz, was || landed);
  }
  // ground test: is there a solid voxel just under the feet?
  b.onGround = false; b.groundBlock = 0;
  if (b.vy <= 0.01) {
    const gy = b.y - 0.04;
    const ax = Math.floor(b.x - b.hw + 1e-3), bx = Math.floor(b.x + b.hw - 1e-3);
    const az = Math.floor(b.z - b.hw + 1e-3), bz = Math.floor(b.z + b.hw - 1e-3);
    const cy = Math.floor(gy);
    for (let x = ax; x <= bx && !b.onGround; x++) for (let z = az; z <= bz; z++) {
      if (world.isSolid(x, cy, z)) { b.onGround = true; b.groundBlock = world.getBlock(x, cy, z); break; }
    }
  }
  // water: a block of it at the waist, and another at the eyes
  b.inWater = world.getBlock(Math.floor(b.x), Math.floor(b.y + b.h * 0.45), Math.floor(b.z)) === BK.WATER;
  b.headWater = world.getBlock(Math.floor(b.x), Math.floor(b.y + b.h * 0.92), Math.floor(b.z)) === BK.WATER;
  return landed;
}

// Walking off a kerb should be a step down, not a fall: when the floor is within
// `maxDrop` below a grounded body, glue it to that floor. Returns true if it moved.
function PH_stick(world, b, maxDrop) {
  if (PH_free(world, b, b.x, b.y - maxDrop, b.z)) return false;     // nothing to land on that close
  const y0 = b.y;
  PH_axis(world, b, 1, -maxDrop);
  b.vy = 0; b.onGround = true;
  return b.y < y0 - 1e-4;
}

// The box of a body, as [x0,y0,z0,x1,y1,z1] for hit tests.
function PH_aabbHit(a, b) {
  return Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.z - b.z) < a.hw + b.hw && a.y < b.y + b.h && b.y < a.y + a.h;
}

// Segment-vs-sphere: where along the segment p -> p + d (length 1 in t) does it
// first come within r of c? Returns t in [0,1] or -1.
function PH_segSphere(px, py, pz, dx, dy, dz, cx, cy, cz, r) {
  const mx = px - cx, my = py - cy, mz = pz - cz;
  const a = dx * dx + dy * dy + dz * dz;
  if (a < 1e-12) return (mx * mx + my * my + mz * mz) <= r * r ? 0 : -1;
  const b = mx * dx + my * dy + mz * dz;
  const c = mx * mx + my * my + mz * mz - r * r;
  if (c <= 0) return 0;
  const disc = b * b - a * c;
  if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / a;
  return (t >= 0 && t <= 1) ? t : -1;
}


// ═══ MODELS ═══
// ═══════════════════════════════════════════════════════════════════════
//  MODELS — characters and props built out of small voxels.
//
//  A model is a tree of PARTS. Each part is a little voxel grid that hangs from a
//  joint; a pose is, per part, three rotations and an offset about that joint. The
//  walk cycle, the punch and the swing of the cape are all just numbers fed to
//  `pose`. Meshing hides every face between two voxels of the same part and bakes
//  a corner ambient-occlusion value into the rest, so a model reads as solid
//  carved blocks without a texture.
//
//  Units: a model is authored in voxels; `vs` is the size of one voxel in world
//  blocks. +y is up and +z is the front of the character.
// ═══════════════════════════════════════════════════════════════════════

var MD_hexCache = {};
function MD_hex(s) {
  let c = MD_hexCache[s];
  if (!c) {
    const n = parseInt(s.slice(1), 16);
    c = MD_hexCache[s] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  return c;
}

// The six faces: normal, the two in-plane axes (u x v = normal, so the quad is
// counter-clockwise seen from outside) and the corner it starts from.
var MD_FACES = [
  { n: [1, 0, 0], u: [0, 1, 0], v: [0, 0, 1], b: [1, 0, 0] },
  { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0], b: [0, 0, 0] },
  { n: [0, 1, 0], u: [0, 0, 1], v: [1, 0, 0], b: [0, 1, 0] },
  { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1], b: [0, 0, 0] },
  { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0], b: [0, 0, 1] },
  { n: [0, 0, -1], u: [0, 1, 0], v: [1, 0, 0], b: [0, 0, 0] },
];

// Sparse voxel grid for one part.
class VxPartData {
  constructor(name) {
    this.name = name; this.v = new Map();
    this.parent = -1; this.jx = 0; this.jy = 0; this.jz = 0;
    this.seed = 1;
    this.oy = 0;             // a head is authored relative to the neck: added to every y given to at/box/erase
  }
  key(x, y, z) { return (x + 128) + (y + 128) * 256 + (z + 128) * 65536; }
  at(x, y, z, hex, emit) {
    const c = MD_hex(hex);
    y += this.oy;
    this.v.set(this.key(x, y, z), { r: c[0], g: c[1], b: c[2], e: emit || 0, x: x, y: y, z: z });

  LL.box(1, 0, -4, 6, 6, 4, ORG); LL.box(1, 0, 4, 6, 2, 8, ORG);
  LR.box(-6, 0, -4, -1, 6, 4, ORG); LR.box(-6, 0, 4, -1, 2, 8, ORG);
  // the umbrella, shut: a cane in the right flipper
  const U = M.part('cane', 'flipR', -8, 12, 3);
  U.box(-9, 2, 2, -8, 26, 3, '#2a2a30');
  U.box(-10, 26, 1, -7, 30, 4, '#c8322c');

  // the umbrella, open: held up over the hat while he flies
  const C = M.part('brolly', 'body', 0, 34, 0);
  C.box(0, 34, 0, 1, 44, 1, '#2a2a30');
  const R = 10;
  for (let x = -R; x <= R; x++) for (let z = -R; z <= R; z++) {
    const d = Math.hypot(x, z);
    if (d > R) continue;
    const h = Math.round((1 - (d / R) * (d / R)) * 4);
    const col = (Math.floor((Math.atan2(z, x) + Math.PI) / (Math.PI / 4)) & 1) ? '#c8322c' : '#17181e';
    C.at(x, 42 + h, z, col);

  }
  C.at(0, 47, 0, '#d9a233');
  M.radius = 5;
  return M;
}

// ── Joker (boss): tall, purple, a grin you can see from across the street ──
function MD_joker() {

  H.box(-3, 5, -3, 3, 8, 3, GRN); H.box(-3, 3, -3, 3, 5, -2, GRN); H.box(-4, 4, -2, -3, 8, 2, GRN); H.box(3, 4, -2, 4, 8, 2, GRN);

// ═══════════════════════════════════════════════════════════════════════
//  Small things: projectiles and pickups. One part each.
// ═══════════════════════════════════════════════════════════════════════
function MD_single(name, vs, fn) {
  const M = new VxModel(name, vs);
  const P = M.part('main', null, 0, 0, 0);
  fn(P);
  let r = 0;
  for (const c of P.v.values()) r = Math.max(r, Math.hypot(c.x, c.y, c.z));
  M.radius = r * vs + 0.5;
  return M;
}

    P.box(-3, 0, 1, -1, 1, 2, K); P.box(2, 0, 1, 4, 1, 2, K);
