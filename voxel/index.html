    const dx = pl.b.x - b.x, dz = pl.b.z - b.z, dist = Math.hypot(dx, dz);
    const pf = this.phase;
    const face = (r) => { this.a += PL_angDiff(this.a, Math.atan2(dx, dz)) * (1 - Math.exp(-(r || 10) * dt)); };
    switch (this.state) {
      case 'intro': {
        face(5);
        if (this.stT > 1.8) { this.set('hunt'); this.cool = 0.8; }
        break;
      }
      case 'gone': {
        // invisible: reappear somewhere else, ready to attack
        this.hidden -= dt;
        if (this.hidden <= 0) {
          const s = this.pickSpot();
          b.x = s[0]; b.z = s[1]; b.y = BS_FLOOR + 0.01; b.vx = b.vz = 0;
          this.vanish(); this.hidden = 0;
          this.cool = 0.35;
          const q = this.attackQ; this.attackQ = 0;
          this.set(q === 'summon' ? 'summon' : (q === 'gas' ? 'gas' : 'hunt'));
        }
        break;
      }
      case 'hunt': {
        face(9);
        // keep a lecturing distance, circling
        let want = 0;
        if (dist < 7) want = -1; else if (dist > 12) want = 1;
        const a = Math.atan2(dx, dz), sp = 4.6 + pf * 0.7;
        let tvx = Math.sin(a) * want * sp + Math.cos(a) * this.strafe * sp * 0.55, tvz = Math.cos(a) * want * sp - Math.sin(a) * this.strafe * sp * 0.55;
        const k = Math.min(1, 10 * dt);
        b.vx += (tvx - b.vx) * k; b.vz += (tvz - b.vz) * k;
        if (Math.random() < dt * 0.3) this.strafe = -this.strafe;
        if (dist < 2.8 && this.cool <= 0) { this.set('melee'); GS.events.push({ t: 'tell', x: b.x, z: b.z }); break; }
        if (this.cool <= 0) {
          // choose: cards most of the time, the clever tricks from phase 2
          const r = Math.random();
          if (pf >= 2 && this.minions() < 1 && r < 0.3) this.set('summon');
          else if (pf >= 2 && r < 0.55) this.set('gas');
          else if (r < 0.80 || pf === 1) this.set('cards');
          else { this.set('gone'); this.vanish(); }
          if (this.state === 'cards') GS.events.push({ t: 'tell', x: b.x, z: b.z });
        }
        break;
      }
      case 'cards': {
        b.vx *= 0.7; b.vz *= 0.7; face(16);
        this.st.aim = Math.min(1, this.st.aim + dt * 8); this.st.aimPitch = 0;
        const T0 = 0.65 - pf * 0.06;
        if (this.stT > T0 && !this.hit) {
          this.hit = true;
          const m = [b.x + Math.sin(this.a) * 0.9, b.y + 1.5, b.z + Math.cos(this.a) * 0.9];
          const n = pf === 1 ? 3 : (pf === 2 ? 5 : 7), spread = 0.20 + pf * 0.03;
          const base = Math.atan2(dx, dz);
          const dyv = (pl.b.y + 1.1 - m[1]) / (Math.max(3, dist));
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * spread;
            PJ_spawn({ kind: 'card', x: m[0], y: m[1], z: m[2], vx: Math.sin(a) * 17, vy: dyv * 17, vz: Math.cos(a) * 17, dmg: 1, life: 2.4, own: 'enemy' });
          }
          GS.events.push({ t: 'gun', x: m[0], z: m[2] });
        }
        if (this.stT > T0 + 0.45) { this.st.aim = 0; this.cool = 1.1 - pf * 0.1; this.set('hunt'); }
        break;
      }
      case 'gas': {
        b.vx *= 0.7; b.vz *= 0.7; face(12);
        if (this.stT > 0.55 && !this.hit) {
          this.hit = true;
          const n = pf === 3 ? 3 : 2;
          for (let i = 0; i < n; i++) {
            const ang = Math.atan2(dx, dz) + (i - (n - 1) / 2) * 0.5;
            const tx = pl.b.x + Math.sin(ang - Math.atan2(dx, dz)) * 4 + (Math.random() - 0.5) * 3, tz = pl.b.z + (Math.random() - 0.5) * 4;
            const T = 0.9 + i * 0.12, v = BS_arc(b.x, b.y + 1.6, b.z, tx, BS_FLOOR + 0.3, tz, T, 22);
            const p = PJ_spawn({ kind: 'bomb', x: b.x, y: b.y + 1.6, z: b.z, vx: v[0], vy: v[1], vz: v[2], dmg: 0, life: T + 0.1, own: 'enemy', grav: 22 });
            p.gas = true;
          }
          GS.events.push({ t: 'throw' });
        }
        if (this.stT > 1.3) { this.cool = 1.0; this.set('hunt'); }
        break;
      }
      case 'summon': {
        b.vx *= 0.6; b.vz *= 0.6; this.st.t += 0; face(6);
        if (this.stT > 0.5 && !this.hit) {
          this.hit = true;
          const n = pf === 3 ? 4 : 3;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + 0.6, x = A.cx + Math.cos(a) * 13, z = A.cz + Math.sin(a) * 13;
            const e = new Enemy(i === 0 && pf === 3 ? 'heavy' : (i === n - 1 && pf >= 2 ? 'goon' : 'clown'), x, BS_FLOOR + 0.01, z, null);
            e.alert = true; e.state = 'chase'; e.bossMinion = true; e.home = { x: x, z: z };
            GS.enemies.push(e);
            GS.fx.puff(x, BS_FLOOR + 1, z, 10, 0.6, 0.4); GS.fx.burst(x, BS_FLOOR + 1, z, 12, [0.6, 0.3, 0.9], 1, 1);
          }
          GS.events.push({ t: 'poof' });
          GS.fx.text(b.x, b.y + 3.2, b.z, '¡LLEGÓ LA FIESTA!', '#c58bff', 1.2);
        }
        if (this.stT > 2.1) { this.cool = 1.0; this.set('hunt'); }
        break;
      }
      case 'melee': {
        b.vx *= 0.6; b.vz *= 0.6; face(14);
        this.st.atk = 1; this.st.atkP = Math.min(0.26, this.stT / 0.55 * 0.26);
        if (this.stT > 0.55 && !this.hit) {
          this.hit = true;
          const d = Math.hypot(dx, dz), ang = Math.abs(PL_angDiff(this.a, Math.atan2(dx, dz)));
          if (d < 3.6 && ang < 1.1 && Math.abs(pl.b.y - b.y) < 2.4) pl.hurt(1, dx, dz, false);
          b.vx += Math.sin(this.a) * 5; b.vz += Math.cos(this.a) * 5;
          GS.events.push({ t: 'enemySwing', x: b.x, z: b.z });
        }
        if (this.hit) this.st.atkP = Math.min(1, 0.26 + (this.stT - 0.55) / 0.3 * 0.74);
        if (this.stT > 0.95) { this.st.atk = 0; this.cool = 0.9; this.set('hunt'); if (Math.random() < 0.5) { this.set('gone'); this.vanish(); } }
        break;
      }
      case 'stunned': break;
    }
    if (this.state !== 'stunned') {
      if (this.minions() > 0) this.minionsAlive = 1;
    }
    // gravity and movement
    if (this.state !== 'gone') {
      b.vy = b.onGround ? 0 : Math.max(b.vy - PH_GRAV * dt, -50);
      PH_move(w, b, dt);
    }
    this.keepIn(16.5);
    // walking animation
    const hs = Math.hypot(b.vx, b.vz), st = this.st;
    const ease = (v, to, rr) => v + (to - v) * (1 - Math.exp(-rr * dt));
    st.walk = ease(st.walk, b.onGround ? AN_clamp(hs / 5, 0, 1) : 0, 12); st.sprint = 0;
    st.phase += dt * (3 + hs * 1.0);
    if (this.state !== 'cards') st.aim = Math.max(0, st.aim - dt * 5);
    // a stunned Joker: when his summoned crowd is gone he staggers
    if (this.state === 'hunt' && this.minionsAlive && this.minions() === 0) { this.minionsAlive = 0; this.set('stunned'); GS.fx.text(b.x, b.y + 3, b.z, '¡MIS CHICOS!', '#c58bff', 1.2); }
    if (this.state === 'stunned') { this.st.stun = 1; b.vx *= 0.8; b.vz *= 0.8; if (this.stT > 3.0) { this.st.stun = 0; this.cool = 0.5; this.set('hunt'); } }
    else this.st.stun = Math.max(0, this.st.stun - dt * 4);
  }

  draw(r) {
    if (this.state === 'gone' && this.hidden > 0) return;
    const b = this.b, M = this.model, st = this.st;
    EN_lightStep(this.light, 1 / 60);
    AN_humanoid(M, this.pose, st);
    M4_model(PK_m, b.x, b.y, b.z, this.a, 0, 0, this.scale);
    let flash = null;
    if (this.flash > 0) flash = [1, 0.95, 0.85, this.flash * 0.7];
    else if (this.state === 'melee' || this.state === 'cards') { const k = 0.5 + 0.5 * Math.sin(this.stT * 30); flash = [0.7, 0.3, 1, 0.15 + 0.2 * k]; }
    MD_drawModel(r, M, PK_m, this.pose, { sky: this.light.sky, moon: this.light.moon, bl: this.light.bl, flash: flash, rim: [0.42, 0.22, 0.58] });
  }
}


// ═══ PROPS ═══
// ═══════════════════════════════════════════════════════════════════════
//  PROPS — the game's relationship with the places the generator made: beacons
//  that save your progress and let you travel, trophies on the rooftops, the
//  Bat-Signal, the objectives, and the triggers that start the boss fights.
// ═══════════════════════════════════════════════════════════════════════

var WD = { lamp: null, signalOn: true, trophyPool: new Map(), nearBeacon: -1, bossCool: 0, arenaIn: null, travelTo: -1, travelT: 0, objs: [] };

// A round bat-signal on a stick: a yellow disc with the bat cut out of it, two-sided.
function MD_lamp() {
  const M = new VxModel('lamp', 1 / 4);
  const P = M.part('main', null, 0, 0, 0);
  const bat = ['..X.....X..', '.XXX...XXX.', 'XXXXXXXXXXX', 'XX.XXXXX.XX', '...XXXXX...', '....X.X....'];
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) {
    if (Math.hypot(x, y) > 5.6) continue;
    for (const z of [-1, 0]) {
      let c = '#ffe9a0', e = 1.5;
      const bx = x + 5, by = 4 - y;
      if (by >= 0 && by < bat.length && bx >= 0 && bx < 11 && bat[by][bx] === 'X') { c = '#14151c'; e = 0; }
      P.at(x, y + 6, z, c, e);
    }
  }
  M.radius = 2;
  return M;
}

function WD_init() {
  LM_init();
  GS.models.lamp = MD_lamp(); GS.models.lamp.upload(GS.rend.gl);
  GS.beacons = LM.beacons.map(function (b, i) { return { name: b.name, x: b.x, y: b.y, z: b.z, active: i === 0, i: i, spin: Math.random() * 6 }; });
  GS.lastBeacon = 0;
  // trophies: one on the flat roof of roughly every sixth block's tallest building
  LM.trophies = [];
  for (let bx = -18; bx <= 17; bx++) for (let bz = -17; bz <= 16; bz++) {
    const info = WG_blockInfo(bx, bz);
    if (!info.full || info.kind !== 'bld' || info.special || !info.bld.length) continue;
    if (NZ_hash(bx, bz, 5150) % 6 !== 0) continue;
    let best = null, bt = 0;
    for (const b of info.bld) {
      if (b.roof !== 0) continue;
      const t = WG_bTop(b, Math.floor((b.x0 + b.x1) / 2), Math.floor((b.z0 + b.z1) / 2));
      if (t > bt) { bt = t; best = b; }
    }
    if (!best || bt < WG_BASE + 22 || bt > WG_H - 14) continue;
    const x = Math.floor((best.x0 + best.x1) / 2) + 0.5 + 3, z = Math.floor((best.z0 + best.z1) / 2) + 0.5 - 3;
    const top = WG_bTop(best, Math.floor(x), Math.floor(z));
    LM.trophies.push({ id: bx + ',' + bz, x: x, y: top + 1.1, z: z });
  }
  // and a few that only a real climb reaches: the bridge towers, the Ferris wheel, a chimney, the crane
  const B = LM.bridge;
  LM.trophies.push({ id: 'tw0', x: 1.0, y: B.ty + 3.2, z: B.cz - B.tz }, { id: 'tw1', x: 9.0, y: B.ty + 3.2, z: B.cz + B.tz });
  for (const sp of LM.special.values()) {
    const cx = sp.bx * WG_PITCH + WG_ST + 19, cz = sp.bz * WG_PITCH + WG_ST + 19;
    if (sp.type === 'ferris') LM.trophies.push({ id: 'fe', x: cx - 2 + 0.5, y: WG_GY + 2 + 22 + 17 + 3.2, z: cz + 0.5 });
    if (sp.type === 'foundry') LM.trophies.push({ id: 'fo' + sp.bx, x: cx - 12 + 0.5, y: WG_GY + 2 + 46 + 2.4, z: cz - 12 + 0.5 });
    if (sp.type === 'crane') LM.trophies.push({ id: 'cr' + sp.bx, x: cx - 13 + 0.5, y: WG_GY + 2 + 31 + 2.2, z: cz - 13 + 0.5 });
  }
  GS.trophyTotal = LM.trophies.length;
  GS.bossInfo = [
    { id: 'penguin', name: 'EL PINGÜINO', arena: LM.arenas.find(a => a.style === 'penguin'), label: 'PINGÜINO' },
    { id: 'joker', name: 'EL JOKER', arena: LM.arenas.find(a => a.style === 'joker'), label: 'JOKER' },
  ];
  // the signal beam: from the lens straight up into the cloud deck
  const g = LM.gcpd;
  GS.beams = [{ p0: [g.cx + 0.5, g.y + 5.2, g.cz + 0.5], p1: [g.cx + 0.5 + 38, 178, g.cz + 0.5 - 70], tint: [1, 0.93, 0.62], w: 1.5, w1: 11, big: true }];
  GS.emblem = { x: g.cx + 0.5 + 38, y: 176, z: g.cz + 0.5 - 70, half: 46 };
  for (let i = 1; i < GS.beacons.length; i++) GS.beacons[i].beamIdx = -1;
}

// What the compass, minimap and map should point at.
function WD_objectives() {
  const out = WD.objs; out.length = 0;
  for (const bi of GS.bossInfo) {
    if (GS.bossDone[bi.id] || !bi.arena) continue;
    out.push({ x: bi.arena.cx, z: bi.arena.cz, icon: '☠', color: '#ff6a5a', label: bi.label, kind: 'boss' });
  }
  const pl = GS.player;
  let best = null, bd = 1e9;
  for (const b of GS.beacons) {
    if (b.active) { out.push({ x: b.x, z: b.z, icon: '', color: '#e8c34a', label: '', kind: 'beaconOn', quiet: true }); continue; }
    const d = Math.hypot(b.x - pl.b.x, b.z - pl.b.z);
    if (d < bd) { bd = d; best = b; }
    out.push({ x: b.x, z: b.z, icon: '', color: '#6c7a92', label: '', kind: 'beaconOff', quiet: true });
  }
  if (best && bd < 700) out.push({ x: best.x, z: best.z, icon: '▲', color: '#e8c34a', label: 'BALIZA', kind: 'beacon' });
  // compass markers skip the quiet ones
  return out.filter(o => !o.quiet || UI.state === 'map' || true);
}

function WD_travel(i) {
  const pl = GS.player;
  for (const e of GS.enemies) {
    if (!e.dead && e.alert && Math.hypot(e.b.x - pl.b.x, e.b.z - pl.b.z) < 40) { UI.mapMsg = 'HAY ENEMIGOS CERCA, NO PUEDES VIAJAR AHORA'; UI.mapMsgT = 2.2; return; }
  }
  if (GS.boss) { UI.mapMsg = 'NO PUEDES HUIR DE UN JEFE'; UI.mapMsgT = 2.2; return; }
  WD.travelTo = i; WD.travelT = 0;
  VX_setState('play');
  VX.fadeTo = 1; VX.fadeSpeed = 1.6;
}

// Contextual advice, each shown once, when the situation first calls for it.
function WD_tips(dt) {
  const pl = GS.player;
  WD.play = (WD.play || 0) + dt;
  if (pl.mode === 'swim') UI_tip('water', 'Apunta a la orilla y pulsa E: el garfio te saca del agua', 7);
  if (pl.hp <= 2 && !pl.dead) UI_tip('hurt', 'Poca vida: recoge corazones o pisa una baliza para curarte', 7);
  if (WD.play > 14 && !GS.glided && !pl.dead) UI_tip('glide', 'Salta desde un borde y pulsa ESPACIO otra vez: Batman planea', 7);
  if (WD.play > 45) UI_tip('goal', 'Activa balizas, busca trofeos y derrota al Pingüino y al Joker', 8);
  if (WD.play > 80) UI_tip('map', 'Pulsa M para ver el mapa y viajar entre balizas', 6);
  if (pl.mode === 'glide') GS.glided = true;
}

function WD_update(dt) {
  const pl = GS.player, w = GS.world;
  WD_tips(dt);
  // fast travel: fade out, move, fade in
  if (WD.travelTo >= 0) {
    WD.travelT += dt;
    if (WD.travelT > 0.5) {
      const b = GS.beacons[WD.travelTo];
      pl.respawn(b.x + (WD.travelTo === 0 ? 0 : 3.5), b.y + 0.2, b.z); pl.inv = 1;
      GS.tcam.snap(pl); GS.projs.length = 0;
      for (const e of GS.enemies) e.gone = true;
      GS.camps.clear();
      w.dirty = true;
      VX.fadeTo = 0; VX.fadeSpeed = 1.4;
      UI_banner(b.name, 'Viaje rápido');
      WD.travelTo = -1;
    }
    return;
  }
  // beacons
  for (const b of GS.beacons) {
    b.spin += dt * 1.4;
    if (b.i === 0) continue;
    const dx = pl.b.x - b.x, dz = pl.b.z - b.z;
    if (!b.active && Math.abs(dx) < 4.8 && Math.abs(dz) < 4.8 && Math.abs(pl.b.y - b.y) < 5) {
      b.active = true; GS.lastBeacon = b.i;
      pl.hp = pl.maxHp; pl.bats = Math.max(pl.bats, 10);
      GS.score += 500;
      GS.fx.burst(b.x, b.y + 12, b.z, 40, [1, 0.85, 0.4], 1.6, 1.4);
      GS.fx.glow(b.x, b.y + 11, b.z, 14, 1, 0.85, 0.45, 5, 1.2);
      UI_banner('BALIZA ACTIVADA', b.name);
      GS.events.push({ t: 'beacon' });
    } else if (b.active && Math.abs(dx) < 5 && Math.abs(dz) < 5 && Math.abs(pl.b.y - b.y) < 5 && GS.lastBeacon !== b.i) {
      GS.lastBeacon = b.i; UI_hint('Punto de reaparición actualizado', 3);
    }
    // standing on an active beacon slowly restores health
    if (b.active && Math.abs(dx) < 4.5 && Math.abs(dz) < 4.5 && Math.abs(pl.b.y - b.y) < 3 && pl.hp < pl.maxHp && !pl.dead) {
      b.heal = (b.heal || 0) + dt;
      if (b.heal > 1.2) { b.heal = 0; pl.heal(1); GS.fx.text(pl.b.x, pl.b.y + 2.2, pl.b.z, '+1 ❤', '#ff8090', 1); }
    }
  }
  // trophies near the player appear as pickups; far ones are dropped again
  WD.tT = (WD.tT || 0) - dt;
  if (WD.tT <= 0) {
    WD.tT = 0.5;
    for (const t of LM.trophies) {
      if (GS.trophies.has(t.id)) continue;
      const d = Math.hypot(t.x - pl.b.x, t.z - pl.b.z);
      const has = WD.trophyPool.has(t.id);
      if (d < 130 && !has) {
        const p = { kind: 'trophy', id: t.id, x: t.x, y: t.y, z: t.z, t: Math.random() * 6 };
        GS.pickups.push(p); WD.trophyPool.set(t.id, p);
      } else if (d > 190 && has) {
        const k = GS.pickups.indexOf(WD.trophyPool.get(t.id)); if (k >= 0) GS.pickups.splice(k, 1);
        WD.trophyPool.delete(t.id);
      }
    }
    for (const [id, p] of WD.trophyPool) if (GS.trophies.has(id)) WD.trophyPool.delete(id);
  }
  // boss arenas
  WD.bossCool = Math.max(0, WD.bossCool - dt);
  if (!GS.boss && WD.bossCool <= 0 && !pl.dead) {
    for (const bi of GS.bossInfo) {
      if (GS.bossDone[bi.id] || !bi.arena) continue;
      const a = bi.arena;
      if (Math.abs(pl.b.x - a.cx) < 17 && Math.abs(pl.b.z - a.cz) < 17 && Math.abs(pl.b.y - (WG_GY + 2)) < 6) BS_start(bi.id, a);
    }
  }
}

function WD_draw(r, cam) {
  // beacon lamps: the bat disc turns slowly above each pedestal, gold once lit
  const M = GS.models.lamp, gl = r.gl;
  for (const b of GS.beacons) {
    if (b.i === 0) continue;
    const dx = b.x - cam.x, dz = b.z - cam.z;
    if (dx * dx + dz * dz > 260 * 260) continue;
    M4_model(PK_m, b.x, b.y + 12.2 + Math.sin(VX.time * 1.6 + b.i) * 0.15, b.z, b.spin, 0, 0, 1);
    const lit = b.active;
    MD_drawModel(r, M, PK_m, M.poseNew(), { sky: 1, moon: 1, bl: [0, 0, 0], emit: lit ? 1.0 : 0.16, rim: [0, 0, 0], flash: lit ? null : [0.35, 0.4, 0.5, 0.65] });
  }
}

// Beams for the renderer: the big signal always, and a short column over each lit beacon.
function WD_beams() {
  const out = GS.beams ? [GS.beams[0]] : [];
  for (const b of GS.beacons) {
    if (b.i === 0 || !b.active) continue;
    const dx = b.x - VX.cam.x, dz = b.z - VX.cam.z;
    if (dx * dx + dz * dz > 380 * 380) continue;
    out.push({ p0: [b.x, b.y + 12, b.z], p1: [b.x, b.y + 150, b.z], tint: [0.55, 0.8, 1.0], w: 0.7, w1: 7 });
  }
  return out;
}


// ═══ UI ═══
// ═══════════════════════════════════════════════════════════════════════
//  UI — everything drawn on the 2D layer above the scene: hearts, ammunition,
//  compass, minimap, banners, the title, the pause card and the full map.
//
//  All sizes are multiples of one unit `u` (a 720-pixel-tall stage is 1.0), so
//  the layout is the same on a phone and on a monitor. The art is deliberately
//  blocky: pixel-grid hearts and a pixel map, to match the world they describe.
// ═══════════════════════════════════════════════════════════════════════

var UI = {
  banner: null, hint: null, bannerT: 0, hintT: 0,
  grapHint: false, hintCheckT: 0, hurtFlash: 0,
  mapReady: false, mapCanvas: null, mapRow: 0, mapOpenT: 0, mapSel: -1,
  hp: 5, hpAnim: 5,
  scoreShown: 0, objT: 0,
  compassT: 0, threat: [],
};

// Pixel art, one string per row.
var UI_HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
var UI_BAT = ['X.....X', 'XX.X.XX', 'XXXXXXX', '.XX.XX.', '..X.X..'];

var UI_MAP = { x0: -820, z0: -780, step: 3, w: 0, h: 0 };
var UI_DCOL = [[10, 24, 42], [92, 98, 112], [120, 88, 56], [96, 70, 120], [96, 150, 178], [64, 110, 74], [160, 70, 38], [150, 140, 70], [170, 50, 120]];

function UI_init() {
  UI_MAP.w = Math.ceil((1640) / UI_MAP.step); UI_MAP.h = Math.ceil((1560) / UI_MAP.step);
  UI.mapCanvas = document.createElement('canvas');
  UI.mapCanvas.width = UI_MAP.w; UI.mapCanvas.height = UI_MAP.h;
  UI.mapCtx = UI.mapCanvas.getContext('2d');
  UI.mapImg = UI.mapCtx.createImageData(UI_MAP.w, UI_MAP.h);
  UI.mapRow = 0;
  UI.canvasPos = { w: 0, h: 0 };
}

// The map is sampled from the generator itself a few rows a frame, so it is always
// exactly the world and costs nothing to ship.
function UI_mapStep(rows) {
  if (UI.mapReady) return;
  const M = UI_MAP, d = UI.mapImg.data, o = { kind: 0, top: 0, b: null };
  for (let n = 0; n < rows && UI.mapRow < M.h; n++, UI.mapRow++) {
    const j = UI.mapRow, z = M.z0 + j * M.step;
    for (let i = 0; i < M.w; i++) {
      const x = M.x0 + i * M.step;
      let c;
      if (!WG_isLand(x, z) && !LM_bridgeTop(x, z)) c = [8, 22, 40];
      else {
        WG_colInfo(x, z, o);
        const dc = UI_DCOL[WG_districtAt(x, z)], h = Math.min(1, (o.top - 27) / 80);
        if (o.kind === WG_K.ROAD) c = [30, 33, 42];
        else if (o.kind === WG_K.BRIDGE) c = [120, 110, 70];
        else if (o.kind === WG_K.SIDEWALK) c = [58, 62, 72];
        else if (o.kind === WG_K.PARK) c = [32, 80, 44];
        else if (o.kind === WG_K.BUILDING) { const k = 0.38 + 0.7 * h; c = [dc[0] * k, dc[1] * k, dc[2] * k]; }
        else if (o.kind === WG_K.ARENA) c = [200, 80, 90];
        else c = [dc[0] * 0.42, dc[1] * 0.42, dc[2] * 0.42];
      }
      const p = (j * M.w + i) * 4;
      d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = 255;
    }
  }
  if (UI.mapRow >= M.h) { UI.mapCtx.putImageData(UI.mapImg, 0, 0); UI.mapReady = true; }
}

// One-time advice, shown the first time it becomes relevant.
function UI_tip(id, text, secs) {
  UI.tipsSeen = UI.tipsSeen || {};
  if (UI.tipsSeen[id]) return;
  UI.tipsSeen[id] = true;
  UI_hint(text, secs || 6);
}
function UI_banner(title, sub) { UI.banner = { t: title, s: sub || '' }; UI.bannerT = 4.2; }
function UI_hint(text, secs) { UI.hint = text; UI.hintT = secs || 4; }
function UI_mapOpen() { UI.mapOpenT = 0; UI.mapSel = -1; }

function UI_update(dt) {
  UI.bannerT = Math.max(0, UI.bannerT - dt);
  UI.mapMsgT = Math.max(0, (UI.mapMsgT || 0) - dt);
  UI.hintT = Math.max(0, UI.hintT - dt);
  UI.hpAnim += (GS.player.hp - UI.hpAnim) * Math.min(1, dt * 8);
  UI.hurtFlash = Math.max(0, UI.hurtFlash - dt * 3);
  UI.scoreShown += (GS.score - UI.scoreShown) * Math.min(1, dt * 6);
  if (!UI.mapReady) UI_mapStep(VX.state === 'boot' ? 6 : 14);
  // is there something to grapple where the player is looking?
  UI.hintCheckT -= dt;
  if (UI.hintCheckT <= 0 && VX.state === 'play') {
    UI.hintCheckT = 0.12;
    const pl = GS.player;
    UI.grapHint = !pl.grap && !pl.dead && !!pl.findGrapple(GS.world, VX.cam);
  }
  // district banner on crossing a border
  if (VX.state === 'play') {
    UI.compassT -= dt;
    if (UI.compassT <= 0) {
      UI.compassT = 0.5;
      const pl = GS.player, d = WG_districtAt(pl.b.x, pl.b.z);
      if (pl.b.y < WG_GY + 45 || true) {
        if (UI.district !== undefined && d !== UI.district && !LM_bridgeTop(pl.b.x, pl.b.z)) UI_banner(WG_DNAME[d], '');
        UI.district = d;
      }
    }
  }
}

// ── drawing helpers ────────────────────────────────────────────────────────
function UI_px(ctx, rows, x, y, s, color, outline) {
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    if (rows[j][i] !== 'X') continue;
    ctx.fillStyle = color; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), Math.ceil(s), Math.ceil(s));
  }
}
function UI_text(ctx, str, x, y, size, color, align, weight, shadow, font) {
  ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px ' + (font || 'Oswald, "Helvetica Neue", sans-serif');
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  if (shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(str, x + size * 0.06, y + size * 0.07); }
  ctx.fillStyle = color || '#e8c34a';
  ctx.fillText(str, x, y);
}
function UI_spacedText(ctx, str, x, y, size, color, spacing, align, weight) {
  ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px Oswald, sans-serif';
  ctx.textBaseline = 'alphabetic';
  let w = 0; for (const ch of str) w += ctx.measureText(ch).width + spacing; w -= spacing;
  let cx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  ctx.textAlign = 'left';
  for (const ch of str) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(ch, cx + size * 0.05, y + size * 0.06);
    ctx.fillStyle = color; ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
}

// world -> screen, or null if behind the camera
function UI_project(x, y, z, w, h) {
  const m = VX.cam.vp;
  const cx = m[0] * x + m[4] * y + m[8] * z + m[12], cy = m[1] * x + m[5] * y + m[9] * z + m[13];
  const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
  if (cw <= 0.05) return null;
  return [(cx / cw * 0.5 + 0.5) * w, (1 - (cy / cw * 0.5 + 0.5)) * h, cw];
}

// ── the frame ──────────────────────────────────────────────────────────────
function UI_draw(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  const u = h / 720;
  const st = VX.state, pl = GS.player;
  if (st === 'boot') return;
  if (st === 'title' || st === 'win') { UI_title(ctx, w, h, u, st === 'win'); return; }

  UI_floatText(ctx, w, h, u);
  UI_hearts(ctx, w, h, u);
  UI_crosshair(ctx, w, h, u);
  UI_compass(ctx, w, h, u);
  UI_minimap(ctx, w, h, u);
  UI_score(ctx, w, h, u);
  UI_threats(ctx, w, h, u);
  if (GS.boss) UI_bossBar(ctx, w, h, u);
  UI_banners(ctx, w, h, u);
  if (st === 'dead') UI_dead(ctx, w, h, u);
  if (st === 'pause') { UI_pause(ctx, w, h, u); UI_pauseFoot(ctx, w, h, u); }
  if (st === 'map') UI_bigMap(ctx, w, h, u);
}

function UI_hearts(ctx, w, h, u) {
  const pl = GS.player, s = 4.2 * u, gap = 7 * u, x0 = 22 * u, y0 = 20 * u;
  for (let i = 0; i < pl.maxHp; i++) {
    const x = x0 + i * (7 * s + gap);
    UI_px(ctx, UI_HEART, x - s * 0.5, y0 - s * 0.5, s, 'rgba(0,0,0,0.55)');
    const full = pl.hp > i;
    const pulse = pl.hp <= 1 && full ? 0.75 + 0.25 * Math.sin(VX.time * 8) : 1;
    UI_px(ctx, UI_HEART, x, y0, s, full ? 'rgba(' + Math.round(235 * pulse) + ',46,72,1)' : 'rgba(70,40,52,0.9)');
    if (full) { ctx.fillStyle = 'rgba(255,150,170,0.9)'; ctx.fillRect(Math.round(x + s), Math.round(y0 + s), Math.ceil(s), Math.ceil(s)); }
  }
  // batarangs
  const by = y0 + 6 * s + 14 * u;
  UI_px(ctx, UI_BAT, x0, by, 3.4 * u, '#9fb7d8');
  UI_text(ctx, '× ' + pl.bats, x0 + 7 * 3.4 * u + 10 * u, by + 5 * 3.4 * u, 20 * u, '#cfe0f5', 'left', 600);
}

function UI_crosshair(ctx, w, h, u) {
  if (VX.state !== 'play' || GS.player.dead) return;
  const cx = w / 2, cy = h / 2, hint = UI.grapHint;
  ctx.fillStyle = hint ? 'rgba(232,195,74,0.95)' : 'rgba(210,225,245,0.55)';
  const s = (hint ? 3 : 2.2) * u;
  ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
  if (hint) {
    const g = 8 * u, l = 6 * u, t = 2 * u;
    ctx.fillRect(cx - g - l, cy - t / 2, l, t); ctx.fillRect(cx + g, cy - t / 2, l, t);
    ctx.fillRect(cx - t / 2, cy - g - l, t, l); ctx.fillRect(cx - t / 2, cy + g, t, l);
  }
}

function UI_score(ctx, w, h, u) {
  const touch = IN.touch;
  const top = touch ? 56 * (VX.hudDpr || 1) : 0;
  const x = w - 22 * u, y = top + 40 * u;
  UI_text(ctx, String(Math.round(UI.scoreShown)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'), x, y, 30 * u, '#e8c34a', 'right', 600, true);
  UI_text(ctx, 'PUNTOS', x, y - 28 * u, 11 * u, 'rgba(157,176,200,0.8)', 'right', 500);
  if (GS.combo >= 2) {
    const k = Math.min(1, GS.comboT / 3.2);
    const pop = 1 + Math.max(0, 0.25 - (3.2 - GS.comboT) * 0.8);
    UI_text(ctx, '×' + GS.combo, x, y + 36 * u * pop, 30 * u * pop, '#ff9a3c', 'right', 700, true);
    ctx.fillStyle = 'rgba(255,154,60,0.9)'; ctx.fillRect(x - 70 * u * k, y + 46 * u, 70 * u * k, 3 * u);
  }
  // trophies and objectives
  const tx = x, ty = y + (GS.combo >= 2 ? 78 : 36) * u;
  UI_text(ctx, GS.trophies.size + ' / ' + GS.trophyTotal + ' TROFEOS', tx, ty, 12 * u, '#6ff08a', 'right', 500);
}

var UI_CARD = ['N', 'E', 'S', 'O'];
function UI_compass(ctx, w, h, u) {
  const pl = GS.player, cam = VX.cam;
  const cx = w / 2, y = 24 * u, half = Math.min(190 * u, w * 0.17);
  ctx.fillStyle = 'rgba(6,9,16,0.38)'; ctx.fillRect(cx - half, y - 14 * u, half * 2, 22 * u);
  ctx.fillStyle = 'rgba(232,195,74,0.7)'; ctx.fillRect(cx - 1 * u, y - 15 * u, 2 * u, 5 * u);
  // heading in the same convention as the camera: yaw 0 looks at -z (north)
  const yaw = cam.yaw;
  const markers = [];
  for (let i = 0; i < 4; i++) markers.push({ a: i * Math.PI / 2, t: UI_CARD[i], c: i === 0 ? '#e8c34a' : '#9db0c8', big: true });
  for (const o of WD_objectives()) markers.push({ a: Math.atan2(o.x - pl.b.x, -(o.z - pl.b.z)), t: o.icon, c: o.color, big: true, d: Math.hypot(o.x - pl.b.x, o.z - pl.b.z) });
  for (const m of markers) {
    let da = m.a - yaw; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    const px = cx + da / (Math.PI * 0.62) * half;
    if (Math.abs(px - cx) > half - 4 * u) continue;
    const fade = 1 - Math.pow(Math.abs(px - cx) / half, 3);
    ctx.globalAlpha = fade;
    UI_text(ctx, m.t, px, y + 3 * u, (m.d !== undefined ? 15 : 14) * u, m.c, 'center', 600, true);
    if (m.d !== undefined) UI_text(ctx, Math.round(m.d) + ' m', px, y + 22 * u, 9 * u, m.c, 'center', 500, true);
    ctx.globalAlpha = 1;
  }
}

function UI_minimap(ctx, w, h, u) {
  const pl = GS.player;
  const R = 62 * u, cx = 22 * u + R, cy = 112 * u + R;
  // a circular window onto the cached map, heading up
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(6,10,18,0.88)'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  if (UI.mapReady) {
    const M = UI_MAP, span = 130, pxPerBlock = R / span;      // blocks from centre to edge
    ctx.imageSmoothingEnabled = false;
    ctx.translate(cx, cy);
    ctx.rotate(-VX.cam.yaw);
    const sc = pxPerBlock * M.step;
    ctx.drawImage(UI.mapCanvas, -(pl.b.x - M.x0) / M.step * sc, -(pl.b.z - M.z0) / M.step * sc, M.w * sc, M.h * sc);
    // markers, in the rotated frame
    for (const o of WD_objectives()) {
      const dx = (o.x - pl.b.x) * pxPerBlock, dz = (o.z - pl.b.z) * pxPerBlock;
      let d = Math.hypot(dx, dz), k = d > R - 8 * u ? (R - 8 * u) / d : 1;
      ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(dx * k, dz * k, (k < 1 ? 3.2 : 4.2) * u, 0, 7); ctx.fill();
    }
    for (const e of GS.enemies) {
      if (e.dead) continue;
      const dx = (e.b.x - pl.b.x) * pxPerBlock, dz = (e.b.z - pl.b.z) * pxPerBlock;
      if (dx * dx + dz * dz > (R - 3 * u) * (R - 3 * u)) continue;
      ctx.fillStyle = e.isBoss ? '#ff3030' : (e.alert ? '#ff5a4a' : '#c0504a'); ctx.fillRect(dx - 2 * u, dz - 2 * u, 4 * u, 4 * u);
    }
  }
  ctx.restore();
  ctx.lineWidth = 2 * u; ctx.strokeStyle = 'rgba(232,195,74,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // the player: an arrow pointing where the character faces, relative to the camera
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(VX.cam.yaw - (Math.PI - pl.a) * 1);
  ctx.fillStyle = '#e8c34a'; ctx.beginPath(); ctx.moveTo(0, -6 * u); ctx.lineTo(4.5 * u, 5 * u); ctx.lineTo(0, 2.5 * u); ctx.lineTo(-4.5 * u, 5 * u); ctx.closePath(); ctx.fill();
  ctx.restore();
  UI_text(ctx, 'N', cx + Math.sin(VX.cam.yaw) * (R + 10 * u) * 0, cy - R - 4 * u, 10 * u, 'rgba(232,195,74,0.8)', 'center', 600);
}

function UI_threats(ctx, w, h, u) {
  // a red tick at the screen edge toward any enemy that is about to hit from out of view
  const pl = GS.player, cam = VX.cam;
  for (const e of GS.enemies) {
    if (e.dead || (e.state !== 'windup' && e.state !== 'strike')) continue;
    const dx = e.b.x - pl.b.x, dz = e.b.z - pl.b.z;
    let da = Math.atan2(dx, -dz) - cam.yaw; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    if (Math.abs(da) < 0.7) continue;
    const a = da - Math.PI / 2, R = Math.min(w, h) * 0.34;
    const x = w / 2 + Math.cos(a) * R, y = h / 2 + Math.sin(a) * R;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = 'rgba(255,70,50,' + (0.6 + 0.4 * Math.sin(VX.time * 20)) + ')';
    ctx.beginPath(); ctx.moveTo(0, -12 * u); ctx.lineTo(9 * u, 8 * u); ctx.lineTo(-9 * u, 8 * u); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function UI_floatText(ctx, w, h, u) {
  for (const t of GS.fx.texts) {
    const p = UI_project(t.x, t.y, t.z, w, h);
    if (!p) continue;
    const k = t.life / t.max, a = Math.min(1, k * 3);
    ctx.globalAlpha = a;
    UI_text(ctx, t.s, p[0], p[1], Math.min(46, 17 * t.size * Math.max(0.6, 26 / p[2])) * u, t.c, 'center', 700, true);
    ctx.globalAlpha = 1;
  }
}

function UI_banners(ctx, w, h, u) {
  if (UI.bannerT > 0 && UI.banner) {
    const k = UI.bannerT, a = Math.min(1, k * 1.2, (4.2 - k) * 2);
    ctx.globalAlpha = Math.max(0, a);
    UI_spacedText(ctx, UI.banner.t, w / 2, h * 0.2, 44 * u, '#e8c34a', 9 * u, 'center', 600);
    if (UI.banner.s) UI_spacedText(ctx, UI.banner.s.toUpperCase(), w / 2, h * 0.2 + 28 * u, 14 * u, '#9db0c8', 5 * u, 'center', 500);
    ctx.globalAlpha = 1;

// ═══ AUDIO ═══
// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — everything you hear is synthesised: rain, the city's low drone, wind
//  under the cape, footsteps in puddles, thunder, every punch, and a dark
//  procedural score that thickens as a fight starts.
//
//  There are no sound files. Browsers keep the audio context suspended until the
//  player does something, so nothing is built until the first key or tap; if the
//  context cannot be made, the game simply plays in silence.
// ═══════════════════════════════════════════════════════════════════════

var AU = {
  ctx: null, master: null, sfx: null, music: null, amb: null, echo: null,
  muted: false, noise: null, wind: null, windF: null, rainG: null,
  mood: [1, 0, 0], step: 0, nextT: 0, bar: 0,
  thunderT: 18, flashT: -1, stepPh: 0, lastEvt: {},
};

function AU_init() {
  const go = function () { AU_resume(); window.removeEventListener('pointerdown', go); window.removeEventListener('keydown', go); };
  window.addEventListener('pointerdown', go); window.addEventListener('keydown', go);
}

function AU_resume() {
  if (!AU.ctx) AU_build();
  if (AU.ctx && AU.ctx.state === 'suspended') { try { AU.ctx.resume(); } catch (e) { } }
}

function AU_toggle() {
  AU_resume();
  AU.muted = !AU.muted;
  if (AU.master) AU.master.gain.setTargetAtTime(AU.muted ? 0 : 0.7, AU.ctx.currentTime, 0.05);
  UI_hint(AU.muted ? 'Sonido desactivado' : 'Sonido activado', 1.6);
  const b = document.getElementById('tbS'); if (b) b.style.opacity = AU.muted ? '0.45' : '1';
}

function AU_build() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = AU.ctx = new C();
    const g = (v, dest) => { const n = ctx.createGain(); n.gain.value = v; if (dest) n.connect(dest); return n; };
    AU.master = g(AU.muted ? 0 : 0.7, ctx.destination);
    // a gentle limiter so a pile-up of effects cannot clip
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(AU.master);
    AU.sfx = g(0.9, comp); AU.music = g(0.42, comp); AU.amb = g(1, comp);
    // two seconds of noise, reused everywhere
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = nb;
    // an echo for the music: a delay with a darkening feedback
    const del = ctx.createDelay(1.0); del.delayTime.value = 0.43;
    const fb = g(0.38, del), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    del.connect(lp); lp.connect(fb); lp.connect(AU.music);
    AU.echo = g(0.5, del);
    // rain: bright hiss and a low roar under it
    const rain = (type, f, q, gain) => {
      const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
      const f1 = ctx.createBiquadFilter(); f1.type = type; f1.frequency.value = f; f1.Q.value = q;
      s.connect(f1); const gg = g(gain, AU.amb); f1.connect(gg); s.start(0, Math.random()); return gg;
    };
    AU.rainG = rain('bandpass', 3400, 0.45, 0.085);
    rain('lowpass', 520, 0.7, 0.055);
    // the city: a low chord that never quite resolves
    [[55, 'sawtooth', 0.016], [82.4, 'triangle', 0.02], [110.5, 'sine', 0.014], [165.2, 'sine', 0.008]].forEach(function (o, i) {
      const osc = ctx.createOscillator(); osc.type = o[1]; osc.frequency.value = o[0];
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03; const lg = g(60, f.frequency); lfo.connect(lg); lfo.start();
      osc.connect(f); f.connect(g(o[2], AU.amb)); osc.start();
    });
    // wind for the glide: the filter and level follow the speed
    const ws = ctx.createBufferSource(); ws.buffer = nb; ws.loop = true;
    AU.windF = ctx.createBiquadFilter(); AU.windF.type = 'bandpass'; AU.windF.frequency.value = 500; AU.windF.Q.value = 0.8;
    AU.wind = g(0, AU.amb); ws.connect(AU.windF); AU.windF.connect(AU.wind); ws.start(0, 0.5);
    AU.nextT = ctx.currentTime + 0.3;
  } catch (e) { AU.ctx = null; }
}

// ── building blocks ───────────────────────────────────────────────────────
function AU_tone(type, f0, f1, dur, gain, delay, dest, attack) {
  const c = AU.ctx; if (!c) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + (attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || AU.sfx);
  o.start(t); o.stop(t + dur + 0.05);
}
function AU_noiseBurst(dur, ftype, f0, f1, q, gain, delay, dest, attack) {
  const c = AU.ctx; if (!c) return;
  const t = c.currentTime + (delay || 0);
  const s = c.createBufferSource(); s.buffer = AU.noise;
  const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q || 0.8;
  f.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + (attack || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || AU.sfx);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function AU_pos(x, z) {
  // distance fade for a sound in the world; 1 near the player, 0 far
  const p = GS.player.b, d = Math.hypot(x - p.x, z - p.z);
  return Math.max(0, 1 - d / 60);
}

// ── one-shot effects ──────────────────────────────────────────────────────
function AU_event(k, e) {
  if (!AU.ctx || AU.ctx.state !== 'running' || AU.muted) return;
  // many events can fire together; the same one more than once in 40 ms is one sound
  const now = AU.ctx.currentTime;
  if (AU.lastEvt[k] && now - AU.lastEvt[k] < 0.04) return;
  AU.lastEvt[k] = now;
  const near = (e && e.x !== undefined) ? AU_pos(e.x, e.z) : 1;
  if (near <= 0.02) return;
  switch (k) {
    case 'burn': AU_noiseBurst(0.4, 'bandpass', 1800, 600, 0.9, 0.18); AU_tone('sawtooth', 160, 70, 0.3, 0.12); break;
    case 'jump': AU_noiseBurst(0.22, 'bandpass', 500, 1400, 0.9, 0.06); break;
    case 'land': AU_tone('sine', 120, 50, 0.16, 0.22); AU_noiseBurst(0.12, 'lowpass', 900, 200, 0.8, 0.12); break;
    case 'landHard': AU_tone('sine', 90, 36, 0.34, 0.4); AU_noiseBurst(0.3, 'lowpass', 1200, 120, 0.8, 0.26); break;
    case 'glide': AU_noiseBurst(0.5, 'bandpass', 300, 1800, 0.7, 0.14, 0, null, 0.06); AU_tone('triangle', 180, 320, 0.2, 0.05); break;
    case 'dodge': AU_noiseBurst(0.3, 'bandpass', 700, 300, 0.9, 0.09); break;
    case 'grapple': AU_noiseBurst(0.12, 'highpass', 2500, 5000, 0.8, 0.12); AU_tone('square', 900, 400, 0.08, 0.04); break;
    case 'grappleMiss': AU_noiseBurst(0.25, 'bandpass', 3000, 900, 0.9, 0.06); break;
    case 'grappleHit': AU_tone('square', 300, 140, 0.07, 0.12); AU_noiseBurst(0.05, 'highpass', 4000, 4000, 1, 0.12); break;
    case 'vault': AU_noiseBurst(0.32, 'bandpass', 400, 1600, 0.8, 0.1); break;
    case 'swing': case 'whoosh': AU_noiseBurst(0.18, 'bandpass', 1500, 500, 1.1, 0.10); break;
    case 'hit': {
      const heavy = e && e.kind === 3;
      AU_tone('sine', heavy ? 210 : 170, 55, heavy ? 0.22 : 0.15, heavy ? 0.5 : 0.36);
      AU_noiseBurst(0.1, 'lowpass', 2400, 400, 0.8, heavy ? 0.28 : 0.2);
      AU_tone('square', 520, 260, 0.04, 0.04);
      break;
    }
    case 'throw': AU_tone('sawtooth', 400, 1100, 0.2, 0.06); AU_noiseBurst(0.2, 'bandpass', 2200, 3200, 1.4, 0.07); break;
    case 'batHit': AU_tone('triangle', 1250, 700, 0.22, 0.18); AU_tone('sine', 190, 70, 0.14, 0.25); break;
    case 'clink': AU_tone('triangle', 2300 + Math.random() * 400, 1700, 0.09, 0.07 * near); break;
    case 'hurt': AU_tone('sawtooth', 220, 90, 0.26, 0.2); AU_noiseBurst(0.16, 'lowpass', 1800, 300, 0.8, 0.22); AU_tone('sine', 80, 40, 0.3, 0.3); break;
    case 'die': AU_tone('sawtooth', 200, 40, 0.9, 0.24); AU_tone('sine', 70, 28, 1.1, 0.35); break;
    case 'kill': AU_tone('sine', 130, 50, 0.2, 0.28 * near); AU_noiseBurst(0.12, 'lowpass', 800, 150, 0.8, 0.12 * near); break;
    case 'gun': AU_noiseBurst(0.08, 'highpass', 1800, 900, 0.6, 0.2 * near); AU_tone('sine', 220, 70, 0.09, 0.18 * near); break;
    case 'enemySwing': AU_noiseBurst(0.2, 'bandpass', 900, 350, 1.0, 0.1 * near); break;
    case 'tell': AU_tone('square', 880, 880, 0.07, 0.06 * near); AU_tone('square', 1175, 1175, 0.07, 0.05 * near, 0.08); break;
    case 'alert': AU_tone('square', 520, 780, 0.12, 0.05 * near); break;
    case 'boom': AU_tone('sine', 110, 32, 0.6, 0.55 * near); AU_noiseBurst(0.55, 'lowpass', 2400, 90, 0.7, 0.4 * near); break;
    case 'slamLand': AU_tone('sine', 80, 28, 0.8, 0.7); AU_noiseBurst(0.7, 'lowpass', 2000, 70, 0.7, 0.5); break;
    case 'poof': AU_noiseBurst(0.5, 'bandpass', 900, 200, 0.7, 0.14); AU_tone('triangle', 520, 150, 0.4, 0.06); break;
    case 'pickup': AU_tone('sine', 880, 880, 0.12, 0.12); AU_tone('sine', 1320, 1320, 0.18, 0.1, 0.07); break;
    case 'beacon': [392, 494, 587, 784].forEach(function (f, i) { AU_tone('triangle', f, f, 0.8, 0.12, i * 0.09); }); break;
    case 'cleared': [523, 659, 784].forEach(function (f, i) { AU_tone('triangle', f, f, 0.4, 0.1, i * 0.08); }); break;
    case 'bossStart': AU_tone('sawtooth', 65, 62, 1.6, 0.2, 0, null, 0.3); AU_tone('sawtooth', 98, 92, 1.6, 0.14, 0, null, 0.3); break;
    case 'bossHit': AU_tone('sine', 100, 40, 0.2, 0.3); break;
    case 'bossDown': [440, 330, 262, 196, 147].forEach(function (f, i) { AU_tone('sawtooth', f, f * 0.98, 0.9, 0.1, i * 0.18); }); AU_tone('sine', 70, 28, 1.6, 0.5); break;
    case 'thunder': AU_noiseBurst(2.8, 'lowpass', 500, 60, 0.7, 0.5, 0, null, 0.25); AU_tone('sine', 50, 28, 2.2, 0.3, 0.1, null, 0.2); break;
  }
}

// ── the score ─────────────────────────────────────────────────────────────
// D minor, 84 bpm, sixteenth-note steps. Four layers fade in and out with the mood:
// a pad and a plucked line always, drums and a driving bass when there is a fight.
var AU_CHORDS = [[146.8, 174.6, 220.0], [116.5, 146.8, 174.6], [98.0, 116.5, 146.8], [110.0, 138.6, 164.8]];
var AU_ROOTS = [73.4, 58.3, 49.0, 55.0];
var AU_LINE = [0, 3, 5, 7, 5, 3, 0, -2];             // semitones over the chord root

function AU_pad(freqs, t, dur, gain) {
  const c = AU.ctx;
  for (const f of freqs) for (const det of [-6, 7]) {

  { name: 'ALTA', scale: 1.00, radius: 8, rain: 5600, bloom: 0.50 },

function VX_setQuality(q) {

function VX_boot() {

  const coarse = VX.coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  try { if (document.fonts && document.fonts.load) { document.fonts.load('600 20px Oswald'); document.fonts.load('700 20px Oswald'); document.fonts.load('700 12px "JetBrains Mono"'); } } catch (e) { }
  const cores = navigator.hardwareConcurrency || 4;
  VX.quality = coarse ? 1 : (cores <= 2 ? 1 : (cores <= 4 ? 2 : 3));
  VX.scale = VX_Q[VX.quality].scale; VX.radius = VX_Q[VX.quality].radius;
  const canvas = document.getElementById('gl');
  VX.hud = document.getElementById('hud');
  VX.hudCtx = VX.hud.getContext('2d');
  try {

  } catch (e) {

    document.getElementById('bar').hidden = true;

  }

  VX.world = new VxWorld(gl, { radius: VX.radius });

  VX.rend.nearDist = (VX.radius - 1) * 16 + 6;
  const nw = Math.max(1, Math.min(3, (navigator.hardwareConcurrency || 2) - 1));
  VX.world.startWorkers(document.getElementById('vx-worker-src').textContent, nw);

  GS.world = VX.world; GS.rend = VX.rend; GS.far = VX.far; GS.cam = VX.cam;
  VX.rend.P.rainCount = VX_Q[VX.quality].rain; VX.rend.P.bloom = VX_Q[VX.quality].bloom;
  GS.fx = new VxFx(VX.rend);
  VX_buildModels(gl);
  GS.tcam = new ThirdCam();
  const sp = WG_SPAWN;
  GS.player = new Player(sp.x, sp.y, sp.z);
  GS.player.a = sp.a;
  GS.tcam.yaw = Math.PI - sp.a; GS.tcam.pitch = -0.22; GS.tcam.snap(GS.player);
  GS.player.b.vy = 0;
  VX.rend.extraGlow = function (out, n) { return GS.fx.appendGlows(out, n); };

  VX.saved = VX_saveLoad();
  IN_init(document.getElementById('stage'), canvas);
  if (typeof AU_init === 'function') AU_init();
  VX_resize();
  window.addEventListener('resize', VX_resize);
  // a hidden tab or a window that lost focus must not leave the player under attack
  document.addEventListener('visibilitychange', function () { if (document.hidden && VX.state === 'play') VX_setState('pause'); });
  window.addEventListener('blur', function () { if (VX.state === 'play' && !IN.touch) VX_setState('pause'); });
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); VX.lost = true; const b = document.getElementById('boot'); if (b) { b.hidden = false; document.getElementById('bootmsg').textContent = 'Se perdió el contexto gráfico: recarga la página'; document.getElementById('bar').hidden = true; } });
  UI_init();
  WD_init();

  VX.booted = true;
  VX.state = 'boot'; VX.stateT = 0;
  // the title camera: a slow orbit over the roof
  VX_titleCam(0);
  if (VX.capture) {
    // tests render on demand; the world still has to stream, so keep it ticking
    setInterval(function () { const f = VX.freeCam ? VX.cam : GS.player.b; VX.world.update(f.x, f.z, 10); VX.far.update(f.x, f.z, 6); }, 16);

function VX_titleCam(t) {
  const sp = WG_SPAWN, c = VX.cam;
  const a = 0.6 + t * 0.07, R = 26;
  c.x = sp.x + Math.sin(a) * R; c.z = sp.z + Math.cos(a) * R; c.y = sp.y + 9 + Math.sin(t * 0.3) * 1.5;

// ── state changes ─────────────────────────────────────────────────────────
function VX_setState(s) { VX.state = s; VX.stateT = 0; }

// Progress survives a reload: which beacons are lit, which bosses are down, the
// trophies, the score. Storage can be blocked or full, so every access is guarded.
var VX_SAVE_KEY = 'gotham-voxel-v1';
function VX_saveLoad() {
  try { const t = localStorage.getItem(VX_SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
}
function VX_saveWrite() {
  try {
    localStorage.setItem(VX_SAVE_KEY, JSON.stringify({
      beacons: GS.beacons.map(b => b.active ? 1 : 0), last: GS.lastBeacon, bosses: GS.bossDone, trophies: Array.from(GS.trophies),
      score: GS.score, kills: GS.kills, best: GS.bestCombo, bats: GS.player.bats,
    }));
  } catch (e) { }
}
function VX_saveClear() { try { localStorage.removeItem(VX_SAVE_KEY); } catch (e) { } }

  if (!d) return false;
  try {
    d.beacons.forEach((v, i) => { if (GS.beacons[i] && v) GS.beacons[i].active = true; });
    GS.lastBeacon = Math.min(GS.beacons.length - 1, d.last | 0);
    GS.bossDone.penguin = !!(d.bosses && d.bosses.penguin); GS.bossDone.joker = !!(d.bosses && d.bosses.joker);

    GS.player.bats = Math.max(8, d.bats | 0);

}

function VX_start() {
  if (typeof AU_resume === 'function') AU_resume();
  VX_setState('play');
  VX.fade = 1; VX.fadeTo = 0; VX.fadeSpeed = 1.5;
  if (VX.saved) {                                         // a continued game starts at the last beacon
    VX_saveApply(VX.saved);
    const b = GS.beacons[GS.lastBeacon], pl = GS.player;
    pl.b.x = b.x + (GS.lastBeacon === 0 ? 0 : 3.5); pl.b.y = b.y + 0.2; pl.b.z = b.z; pl.b.vx = pl.b.vy = pl.b.vz = 0;
    GS.tcam.snap(pl); VX.world.dirty = true;
    UI_banner(b.name, 'Partida continuada');
  } else {
    UI_banner(WG_DNAME[WG_districtAt(GS.player.b.x, GS.player.b.z)], 'Gotham te necesita');
    UI_hint('Planea con ESPACIO en el aire · Garfio con E', 7);
  }

function VX_respawn() {
  const pl = GS.player;
  const bc = GS.beacons[GS.lastBeacon] || { x: WG_SPAWN.x, y: WG_SPAWN.y, z: WG_SPAWN.z };
  pl.respawn(bc.x, bc.y + 0.2, bc.z);
  GS.tcam.snap(pl);
  GS.projs.length = 0;
  // enemies near the spawn go away, so the player is not killed again at once
  for (const e of GS.enemies) { const d = Math.hypot(e.b.x - pl.b.x, e.b.z - pl.b.z); if (d < 30 && !e.isBoss) e.gone = true; }
  GS.combo = 0;
  VX.fade = 1; VX.fadeTo = 0; VX.fadeSpeed = 1.4;
  VX_setState('play');
}

// ── the simulation step ───────────────────────────────────────────────────
function VX_events() {
  const pl = GS.player;
  for (const e of pl.events) {
    const k = typeof e === 'string' ? e : e.t;
    if (typeof AU_event === 'function') AU_event(k, e);
    if (k === 'land' || k === 'landHard' || k === 'dust') {
      GS.fx.dust(pl.b.x, pl.b.y, pl.b.z, k === 'land' ? 8 : 14, k === 'land' ? 0.8 : 1.3);
    }
    if (k === 'jump') GS.fx.dust(pl.b.x, pl.b.y, pl.b.z, 5, 0.6);
    if (k === 'dodge') GS.fx.dust(pl.b.x, pl.b.y, pl.b.z, 8, 1.0);
    if (k === 'glide') GS.fx.puff(pl.b.x, pl.b.y + 1.0, pl.b.z, 5, 0.3, 0.2);
    if (k === 'hurt') { VX.rend.P.hurt[3] = 0.7; }
  }
  pl.events.length = 0;
  for (const e of GS.events) {
    if (typeof AU_event === 'function') AU_event(e.t, e);
    if (e.t === 'alert') UI_tip('fight', 'Clic: golpear · F: batarang · Q: esquivar cuando veas el aviso naranja', 7);
  }
  GS.events.length = 0;
}

function VX_simStep(dt) {
  const pl = GS.player;
  GS.time += dt;
  GS.fx.update(dt);
  pl.update(dt, VX.cam, GS.world, true);
  VX_events();
  if (VX.state === 'play' || VX.state === 'dead') {
    EN_update(dt);
    PJ_update(dt);
    PK_update(dt);
    if (GS.boss) BS_update(dt);
    WD_update(dt);
  }
  if (GS.comboT > 0) { GS.comboT -= dt; if (GS.comboT <= 0) GS.combo = 0; }
  VX.saveT -= dt;
  if (VX.saveT <= 0 && VX.state === 'play') { VX.saveT = 10; VX_saveWrite(); }
}

function VX_update(dtReal) {
  VX.time += dtReal;
  VX.rend.time = VX.time;
  const pl = GS.player;
  VX.stateT += dtReal;
  IN_pollPad(dtReal);

  // world streaming follows the player (or the title camera)
  const fx = VX.state === 'title' || VX.state === 'boot' ? VX.cam : pl.b;
  VX.world.update(fx.x, fx.z, 5);
  VX.far.update(fx.x, fx.z, 3);
  const f = VX.world.loadedFraction();
  const bar = document.getElementById('barfill');
  if (bar) bar.style.width = Math.round(f * 100) + '%';

  switch (VX.state) {
    case 'boot': {
      VX_titleCam(VX.time);
      if (f > 0.62) {
        const boot = document.getElementById('boot'); if (boot) boot.hidden = true;
        VX_setState('title'); VX.fade = 1; VX.fadeTo = 0;
      }
      break;
    }
    case 'title': {
      VX_titleCam(VX.time);
      if (VX.saved && IN.keys.KeyB) { VX_saveClear(); VX.saved = null; }
      if (VX.stateT > 0.6 && IN.anyEdge) VX_start();
      break;
    }
    case 'play':
    case 'dead': {
      // hit-stop: a landed punch holds the world for a few frames
      let dt = dtReal;
      if (GS.slow > 0) { GS.slow -= dtReal; dt *= 0.12; }
      dt = Math.min(dt, 0.1);
      if (VX.state === 'play') {
        if (IN.pauseEdge) { VX_setState('pause'); break; }
        if (IN.mapEdge) { VX_setState('map'); UI_mapOpen(); break; }
      }
      VX.acc += dt;
      let n = 0;
      while (VX.acc >= VX_STEP && n < 12) { VX_simStep(VX_STEP); VX.acc -= VX_STEP; n++; }
      if (n === 12) VX.acc = 0;
      if (pl.dead && VX.state === 'play') { VX_setState('dead'); VX.fadeTo = 1; VX.fadeSpeed = 0.8; }
      if (VX.state === 'dead' && VX.stateT > 2.6) VX_respawn();
      // the camera
      IN_takeLook(VX.look);
      GS.tcam.update(dtReal, VX.cam, pl, GS.world, VX.look);
      break;
    }
    case 'pause': {
      IN_takeLook(VX.look);
      if (IN.pauseEdge || (IN.anyEdge && VX.stateT > 0.3 && IN.jumpEdge)) VX_setState('play');
      break;
    }
    case 'map': {
      IN_takeLook(VX.look);
      if (IN.mapEdge || IN.pauseEdge) VX_setState('play');
      break;
    }
    case 'win': {
      IN_takeLook(VX.look);
      VX_titleCam(VX.time);
      if (VX.stateT > 1.5 && IN.anyEdge) { VX_setState('play'); VX.fadeTo = 0; }
      break;
    }
  }
  // the air of the district the camera is in
  VX_air.t -= dtReal;
  if (VX_air.t <= 0) { VX_air.t = 0.4; VX_air.want = VX_AIR[WG_districtAt(VX.cam.x, VX.cam.z)] || VX_AIR[WG_D.AZOTEAS]; }
  for (let i = 0; i < 3; i++) {
    VX_air.fog[i] += (VX_air.want.fog[i] - VX_air.fog[i]) * Math.min(1, dtReal * 0.8);
    VX_air.hor[i] += (VX_air.want.hor[i] - VX_air.hor[i]) * Math.min(1, dtReal * 0.8);
  }
  VX.rend.P.horizon = VX_air.hor;
  // under the surface the city turns to murk
  const cam = VX.cam, inWater = GS.world.getBlock(Math.floor(cam.x), Math.floor(cam.y), Math.floor(cam.z)) === BK.WATER;
  VX.uw += ((inWater ? 1 : 0) - VX.uw) * Math.min(1, dtReal * 7);
  const P = VX.rend.P, B = VX_BASE;
  const F = VX_air.fog;
  P.fog = [F[0] + (0.015 - F[0]) * VX.uw, F[1] + (0.085 - F[1]) * VX.uw, F[2] + (0.12 - F[2]) * VX.uw];
  P.fogD = B.fogD + (0.15 - B.fogD) * VX.uw; P.fogK = B.fogK * (1 - VX.uw);
  // screen fade
  VX.fade += (VX.fadeTo - VX.fade) * Math.min(1, VX.fadeSpeed * dtReal * 3);
  if (Math.abs(VX.fade - VX.fadeTo) < 0.004) VX.fade = VX.fadeTo;
  VX.rend.P.fade = 1 - VX.fade;
  VX.rend.P.hurt[3] = Math.max(0, VX.rend.P.hurt[3] - dtReal * 1.6);
  UI_update(dtReal);
  if (typeof AU_update === 'function') AU_update(dtReal);
  VX_adapt(dtReal);
  IN_clearEdges();
}

// ── drawing ───────────────────────────────────────────────────────────────
function VX_extra(r, cam) {
  const gl = r.gl, P = r.P, p = r.prog.ent;
  gl.useProgram(p.id);
  gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
  r.common(p, cam);
  gl.uniform3f(p.u('uSkyTint'), P.skyTint[0], P.skyTint[1], P.skyTint[2]);
  gl.uniform1f(p.u('uSkyI'), P.skyI);
  gl.uniform1f(p.u('uBlockI'), P.blockI);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  // a camera squeezed against a wall would fill the screen with the back of his head
  if (GS.tcam.dist > 1.5 || VX.state !== 'play') PL_draw(r, GS.player);
  for (const e of GS.enemies) {
    const dx = e.b.x - cam.x, dz = e.b.z - cam.z;
    if (dx * dx + dz * dz > 170 * 170) continue;
    if (!M4_boxVisible(cam.planes, e.b.x - 3, e.b.y - 1, e.b.z - 3, e.b.x + 3, e.b.y + 5, e.b.z + 3)) continue;
    e.draw(r);
  }
  PK_draw(r);
  PJ_draw(r);
  WD_draw(r, cam);
  const ropes = PL_ropes();
  GS.fx.draw(r, cam, ropes);
  gl.bindVertexArray(null);
}

var PL_mA = new Float32Array(16);
function PL_draw(r, pl) {
  const M = GS.models.batman, st = pl.st, b = pl.b;
  const hip = 0.625;
  const bank = pl.mode === 'glide' ? pl.gl.bank : 0;
  M4_model(PL_mA, b.x, b.y + hip, b.z, pl.a, 0, bank, 1);
  PL_mA[12] -= hip * PL_mA[4]; PL_mA[13] -= hip * PL_mA[5]; PL_mA[14] -= hip * PL_mA[6];
  pl.pose = pl.pose || M.poseNew();
  AN_humanoid(M, pl.pose, st);
  EN_lightProbe(b.x, b.y, b.z, pl.light);
  EN_lightStep(pl.light, 1 / 60);
  let flash = null;
  if (st.hurt > 0) flash = [1, 0.35, 0.3, st.hurt * 0.6];
  else if (pl.inv > 0 && !pl.dead && ((VX.time * 14) | 0) % 2) flash = [1, 1, 1, 0.22];
  MD_drawModel(r, M, PL_mA, pl.pose, { sky: pl.light.sky, moon: pl.light.moon, bl: pl.light.bl, flash: flash, rim: [0.16, 0.24, 0.42] });
}

// The grapple rope, from the right hand to the anchor.
var PL_rp = [{ ax: 0, ay: 0, az: 0, bx: 0, by: 0, bz: 0, sag: 0 }];
var PL_hand = [0, 0, 0];
function PL_ropes() {
  const pl = GS.player, g = pl.grap;
  if (!g && !(pl.grapMiss > 0)) return null;
  const M = GS.models.batman;
  M.attach(MD_ARMR, -5.5, 10, 0, PL_hand);
  const R = PL_rp[0];
  R.ax = PL_hand[0]; R.ay = PL_hand[1]; R.az = PL_hand[2];
  if (g) {
    const t = g.phase === 'fly' ? Math.min(1, g.t) : 1;
    R.bx = PL_hand[0] + (g.ax - PL_hand[0]) * t; R.by = PL_hand[1] + (g.ay - PL_hand[1]) * t; R.bz = PL_hand[2] + (g.az - PL_hand[2]) * t;
    R.sag = (1 - t) * 0.6;
    return PL_rp;
  }
  const k = 1 - pl.grapMiss / 0.25, L = 22 * Math.min(1, k * 1.6);
  R.bx = PL_hand[0] + pl.missDir[0] * L; R.by = PL_hand[1] + pl.missDir[1] * L; R.bz = PL_hand[2] + pl.missDir[2] * L; R.sag = 0.3;
  return PL_rp;
}

function VX_draw() {
  VX.rend.beams = WD_beams(); VX.rend.emblem = GS.emblem || null;
  VX.rend.render(VX.cam, VX.world, VX.far, VX_extra);
  if (VX.hideHud) VX.hudCtx.clearRect(0, 0, VX.hud.width, VX.hud.height); else UI_draw(VX.hudCtx, VX.hud.width, VX.hud.height);
}

// A bug in one frame must not freeze the whole game: the error is counted and the
// loop carries on. Only a failure that repeats every frame stops it, with a message.
function VX_loop(ts) {
  const dt = Math.min(0.1, (ts - VX.last) / 1000);
  VX.last = ts;
  try {
    VX_update(dt);
    VX_draw();
    VX.errRun = 0;
  } catch (e) {
    VX.errRun = (VX.errRun || 0) + 1; VX.errTotal = (VX.errTotal || 0) + 1;
    if (VX.errTotal <= 3 && window.console) console.error(e);
    if (VX.errRun > 90) {
      const b = document.getElementById('boot');
      if (b) { b.hidden = false; document.getElementById('bootmsg').textContent = 'Algo falló en el juego: recarga la página'; document.getElementById('bar').hidden = true; }
      return;
    }
  }
  VX.frame++;
  requestAnimationFrame(VX_loop);
}

// ── test hooks ────────────────────────────────────────────────────────────
window.__vx = {
  ready: function () { return VX.booted && VX.world.loadedFraction() > 0.985 && VX.world.uploadQ.length === 0 && VX.world.pending.size === 0 && VX.far.done(); },
  fraction: function () { return VX.world.loadedFraction(); },
  mode: function () { return VX.world.mode; },
  stats: function () { return Object.assign({ chunks: VX.world.chunks.size, mode: VX.world.mode, hdr: VX.rend.hdr, farTiles: VX.far.tiles.size, farMs: Math.round(VX.far.stats.ms) }, VX.world.stats); },
  setCam: function (x, y, z, yaw, pitch) { const c = VX.cam; c.x = x; c.y = y; c.z = z; c.yaw = yaw; c.pitch = pitch; VX.world.dirty = true; VX.freeCam = true; VX.world.update(x, z, 0); VX.far.update(x, z, 0); },
  set: function (k, v) { VX.rend.P[k] = v; },
  setBeam: function (a, b) { VX.rend.beam.p0 = a; VX.rend.beam.p1 = b; },
  render: function (t) {
    if (t !== undefined) { VX.time = t; VX.rend.time = t; }
    const boot = document.getElementById('boot'); if (boot) boot.hidden = true;
    VX_resize(); VX_draw();
  },
  // advance the simulation by n fixed steps with the camera driven as in play
  step: function (n, dt) {
    for (let i = 0; i < n; i++) {
      VX.time += VX_STEP;
      VX_simStep(VX_STEP);
      GS.tcam.update(VX_STEP, VX.cam, GS.player, GS.world, { x: 0, y: 0 });
      IN_clearEdges();
    }
  },
  world: function () { return VX.world; },
  cam: function () { return VX.cam; },
  rend: function () { return VX.rend; },
  gs: function () { return GS; },
  vx: function () { return VX; },
  input: function () { return IN; },
  start: function () { VX_setState('play'); VX.fade = 0; VX.fadeTo = 0; },
  mapAll: function () { UI_mapStep(99999); },
  audioSmoke: function () {
    // every sound once, plus a few seconds of the score, to see that nothing throws
    AU_resume();
    const bad = [];
    const kinds = ['jump', 'land', 'landHard', 'glide', 'dodge', 'grapple', 'grappleMiss', 'grappleHit', 'vault', 'swing', 'whoosh', 'hit', 'throw', 'batHit', 'clink', 'hurt', 'die', 'kill', 'gun', 'enemySwing', 'tell', 'alert', 'boom', 'slamLand', 'poof', 'pickup', 'beacon', 'cleared', 'bossStart', 'bossHit', 'bossDown', 'thunder', 'burn'];
    for (const k of kinds) { try { AU.lastEvt = {}; AU_event(k, { t: k, kind: 3, x: GS.player.b.x, z: GS.player.b.z }); } catch (e) { bad.push(k + ': ' + e.message); } }
    try { for (let i = 0; i < 400; i++) AU_update(0.016); } catch (e) { bad.push('update: ' + e.message); }
    return { ctx: !!AU.ctx, state: AU.ctx && AU.ctx.state, bad: bad };
  },
  hurt: function (n) { const p = GS.player; p.inv = 0; p.hurt(n, 1, 0, false); },
  setState: function (s) { VX_setState(s); },
  glError: function () { return VX.rend.gl.getError(); },
  killBoss: function () { const b = GS.boss; if (b) { b.hp = 0.1; b.set && 0; b.state = b.id === 'penguin' ? 'dazed' : 'hunt'; b.damage(5, 1, 0, 3); } },
  travel: function (i) { WD_travel(i); },
  tips: function () { return UI.tipsSeen ? Object.keys(UI.tipsSeen) : []; },
  spawn: function (kind, x, y, z, alert) { const e = new Enemy(kind, x, y, z, null); if (alert) { e.alert = true; e.state = 'chase'; } GS.enemies.push(e); return e; },
  lm: function () { return LM; },
  lookAt: function (x, y, z, tx, ty, tz) {
    const c = VX.cam, dx = tx - x, dy = ty - y, dz = tz - z;
    c.x = x; c.y = y; c.z = z; c.yaw = Math.atan2(dx, -dz); c.pitch = Math.atan2(dy, Math.hypot(dx, dz));
    VX.world.dirty = true; VX.freeCam = true;
    VX.world.update(x, z, 0); VX.far.update(x, z, 0);          // so the loaded fraction is about HERE, not where we were
  },
  hideHud: function (on) { VX.hideHud = on; },
  bossStart: function (id) { const bi = GS.bossInfo.find(b => b.id === id); BS_start(id, bi.arena); },
  arena: function (id) { return GS.bossInfo.find(b => b.id === id).arena; },
  place: function (x, y, z, a) { const p = GS.player; p.b.x = x; p.b.y = y; p.b.z = z; p.b.vx = p.b.vy = p.b.vz = 0; if (a !== undefined) p.a = a; GS.tcam.snap(p); VX.world.dirty = true; },
};

VX_boot();

</script>
</body>
</html>
